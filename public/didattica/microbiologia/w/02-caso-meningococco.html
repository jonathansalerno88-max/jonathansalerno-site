<h2 class="sr-only">Caso clinico guidato in cinque passi: un ragazzo con febbre, rigidità nucale e porpora. Ogni passo ha una figura da esplorare e una domanda; la risposta giusta apre il passo successivo.</h2>
<div class="top"><div class="pg" id="pg"></div><button id="all" type="button"></button></div>
<div id="case"></div>
<script>
var D={"ui": {"lab": "Etichette", "step": "Passo", "all": "Mostra tutto il caso", "restart": "Ricomincia", "next": "Avanti ↓", "end": "Fine del caso.", "ok": "Giusto.", "no": "Non proprio."}, "figs": {"rash": {"ls": 1.35, "modes": ["La pelle di Marco", "Esantema virale"], "flags": ["Premi il bicchiere"], "hint": "Passa il mouse o tocca le lesioni, poi premi il bicchiere. Confronta con l'esantema virale.", "lab": {"pet": "Petechie (< 2 mm)", "pur": "Porpora (> 2 mm)", "vir": "Esantema virale: chiazze rosa sfumate", "gm": "Sotto il bicchiere restano visibili", "gv": "Sotto il bicchiere sbiadisce", "aria": "Pelle della gamba con petechie e porpora, e test del bicchiere"}, "K": {"pet": ["Petechie", "Puntini rossi o violacei sotto i 2 mm: piccole emorragie nella pelle. Con la febbre sono il segno d'allarme da cercare su tutto il corpo, anche su congiuntive e palato."], "pur": ["Porpora", "Chiazze sopra i 2 mm, violacee, a volte con il centro scuro e necrotico. Possono allargarsi in poche ore: si segnano i bordi con la penna per seguirle. La porpora fulminante è la forma più grave."], "glass": ["Test del bicchiere", "Premendo un bicchiere trasparente sulla pelle, l'arrossamento da vasodilatazione sbiadisce, perché il sangue viene spinto fuori dai capillari. Le petechie restano: il sangue è già fuori dai vasi. Un rash che non sbiadisce, con la febbre, va trattato come sepsi meningococcica."], "vir": ["Esantema virale", "Chiazze rosa, sfumate, a volte confluenti: è vasodilatazione, e sotto il bicchiere sbiadisce. Attenzione: nelle prime ore anche la meningococcica può dare un rash maculare che sbiadisce."]}}, "csf": {"ls": 1.3, "nolab": true, "hint": "Tocca una provetta per leggere i valori. Dietro c'è un foglio stampato: attraverso un liquor limpido si legge.", "lab": {"tA": "normale", "tB": "tubercolare", "tC": "batterica", "tD": "virale", "aria": "Quattro provette di liquor davanti a un foglio stampato"}, "K": {"tA": ["Provetta A", "<table><tr><td>Aspetto</td><td>limpido, «acqua di roccia»</td></tr><tr><td>Cellule</td><td>2/µL, linfociti</td></tr><tr><td>Glucosio</td><td>62 mg/dL (glicemia 100: rapporto 0,62)</td></tr><tr><td>Proteine</td><td>30 mg/dL</td></tr><tr><td>Pressione di apertura</td><td>15 cmH₂O</td></tr></table>", "A · Liquor normale"], "tB": ["Provetta B", "<table><tr><td>Aspetto</td><td>limpido o opalescente; a riposo forma un reticolo di fibrina «a ragnatela»</td></tr><tr><td>Cellule</td><td>260/µL, 80 % linfociti</td></tr><tr><td>Glucosio</td><td>28 mg/dL (glicemia 105: rapporto 0,27)</td></tr><tr><td>Proteine</td><td>380 mg/dL</td></tr><tr><td>Pressione di apertura</td><td>28 cmH₂O</td></tr></table>", "B · Meningite tubercolare"], "tC": ["Provetta C", "<table><tr><td>Aspetto</td><td>torbido</td></tr><tr><td>Cellule</td><td>3.800/µL, 92 % neutrofili</td></tr><tr><td>Glucosio</td><td>18 mg/dL (glicemia 110: rapporto 0,16)</td></tr><tr><td>Proteine</td><td>280 mg/dL</td></tr><tr><td>Pressione di apertura</td><td>34 cmH₂O</td></tr></table>", "C · Meningite batterica: è Marco"], "tD": ["Provetta D", "<table><tr><td>Aspetto</td><td>limpido</td></tr><tr><td>Cellule</td><td>180/µL, 85 % linfociti</td></tr><tr><td>Glucosio</td><td>64 mg/dL (glicemia 105: rapporto 0,61)</td></tr><tr><td>Proteine</td><td>72 mg/dL</td></tr><tr><td>Pressione di apertura</td><td>20 cmH₂O</td></tr></table>", "D · Meningite virale"]}}, "gram": {"ls": 1.35, "labs": {"o1": "Gram+ a lancetta", "o2": "Coccobacilli Gram−"}, "modes": ["Liquor di Marco", "Pneumococco", "Haemophilus"], "hint": "Passa il mouse o tocca le cellule; cambia batterio per confrontare.", "lab": {"neu": "Neutrofilo", "intra": "Dentro i neutrofili", "extra": "Liberi", "o1": "Diplococchi Gram+ a lancetta, con capsula", "o2": "Coccobacilli Gram− piccoli", "m0": "Gram · liquor", "m1": "Gram · pneumococco", "m2": "Gram · Haemophilus", "aria": "Colorazione di Gram del liquor al microscopio"}, "K": {"neu": ["Neutrofilo", "Granulocita con il nucleo in 3–5 lobi. Nel Gram prende la safranina e si colora di rosa. Migliaia per microlitro: è la risposta all'infezione batterica acuta."], "intra": ["Diplococchi dentro i neutrofili", "Coppie di cocchi a chicco di caffè, con i lati piatti affacciati, fagocitate dai neutrofili. Rosa: Gram negativi. In un liquor questo quadro è quasi sempre Neisseria meningitidis."], "extra": ["Diplococchi liberi", "Gli stessi diplococchi fuori dalle cellule. La capsula li protegge dalla fagocitosi finché anticorpi e complemento non li rivestono."], "o1": ["Pneumococco", "Streptococcus pneumoniae: diplococchi Gram positivi (viola) a forma di lancetta, con un alone chiaro, la capsula. È la causa più frequente di meningite batterica nell'adulto."], "o2": ["Haemophilus influenzae", "Coccobacilli Gram negativi piccoli e di forma variabile. Il tipo b (Hib) era la prima causa di meningite nei bambini piccoli prima del vaccino coniugato."]}}, "nm": {"split": ["0 0 314 380", "314 14 286 356"], "modes": ["N. meningitidis", "N. gonorrhoeae"], "hint": "Passa il mouse o tocca le strutture nell'ingrandimento.", "lab": {"caps": "capsula", "los": "LOS", "pg": "peptidoglicano", "im": "membrana interna", "peri": "periplasma", "ves": "vescicola", "pil": "pilo", "iga": "IgA1 tagliata", "nm": "Neisseria meningitidis", "gc": "Neisseria gonorrhoeae: senza capsula", "aria": "Il meningococco, un diplococco, e l'ingrandimento del suo involucro"}, "K": {"caps": ["Capsula", "Polisaccaride che ostacola fagocitosi e complemento. Definisce i sierogruppi: A, B, C, W, X e Y causano quasi tutti i casi. Il gonococco non ha capsula."], "los": ["LOS (lipooligosaccaride)", "È l'LPS delle Neisserie, ma con catene di zuccheri corte e senza antigene O. Il lipide A è l'endotossina: attiva il <b>TLR4</b> (Toll-like receptor 4) e porta a shock, <b>CID</b> (coagulazione intravascolare disseminata) e, nei casi peggiori, a emorragia surrenalica (sindrome di Waterhouse–Friderichsen)."], "ves": ["Vescicole della membrana esterna", "Il meningococco perde in continuazione bolle di membrana esterna cariche di LOS: per questo l'endotossina nel sangue arriva a livelli altissimi. Le stesse vescicole, purificate, sono una componente di un vaccino contro il sierogruppo B."], "por": ["PorB", "Porina della membrana esterna: il canale da cui entrano piccole molecole idrofile, compresi alcuni antibiotici. È anche bersaglio di anticorpi e serve a tipizzare i ceppi."], "opa": ["Opa", "Proteine di adesione che legano le molecole CEACAM sulle cellule della mucosa e sui neutrofili. Si accendono e si spengono (variazione di fase): il batterio cambia faccia durante l'infezione."], "fhbp": ["fHbp e fattore H", "La proteina che lega il fattore H (fHbp) cattura un regolatore umano del complemento: sulla superficie del batterio il complemento si spegne. È uno degli antigeni dei vaccini contro il sierogruppo B."], "pil": ["Pili di tipo IV", "Lunghi filamenti che fanno aderire il batterio alle cellule della faringe e, nel sangue, all'endotelio dei piccoli vasi; ritraendosi lo trascinano. Nel gonococco cambiano di continuo (variazione antigenica): per questo ci si può reinfettare."], "iga": ["IgA1 proteasi", "Enzima secreto che taglia le IgA1 nella regione cerniera e disattiva gli anticorpi delle mucose. Ce l'hanno anche pneumococco e Haemophilus, che colonizzano le stesse vie respiratorie."], "pg": ["Peptidoglicano", "Sottile, nel periplasma, come in tutti i Gram negativi. Il ceftriaxone blocca le PBP che lo costruiscono."], "im": ["Membrana interna", "La membrana citoplasmatica, con la catena respiratoria. Il complesso di attacco del complemento (C5b-9) si inserisce nella membrana esterna e porta alla rottura di quella interna: è la difesa chiave contro le Neisserie."]}}}, "steps": [{"h": "In pronto soccorso", "figs": ["rash"], "story": "<p>Marco, 19 anni, studente fuori sede, vive in una residenza universitaria. Stamattina febbre alta, mal di testa forte e vomito; nel pomeriggio è confuso e la luce gli dà fastidio. Sulle gambe compaiono macchioline rosso-violacee.</p><div class=\"vt\"><span class=\"al\">Temperatura 39,6 °C</span><span class=\"al\">Pressione 92/54 mmHg</span><span class=\"al\">Frequenza cardiaca 124/min</span><span>Frequenza respiratoria 24/min</span><span class=\"al\">Riempimento capillare 4 s</span><span>Mani e piedi freddi</span><span class=\"al\">Rigidità nucale</span><span><b>GCS</b> (Glasgow Coma Scale) 13</span></div><p>Guarda la pelle e prova il test del bicchiere.</p>", "q": {"t": "Che cosa fai per primo?", "o": [["TC dell'encefalo, poi puntura lombare, poi l'antibiotico scelto in base al liquor", false, "Così passano ore. Con febbre, porpora e segni di shock l'antibiotico non aspetta né la TC né la puntura lombare: la mortalità sale con ogni ora di ritardo."], ["Emocolture e subito ceftriaxone endovena, con liquidi per lo shock", true, "Le emocolture si prelevano in pochi minuti e non devono ritardare l'antibiotico. Il ceftriaxone copre meningococco e pneumococco ed entra bene nel liquor. Polso rapido, pressione bassa e riempimento capillare lento sono shock: servono liquidi e monitoraggio."], ["Aspetti la coltura per dare un antibiotico mirato", false, "La coltura richiede 24–48 ore. La terapia empirica si inizia subito e si corregge dopo, con il risultato."], ["È un'eruzione da farmaci: antistaminico e osservazione", false, "Una porpora che non sbiadisce in un paziente febbrile e ipoteso è sepsi meningococcica fino a prova contraria."]]}, "after": "<h4>Da ricordare</h4><p>Petechie e porpora sono sangue uscito dai vasi: per questo la pressione del bicchiere non le fa sparire. Nella sepsi meningococcica nascono da danno endoteliale, trombosi dei piccoli vasi e <b>CID</b> (coagulazione intravascolare disseminata), scatenati dall'endotossina.</p><p>Il desametasone si usa nella meningite batterica sospetta, prima o con la prima dose di antibiotico: riduce sordità e altre sequele, soprattutto nella pneumococcica. Nella sepsi meningococcica con shock le linee guida sono più caute.</p>"}, {"h": "Il liquor", "figs": ["csf"], "story": "<p>Dopo 40 minuti di ceftriaxone e i liquidi la pressione risale. Marco è confuso, quindi prima della puntura lombare si fa una TC: è normale. Piastrine e coagulazione sono accettabili e si esegue la puntura lombare.</p><p>Il laboratorio ha quattro liquor della giornata, ma le etichette con i nomi si sono staccate. Tocca le provette per leggere i valori.</p>", "q": {"t": "Quale provetta è quella di Marco?", "o": [["Provetta A", false, "A è un liquor normale: limpido, quasi senza cellule, glucosio circa il 60 % della glicemia."], ["Provetta B", false, "B ha glucosio basso e proteine molto alte, ma con linfociti e un reticolo di fibrina: è il quadro della meningite tubercolare, che si sviluppa in settimane."], ["Provetta C", true, "Torbido per le migliaia di neutrofili, glucosio crollato e proteine alte: meningite batterica acuta. Il glucosio si valuta sempre in rapporto alla glicemia: qui 18 su 110, circa 0,16."], ["Provetta D", false, "D ha poche centinaia di linfociti, glucosio normale e proteine poco aumentate: è il quadro di una meningite virale."]]}, "after": "<h4>Come si legge</h4><p>Neutrofili, glucosio basso e proteine alte: batterica. Linfociti con glucosio normale: virale. Linfociti con glucosio basso e proteine molto alte: tubercolare, o fungina. L'antibiotico dato prima della puntura lombare abbassa la resa della coltura, ma la colorazione di Gram resta utile nelle prime ore e la <b>PCR</b> (reazione a catena della polimerasi) resta spesso positiva.</p>"}, {"h": "Il Gram del liquor", "figs": ["gram"], "story": "<p>Al microscopio, il sedimento del liquor colorato con il Gram. Confrontalo con lo pneumococco e con Haemophilus influenzae, le altre cause classiche di meningite batterica.</p>", "q": {"t": "Diplococchi Gram negativi dentro i neutrofili. Come confermi che è Neisseria meningitidis?", "o": [["Agar sangue: α-emolisi e sensibilità all'optochina", false, "Sono le prove dello pneumococco, che è Gram positivo."], ["Agar cioccolato in CO₂: colonie ossidasi positive che fermentano glucosio e maltosio; in parallelo PCR su liquor e sangue", true, "Neisseria cresce su agar cioccolato in atmosfera arricchita di CO₂ ed è ossidasi positiva. Il meningococco fermenta glucosio e maltosio, il gonococco solo il glucosio. La PCR funziona anche se l'antibiotico ha già sterilizzato la coltura e indica il sierogruppo."], ["Catalasi e coagulasi", false, "Servono a distinguere stafilococchi e streptococchi, cocchi Gram positivi."], ["Ziehl–Neelsen sul liquor", false, "Cerca i micobatteri, bacilli alcol-acido resistenti: qui ci sono diplococchi Gram negativi."]]}, "after": "<h4>Da ricordare</h4><p><b>M</b>altosio come <b>M</b>eningitidis: il meningococco fermenta glucosio e maltosio, il gonococco solo il glucosio. Il Thayer–Martin è un agar cioccolato con antibiotici (vancomicina, colistina, nistatina, trimetoprim) che bloccano la flora normale: si usa per i campioni non sterili, come quelli genitali o faringei, non per il liquor.</p>"}, {"h": "Perché è così rapido", "figs": ["nm"], "story": "<p>Ventiquattro ore fa Marco stava bene. Guarda com'è fatto il meningococco: quasi ogni struttura del suo involucro serve a sfuggire alle difese o a fare danno. Poi confrontalo con il gonococco.</p>", "q": {"t": "Marco guarisce. Nella stessa residenza una ragazza ha avuto due meningiti meningococciche in tre anni. Che cosa cerchi?", "o": [["Un deficit di IgA", false, "Dà soprattutto infezioni delle mucose (respiratorie, o intestinali come la giardiasi) e reazioni alle trasfusioni, non meningococciche ricorrenti."], ["Un deficit dei linfociti T, per esempio da HIV", false, "I difetti dei linfociti T espongono a patogeni intracellulari e opportunisti: Listeria, Cryptococcus, micobatteri, Pneumocystis."], ["Un deficit dei componenti terminali del complemento (C5–C9)", true, "Senza il complesso di attacco alla membrana (C5b-9) le Neisserie non vengono uccise e le infezioni meningococciche si ripetono. Lo stesso rischio lo dà l'eculizumab, che blocca C5: chi lo assume va vaccinato. Si cerca misurando l'attività emolitica del complemento."], ["La granulomatosi cronica (difetto della NADPH ossidasi)", false, "Espone a batteri e funghi catalasi positivi, come S. aureus e Aspergillus, con granulomi e ascessi."]]}, "after": "<h4>Da ricordare</h4><p>Asplenia e deficit del complemento espongono ai batteri capsulati: pneumococco, meningococco, Haemophilus influenzae tipo b. Per questo chi non ha la milza va vaccinato contro tutti e tre. Il gonococco, senza capsula, dà soprattutto infezioni localizzate (uretrite, cervicite) e, grazie alla variazione antigenica, non lascia immunità.</p>"}, {"h": "I contatti", "figs": [], "story": "<p>Il compagno di stanza di Marco e la sua ragazza, che lo ha baciato due giorni fa, chiedono che cosa fare. La PCR indica il sierogruppo B. Il caso va notificato subito all'autorità sanitaria.</p>", "q": {"t": "Che cosa offri ai contatti stretti?", "o": [["Niente: il meningococco non si trasmette da persona a persona", false, "Si trasmette con le goccioline e le secrezioni respiratorie, nei contatti stretti e prolungati: chi vive con il paziente, chi lo ha baciato."], ["Solo il vaccino", false, "Il vaccino protegge nelle settimane successive ma non elimina subito il batterio dalla faringe dei portatori: prima serve la profilassi antibiotica."], ["Profilassi antibiotica al più presto, idealmente entro 24 ore: ciprofloxacina in dose singola, o rifampicina per 2 giorni, o ceftriaxone intramuscolo in dose singola", true, "Elimina il meningococco dalla faringe dei contatti, che possono portare lo stesso ceppo. In gravidanza si preferisce il ceftriaxone; la rifampicina colora di arancio urine e lacrime e riduce l'efficacia della pillola. Va fatta anche ai vaccinati."], ["Amoxicillina per 10 giorni", false, "La penicillina cura la malattia ma non elimina in modo affidabile il portatore faringeo."]]}, "after": "<h4>I vaccini</h4><p>Il <b>MenACWY</b> (vaccino coniugato contro i sierogruppi A, C, W e Y) lega il polisaccaride capsulare a una proteina: così attiva i linfociti T helper e dà memoria anche nei lattanti. Il polisaccaride del sierogruppo B, un acido polisialico, somiglia a molecole del nostro tessuto nervoso e quasi non induce anticorpi: i vaccini <b>MenB</b> (contro il sierogruppo B) usano allora proteine di superficie, come la fHbp, e vescicole della membrana esterna. In Italia il MenB è nel calendario del primo anno di vita, il MenACWY in quello dell'infanzia e dell'adolescenza.</p><p>Marco, curato con ceftriaxone, non ha bisogno d'altro per eliminare il batterio dalla faringe.</p>"}]};
// ---------- helpers ----------
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function f1(v){return Math.round(v*10)/10;}
function cpath(p){var n=p.length,d='M'+f1(p[0][0])+' '+f1(p[0][1]);
  for(var i=0;i<n;i++){var p0=p[(i-1+n)%n],q1=p[i],q2=p[(i+1)%n],p3=p[(i+2)%n];
    d+=' C'+f1(q1[0]+(q2[0]-p0[0])/6)+' '+f1(q1[1]+(q2[1]-p0[1])/6)+' '+f1(q2[0]-(p3[0]-q1[0])/6)+' '+f1(q2[1]-(p3[1]-q1[1])/6)+' '+f1(q2[0])+' '+f1(q2[1]);}

function bpts(R,cx,cy,rx,ry,irr,n){var p=[],a0=R()*6.28,h1=R()*6.28,h2=R()*6.28;n=n||10;

  var ly='';for(i=0;i<1150;i++){var a=R()*6.2832,rr=.72+Math.pow(R(),.8)*.24,p=E(rr,a);ly+='<circle cx="'+f1(p[0]+(R()-.5)*3)+'" cy="'+f1(p[1]+(R()-.5)*3)+'" r="'+f1(2.3+R()*.9)+'"/>';}
  for(i=0;i<70;i++){var a=R()*6.2832,p=E(.45+R()*.28,a);ly+='<circle cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" r="2.5"/>';}
  s+='<g fill="'+P.lyn+'" opacity=".88">'+ly+'</g>';
  // Langhans giant cells
  var LG=[[-.55,.6],[2.25,.58],[3.95,.6]],lgs='',lgHit='',lgOl='';
  LG.forEach(function(g,ix){var p=E(g[1],g[0]),rot=g[0]*180/Math.PI+90,rx=37,ry=27;
    var cell='<ellipse cx="0" cy="0" rx="'+rx+'" ry="'+ry+'" fill="'+P.lg+'" stroke="'+P.lgs+'" stroke-width="1"/>';
    var n=11+ix,open=(R()*6.28),span=3.7;
    for(var j=0;j<n;j++){var aa=open+span*j/(n-1),nx=Math.cos(aa)*rx*.74,ny=Math.sin(aa)*ry*.7;
      cell+='<ellipse cx="'+f1(nx)+'" cy="'+f1(ny)+'" rx="4.8" ry="3" fill="'+P.lgn+'" opacity=".92" transform="rotate('+f1(aa*180/Math.PI+90)+' '+f1(nx)+' '+f1(ny)+')"/>';}
    lgs+='<g transform="translate('+f1(p[0])+' '+f1(p[1])+') rotate('+f1(rot)+')">'+cell+'</g>';
    lgHit+='<ellipse cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" rx="40" ry="40" fill="transparent"/>';lgOl+=oc(f1(p[0]),f1(p[1]),38,'#E0662B');
  });
  // epithelioid nuclei, avoiding the giant cells
  var en='';for(i=0;i<330;i++){var a=R()*6.2832,rr=.42+R()*.32,p=E(rr,a),ok=true;
    LG.forEach(function(g){var q=E(g[1],g[0]);if(Math.hypot(q[0]-p[0],q[1]-p[1])<42)ok=false;});if(!ok)continue;
    var ang=a*180/Math.PI+(R()-.5)*50;
    en+='<ellipse cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" rx="'+f1(5.5+R()*2)+'" ry="'+f1(2.2+R()*.6)+'" transform="rotate('+f1(ang)+' '+f1(p[0])+' '+f1(p[1])+')"/>';}
  s+='<g fill="'+P.epn+'" stroke="'+P.eps+'" stroke-width=".7">'+en+'</g>'+lgs;
  // caseous necrosis: amorphous, granular, no cell outlines
  s+='<path d="'+cas()+'" fill="'+P.cas+'" filter="url(#'+u+'b1)"/>';
  var gr='';for(i=0;i<1400;i++){var a=R()*6.2832,rr=Math.sqrt(R())*.44,p=E(rr,a);gr+='<circle cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" r="'+f1(.5+R()*1.1)+'"/>';}
  s+='<g clip-path="url(#'+u+'cc)"><g fill="'+P.cas2+'" opacity=".75">'+gr+'</g>';
  var du='';for(i=0;i<220;i++){var a=R()*6.2832,rr=.18+Math.pow(R(),.5)*.26,p=E(rr,a);du+='<circle cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" r="'+f1(.6+R()*1)+'"/>';}
  s+='<g fill="'+P.dust+'" opacity=".7">'+du+'</g></g>';
  if(zn){var bc='';for(i=0;i<14;i++){var a=R()*6.2832,p=E(.3+R()*.14,a);bc+=rod(p[0],p[1],R()*3.14,7+R()*3,'#D7265B',1.6);}
    for(i=0;i<4;i++){var a=R()*6.2832,p=E(.5+R()*.2,a);bc+=rod(p[0],p[1],R()*3.14,7,'#D7265B',1.6);}s+=bc;}
  // scale bar
  s+='<g><rect x="214" y="432" width="104" height="6" fill="#1f2a36"/>'+tx(326,440,'100 µm','start',{s:14,c:'#1f2a36',h:'#fff',hw:3})+'</g>';
  var lab='',c='#16222E',H={c:c,h:'#fff',hw:4.5,s:17,w:600};
  lab+=tx(300,232,lb.cas,'middle',H);
  lab+=tx(14,30,lb.ep,'start',H)+ld(96,36,E(.58,3.6)[0],E(.58,3.6)[1],c);
  var lgp=E(.6,-.55);lab+=tx(586,30,lb.lg,'end',H)+ld(500,36,f1(lgp[0]+8),f1(lgp[1]-6),c);
  var lyp=E(.84,.9);lab+=tx(586,440,lb.ly,'end',H)+ld(540,424,f1(lyp[0]),f1(lyp[1]),c);
  var fp=E(.99,2.5);lab+=tx(14,440,lb.fib,'start',H)+ld(60,424,f1(fp[0]),f1(fp[1]),c);
  lab+=tx(586,232,lb.par,'end',H);
  if(zn) lab+=tx(300,256,lb.bac,'middle',{c:'#B0183F',h:'#fff',hw:4,s:14,w:600});
  var hot='';
  hot+=hs('par','<path d="M0 0H600V450H0Z '+ring(1.04)+'" fill="transparent" fill-rule="evenodd"/>','<path d="'+ring(1.06)+'" fill="none" stroke="#E0662B" stroke-width="2.5" stroke-dasharray="6 4"/>');
  hot+=hs('fib','<path d="'+ring(1.04)+' '+ring(.93)+'" fill="transparent" fill-rule="evenodd"/>','<path d="'+ring(1.04)+' '+ring(.93)+'" fill="#E0662B" fill-opacity=".18" fill-rule="evenodd" stroke="#E0662B" stroke-width="2" stroke-dasharray="6 4"/>');
  hot+=hs('ly','<path d="'+ring(.93)+' '+ring(.73)+'" fill="transparent" fill-rule="evenodd"/>','<path d="'+ring(.93)+' '+ring(.73)+'" fill="#E0662B" fill-opacity=".15" fill-rule="evenodd" stroke="#E0662B" stroke-width="2" stroke-dasharray="6 4"/>');
  hot+=hs('ep','<path d="'+ring(.73)+' '+cas()+'" fill="transparent" fill-rule="evenodd"/>','<path d="'+ring(.73)+' '+cas()+'" fill="#E0662B" fill-opacity=".15" fill-rule="evenodd" stroke="#E0662B" stroke-width="2" stroke-dasharray="6 4"/>');
  hot+=hs('cas','<path d="'+cas()+'" fill="transparent"/>','<path d="'+cas()+'" fill="#E0662B" fill-opacity=".12" stroke="#E0662B" stroke-width="2.5" stroke-dasharray="6 4"/>');
  hot+=hs('lg',lgHit,lgOl);
  return '<svg viewBox="0 0 600 450" class="fsv" role="img" aria-label="'+lb.aria+'">'+s+(st.lab?'<g class="lb">'+lab+'</g>':'')+hot+'</svg>';
};

// From granuloma to cavity: four stages
FIG.cav=function(st,L,u){
  var R=rng(21),lb=L.lab,s='<defs>'+blur(u+'b1',.8)+'</defs>',hot='';
  for(var i=0;i<4;i++){var x0=4+i*149,y0=4,w=143,h=150,cx=x0+62,cy=y0+92;
    s+='<clipPath id="'+u+'p'+i+'"><rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" rx="10"/></clipPath>';
    var g='<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="#F7E6EE"/>';
    for(var k=0;k<34;k++){var ax=x0+R()*w,ay=y0+R()*h;if(Math.hypot(ax-cx,ay-cy)<48+i*4)continue;g+='<circle cx="'+f1(ax)+'" cy="'+f1(ay)+'" r="'+f1(7+R()*4)+'" fill="#FFFDFE" stroke="#E2A9C2" stroke-width="1.6"/>';}
    // bronchus from the top right
    var bx=x0+w-30;g+='<path d="M'+(bx+14)+' '+(y0-4)+' C'+(bx+12)+' '+(y0+30)+' '+(bx-4)+' '+(y0+50)+' '+(cx+44)+' '+(cy-30)+'" stroke="#C98AA8" stroke-width="20" fill="none"/>';
    g+='<path d="M'+(bx+14)+' '+(y0-4)+' C'+(bx+12)+' '+(y0+30)+' '+(bx-4)+' '+(y0+50)+' '+(cx+44)+' '+(cy-30)+'" stroke="#FFFFFF" stroke-width="13" fill="none"/>';
    var r=34+i*4;
    g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r+5)+'" fill="#EDA9C4"/>';
    var lyd='';for(k=0;k<160;k++){var a=R()*6.28,rr=r-2-R()*8;lyd+='<circle cx="'+f1(cx+Math.cos(a)*rr)+'" cy="'+f1(cy+Math.sin(a)*rr)+'" r="1.5"/>';}
    g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#EBC8DB"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r-9)+'" fill="#F4D4E2"/><g fill="#3F2370" opacity=".85">'+lyd+'</g>';
    var en='';for(k=0;k<26;k++){var a=R()*6.28,rr=(i?r*.5:6)+R()*(r-12-(i?r*.5:6));en+='<ellipse cx="'+f1(cx+Math.cos(a)*rr)+'" cy="'+f1(cy+Math.sin(a)*rr)+'" rx="3.4" ry="1.5" fill="#AA8DCB" transform="rotate('+f1(a*57.3)+' '+f1(cx+Math.cos(a)*rr)+' '+f1(cy+Math.sin(a)*rr)+')"/>';}
    g+=en;
    var cr=[0,14,19,22][i];
    if(i===1) g+='<path d="'+blob(R,cx,cy,cr,cr,.15,8)+'" fill="#E7A6C2"/>';
    if(i===2){g+='<path d="'+blob(R,cx,cy,cr,cr,.12,8)+'" fill="#F6DDE8" stroke="#E7A6C2" stroke-width="3"/>';
      for(k=0;k<26;k++){var a=R()*6.28,rr=R()*(cr-4);g+=rod(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,R()*3.14,5,'#D7265B',1.5);}}
    if(i===3){g+='<path d="M'+(cx+14)+' '+(cy-16)+' L'+(cx+44)+' '+(cy-30)+'" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>';
      g+='<path d="'+blob(R,cx,cy,cr+2,cr,.1,9)+'" fill="#FFFFFF" stroke="#E7A6C2" stroke-width="4"/>';
      for(k=0;k<10;k++){var a=R()*6.28;g+=rod(cx+Math.cos(a)*(cr-1),cy+Math.sin(a)*(cr-1),a+1.57,5,'#D7265B',1.5);}
      for(k=0;k<6;k++){var t=k/5,px=(cx+40)+(bx+10-(cx+40))*t,py=(cy-30)+((y0+6)-(cy-30))*t;g+=rod(px+(R()-.5)*5,py,R()*3.14,5,'#D7265B',1.6);}
      g+='<path d="M'+(bx+20)+' '+(y0+40)+' l0 -18 m-5 6 l5 -6 l5 6" stroke="#B0183F" stroke-width="2" fill="none"/>';
      g+=tx(cx,cy+5,lb.air,'middle',{s:12,c:'#55697A',h:''});
      g+='<circle cx="'+(x0+22)+'" cy="'+(y0+136)+'" r="7" fill="#EDA9C4"/><circle cx="'+(x0+22)+'" cy="'+(y0+136)+'" r="4" fill="#E7A6C2"/>';}
    s+='<g clip-path="url(#'+u+'p'+i+')">'+g+'</g><rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" rx="10" fill="none" stroke="#C7B4C0"/>';
    s+='<circle cx="'+(x0+16)+'" cy="'+(y0+16)+'" r="11" fill="#16222E"/>'+tx(x0+16,y0+21,String(i+1),'middle',{s:13,w:700,h:''});
    s+=tx(x0+w/2,y0+h+22,lb['c'+(i+1)],'middle',{s:15,c:'#16222E',h:'',w:600});
    hot+=hs('c'+(i+1),hr(x0,y0,w,h+30),orc(x0-2,y0-2,w+4,h+4));
  }
  return '<svg viewBox="0 0 600 186" class="fsv" role="img" aria-label="'+lb.aria+'">'+s+hot+'</svg>';
};

// Sputum smear: Ziehl–Neelsen or auramine
FIG.zn=function(st,L,u){
  var R=rng(31),au=st.m===1,lb=L.lab,s='',cx=300,cy=182,r=172;
  s+='<defs>'+blur(u+'g',1.6)+blur(u+'b3',3)+'<clipPath id="'+u+'f"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'"/></clipPath></defs>';
  s+='<rect width="600" height="364" fill="#0b0b0b"/>';
  var g='<rect width="600" height="364" fill="'+(au?'#060807':'#D2E2F2')+'"/>';
  var mu='';for(var i=0;i<7;i++){var y=40+i*46+R()*20;mu+='<path d="M100 '+f1(y)+' C200 '+f1(y-40+R()*80)+' 380 '+f1(y-40+R()*80)+' 520 '+f1(y+R()*30-15)+'" stroke-width="'+f1(12+R()*18)+'"/>';}
  g+='<g stroke="'+(au?'#121a12':'#A9C3E2')+'" fill="none" opacity=".55" filter="url(#'+u+'b3)">'+mu+'</g>';
  var ep='',ne='',ba='';
  [[200,120],[400,250],[420,92]].forEach(function(c){ep+='<path d="'+blob(R,c[0],c[1],40,30,.22,7)+'" fill="'+(au?'#0e120e':'#E3EDF8')+'" stroke="'+(au?'#172017':'#9AB5D6')+'" stroke-width="1.2"/><circle cx="'+(c[0]+4)+'" cy="'+(c[1]-2)+'" r="5" fill="'+(au?'#141a14':'#5B7FB7')+'"/>';});
  var NE=[];for(i=0;i<15;i++){var a=R()*6.28,rr=Math.sqrt(R())*150,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;NE.push([x,y]);
    ne+='<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="9" fill="'+(au?'#0d110d':'#C6D8EE')+'"/>';
    if(!au){for(var j=0;j<3;j++){var aa=R()*6.28;ne+='<circle cx="'+f1(x+Math.cos(aa)*3.6)+'" cy="'+f1(y+Math.sin(aa)*3.6)+'" r="2.9" fill="#3E62A3"/>';}}}
  var col=au?'#E4FF6A':'#D21F57';NE.sort(function(a,b){return Math.hypot(a[0]-500,a[1]-60)-Math.hypot(b[0]-500,b[1]-60);});
  for(i=0;i<46;i++){var a=R()*6.28,rr=Math.sqrt(R())*155;ba+=rod(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,R()*3.14,10+R()*6,col,2.1,R()<.4);}
  // a small cord of parallel bacilli
  for(i=0;i<9;i++)ba+=rod(250+i*2.2+R()*2,232+i*3.2,.5+R()*.12,16,col,2.2,R()<.3);
  g+=ep+ne+(au?'<g filter="url(#'+u+'g)" opacity=".9">'+ba+'</g>':'')+ba;
  s+='<g clip-path="url(#'+u+'f)">'+g+'</g><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#333" stroke-width="3"/>';
  s+=tx(586,354,au?lb.au:lb.zn,'end',{s:14,c:'#cfd6dd',h:''})+tx(14,354,'×1000','start',{s:14,c:'#cfd6dd',h:''});
  var lab='',hot='';
  lab+=tx(14,34,lb.bac,'start',{s:16})+ld(110,40,252,234);
  lab+=tx(586,34,lb.ne,'end',{s:16})+ld(530,40,f1(NE[0][0]),f1(NE[0][1]));
  lab+=tx(14,320,lb.ep,'start',{s:16})+ld(60,304,186,132);
  hot+=hs('bac',he(262,246,26,24),oe(262,246,26,24));
  hot+=hs('ne',hc(f1(NE[0][0]),f1(NE[0][1]),16),oc(f1(NE[0][0]),f1(NE[0][1]),15));
  hot+=hs('ep',he(200,120,46,36)+he(400,250,46,36)+he(420,92,46,36),oe(200,120,46,36)+oe(400,250,46,36)+oe(420,92,46,36));
  return '<svg viewBox="0 0 600 364" class="fsv" role="img" aria-label="'+lb.aria+'">'+s+(st.lab?'<g class="lb">'+lab+'</g>':'')+hot+'</svg>';
};

// Rash and the glass test
FIG.rash=function(st,L,u){
  var R=rng(41),vir=st.m===1,gl=st.f[0],lb=L.lab,s='',GX=392,GY=168,GR=100;
  s+='<defs>'+blur(u+'b3',3)+blur(u+'b1',.7)+blur(u+'b6',6)+
    '<linearGradient id="'+u+'sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7C1A6"/><stop offset=".5" stop-color="#EECDB5"/><stop offset="1" stop-color="#DDB096"/></linearGradient>'+
    '<clipPath id="'+u+'gc"><circle cx="'+GX+'" cy="'+GY+'" r="'+(GR-6)+'"/></clipPath></defs>';
  var skin='<rect width="600" height="336" fill="url(#'+u+'sk)"/>';
  for(var i=0;i<260;i++) skin+='<circle cx="'+f1(R()*600)+'" cy="'+f1(R()*336)+'" r="'+f1(.6+R()*.8)+'" fill="#C99B80" opacity=".35"/>';
  for(i=0;i<40;i++){var x=R()*600,y=R()*336,a=R()*.6+1.1;skin+='<path d="M'+f1(x)+' '+f1(y)+' q3 -5 '+f1(Math.cos(a)*14)+' '+f1(-Math.sin(a)*14)+'" stroke="#8E6A52" stroke-width=".7" fill="none" opacity=".45"/>';}
  var spots='',pet='',pur='';
  if(!vir){
    var CL=[[110,90],[200,220],[300,120],[420,80],[470,230],[380,200],[540,140],[90,250],[250,300]];
    CL.forEach(function(c){for(var j=0;j<18;j++){var x=c[0]+(R()-.5)*90,y=c[1]+(R()-.5)*70,r=.9+R()*1.6;pet+='<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(r+.7)+'" fill="#C6475E" opacity=".5"/><circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(r)+'" fill="#9E1B3A"/>';}});
    [[160,150,15],[350,110,11],[410,190,18],[520,260,13],[230,80,8],[90,180,9],[300,250,10]].forEach(function(p){
      pur+='<path d="'+blob(R,p[0],p[1],p[2]+4,p[2]*.85+3,.3,9)+'" fill="#8E2A55" opacity=".55" filter="url(#'+u+'b1)"/><path d="'+blob(R,p[0],p[1],p[2],p[2]*.85,.3,9)+'" fill="#6F2149"/>'+(p[2]>14?'<path d="'+blob(R,p[0]+2,p[1],p[2]*.35,p[2]*.3,.3,7)+'" fill="#33121F"/>':'');});
    spots=pet+pur;
  }else{
    for(i=0;i<44;i++){spots+='<path d="'+blob(R,R()*600,R()*336,10+R()*16,8+R()*14,.35,8)+'" fill="#E0605E" opacity=".38" filter="url(#'+u+'b3)"/>';}
    for(i=0;i<70;i++){spots+='<circle cx="'+f1(R()*600)+'" cy="'+f1(R()*336)+'" r="'+f1(1.6+R()*1.8)+'" fill="#D9534F" opacity=".35"/>';}
  }
  s+=skin+spots;
  if(gl){
    // pressure blanches the skin under the glass; extravasated blood stays visible
    s+='<g clip-path="url(#'+u+'gc)"><rect width="600" height="336" fill="#F5E2D6"/>'+(vir?'':pet+pur)+'</g>';
    s+='<circle cx="'+GX+'" cy="'+GY+'" r="'+GR+'" fill="#DDEEFF" fill-opacity=".12" stroke="#8FB0C8" stroke-width="10" stroke-opacity=".55"/>';
    s+='<circle cx="'+GX+'" cy="'+GY+'" r="'+(GR-9)+'" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity=".7"/>';
    s+='<path d="M'+(GX-70)+' '+(GY-55)+' A90 90 0 0 1 '+(GX+20)+' '+(GY-88)+'" stroke="#FFFFFF" stroke-width="7" stroke-opacity=".6" fill="none" stroke-linecap="round"/>';
  }
  var lab='',hot='',H={s:17,c:'#16222E',h:'#fff',hw:4.5,w:600};
  if(!vir){lab+=tx(14,30,lb.pet,'start',H)+ld(90,36,112,84,'#16222E');lab+=tx(14,326,lb.pur,'start',H)+ld(70,310,150,160,'#16222E');
    hot+=hs('pet',he(112,92,46,36)+he(200,220,46,36),oe(112,92,46,36)+oe(200,220,46,36))+hs('pur',hc(160,150,22)+hc(410,190,24)+hc(520,260,20),oc(160,150,22)+oc(410,190,24)+oc(520,260,20));}

function reveal(n){shown=Math.max(shown,n);for(var i=0;i<N;i++)$('#s'+i).hidden=i>=shown;prog();}
var root=$('#case');
D.steps.forEach(function(s,i){var sec=document.createElement('section');sec.className='step';sec.id='s'+i;
  var h='<div class="shd"><span class="sn">'+(i+1)+'</span><h3>'+s.h+'</h3></div><div class="story">'+s.story+'</div>';
  (s.figs||[]).forEach(function(f){h+='<div class="fig" data-f="'+f+'"><div class="ctl"></div><div class="sv"></div><p class="fn"></p><p class="kd" aria-live="polite"></p></div>';});
  h+='<div class="q"><p class="qt">'+s.q.t+'</p><div class="opts">';
  s.q.o.forEach(function(o,j){h+='<button type="button" data-j="'+j+'">'+o[0]+'</button>';});
  h+='</div><div class="fb" aria-live="polite"></div></div><div class="after" hidden>'+s.after+(i<N-1?'<button type="button" class="nx">'+D.ui.next+'</button>':'<p class="end">'+D.ui.end+'</p>')+'</div>';
  sec.innerHTML=h;root.appendChild(sec);
  (s.figs||[]).forEach(function(f){initFig(f,$('.fig[data-f="'+f+'"]',sec));});
  $('.opts',sec).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var o=s.q.o[+b.getAttribute('data-j')];
    b.classList.add(o[1]?'ok':'no');var fb=$('.fb',sec);fb.className='fb '+(o[1]?'ok':'no');fb.innerHTML='<b>'+(o[1]?D.ui.ok:D.ui.no)+'</b> '+o[2];
    if(o[1]&&!done[i]){done[i]=1;sec.classList.add('solved');$('.after',sec).hidden=false;(s.figs||[]).forEach(function(f){FS[f].done=1;render(f);});prog();}});
  var nx=$('.nx',sec);if(nx)nx.addEventListener('click',function(){reveal(i+2);var nxt=$('#s'+(i+1));try{nxt.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){nxt.scrollIntoView();}});
});
$('#all').addEventListener('click',function(){if(shown>=N){location.reload();return;}reveal(N);});
reveal(1);
</script>
</body>
</html>
