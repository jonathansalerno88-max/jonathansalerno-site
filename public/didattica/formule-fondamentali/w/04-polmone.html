<h2 class="sr-only">Un polmone che respira: sforzo, ventilazione, superficie, spessore, ossigeno e quota decidono la saturazione</h2>

<div class="pnl"><svg id="sv" viewBox="0 0 640 250" role="img" aria-label="Un polmone che respira: sforzo, ventilazione, superficie, spessore, ossigeno e quota decidono la saturazione"></svg><div class="dead" id="dead"><div><b id="dT"></b><br><span id="dM"></span><br><button type="button" id="again"></button></div></div></div>

<script>
var D={"ui": {"loc": "it-IT", "preT": "Situazione:", "pause": "❚❚ Pausa", "play": "▶ Riprendi", "lab": {"hb": "Emoglobina", "q": "Gittata cardiaca", "bohr": "Effetto Bohr", "hald": "Effetto Haldane", "w": "Sforzo", "ve": "Ventilazione", "A": "Superficie A", "T": "Spessore T", "Fi": "Ossigeno inspirato (FiO₂)", "h": "Quota"}, "hint": {"hb": "normale 13–17 g/dL; meno = anemia", "q": "100% = quella giusta per lo sforzo; meno = scompenso, shock", "bohr": "nei tessuti CO₂ e acidità spostano la curva dell’emoglobina a destra: l’O₂ si stacca più facilmente", "hald": "l’emoglobina che ha ceduto O₂ lega più CO₂ e H⁺: il sangue venoso porta più CO₂ senza che la sua pressione salga troppo", "w": "più sforzo = più sangue nei polmoni e meno tempo nel capillare", "ve": "100% = quella giusta per lo sforzo; meno = ipoventilazione, 0 = apnea", "A": "normale 50–100 m²; si riduce nell’enfisema", "T": "normale 0,2–0,5 µm; aumenta nella fibrosi e nell’edema", "Fi": "aria 21%; con l’ossigenoterapia di più", "h": "più in alto, meno pressione e meno ossigeno nell’aria"}, "tip": {"P1": "<h4>P₁ · O₂ nell’alveolo (P<sub>A</sub>O₂)</h4><p>Lo decide l’<b>equazione dei gas alveolari</b>: P<sub>A</sub>O₂ = FiO₂ · (P<sub>B</sub> − 47) − P<sub>a</sub>CO₂ / 0,8. Adesso: {FI} × ({PB} − 47) − {CO2} / 0,8 ≈ <b>{PA} mmHg</b>.</p><ul><li><b>FiO₂</b>, la frazione di O₂ inspirata: 21% in aria; ↑ con l’ossigenoterapia → P₁ ↑.</li><li><b>P<sub>B</sub></b>, la pressione atmosferica: 760 mmHg al livello del mare; ↓ in quota (circa 430 mmHg in Capanna Margherita) → P₁ ↓.</li><li><b>47 mmHg</b>, il vapore acqueo: l’aria negli alveoli è satura d’acqua a 37 °C. È fisso, e in quota pesa di più.</li><li><b>P<sub>a</sub>CO₂</b>, che dipende dalla ventilazione: se respiri poco la CO₂ sale e prende il posto dell’O₂ → P₁ ↓; se iperventili la CO₂ scende → P₁ ↑. 0,8 è il quoziente respiratorio.</li><li><b>Le zone del polmone.</b> In piedi gli apici sono molto ventilati e poco perfusi (V̇/Q̇ alto): P<sub>A</sub>O₂ circa 130 mmHg. Le basi sono molto perfuse e meno ventilate (V̇/Q̇ basso): circa 90 mmHg. Qui uso un solo alveolo medio.</li></ul>", "P2": "<h4>P₂ · O₂ nel sangue venoso che arriva al polmone (P<sub>v̄</sub>O₂)</h4><p>Lo decide il <b>Fick cardiovascolare</b>: V̇O₂ = Q · (CaO₂ − CvO₂), quindi CvO₂ = CaO₂ − V̇O₂ / Q. <b>CaO₂</b> e <b>CvO₂</b> sono il <b>contenuto</b> di O₂ del sangue arterioso e venoso: quanti mL di O₂ ci sono in un decilitro di sangue (C sta per contenuto, P per pressione, S per saturazione). Adesso: {CA} − {VO2} / ({Q} × 10) = <b>{CV} mL/dL</b>, che sulla curva dell’emoglobina corrisponde a <b>{PV} mmHg</b>. (× 10 porta Q da litri a decilitri.)</p><ul><li><b>V̇O₂</b>, quanto consumano i tessuti: ↑ con sforzo, febbre, brividi, ipertiroidismo → P₂ ↓.</li><li><b>Q</b>, la gittata cardiaca: ↓ nello scompenso e nello shock → il sangue passa più lentamente, i tessuti ne prendono di più → P₂ ↓. Più gittata → P₂ ↑.</li><li><b>CaO₂</b>, l’O₂ nel sangue arterioso: 1,34 × Hb × SaO₂ + 0,003 × PaO₂. ↓ nell’anemia (meno emoglobina) e nell’ipossiemia (meno saturazione) → P₂ ↓.</li><li><b>La curva dell’emoglobina</b> traduce il contenuto in pressione: nel tratto ripido basta un piccolo calo di P₂ per cedere molto O₂.</li><li><b>Effetto Bohr</b>: nei tessuti il pH del sangue venoso scende a circa {DPH} e la curva si sposta a destra (P50 {P50} mmHg invece di 26,8). Per cedere lo stesso O₂, P₂ resta più alta: l’O₂ arriva ai tessuti a una pressione maggiore. Nel polmone la CO₂ se ne va e la curva torna a sinistra, così il sangue si ricarica meglio. L’effetto Haldane è la stessa cosa vista dalla parte della CO₂.</li></ul>", "V": "<h4>V̇O₂ · l’O₂ che attraversa la barriera</h4><p>È quello che il sangue prende passando nel polmone: Q × (CaO₂ − CvO₂) = {Q} × 10 × ({CA} − {CV}) ≈ <b>{VO} mL/min</b>. In condizioni stabili è uguale al consumo dei tessuti: circa 250 mL/min a riposo, fino a 3000 sotto sforzo.</p><p><b>L’anemia non cambia V̇O₂.</b> V̇O₂ è il consumo, e lo decide il metabolismo. Con meno emoglobina cala la consegna, non il consumo: i tessuti estraggono di più e il sangue venoso torna più vuoto (P₂ più bassa). V̇O₂ cala solo quando la consegna non basta più nemmeno estraendo tutto.</p>", "D": "<h4>D · costante di diffusione dell’O₂</h4><p>Dipende dal gas, non dalla persona: è proporzionale a solubilità / √peso molecolare. Per questo non si muove con le malattie.</p>", "A": "<h4>A · superficie di scambio</h4><p>Normale 50–100 m². ↓ nell’enfisema, dopo una resezione, nell’atelettasia e nell’embolia polmonare (alveoli non perfusi). ↑ sotto sforzo, quando si aprono i capillari degli apici.</p>", "T": "<h4>T · spessore della barriera</h4><p>Normale 0,2–0,5 µm. ↑ nella fibrosi, nell’edema polmonare e nelle polmoniti interstiziali: il sangue fa meno in tempo a caricarsi, soprattutto sotto sforzo.</p>", "C1": "<h4>P<sub>v̄</sub>CO₂ · CO₂ nel sangue venoso che arriva al polmone</h4><p>È la spinta della CO₂ verso l’alveolo, l’equivalente di P₂ per l’O₂. Il <b>contenuto</b> di CO₂ che il sangue deve portare lo decidono i tessuti che la producono (V̇CO₂ = {VCO} mL/min) e la gittata. La <b>pressione</b> a cui corrisponde quel contenuto dipende dall’emoglobina: è qui che agisce l’effetto Haldane.</p><ul><li>↑ con lo sforzo e la febbre (più CO₂ prodotta), con una gittata bassa, con l’ipoventilazione (P<sub>A</sub>CO₂ più alta).</li></ul>", "C2": "<h4>P<sub>A</sub>CO₂ · CO₂ nell’alveolo</h4><p>Dipende quasi solo dalla <b>ventilazione</b>: P<sub>A</sub>CO₂ ≈ 0,863 × V̇CO₂ / V̇<sub>A</sub>. Respirare il doppio la dimezza, respirare la metà la raddoppia. Normale circa 40 mmHg; il sangue arterioso ha la stessa P<sub>a</sub>CO₂.</p>", "VC": "<h4>V̇CO₂ · CO₂ che attraversa la barriera</h4><p>È la CO₂ prodotta dai tessuti: circa 0,8 volte l’O₂ consumato (quoziente respiratorio), quindi circa 200 mL/min a riposo. In condizioni stabili tutta quella CO₂ deve uscire dal polmone.</p>", "DC": "<h4>D<sub>CO₂</sub> · costante di diffusione della CO₂</h4><p>La CO₂ è circa 24 volte più solubile dell’O₂ e pesa poco di più: diffonde circa 20 volte meglio. Per questo le bastano pochi mmHg di gradiente.</p>", "TR": "<h4>Il TIR con la parete mobile</h4><p>Il globulo rosso è un camion con un solo container, diviso da una <b>parete mobile</b>: a sinistra l’O₂ (quattro casse, i quattro eme), a destra CO₂ e H⁺. La parete è il cambio di forma dell’emoglobina: verso la CO₂ è lo stato R, verso l’O₂ è lo stato T.</p><ul><li><b>Nei tessuti</b> la CO₂ entra e spinge la parete: schiaccia fuori l’O₂ (<b>Bohr</b>), e l’O₂ che esce fa posto alla CO₂ (<b>Haldane</b>).</li><li><b>Nel polmone</b> succede il contrario.</li><li>Le casse seguono i numeri del modello: il carico di O₂ all’andata è la saturazione arteriosa, al ritorno quella venosa.</li><li>Spegni Bohr o Haldane: <b>le casse restano le stesse</b>, ma cambia la pressione nel riquadro sopra. Senza Bohr la PO₂ nei tessuti scende (l’O₂ esce solo spremuto), senza Haldane la PCO₂ sale. È la stessa merce a una pressione diversa.</li><li><b>L’anemia</b> non cambia il consumo (V̇O₂): i tessuti svuotano di più ogni camion, quindi al ritorno le casse di O₂ sono meno.</li></ul>", "RQ": "<h4>V̇CO₂ / V̇O₂ · il quoziente respiratorio</h4><p>Adesso: {VCO} / {VO} = <b>{RQV}</b>. Dice da dove viene la CO₂ che butti fuori.</p><ul><li><b>Circa 0,7–1,0</b>: tutta CO₂ del metabolismo aerobico. Dipende da che cosa bruci: grassi circa 0,7, dieta mista circa 0,8 (quello che uso qui), solo zuccheri 1,0.</li><li><b>Sopra 1</b>: c’è CO₂ in più che non viene dai mitocondri. Il muscolo produce acido lattico, il bicarbonato lo tampona (H⁺ + HCO₃⁻ → CO₂ + H₂O) e libera CO₂. È la <b>soglia anaerobica</b> del test da sforzo: il punto in cui V̇CO₂ stacca V̇O₂.</li><li>Nel widget succede in due casi: sopra circa il 55% dello sforzo, anche da sani; e ogni volta che l’O₂ non basta (fibrosi, anemia, scompenso sotto sforzo), con un salto netto.</li><li>Anche l’iperventilazione da ansia alza il rapporto per un po’, perché butta fuori CO₂ di riserva.</li></ul>"}, "tipHint": "Passa con il mouse (o tocca) un termine dell’equazione per vedere da che cosa dipende.", "do2T": "O₂ consegnato ai tessuti (DO₂)", "vo2T": "O₂ consumato (V̇O₂)", "do2L": "<b>L’obiettivo vero:</b> DO₂ = Q × CaO₂ = {Q} L/min × {CA} mL/dL × 10 ≈ {DO2} mL/min. I tessuti ne estraggono il {EX}% (normale: circa 25% a riposo, fino a circa 75% sotto sforzo massimo).", "hidden": "Ma la saturazione inganna: arriva poco O₂ e i tessuti devono estrarne troppo.", "hidden2": "E arriva anche poco O₂ ai tessuti.", "vigB": "<b>Il Bohr non cambia quanto O₂ c’è nel sangue venoso. Cambia a quale pressione corrisponde quella quantità.</b><br>Il contenuto venoso CvO₂ resta {CV} mL/dL, con o senza Bohr, perché i tessuti consumano lo stesso. Con la curva spostata a destra (P50 {P50} mmHg invece di 26,8) la stessa saturazione venosa, {SV}%, corrisponde a <b>{PV} mmHg</b> invece di <b>{PV0} mmHg</b>.", "vigH": "<b>Haldane non cambia quanta CO₂ c’è nel sangue venoso. Cambia a quale pressione corrisponde quella quantità.</b><br>L’emoglobina che ha ceduto O₂ lega più CO₂ (carbammino) e tampona più H⁺, così più CO₂ diventa bicarbonato: forme che non fanno pressione. Per portare la stessa CO₂, P<sub>v̄</sub>CO₂ resta <b>{PVC} mmHg</b> invece di <b>{PVC0} mmHg</b>. Nel polmone l’emoglobina si ricarica di O₂ e libera quella CO₂, proprio dove deve uscire.", "dCO2v": "≈ 20 × O₂", "dCO2l": "della CO₂", "pvcLab": "venoso che arriva al polmone", "tLung": "POLMONE", "tTis": "TESSUTI", "tSend": "consegna DO₂", "tFull": "carico", "tNeed": "consumo V̇O₂", "tTake": "scaricano", "tGo": "{N} camion (emoglobina) · velocità = gittata {Q} L/min", "tBack": "tornano carichi al {SV}% (saturazione venosa)", "tHint": "passa qui sopra: il TIR con la parete mobile", "tR": "stato R · ama l’O₂", "tT": "stato T · ama CO₂ e H⁺", "tLock": "parete bloccata (Bohr e Haldane spenti)", "rqT": "Il rapporto:", "rqA": "aerobico", "rqM": "misto", "rqH": "oltre la soglia: lattato", "capB": "effetto Bohr: sposta P₂", "capBoff": "Bohr spento", "capH": "effetto Haldane: abbassa P<sub>v̄</sub>CO₂", "capHoff": "Haldane spento", "co2L": "CO₂: sangue venoso {PVC} mmHg → alveolo {PAC} mmHg (gradiente {DC} mmHg).", "noHald": "Senza Haldane serve circa il doppio del gradiente per portare la stessa CO₂.", "alv": "alveolo", "dConst": "costante", "dLab": "dell’O₂", "aLab": "superficie", "p1Lab": "alveolo", "p2Lab": "venoso che arriva al polmone", "tLab": "spessore", "inC": "entra", "outC": "esce", "transit": "tempo nel capillare", "grad": "gradiente all’ingresso del capillare", "sOk": "Saturazione normale.", "sLow": "Saturazione bassa.", "sHyp": "Ipossiemia.", "sCya": "Ipossiemia grave: cianosi.", "deadS": "Ha perso conoscenza.", "deadT": "Perde conoscenza!", "again": "Ricomincia", "wApnea": "Non respira: l’aria nell’alveolo non si rinnova e P₁ crolla.", "wHypo": "Respira troppo poco: la CO₂ sale e l’O₂ nell’alveolo scende.", "wAlt": "C’è poco ossigeno nell’aria: P₁ è basso.", "wShort": "Il sangue arriva già quasi vuoto: i tessuti non riescono a prendere tutto l’O₂ che consumano.", "wDiff": "Il limite è la barriera: il sangue esce dal capillare prima di essersi caricato.", "note": "Modello giocattolo: equazione dei gas alveolari per la PO₂ alveolare, poi l’O₂ che sale lungo il capillare secondo Fick (D<sub>L</sub> normale 25 mL·min⁻¹·mmHg⁻¹), e la curva dell’emoglobina. Tempi accelerati, numeri indicativi."}, "pre": [{"n": "Sano a riposo", "w": 0, "ve": 100, "A": 70, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Sano sotto sforzo", "w": 100, "ve": 100, "A": 70, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Fibrosi a riposo", "w": 0, "ve": 100, "A": 70, "T": 2.5, "Fi": 21, "h": 0}, {"n": "Fibrosi sotto sforzo", "w": 50, "ve": 100, "A": 70, "T": 2.5, "Fi": 21, "h": 0}, {"n": "Fibrosi sotto sforzo + ossigeno", "w": 50, "ve": 100, "A": 70, "T": 2.5, "Fi": 40, "h": 0}, {"n": "Enfisema sotto sforzo", "w": 70, "ve": 100, "A": 25, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Oppioidi (ipoventilazione)", "w": 0, "ve": 50, "A": 70, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Apnea", "w": 0, "ve": 0, "A": 70, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Capanna Margherita, 4559 m", "w": 0, "ve": 150, "A": 70, "T": 0.5, "Fi": 21, "h": 4559}, {"n": "Anemia (Hb 7 g/dL)", "w": 0, "ve": 100, "A": 70, "T": 0.5, "Fi": 21, "h": 0, "hb": 7}, {"n": "Scompenso (gittata 50%)", "w": 0, "ve": 100, "A": 70, "T": 0.5, "Fi": 21, "h": 0, "q": 50}]},U=D.ui,P=D.pre;
var LASTH='',HK='P1',S={sp:0,hb:15,q:100,w:0,ve:100,A:70,T:0.5,Fi:21,h:0,bohr:true,hald:true},PA=100,SAT=97,DEAD=false,PZ=false,t0=null,ph=0,flow=0,lowT=0;
function $(q){return document.querySelector(q);}
function f(x,d){return x.toLocaleString(U.loc,{maximumFractionDigits:d,minimumFractionDigits:d});}
