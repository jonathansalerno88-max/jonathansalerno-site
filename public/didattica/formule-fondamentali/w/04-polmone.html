<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fick nel polmone: prova tu</title>
<link rel="stylesheet" href="widget.css">
<style>
svg[viewBox]{min-width:0!important;max-width:100%!important;width:100%}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;font-size:13px}
.row .vl{font-weight:700;color:#55697A}
.row button{font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--border-strong);background:#FFFFFF;color:var(--text-primary);cursor:pointer}
.row button.on{border:1.5px solid #1456A8;background:#EEF4FC;color:#1456A8;font-weight:700}
.row .sp{flex:1 1 auto}
#pz.on{border-color:#B5520C;background:#FCEEDD;color:#7A3E0B}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;margin:0 0 10px}
.ctl label{display:block;font-size:13px;font-weight:700}
.ctl label span{float:right;color:#1456A8}
.ctl input{width:100%}
.ctl small{display:block;color:#55697A;font-size:12px;line-height:1.35}
.pnl{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;margin:0 0 8px;overflow:hidden;position:relative}
.res{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;padding:9px 12px;font-size:14px;line-height:1.55}
.res p{margin:0 0 6px}.res p:last-child{margin:0}
.eqr{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;margin:2px 0 10px}
.eqr .op{font-size:18px;color:#55697A;padding:0 1px}
.tm{border:1.5px solid var(--border);border-radius:8px;padding:3px 6px;text-align:center;min-width:56px;background:#F7FAFC}
.tm{cursor:help}.tm.hk{outline:2px solid #1456A8;outline-offset:1px}
.tip{border-top:1px solid var(--border);padding:8px 2px 4px;margin:0 0 8px;font-size:13.5px;line-height:1.5}
.tip h4{margin:0 0 4px;font-size:14px}.tip p{margin:0 0 5px}.tip ul{margin:2px 0 0;padding-left:18px}.tip li{margin:0 0 3px}
.tm.ch{border-color:#B5520C;background:#FCEEDD}
.tm .sy{display:block;font-size:15px;font-weight:700;color:#1456A8}
.tm b{display:block;font-size:15px;color:#16222E;white-space:nowrap}
.tm small{display:block;font-size:11px;color:#55697A;line-height:1.2}
.do2{border-top:1px solid var(--border);padding-top:6px;margin:0 0 4px}
.lab{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.bar{height:10px;border-radius:5px;background:#EEF2F5;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;border-radius:5px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin:0 0 8px}
.kv div{background:#F7FAFC;border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;color:#55697A}
.kv b{display:block;font-size:17px;color:#16222E}
.dead{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;padding-top:8px;background:rgba(251,252,253,.25)}
.dead div{background:#FFFFFF;border:1.5px solid #A32D2D;border-radius:10px;padding:6px 12px;text-align:center;max-width:85%;font-size:14px}
.dead b{color:#A32D2D;font-size:16px}
@media (max-width:500px){.dead div{font-size:11.5px;padding:4px 8px}.dead b{font-size:13px}.dead button{font-size:12px;padding:3px 9px;margin-top:3px}}
.dead button{margin-top:6px;font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid #1456A8;background:#EEF4FC;color:#1456A8;font-weight:700;cursor:pointer}
@media (max-width:500px){.tm{padding:2px 4px;min-width:0}.tm b{font-size:13px}.tm .sy{font-size:13px}.tm small{font-size:10px}.eqr{gap:2px}.eqr .op{font-size:15px}}
</style>
</head>
<body>
<h2 class="sr-only">Un polmone che respira: sforzo, ventilazione, superficie, spessore, ossigeno e quota decidono la saturazione</h2>
<div class="row" id="pre"></div>
<div class="ctl" id="ctl"></div>
<div class="pnl"><svg id="sv" viewBox="0 0 640 250" role="img" aria-label="Un polmone che respira: sforzo, ventilazione, superficie, spessore, ossigeno e quota decidono la saturazione"></svg><div class="dead" id="dead"><div><b id="dT"></b><br><span id="dM"></span><br><button type="button" id="again"></button></div></div></div>
<div class="res" id="res"></div>
<script>
var D={"ui": {"loc": "it-IT", "preT": "Situazione:", "pause": "❚❚ Pausa", "play": "▶ Riprendi", "lab": {"hb": "Emoglobina", "q": "Gittata cardiaca", "bohr": "Effetto Bohr", "hald": "Effetto Haldane", "w": "Sforzo", "ve": "Ventilazione", "A": "Superficie A", "T": "Spessore T", "Fi": "Ossigeno inspirato (FiO₂)", "h": "Quota"}, "hint": {"hb": "normale 13–17 g/dL; meno = anemia", "q": "100% = quella giusta per lo sforzo; meno = scompenso, shock", "bohr": "nei tessuti CO₂ e acidità spostano la curva dell’emoglobina a destra: l’O₂ si stacca più facilmente", "hald": "l’emoglobina che ha ceduto O₂ lega più CO₂ e H⁺: il sangue venoso porta più CO₂ senza che la sua pressione salga troppo", "w": "più sforzo = più sangue nei polmoni e meno tempo nel capillare", "ve": "100% = quella giusta per lo sforzo; meno = ipoventilazione, 0 = apnea", "A": "normale 50–100 m²; si riduce nell’enfisema", "T": "normale 0,2–0,5 µm; aumenta nella fibrosi e nell’edema", "Fi": "aria 21%; con l’ossigenoterapia di più", "h": "più in alto, meno pressione e meno ossigeno nell’aria"}, "tip": {"P1": "<h4>P₁ · O₂ nell’alveolo (P<sub>A</sub>O₂)</h4><p>Lo decide l’<b>equazione dei gas alveolari</b>: P<sub>A</sub>O₂ = FiO₂ · (P<sub>B</sub> − 47) − P<sub>a</sub>CO₂ / 0,8. Adesso: {FI} × ({PB} − 47) − {CO2} / 0,8 ≈ <b>{PA} mmHg</b>.</p><ul><li><b>FiO₂</b>, la frazione di O₂ inspirata: 21% in aria; ↑ con l’ossigenoterapia → P₁ ↑.</li><li><b>P<sub>B</sub></b>, la pressione atmosferica: 760 mmHg al livello del mare; ↓ in quota (circa 430 mmHg in Capanna Margherita) → P₁ ↓.</li><li><b>47 mmHg</b>, il vapore acqueo: l’aria negli alveoli è satura d’acqua a 37 °C. È fisso, e in quota pesa di più.</li><li><b>P<sub>a</sub>CO₂</b>, che dipende dalla ventilazione: se respiri poco la CO₂ sale e prende il posto dell’O₂ → P₁ ↓; se iperventili la CO₂ scende → P₁ ↑. 0,8 è il quoziente respiratorio.</li><li><b>Le zone del polmone.</b> In piedi gli apici sono molto ventilati e poco perfusi (V̇/Q̇ alto): P<sub>A</sub>O₂ circa 130 mmHg. Le basi sono molto perfuse e meno ventilate (V̇/Q̇ basso): circa 90 mmHg. Qui uso un solo alveolo medio.</li></ul>", "P2": "<h4>P₂ · O₂ nel sangue venoso che arriva (P<sub>v̄</sub>O₂)</h4><p>Lo decide il <b>Fick cardiovascolare</b>: V̇O₂ = Q · (CaO₂ − CvO₂), quindi CvO₂ = CaO₂ − V̇O₂ / Q. Adesso: {CA} − {VO2} / ({Q} × 10) = <b>{CV} mL/dL</b>, che sulla curva dell’emoglobina corrisponde a <b>{PV} mmHg</b>. (× 10 porta Q da litri a decilitri.)</p><ul><li><b>V̇O₂</b>, quanto consumano i tessuti: ↑ con sforzo, febbre, brividi, ipertiroidismo → P₂ ↓.</li><li><b>Q</b>, la gittata cardiaca: ↓ nello scompenso e nello shock → il sangue passa più lentamente, i tessuti ne prendono di più → P₂ ↓. Più gittata → P₂ ↑.</li><li><b>CaO₂</b>, l’O₂ nel sangue arterioso: 1,34 × Hb × SaO₂ + 0,003 × PaO₂. ↓ nell’anemia (meno emoglobina) e nell’ipossiemia (meno saturazione) → P₂ ↓.</li><li><b>La curva dell’emoglobina</b> traduce il contenuto in pressione: nel tratto ripido basta un piccolo calo di P₂ per cedere molto O₂.</li><li><b>Effetto Bohr</b>: nei tessuti il pH del sangue venoso scende a circa {DPH} e la curva si sposta a destra (P50 {P50} mmHg invece di 26,8). Per cedere lo stesso O₂, P₂ resta più alta: l’O₂ arriva ai tessuti a una pressione maggiore. Nel polmone la CO₂ se ne va e la curva torna a sinistra, così il sangue si ricarica meglio. L’effetto Haldane è la stessa cosa vista dalla parte della CO₂.</li></ul>", "V": "<h4>V̇O₂ · l’O₂ che attraversa la barriera</h4><p>È quello che il sangue prende passando nel polmone: Q × (CaO₂ − CvO₂) = {Q} × 10 × ({CA} − {CV}) ≈ <b>{VO} mL/min</b>. In condizioni stabili è uguale al consumo dei tessuti: circa 250 mL/min a riposo, fino a 3000 sotto sforzo.</p>", "D": "<h4>D · costante di diffusione dell’O₂</h4><p>Dipende dal gas, non dalla persona: è proporzionale a solubilità / √peso molecolare. Per questo non si muove con le malattie.</p>", "A": "<h4>A · superficie di scambio</h4><p>Normale 50–100 m². ↓ nell’enfisema, dopo una resezione, nell’atelettasia e nell’embolia polmonare (alveoli non perfusi). ↑ sotto sforzo, quando si aprono i capillari degli apici.</p>", "T": "<h4>T · spessore della barriera</h4><p>Normale 0,2–0,5 µm. ↑ nella fibrosi, nell’edema polmonare e nelle polmoniti interstiziali: il sangue fa meno in tempo a caricarsi, soprattutto sotto sforzo.</p>"}, "tipHint": "Passa con il mouse (o tocca) un termine dell’equazione per vedere da che cosa dipende.", "do2T": "O₂ consegnato ai tessuti (DO₂)", "vo2T": "O₂ consumato (V̇O₂)", "do2L": "<b>L’obiettivo vero:</b> DO₂ = Q × CaO₂ = {Q} L/min × {CA} mL/dL × 10 ≈ {DO2} mL/min. I tessuti ne estraggono il {EX}% (normale: circa 25% a riposo, fino a circa 75% sotto sforzo massimo).", "hidden": "Ma la saturazione inganna: arriva poco O₂ e i tessuti devono estrarne troppo.", "hidden2": "E arriva anche poco O₂ ai tessuti.", "co2L": "CO₂: sangue venoso {PVC} mmHg → alveolo {PAC} mmHg (gradiente {DC} mmHg).", "noHald": "Senza Haldane serve circa il doppio del gradiente per portare la stessa CO₂.", "alv": "alveolo", "dConst": "costante", "dLab": "dell’O₂", "aLab": "superficie", "p1Lab": "alveolo", "p2Lab": "sangue venoso in arrivo", "tLab": "spessore", "inC": "entra", "outC": "esce", "transit": "tempo nel capillare", "grad": "gradiente all’ingresso del capillare", "sOk": "Saturazione normale.", "sLow": "Saturazione bassa.", "sHyp": "Ipossiemia.", "sCya": "Ipossiemia grave: cianosi.", "deadS": "Ha perso conoscenza.", "deadT": "Perde conoscenza!", "again": "Ricomincia", "wApnea": "Non respira: l’aria nell’alveolo non si rinnova e P₁ crolla.", "wHypo": "Respira troppo poco: la CO₂ sale e l’O₂ nell’alveolo scende.", "wAlt": "C’è poco ossigeno nell’aria: P₁ è basso.", "wShort": "Il sangue arriva già quasi vuoto: i tessuti non riescono a prendere tutto l’O₂ che consumano.", "wDiff": "Il limite è la barriera: il sangue esce dal capillare prima di essersi caricato.", "note": "Modello giocattolo: equazione dei gas alveolari per la PO₂ alveolare, poi l’O₂ che sale lungo il capillare secondo Fick (D<sub>L</sub> normale 25 mL·min⁻¹·mmHg⁻¹), e la curva dell’emoglobina. Tempi accelerati, numeri indicativi."}, "pre": [{"n": "Sano a riposo", "w": 0, "ve": 100, "A": 70, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Sano sotto sforzo", "w": 100, "ve": 100, "A": 70, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Fibrosi a riposo", "w": 0, "ve": 100, "A": 70, "T": 2.5, "Fi": 21, "h": 0}, {"n": "Fibrosi sotto sforzo", "w": 50, "ve": 100, "A": 70, "T": 2.5, "Fi": 21, "h": 0}, {"n": "Fibrosi sotto sforzo + ossigeno", "w": 50, "ve": 100, "A": 70, "T": 2.5, "Fi": 40, "h": 0}, {"n": "Enfisema sotto sforzo", "w": 70, "ve": 100, "A": 25, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Oppioidi (ipoventilazione)", "w": 0, "ve": 50, "A": 70, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Apnea", "w": 0, "ve": 0, "A": 70, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Capanna Margherita, 4559 m", "w": 0, "ve": 150, "A": 70, "T": 0.5, "Fi": 21, "h": 4559}, {"n": "Anemia (Hb 7 g/dL)", "w": 0, "ve": 100, "A": 70, "T": 0.5, "Fi": 21, "h": 0, "hb": 7}, {"n": "Scompenso (gittata 50%)", "w": 0, "ve": 100, "A": 70, "T": 0.5, "Fi": 21, "h": 0, "q": 50}]},U=D.ui,P=D.pre;
var LASTH='',HK='P1',S={sp:0,hb:15,q:100,w:0,ve:100,A:70,T:0.5,Fi:21,h:0,bohr:true,hald:true},PA=100,SAT=97,DEAD=false,PZ=false,t0=null,ph=0,flow=0,lowT=0;
function $(q){return document.querySelector(q);}
function f(x,d){return x.toLocaleString(U.loc,{maximumFractionDigits:d,minimumFractionDigits:d});}
var SL=[['w',0,100,1,'%'],['ve',0,300,5,'%'],['A',10,100,1,'m²'],['T',0.3,5,0.1,'µm'],['Fi',21,100,1,'%'],['h',0,8800,100,'m'],['hb',5,20,0.5,'g/dL'],['q',30,150,5,'%']];
function ctl(){$('#ctl').innerHTML=SL.map(function(s){return '<div><label for="s_'+s[0]+'">'+U.lab[s[0]]+' <span id="v_'+s[0]+'"></span></label><input type="range" id="s_'+s[0]+'" min="'+s[1]+'" max="'+s[2]+'" step="'+s[3]+'"><small>'+U.hint[s[0]]+'</small></div>';}).join('')+
  ['bohr','hald'].map(function(k){return '<div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="c_'+k+'" style="width:auto"> '+U.lab[k]+'</label><small>'+U.hint[k]+'</small></div>';}).join('');
  ['bohr','hald'].forEach(function(k){$('#c_'+k).addEventListener('change',function(e){S[k]=e.target.checked;});});
  SL.forEach(function(s){$('#s_'+s[0]).addEventListener('input',function(e){S[s[0]]=+e.target.value;S.sp=-1;sync();});});}
function sync(){['bohr','hald'].forEach(function(k){$('#c_'+k).checked=S[k];});SL.forEach(function(s){$('#s_'+s[0]).value=S[s[0]];$('#v_'+s[0]).textContent=f(S[s[0]],s[3]<1?1:0)+' '+s[4];});
  $('#pre').innerHTML='<span class="vl">'+U.preT+'</span>'+P.map(function(p,i){return '<button type="button" data-p="'+i+'"'+(i===S.sp?' class="on"':'')+'>'+p.n+'</button>';}).join('')+'<span class="sp"></span><button type="button" id="pz"'+(PZ?' class="on"':'')+'>'+(PZ?U.play:U.pause)+'</button>';}
function setPre(i){var p=P[i];S.sp=i;['w','ve','A','T','Fi','h'].forEach(function(k){S[k]=p[k];});S.hb=p.hb||15;S.q=p.q||100;revive();sync();}
$('#pre').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.id==='pz'){PZ=!PZ;sync();return;}setPre(+b.getAttribute('data-p'));});
$('#again').addEventListener('click',function(){revive();});
function revive(){DEAD=false;lowT=0;PA=ss().PAss;SAT=sat(model().Pend);$('#dead').style.display='none';}
function sat(p,p50){p=Math.max(p,0.1);return 100/(1+Math.pow((p50||26.8)/p,2.7));}
// steady state of the alveolus: alveolar gas equation with the ventilation chosen
function ss(){var w=S.w/100,Pb=760*Math.exp(-S.h/7990),PI=S.Fi/100*(Pb-47),va=S.ve/100,co2=40/Math.max(va,0.01);
  var PAss=Math.max(15,PI-co2/0.8);if(va<0.01)PAss=15;return {PI:PI,PAss:Math.min(PAss,PI),PaCO2:Math.min(co2,120),Pb:Pb};}
// P2 (mixed venous PO2) from the Fick principle: CvO2 = CaO2 - VO2/Q, then back to PO2 on the haemoglobin curve
var CVMIN=2;
function cont(p,p50){return 1.34*S.hb*sat(p,p50)/100+0.003*p;}
function pOf(c,p50){var lo=0.5,hi=700;for(var k=0;k<40;k++){var mid=(lo+hi)/2;if(cont(mid,p50)<c)lo=mid;else hi=mid;}return (lo+hi)/2;}
function model(){var w=S.w/100,tt=0.75/(1+2*w),DL=25*(S.A/70)/(S.T/0.5),tau=0.1*25/DL,need=250+2750*w,Q=(5+15*w)*S.q/100,dpH=0.03+0.17*w,P50v=S.bohr?26.8*Math.pow(10,0.48*dpH):26.8;
  var Pv=Math.min(40,PA),Pend=PA,Ca=0,Cv=0,up=need;
  for(var k=0;k<40;k++){Pend=PA-(PA-Pv)*Math.exp(-tt/tau);Ca=cont(Pend);Cv=Ca-need/(Q*10);if(Cv<CVMIN)Cv=Math.min(CVMIN,Ca);var nv=pOf(Cv,P50v);Pv=Pv+0.5*(nv-Pv);}
  Pend=PA-(PA-Pv)*Math.exp(-tt/tau);Ca=cont(Pend);up=Q*10*(Ca-Cv);
  var dC=6*(0.8*need/Q)/40*(S.hald?1:2);
  return {P50v:P50v,dpH:dpH,dCO2:dC,tt:tt,DL:DL,tau:tau,Pv:Pv,Pend:Pend,need:need,Q:Q,Ca:Ca,Cv:Cv,up:up,short:up<need*0.97};}
function why(m,s){if(S.ve<10)return U.wApnea;if(m.short&&SAT>=60)return U.wShort;if(s.PaCO2>50)return U.wHypo;if(s.PI<100)return U.wAlt;if(PA-m.Pend>8)return U.wDiff;return '';}
function draw(m,s){var o='<rect width="640" height="250" fill="#FFFFFF"/>';
  // person: head and trunk with two lungs that inflate with the breath
  var br=S.ve<1||DEAD?0:(Math.sin(ph)+1)/2,amp=Math.min(1.5,S.ve/100)*(0.6+0.6*S.w/100),sc=1+0.06*br*amp;
  var lip=SAT>=90?'#C0504D':SAT>=80?'#8E6FA8':'#4F6DB0',skin=SAT>=85?(S.hb<10?'#F3ECE6':'#F2D6C4'):'#D9D6E6';if(S.hb<10&&SAT>=90)lip='#D9A3A1';
  o+='<g transform="translate(130,0)"><circle cx="0" cy="44" r="28" fill="'+skin+'" stroke="#9A8478"/>'+(DEAD?'<path d="M-12 38 l7 6 M-12 44 l7 -6 M5 38 l7 6 M5 44 l7 -6" stroke="#16222E" stroke-width="2"/>':'<circle cx="-9" cy="40" r="2.6" fill="#16222E"/><circle cx="9" cy="40" r="2.6" fill="#16222E"/>')+
    '<path d="M-9 56 Q0 '+(60+4*br)+' 9 56" stroke="'+lip+'" stroke-width="3.5" fill="none" stroke-linecap="round"/>'+
    '<path d="M-70 92 Q-72 76 -40 74 L40 74 Q72 76 70 92 L62 240 L-62 240Z" fill="#EEF2F5" stroke="#B9C5CF"/>'+
    '<path d="M0 70 L0 108 M0 108 L-18 124 M0 108 L18 124" stroke="#8696A4" stroke-width="5" fill="none" stroke-linecap="round"/>'+
    '<g transform="translate(-30,160) scale('+sc+') translate(30,-160)"><path d="M-14 112 C-46 104 -58 150 -54 196 C-52 220 -20 222 -12 206 Z" fill="#F4B7B4" stroke="#C0504D" stroke-width="1.5"/></g>'+
    '<g transform="translate(30,160) scale('+sc+') translate(-30,-160)"><path d="M14 112 C46 104 58 150 54 196 C52 220 20 222 12 206 Z" fill="#F4B7B4" stroke="#C0504D" stroke-width="1.5"/></g>'+
    '<path d="M-58 212 Q0 '+(232+8*br*amp)+' 58 212" stroke="#B5520C" stroke-width="2.5" fill="none"/>';
  o+='</g>';
  // zoom on one alveolus and its capillary: red cells change colour along the capillary
  var x0=300,x1=620,yc=150;o+='<line x1="230" y1="150" x2="'+x0+'" y2="120" stroke="#B9C5CF" stroke-dasharray="4 3"/>';
  o+='<path d="M'+x0+' 128 Q460 '+(30-10*br*Math.min(1,S.ve/100))+' '+x1+' 128 Z" fill="#E6F1F9" stroke="#1F6FB2" stroke-width="1.5"/>';
  o+='<text x="460" y="96" font-size="12" font-weight="700" text-anchor="middle" fill="#1F6FB2">'+U.alv+' P<tspan font-size="9" dy="3">A</tspan><tspan dy="-3">O₂ '+f(PA,0)+' mmHg</tspan></text>';
  var Tpx=Math.min(14,4+S.T*2);o+='<rect x="'+x0+'" y="128" width="'+(x1-x0)+'" height="'+Tpx+'" fill="#F2DE96" opacity=".7"/>';
  o+='<rect x="'+x0+'" y="'+(128+Tpx)+'" width="'+(x1-x0)+'" height="34" rx="6" fill="#FBEDEC" stroke="#C0504D"/>';
  for(var i=0;i<9;i++){var u=((flow+i/9)%1),x=x0+8+u*(x1-x0-16),t=u*m.tt,p=PA-(PA-m.Pv)*Math.exp(-t/m.tau),sv=sat(p)/100;
    var r=Math.round(90+150*sv),g=Math.round(70-30*sv),b=Math.round(160-120*sv);o+='<ellipse cx="'+x.toFixed(1)+'" cy="'+(128+Tpx+17)+'" rx="11" ry="7" fill="rgb('+r+','+g+','+b+')"/>';}
  o+='<text x="'+x0+'" y="'+(128+Tpx+50)+'" font-size="11" fill="#55697A">'+U.inC+' '+f(m.Pv,0)+' mmHg</text><text x="'+x1+'" y="'+(128+Tpx+50)+'" font-size="11" fill="#55697A" text-anchor="end">'+U.outC+' '+f(m.Pend,0)+' mmHg</text>';
  o+='<text x="'+((x0+x1)/2)+'" y="'+(128+Tpx+66)+'" font-size="11" fill="#55697A" text-anchor="middle">'+U.transit+' '+f(m.tt,2)+' s</text>';
  $('#sv').innerHTML=o;
  var DO2=m.Q*m.Ca*10,EX=Math.min(100,m.need/Math.max(DO2,1)*100),exLim=35+50*S.w/100,mx=Math.max(DO2,m.need)*1.1,low=EX>exLim;
  var do2='<div class="do2"><div class="lab"><span>'+U.do2T+'</span><span>'+f(DO2,0)+' mL/min</span></div><div class="bar"><i style="width:'+(DO2/mx*100).toFixed(1)+'%;background:#2E7D4F"></i></div>'+
   '<div class="lab"><span>'+U.vo2T+'</span><span>'+f(m.need,0)+' mL/min</span></div><div class="bar"><i style="width:'+(m.need/mx*100).toFixed(1)+'%;background:#B5520C"></i></div>'+
   '<p style="font-size:13px">'+U.do2L.replace('{Q}',f(m.Q,1)).replace('{CA}',f(m.Ca,1)).replace('{DO2}',f(DO2,0)).replace('{EX}',f(EX,0))+'</p></div>';
  var st=SAT>=94?['#27500A',U.sOk]:SAT>=90?['#8A4A0B',U.sLow]:SAT>=80?['#A32D2D',U.sHyp]:['#A32D2D',U.sCya];
  var VO=m.up;
  function ar(v,n,tol){return Math.abs(v-n)<=tol?'':(v>n?' ↑':' ↓');}
  function tile(sym,val,lab,chg,k){return '<div class="tm'+(chg?' ch':'')+(HK===k?' hk':'')+'" data-k="'+k+'" tabindex="0"><span class="sy">'+sym+'</span><b>'+val+'</b><small>'+lab+'</small></div>';}
  var V={P50:f(m.P50v,1),DPH:f(7.40-m.dpH,2),PVC:f(s.PaCO2+m.dCO2,0),PAC:f(s.PaCO2,0),DC:f(m.dCO2,0),FI:f(S.Fi/100,2),PB:f(s.Pb,0),CO2:f(s.PaCO2,0),PA:f(PA,0),CA:f(m.Ca,1),CV:f(m.Cv,1),VO2:f(m.need,0),Q:f(m.Q,0),PV:f(m.Pv,0),VO:f(m.up,0)};
  var tip=HK?U.tip[HK].replace(/\{(\w+)\}/g,function(_,k){return V[k];}):'<span style="color:#55697A">'+U.tipHint+'</span>';
  var aV=ar(VO,250,15),aA=ar(S.A,70,2),aT=ar(S.T,0.5,0.05),aP1=ar(PA,100,3),aP2=ar(m.Pv,40,2);
  var H='<div class="eqr">'+tile('V̇O₂',f(VO,0)+aV,'mL/min',aV,'V')+'<span class="op">=</span>'+tile('D',U.dConst,U.dLab,'','D')+'<span class="op">·</span>'+tile('A',f(S.A,0)+' m²'+aA,U.aLab,aA,'A')+
   '<span class="op">·</span><span class="op">(</span>'+tile('P₁',f(PA,0)+' mmHg'+aP1,U.p1Lab,aP1,'P1')+'<span class="op">−</span>'+tile('P₂',f(m.Pv,0)+' mmHg'+aP2,U.p2Lab,aP2,'P2')+'<span class="op">)</span><span class="op">/</span>'+tile('T',f(S.T,1)+' µm'+aT,U.tLab,aT,'T')+'</div>'+
   '<div class="tip">'+tip+'</div>'+
   do2+'<p style="font-size:13px;color:#55697A">'+U.co2L.replace('{PVC}',f(s.PaCO2+m.dCO2,0)).replace('{PAC}',f(s.PaCO2,0)).replace('{DC}',f(m.dCO2,0))+(S.hald?'':' <b style="color:#B5520C">'+U.noHald+'</b>')+'</p>'+
   '<p><b style="color:'+st[0]+'">SpO₂ '+f(SAT,0)+' % · '+(DEAD?U.deadS:st[1])+'</b> '+(SAT<94||DEAD?why(m,s):'')+(low&&!DEAD?' <b style="color:#A32D2D">'+(SAT>=94?U.hidden:U.hidden2)+'</b>':'')+'</p>';if(H!==LASTH){$('#res').innerHTML=H;LASTH=H;}}
function tick(ts){if(t0===null)t0=ts;var dt=Math.min(0.05,(ts-t0)/1000);t0=ts;var s=ss(),m=model();
  if(!PZ){var rate=(12+28*S.w/100)*(S.ve<1?0:Math.min(1.6,0.5+S.ve/200));ph+=dt*rate/60*2*Math.PI*1.5;flow=(flow+dt/(m.tt*4))%1;
    if(!DEAD){PA+=(s.PAss-PA)*Math.min(1,dt/1.5);var tg=sat(m.Pend);SAT+=(tg-SAT)*Math.min(1,dt/0.8);
      if(SAT<60||m.short){lowT+=dt;if(lowT>1.5){DEAD=true;$('#dT').textContent=U.deadT;$('#dM').textContent=why(m,s)||U.wDiff;$('#again').textContent=U.again;$('#dead').style.display='flex';}}else lowT=0;}}
  draw(m,s);requestAnimationFrame(tick);}
$('#res').addEventListener('mouseover',function(e){var t=e.target.closest('.tm');if(t)HK=t.getAttribute('data-k');});
$('#res').addEventListener('pointerdown',function(e){var t=e.target.closest('.tm');if(t)HK=t.getAttribute('data-k');});
$('#res').addEventListener('focusin',function(e){var t=e.target.closest('.tm');if(t)HK=t.getAttribute('data-k');});
ctl();setPre(0);requestAnimationFrame(tick);
</script>
