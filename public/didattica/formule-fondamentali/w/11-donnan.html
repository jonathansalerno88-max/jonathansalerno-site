<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Da Gibbs-Donnan a Starling, passo per passo</title>
<link rel="stylesheet" href="widget.css">
<style>
body{margin:0;padding:8px 10px 10px}
.pn{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;padding:8px 10px;color:#16222E}

.ct{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 2px 6px}
.bt{font:700 14.5px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;padding:7px 14px;border-radius:9px;border:2px solid #1456A8;background:#1456A8;color:#FFFFFF;cursor:pointer;min-width:112px}
.bt.g{background:#FFFFFF;color:#16222E;border-color:#55697A;min-width:0}
.st{font:700 13px/1 system-ui,-apple-system,Segoe UI,sans-serif;width:30px;height:30px;border-radius:50%;border:2px solid #9AA7B2;background:#FFFFFF;color:#55697A;cursor:pointer;padding:0}
.st.on{border-color:#1456A8;background:#1456A8;color:#FFFFFF}
.st.dn{border-color:#1456A8;color:#1456A8}
.rd{font-size:14.5px;line-height:1.45;margin:6px 2px 2px;min-height:4.4em}
.rd b{font-weight:700}
.lg{font-size:12px;line-height:1.4;color:#55697A;margin:4px 2px 0}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<p class="sr" id="sr"></p>
<div class="pn">
 <div class="ct"><button type="button" class="bt" id="pl"></button><button type="button" class="bt g" id="rs">↺</button><span id="sts" style="display:flex;gap:5px;margin-left:6px"></span></div>
 <svg id="sv" viewBox="0 0 720 300" role="img"></svg>
 <p class="rd" id="rd" aria-live="polite"></p>
 <p class="lg" id="lg"></p>
</div>
<script>
(function(){
var it=document.documentElement.lang==='it';function T(a,b){return it?a:b;}
var NS='http://www.w3.org/2000/svg',sv=document.getElementById('sv');
function mk(n,a,t,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;(p||sv).appendChild(e);return e;}

mk('path',{d:'M'+PX0+' '+YT+' V'+YB+' H'+IX1+' V'+YT,stroke:INK,'stroke-width':2.5,fill:'none'});
for(var y=YT;y<YB;y+=22)mk('rect',{x:PX1,y:y,width:16,height:13,fill:'#B03A3A'});
mk('text',{x:(PX0+PX1)/2,y:44,'font-size':15,'font-weight':700,fill:'#B03A3A','text-anchor':'middle'},T('plasma','plasma'));
mk('text',{x:(IX0+IX1)/2,y:44,'font-size':15,'font-weight':700,fill:'#8A6A00','text-anchor':'middle'},T('interstizio','interstitium'));
mk('text',{x:PX1+8,y:22,'font-size':11.5,fill:MU,'text-anchor':'middle'},T('parete del capillare','capillary wall'));mk('path',{d:'M'+(PX1+8)+' 27 V'+(YT-4),stroke:MU,'stroke-width':1});
var chg=mk('text',{x:PX0+8,y:YT+18,'font-size':12.5,'font-weight':700,fill:INK});
var cnt=[mk('text',{x:(PX0+PX1)/2,y:YB+20,'font-size':13,'font-weight':700,fill:INK,'text-anchor':'middle'}),mk('text',{x:(IX0+IX1)/2,y:YB+20,'font-size':13,'font-weight':700,fill:INK,'text-anchor':'middle'})];
var tot=[mk('text',{x:(PX0+PX1)/2,y:YB+38,'font-size':12.5,fill:MU,'text-anchor':'middle'}),mk('text',{x:(IX0+IX1)/2,y:YB+38,'font-size':12.5,fill:MU,'text-anchor':'middle'})];
function dot(c,s,r){var g=mk('g',{});mk('circle',{r:r||8,fill:c,stroke:INK,'stroke-width':1},null,g);mk('text',{y:(r||8)*.42,'font-size':(r||8)*1.25,'font-weight':800,fill:INK,'text-anchor':'middle'},s,g);return g;}
var P=[];function add(c,s,x,y,r,o){var d={e:dot(c,s,r),x:x,y:y,ph:P.length*1.7,fx:!!(o&&o.fx)};if(o)for(var k in o)d[k]=o[k];P.push(d);return d;}
[[100,150],[215,140],[150,205],[270,215]].forEach(function(q){add(CPr,'−',q[0],q[1],13,{fx:1});});
[[80,205],[120,175],[180,165],[245,180],[300,150],[90,235],[200,232],[235,212],[300,235],[160,138]].forEach(function(q){add(CNa,'+',q[0],q[1]);});
[[130,228],[195,195],[262,160],[305,195],[70,170],[240,236]].forEach(function(q){add(CCl,'−',q[0],q[1]);});
[[380,150],[430,190],[480,145],[530,200],[585,150],[635,195],[405,232],[505,235],[610,234]].forEach(function(q){add(CNa,'+',q[0],q[1]);});
[[400,180],[455,150],[455,225],[510,175],[560,170],[560,228],[612,172],[650,150],[650,230]].forEach(function(q){add(CCl,'−',q[0],q[1]);});
var mNa=add(CNa,'+',372,205,8,{tx:292,ty:200}),mCl=add(CCl,'−',372,170,8,{tx:286,ty:172});
var wd=[];for(var i=0;i<5;i++)wd.push(mk('circle',{r:5,fill:CW,stroke:'#FFFFFF','stroke-width':1,opacity:0}));
var hyd=mk('g',{opacity:0});mk('path',{d:'M0 0 V34 m-9 -11 l9 13 l9 -13',stroke:'#B03A3A','stroke-width':5,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'},null,hyd);mk('path',{d:'M90 0 V34 m-9 -11 l9 13 l9 -13',stroke:'#B03A3A','stroke-width':5,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'},null,hyd);mk('text',{x:45,y:14,'font-size':12,'font-weight':700,fill:'#B03A3A','text-anchor':'middle'},T('pressione','hydrostatic'),hyd);mk('text',{x:45,y:28,'font-size':12,'font-weight':700,fill:'#B03A3A','text-anchor':'middle'},T('idrostatica','pressure'),hyd);
var osm=mk('g',{opacity:0});mk('path',{d:'M'+(IX0+70)+' 92 H'+(PX1-60)+' m12 -8 l-13 8 l13 8',stroke:CW,'stroke-width':5,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'},null,osm);mk('text',{x:IX0+78,y:96,'font-size':12.5,'font-weight':700,fill:'#1F6FB0'},T('l’acqua entra','water enters'),osm);
var bal=mk('text',{x:(IX0+IX1)/2+60,y:YT+40,'font-size':13,'font-weight':800,fill:INK,'text-anchor':'middle',opacity:0},T('spinta = richiamo','push = pull'));
var CAP=[[T('1 · Partenza','1 · Start'),T('Le proteine (rosa) hanno cariche negative e non passano la parete. Mettiamo il Na⁺ pari ai due lati. Il plasma è neutro, ma ha <b>meno Cl⁻</b> dell’interstizio.','The proteins (pink) carry negative charges and do not cross the wall. We set Na⁺ equal on both sides. Plasma is neutral, but it has <b>less Cl⁻</b> than the interstitium.')],
[T('2 · Entra il Cl⁻','2 · Cl⁻ enters'),T('Il Cl⁻ attraversa la parete e va dove ce n’è meno: <b>entra nel plasma</b>. Il plasma si ritrova con una carica negativa in più.','Cl⁻ crosses the wall and goes where there is less of it: <b>it enters plasma</b>. Plasma is left with one extra negative charge.')],
[T('3 · Lo segue il Na⁺','3 · Na⁺ follows'),T('Un plasma negativo attira cationi: <b>entra Na⁺</b> e il plasma torna neutro. Ora nel plasma c’è più Na⁺ che fuori, e ancora meno Cl⁻ che fuori.','A negative plasma attracts cations: <b>Na⁺ enters</b> and plasma is neutral again. Plasma now has more Na⁺ than outside, and still less Cl⁻ than outside.')],
[T('4 · Entra l’acqua','4 · Water enters'),T('Conta le particelle: <b>più nel plasma che nell’interstizio</b>. L’acqua va verso il lato più concentrato: entra nel plasma. È la parte «Donnan» della pressione oncotica.','Count the particles: <b>more in plasma than in the interstitium</b>. Water moves towards the more concentrated side: it enters plasma. This is the “Donnan” part of oncotic pressure.')],
[T('5 · La pressione idrostatica si oppone','5 · Hydrostatic pressure opposes'),T('Da solo il richiamo d’acqua non si fermerebbe. Nel capillare lo contrasta la <b>pressione idrostatica</b> del sangue, che spinge l’acqua fuori. Quando spinta e richiamo si pareggiano, tutto è fermo: è l’<b>equazione di Starling</b>.','On its own the pull of water would not stop. In the capillary it is opposed by the <b>hydrostatic pressure</b> of blood, which pushes water out. When push and pull are equal, everything stands still: this is <b>Starling’s equation</b>.')]];
var N=CAP.length,DUR=5.2,tm=0,play=false,last=0,red=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,jt=0;
var pl=document.getElementById('pl'),sts=document.getElementById('sts'),sb=[];
for(var k=0;k<N;k++)(function(k){var b=document.createElement('button');b.type='button';b.className='st';b.textContent=k+1;b.setAttribute('aria-label',CAP[k][0]);b.addEventListener('click',function(){tm=k*DUR+(k?DUR*.55:0);play=false;ui();draw();});sts.appendChild(b);sb.push(b);})(k);
function cl(v){return Math.max(0,Math.min(1,v));}function ez(u){return u<.5?2*u*u:1-2*(1-u)*(1-u);}
var cur=-1;
function ui(){pl.textContent=play?T('⏸ Pausa','⏸ Pause'):(tm>=N*DUR-.01?T('↺ Da capo','↺ Replay'):T('▶ Avvia','▶ Play'));}
function draw(){var k=Math.min(N-1,Math.floor(tm/DUR)),u=cl((tm-k*DUR)/(DUR*.5)),e=ez(u);
 var aCl=k>1?1:k===1?e:0,aNa=k>2?1:k===2?e:0,aW=k>3?1:k===3?e:0,aH=k===4?e:0;
 if(k!==cur){cur=k;document.getElementById('rd').innerHTML='<b>'+CAP[k][0]+'.</b> '+CAP[k][1];sb.forEach(function(b,i){b.className='st'+(i===k?' on':i<k?' dn':'');});}
 var lvP=L0-20*aW+20*aH,lvI=L0+17*aW-17*aH;liqP.setAttribute('y',lvP);liqP.setAttribute('height',YB-lvP);liqI.setAttribute('y',lvI);liqI.setAttribute('height',YB-lvI);
 P.forEach(function(d){var x=d.x,y=d.y;if(d===mCl){x+=(d.tx-d.x)*aCl;y+=(d.ty-d.y)*aCl;}if(d===mNa){x+=(d.tx-d.x)*aNa;y+=(d.ty-d.y)*aNa;}
  var a=d.fx?1.2:3.2;d.e.setAttribute('transform','translate('+(x+Math.sin(jt*1.3+d.ph)*a).toFixed(1)+' '+(y+Math.cos(jt*1.1+d.ph*1.3)*a).toFixed(1)+')');});
 var neg=k===1&&u>.55||(k===2&&u<.45);chg.textContent=neg?T('un po’ negativo','slightly negative'):T('neutro','neutral');chg.setAttribute('fill',neg?'#B03A3A':MU);
 var na=[10+(aNa>.5?1:0),10-(aNa>.5?1:0)],clv=[6+(aCl>.5?1:0),10-(aCl>.5?1:0)];
 cnt[0].textContent='Na⁺ '+na[0]+'   Cl⁻ '+clv[0]+T('   proteine 4','   proteins 4');cnt[1].textContent='Na⁺ '+na[1]+'   Cl⁻ '+clv[1];
 tot[0].textContent=T('particelle: ','particles: ')+(na[0]+clv[0]+4);tot[1].textContent=T('particelle: ','particles: ')+(na[1]+clv[1]);
 var sh=k>=3;tot[0].setAttribute('font-weight',sh?800:400);tot[1].setAttribute('font-weight',sh?800:400);tot[0].setAttribute('fill',sh?INK:MU);tot[1].setAttribute('fill',sh?INK:MU);
 wd.forEach(function(w,i){var ph=k===3?cl(u*1.5-i*.12):0;w.setAttribute('opacity',ph>0&&ph<1?1:0);w.setAttribute('cx',(IX0+40-ph*110).toFixed(1));w.setAttribute('cy',135+i*24);});
 osm.setAttribute('opacity',k===3?cl(u*3):k===4?1:0);hyd.setAttribute('opacity',k===4?cl(u*3):0);hyd.setAttribute('transform','translate('+((PX0+PX1)/2-45)+' '+(lvP-52)+')');bal.setAttribute('opacity',k===4&&u>.9?1:0);bal.setAttribute('y',YT+20);}
function loop(now){var dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(!red)jt+=dt*(play?1:.35);if(play){tm+=dt;if(tm>=N*DUR){tm=N*DUR-.001;play=false;ui();}}draw();requestAnimationFrame(loop);}
pl.addEventListener('click',function(){if(tm>=N*DUR-.01)tm=0;play=!play;ui();});
document.getElementById('rs').addEventListener('click',function(){tm=0;play=false;ui();draw();});
document.getElementById('rs').setAttribute('aria-label',T('Ricomincia','Restart'));
document.getElementById('lg').innerHTML=T('Disegno schematico: poche particelle al posto di milioni, e l’interstizio grande quanto il plasma. Nel corpo i passi 2, 3 e 4 avvengono insieme e sono sempre già avvenuti.','Schematic drawing: a few particles instead of millions, and the interstitium as large as plasma. In the body steps 2, 3 and 4 happen together and have always already happened.');
document.getElementById('sr').textContent=T('Animazione in cinque passi, con pausa: il cloro entra nel plasma, il sodio lo segue, l’acqua entra perché nel plasma ci sono più particelle, e la pressione idrostatica si oppone.','Five-step animation, with pause: chloride enters plasma, sodium follows, water enters because plasma holds more particles, and hydrostatic pressure opposes.');
ui();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
