<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animazioni delle formule</title>
<link rel="stylesheet" href="widget.css">
<style>
body{margin:0;padding:8px 10px 10px}
.fm{text-align:center;margin:2px 0 6px;min-height:46px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 5px;font-size:18px;line-height:1.1}
.fm b{display:inline-block;transition:font-size .15s}
.fm span{color:#55697A}
canvas{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:10px;background:#FFFFFF}
.out{display:flex;align-items:center;gap:10px;margin:8px 0 6px;font-size:14px;flex-wrap:wrap}
.out .lab{font-weight:700;min-width:64px}
.bar{position:relative;flex:1 1 180px;height:16px;border-radius:8px;background:#EEF2F5;border:1px solid var(--border);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:8px}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#16222E}
.out .val{font-weight:700;min-width:150px}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px 18px;margin:6px 0 4px}
.sl label{display:block;font-size:13px;line-height:1.3}
.sl label b{font-size:15px}
.sl label em{font-style:normal;float:right;font-weight:700}
.sl label small{display:block;color:#55697A;font-size:12px}
.sl input{width:100%;margin:2px 0 0}
.up{color:#0E7C66;font-weight:700}.dn{color:#B03A3A;font-weight:700}
.rs{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--border-strong);background:#FFFFFF;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<h2 class="sr-only" id="sr"></h2>
<div class="fm" id="fm" aria-hidden="true"></div>
<canvas id="cv" width="680" height="250"></canvas>
<div class="out"><span class="lab" id="ol"></span><div class="bar"><i id="bi"></i><u id="bu"></u></div><span class="val" id="ov"></span></div>
<div class="sl" id="sl"></div>
<button type="button" class="rs" id="rs"></button>
<script>
(function(){
var it=document.documentElement.lang==='it',F=(new URLSearchParams(location.search).get('f'))||'darcy';

var UP=T('se sale, il flusso sale','if it rises, flow rises'),DN=T('se sale, il flusso scende','if it rises, flow falls');

    {k:'L',s:'L',c:'#8A6A00',n:T('spessore dello strato','thickness of the layer'),d:-1}],
 f:function(v){return v.k*v.A*v.dP/(v.mu*v.L);},

 t:[{k:'Pc',s:'P<sub>c</sub>',c:'#B03A3A',n:T('pressione nel capillare: spinge fuori','pressure in the capillary: pushes out'),d:1,min:5,max:60,v:35,u:'mmHg'},
    {k:'pc',s:'π<sub>c</sub>',c:'#6A3A96',n:T('proteine del plasma: richiamano dentro','plasma proteins: pull in'),d:-1,min:5,max:40,v:25,u:'mmHg'},
    {k:'Pi',s:'P<sub>i</sub>',c:'#C2571A',n:T('pressione nel tessuto: si oppone','pressure in the tissue: opposes'),d:-1,min:-5,max:20,v:0,u:'mmHg'},

 fm:function(B){return B('res')+'<span>=</span>'+B('Kf')+'<span>· [(</span>'+B('Pc')+'<span>−</span>'+B('Pi')+'<span>) −</span>'+B('sg')+'<span>(</span>'+B('pc')+'<span>−</span>'+B('pi')+'<span>)]</span>';}}
}[F]||null;
if(!D)return;
document.getElementById('sr').textContent=D.sr;
var V={},DEF={};D.t.forEach(function(t){if(t.min==null)t.min=.25;if(t.max==null)t.max=3;if(t.v==null)t.v=1;if(t.u==null)t.u='×';V[t.k]=t.v;DEF[t.k]=t.v;});

document.getElementById('rs').textContent=T('↺ Valori normali','↺ Normal values');

  var t=D.t.filter(function(x){return x.k===k;})[0],rel=D.abs?(t.k==='sg'?.5+V[k]*.5:t.k==='Pi'||t.k==='pi'?(V[k]-t.min+4)/(DEF[k]-t.min+4):V[k]/DEF[k]):V[k];rel=Math.min(3.2,Math.max(.22,rel));
  return '<b style="color:'+t.c+';font-size:'+Math.max(11,(20+8*Math.log(rel)/Math.LN2)).toFixed(0)+'px">'+t.s+'</b>';}
 document.getElementById('fm').innerHTML=D.fm(B);
 var bi=document.getElementById('bi'),bu=document.getElementById('bu'),ov=document.getElementById('ov');
 if(D.abs){var net=(V.Pc-V.Pi)-V.sg*(V.pc-V.pi),w=Math.min(50,Math.abs(q)*1.1);bu.style.left='50%';bi.style.left=q>=0?'50%':(50-w)+'%';bi.style.width=w+'%';bi.style.background=q>=0?'#1456A8':'#6A3A96';

 else{var p=Math.min(100,33.3*Math.log(1+r*3.2)/Math.log(4.2)*1.5);bu.style.left='50%';bi.style.left='0';bi.style.width=Math.min(100,50*Math.sqrt(r))+'%';bi.style.background='#1456A8';

var cv=document.getElementById('cv'),x=cv.getContext('2d'),W=680,H=250,dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;x.scale(dpr,dpr);

 var sp=Math.min(320,Math.max(6,70*v)),rad=2.4+1.3*V.mu,mc=Math.min(1,(V.mu-.25)/2.75),col='rgb('+Math.round(40+190*mc)+','+Math.round(120+40*mc)+','+Math.round(215-190*mc)+')';
 P.forEach(function(p){p.x+=sp*dt*(p.x<w.x0?.9:p.x>w.x1?1.1:1);x.globalAlpha=p.x>620?Math.max(0,(680-p.x)/60):1;x.fillStyle=col;x.beginPath();x.arc(p.x,p.y,rad,0,7);x.fill();});x.globalAlpha=1;P=P.filter(function(p){return p.x<680;});
 arrow(22,H/2,22+26+34*V.dP,H/2,'#B03A3A',3+3.2*V.dP);txt('ΔP',40,H/2-16-2*V.dP,'#B03A3A','left',15);
 brace(w.x1+10,w.y0,w.y1,'#0E7C66','A');x.strokeStyle='#8A6A00';x.lineWidth=2;x.beginPath();x.moveTo(w.x0,H-12);x.lineTo(w.x1,H-12);x.moveTo(w.x0,H-17);x.lineTo(w.x0,H-7);x.moveTo(w.x1,H-17);x.lineTo(w.x1,H-7);x.stroke();txt('L',340,H-18,'#8A6A00','center',15);
 txt('k: '+n+' '+T('pori','pores'),340,16,'#B5520C','center',13);txt(T('alta pressione','high pressure'),12,22,'#55697A','left',12);txt(T('bassa pressione','low pressure'),668,22,'#55697A','right',12);txt('Q',640,H/2-12,'#1456A8','center',16);}
