<style>
body{margin:0;padding:8px 10px 10px}

.sl label small{display:block;color:#55697A;font-size:12px}

.up{color:#0E7C66;font-weight:700}.dn{color:#B03A3A;font-weight:700}

ng:6px 8px;font-size:12.5px;text-align:center;pointer-events:none}.zl[hidden]{display:none}.zl svg{display:block;width:100%;height:auto}#mZ{cursor:zoom-in}
#fs{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;margin:6px 0;padding:6px 8px}#fs[hidden]{display:none}#fs svg{display:block;width:100%;height:auto}.kid{display:flex;gap:10px;align-items:center;margin:8px 2px 2px;padding:8px 10px;border:1.5px solid #C9D3DC;border-radius:10px;background:#FBFCFD;flex-wrap:wrap}#circ .kid svg{display:block;width:52px;height:56px;flex:0 0 auto;margin:0}.kw.kwa{border-left-color:#E8960C;background:#FDF3E1}.kw.kwa b{color:#9A5B00}.lad{margin:6px 2px 2px;font-size:12.5px}.lad ol{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.lad li{border:1.5px solid #DDE4EA;border-radius:9px;padding:5px 7px;background:#FBFCFD;color:#8696A4;line-height:1.3}.lad li b{display:block;font-size:12px}.lad li span{font-size:11px}.lad li.dn2{color:#55697A;border-color:#9DACB9;background:#F1F4F7}.lad li.cur{color:#16222E;border-width:2.5px}.lad li.s1,.lad li.s2{border-color:#1456A8;background:#E8F0FB}.lad li.s3{border-color:#E8960C;background:#FDF3E1}.lad li.s4{border-color:#B03A3A;background:#FCEBEB}@media (max-width:560px){.lad ol{grid-template-columns:1fr 1fr}}#circ svg.lift{flex:0 0 168px;width:168px;height:auto;display:block}@media (prefers-reduced-motion:no-preference){.lift.shk{animation:shk .18s linear infinite}}@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.2px)}75%{transform:translateX(1.2px)}}.per{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:3px 14px;margin:6px 2px 2px;padding:7px 10px;border:1.5px solid #C9D3DC;border-radius:10px;background:#FBFCFD;font-size:12.5px}.per>b{grid-column:1/-1}.pi{display:flex;align-items:center;gap:6px}.pi span{flex:0 0 104px}.pi i{flex:1;height:9px;border-radius:5px;background:#EEF2F5;border:1px solid #DDE4EA;overflow:hidden}.pi u{display:block;height:100%}.pi em{font-style:normal;font-weight:700;flex:0 0 38px;text-align:right}.pi small{font-weight:400;color:#55697A}.kw{flex:1 1 100%;margin:2px 0 0;padding:5px 9px;border-left:4px solid #B03A3A;background:#FCEBEB;font-size:12.5px;line-height:1.4;color:#16222E}.kw b{color:#B03A3A}.kt{display:flex;flex-direction:column;font-size:12.5px;line-height:1.35;flex:1 1 150px;min-width:0}.kt:first-of-type{flex:3 1 280px}.kt .kf{font-size:15px;margin:2px 0}.kt small{color:#55697A;font-size:11px}.kt small.kn{font-size:11.5px}
.fsc{margin:2px 4px 0;font-size:12px;line-height:1.35}.fsh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;margin:0 0 2px}.fsh b{margin-right:auto}.fsh button.pl{border-color:#55697A;color:#16222E;display:inline-flex;align-items:center}.fsh button.pl i{display:inline-block;width:20px;height:10px;border-radius:5px;border:1.3px solid #55697A;margin-right:6px}.fsh button.pl.on{background:#3E4A54;border-color:#3E4A54;color:#FFFFFF}.fsh2 button.rst{border-color:#55697A;color:#16222E}.fsh2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 4px}.fsh button,.fsh2 button{font:inherit;font-size:13px;padding:3px 11px;border-radius:999px;border:1.5px solid #0E7C66;background:#FFFFFF;color:#0E7C66;font-weight:700;cursor:pointer}.fsh button.on{background:#0E7C66;color:#FFFFFF}.fsh button.bad,.fsh2 button.bad{border-color:#B03A3A;color:#B03A3A}.fsh button.bad.on,.fsh2 button.bad.on{background:#B03A3A;color:#FFFFFF}
.cs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 2px}.cs[hidden]{display:none}.cs button{font:inherit;text-align:left;border:1.5px solid #C9D3DC;border-radius:10px;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;line-height:1.3;color:#16222E}.cs button.on{border:3px solid #16222E;padding:4.5px 8.5px}.cs span{font-size:12.5px}.cs b{font-size:16px}.cs b small{font-size:12px;font-weight:700}.cs em{font-style:normal;font-size:12px;color:#55697A}
#kctl{display:none!important}.out.hid{display:none}#circ>.kw{margin:4px 2px}
.pre{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.pre button{font:inherit;font-size:13px;padding:4px 11px;border-radius:999px;border:1.5px solid #1456A8;background:#FFFFFF;color:#1456A8;font-weight:700;cursor:pointer}.pre button.on{background:#1456A8;color:#FFFFFF}
.sld{margin:6px 0 0}.sld summary{cursor:pointer;font-size:13.5px;font-weight:700;color:#1456A8;padding:5px 0;list-style-position:inside}.sld.plain summary{display:none}
.rs{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--border-strong);background:#FFFFFF;cursor:pointer}

<script>
(function(){
var it=document.documentElement.lang==='it',F=(new URLSearchParams(location.search).get('f'))||'darcy';
function T(a,b){return it?a:b;}
var UP=T('se sale, il flusso sale','if it rises, flow rises'),DN=T('se sale, il flusso scende','if it rises, flow falls');
var D={
darcy:{sr:T('Animazione della legge di Darcy: muovi i cinque termini e guarda il flusso','Animation of Darcy’s law: move the five terms and watch the flow'),res:'Q',rc:'#1456A8',q:T('Q = portata: volume che passa nell’unità di tempo&#10;[L³ T⁻¹] · m³/s','Q = flow rate: volume passing per unit time&#10;[L³ T⁻¹] · m³/s'),
 t:[{k:'dP',s:'ΔP',c:'#B03A3A',q:T('ΔP = differenza di pressione tra i due lati&#10;[M L⁻¹ T⁻²] · Pa (Pa = N/m²)','ΔP = pressure difference between the two sides&#10;[M L⁻¹ T⁻²] · Pa (Pa = N/m²)'),n:T('spinta: differenza di pressione','push: pressure difference'),d:1},
    {k:'k',s:'k',c:'#B5520C',q:T('k = permeabilità del materiale&#10;[L²] · m²','k = permeability of the material&#10;[L²] · m²'),n:T('permeabilità: quanti pori','permeability: how many pores'),d:1},
    {k:'A',s:'A',c:'#0E7C66',q:T('A = area attraversata&#10;[L²] · m²','A = area crossed&#10;[L²] · m²'),n:T('area dello strato','area of the layer'),d:1},
    {k:'mu',s:'μ',c:'#6A3A96',q:T('μ = viscosità dinamica del liquido&#10;[M L⁻¹ T⁻¹] · Pa·s (Pa = N/m²)','μ = dynamic viscosity of the fluid&#10;[M L⁻¹ T⁻¹] · Pa·s (Pa = N/m²)'),n:T('viscosità: acqua → miele','viscosity: water → honey'),d:-1},
    {k:'L',s:'L',c:'#8A6A00',q:T('L = spessore dello strato&#10;[L] · m','L = thickness of the layer&#10;[L] · m'),n:T('spessore dello strato','thickness of the layer'),d:-1}],
 f:function(v){return v.k*v.A*v.dP/(v.mu*v.L);},
 fm:function(B){return B('res')+'<span>=</span>'+B('k')+'<span>·</span>'+B('A')+'<span>·</span>'+B('dP')+'<span>/ (</span>'+B('mu')+'<span>·</span>'+B('L')+'<span>)</span>';}},
fick:{sr:T('Animazione della legge di Fick: muovi i quattro termini e guarda quante molecole passano','Animation of Fick’s law: move the four terms and watch how many molecules cross'),res:'J·A',rc:'#1456A8',q:T('J·A = quantità di sostanza che attraversa nell’unità di tempo&#10;[N T⁻¹] · mol/s&#10;(J da solo è il flusso per unità di area: [N L⁻² T⁻¹] · mol/(m²·s))','J·A = amount of substance crossing per unit time&#10;[N T⁻¹] · mol/s&#10;(J alone is the flux per unit area: [N L⁻² T⁻¹] · mol/(m²·s))'),
 t:[{k:'dC',s:'ΔC',c:'#B03A3A',q:T('ΔC = differenza di concentrazione tra i due lati&#10;[N L⁻³] · mol/m³','ΔC = concentration difference between the two sides&#10;[N L⁻³] · mol/m³'),n:T('differenza di concentrazione','concentration difference'),d:1,min:0},
    {k:'D',s:'D',c:'#B5520C',q:T('D = coefficiente di diffusione (diffusività)&#10;[L² T⁻¹] · m²/s','D = diffusion coefficient (diffusivity)&#10;[L² T⁻¹] · m²/s'),n:T('diffusività: quanto si agitano le molecole','diffusivity: how much the molecules jiggle'),d:1},
    {k:'A',s:'A',c:'#0E7C66',q:T('A = area della membrana&#10;[L²] · m²','A = area of the membrane&#10;[L²] · m²'),n:T('area della membrana','area of the membrane'),d:1},
    {k:'dx',s:'Δx',c:'#8A6A00',q:T('Δx = spessore della membrana&#10;[L] · m','Δx = thickness of the membrane&#10;[L] · m'),n:T('spessore della membrana','thickness of the membrane'),d:-1}],
 f:function(v){return v.D*v.A*v.dC/v.dx;},
 fm:function(B){return B('res')+'<span>=</span>'+B('D')+'<span>·</span>'+B('A')+'<span>·</span>'+B('dC')+'<span>/</span>'+B('dx');}},
starling:{sr:T('Animazione dell’equazione di Starling: muovi le forze e guarda se il liquido esce o rientra','Animation of the Starling equation: move the forces and watch whether fluid leaves or returns'),res:'J<sub>v</sub>',rc:'#1456A8',q:T('Jv = flusso di liquido attraverso la parete del capillare&#10;[L³ T⁻¹] · m³/s; in clinica mL/min','Jv = fluid flow across the capillary wall&#10;[L³ T⁻¹] · m³/s; clinically mL/min'),abs:1,up:T('se sale, esce più liquido','if it rises, more fluid leaves'),dn:T('se sale, esce meno liquido','if it rises, less fluid leaves'),
 pre:[[T('normale','normal'),{},'',T('Il filtrato è poco e la linfa lo porta via: nessun edema.','Little is filtered and lymph carries it away: no oedema.')],
  [T('scompenso sinistro','left heart failure'),{Pc:50},'lhf',T('<b>Problema di precarico, nel piccolo circolo.</b> Il cuore sinistro non smaltisce il sangue che torna dai polmoni: il sangue si accumula e la pressione alta del ventricolo si trasmette a ritroso a tutto il sangue collegato (principio di Pascal): vene polmonari, poi capillari del polmone, dove sale P<sub>c</sub>. Edema polmonare, fiato corto; le caviglie restano asciutte. Alla lunga la pressione risale fino all’arteria polmonare: per il cuore destro è un postcarico alto, e cede anche lui. (Nel polmone le pressioni vere sono più basse: P<sub>c</sub> normale circa 7–10 mmHg.)','<b>A preload problem, in the pulmonary circulation.</b> The left heart cannot clear the blood coming back from the lungs: blood accumulates and the high pressure in the ventricle is transmitted backwards to all the connected blood (Pascal’s principle): pulmonary veins, then lung capillaries, where P<sub>c</sub> rises. Pulmonary oedema, breathlessness; the ankles stay dry. In the long run the pressure climbs back to the pulmonary artery: for the right heart that is a high afterload, and it fails too. (In the lung real pressures are lower: normal P<sub>c</sub> about 7–10 mmHg.)')],
  [T('scompenso destro','right heart failure'),{Pc:50},'hf',T('<b>Problema di precarico, nel grande circolo.</b> Il cuore destro non smaltisce il sangue che torna dal corpo: ristagna nelle vene sistemiche e sale P<sub>c</sub> nei capillari del corpo. Caviglie gonfie da tutti e due i lati; i polmoni restano asciutti.','<b>A preload problem, in the systemic circulation.</b> The right heart cannot clear the blood coming back from the body: it backs up in the systemic veins and P<sub>c</sub> rises in the body’s capillaries. Swollen ankles on both sides; the lungs stay dry.')],
  [T('ipertensione polmonare','pulmonary hypertension'),{Pc:46},'ph',T('<b>Problema di postcarico, per il cuore destro.</b> Nell’arteria polmonare la pressione è alta: il ventricolo destro spinge contro una resistenza alta. Finché regge, nessun edema. Quando cede, il sangue ristagna nelle vene del corpo e torna a essere un problema di precarico: P<sub>c</sub> alta, caviglie gonfie. Se l’ostacolo è prima dei capillari, i polmoni restano asciutti.','<b>An afterload problem, for the right heart.</b> Pressure in the pulmonary artery is high: the right ventricle pushes against a high resistance. While it copes, no oedema. When it gives way, blood backs up in the body’s veins and it becomes a preload problem again: high P<sub>c</sub>, swollen ankles. If the obstacle is before the capillaries, the lungs stay dry.')],
  [T('vena chiusa (trombosi)','blocked vein (thrombosis)'),{Pc:52},'dvt',T('<b>Né precarico né postcarico:</b> è un blocco locale. A monte del trombo sale P<sub>c</sub>, in una gamba sola. Il sangue aggira il blocco passando dalle perforanti nelle vene superficiali, che si dilatano: è il circolo collaterale.','<b>Neither preload nor afterload:</b> a local block. Upstream of the clot P<sub>c</sub> rises, in one leg only. Blood bypasses the block through the perforating veins into the superficial veins, which dilate: the collateral circulation.')],
  [T('varici (valvole che non tengono)','varicose veins (leaky valves)'),{Pc:44},'var',T('<b>Né precarico né postcarico:</b> le valvole delle vene superficiali e delle perforanti non tengono. In piedi il sangue ricade verso il basso e dalle vene profonde torna nelle superficiali: pressione alta alla caviglia, vene dilatate, gonfiore la sera.','<b>Neither preload nor afterload:</b> the valves of the superficial and perforating veins leak. On standing, blood falls back down and returns from the deep veins into the superficial ones: high pressure at the ankle, dilated veins, swelling in the evening.')],
  [T('poca albumina','low albumin'),{pc:12},'alb',T('<b>Né precarico né postcarico:</b> mancano proteine nel plasma, cala π<sub>c</sub> e il richiamo si indebolisce. Edema diffuso, anche al viso.','<b>Neither preload nor afterload:</b> plasma proteins are missing, π<sub>c</sub> falls and the pull weakens. Widespread oedema, the face too.')],
  [T('infiammazione, ustione','inflammation, burn'),{sg:.4,Kf:2.5,pi:10},'infl',T('<b>Problema della parete:</b> lascia passare le proteine (σ scende) e ha più pori (K<sub>f</sub> sale). Edema locale, caldo e rosso.','<b>A wall problem:</b> it lets proteins through (σ falls) and has more pores (K<sub>f</sub> rises). Local oedema, warm and red.')],
  [T('linfatici bloccati','blocked lymphatics'),{ly:.1,pi:8},'lymph',T('<b>Problema di drenaggio:</b> il filtrato è normale ma nessuno lo porta via. Di solito un arto solo.','<b>A drainage problem:</b> filtration is normal but nothing carries it away. Usually one limb.')],
  [T('emorragia, disidratazione','bleeding, dehydration'),{Pc:18},'dehy',T('<b>Precarico basso:</b> c’è meno volume in circolo, P<sub>c</sub> scende e il liquido rientra dal tessuto nel sangue. È l’opposto dell’edema: il rischio è per il rene.','<b>Low preload:</b> there is less volume in the circulation, P<sub>c</sub> falls and fluid goes back from the tissue into the blood. The opposite of oedema: the risk is for the kidney.')]],
 t:[{k:'Pc',s:'P<sub>c</sub>',c:'#B03A3A',q:T('Pc = pressione idrostatica nel capillare&#10;[M L⁻¹ T⁻²] · Pa (Pa = N/m²); in clinica mmHg (1 mmHg ≈ 133 Pa)','Pc = hydrostatic pressure in the capillary&#10;[M L⁻¹ T⁻²] · Pa (Pa = N/m²); clinically mmHg (1 mmHg ≈ 133 Pa)'),n:T('pressione nel capillare: spinge fuori','pressure in the capillary: pushes out'),d:1,min:5,max:60,v:35,u:'mmHg'},
    {k:'pc',s:'π<sub>c</sub>',c:'#6A3A96',q:T('πc = pressione oncotica (colloido-osmotica) del plasma&#10;[M L⁻¹ T⁻²] · Pa (Pa = N/m²); in clinica mmHg (1 mmHg ≈ 133 Pa)','πc = oncotic (colloid osmotic) pressure of plasma&#10;[M L⁻¹ T⁻²] · Pa (Pa = N/m²); clinically mmHg (1 mmHg ≈ 133 Pa)'),n:T('proteine del plasma: richiamano dentro','plasma proteins: pull in'),d:-1,min:5,max:40,v:25,u:'mmHg'},

 var dl=[];if(DRUG.n)dl.push(T('<b>FANS</b> (antinfiammatori non steroidei): niente prostaglandine, l’afferente resta stretta e non si può più aprire: sbarra e lucchetto. La pressione sale un po’.','<b>NSAIDs</b> (non-steroidal anti-inflammatory drugs): no prostaglandins, the afferent stays narrow and can no longer open: bar and padlock. Blood pressure rises a little.'));if(DRUG.b)dl.push(T('<b>β-bloccante</b> <b style="background:#7A4FB5;color:#fff;border-radius:5px;padding:1px 7px;font-size:11.5px;letter-spacing:.4px;white-space:nowrap">MENO FREQUENZA</b>: frena il simpatico. Il cuore batte più lento: chiede meno ossigeno e ha più diastole per riempire le coronarie. Nel tempo il cuore debole recupera un po’ di forza. Si inizia a dosi basse, a paziente stabile: all’inizio toglie un po’ di spinta.','<b>Beta-blocker</b> <b style="background:#7A4FB5;color:#fff;border-radius:5px;padding:1px 7px;font-size:11.5px;letter-spacing:.4px;white-space:nowrap">LOWER HEART RATE</b>: it holds back the sympathetic drive. The heart beats more slowly: it demands less oxygen and has more diastole to fill the coronaries. Over time the weak heart regains some strength. It is started at low doses in a stable patient: at first it takes away a little push.'));if(DRUG.a)dl.push(T('<b>Inibitore del RAAS</b> <b style="background:#1456A8;color:#fff;border-radius:5px;padding:1px 7px;font-size:11.5px;letter-spacing:.4px;white-space:nowrap">MENO POSTCARICO</b> (ACE-inibitore, sartano o sacubitril-valsartan): niente angiotensina II. L’efferente si apre e non si può più stringere: la valvola è saltata. Le resistenze calano: <b>il cuore debole spinge contro meno postcarico e la gittata risale</b>. Nel rene però la pressione di filtrazione scende.','<b>RAAS inhibitor</b> <b style="background:#1456A8;color:#fff;border-radius:5px;padding:1px 7px;font-size:11.5px;letter-spacing:.4px;white-space:nowrap">LESS AFTERLOAD</b> (ACE inhibitor, sartan or sacubitril-valsartan): no angiotensin II. The efferent op
