<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Il potenziale di Nernst</title>
<link rel="stylesheet" href="widget.css">
<style>
svg[viewBox]{min-width:0!important;max-width:620px!important;width:100%;margin:0 auto}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;font-size:13px}
.row .vl{font-weight:700;color:#55697A;min-width:76px}
.row button{font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--border-strong);background:#FFFFFF;color:var(--text-primary);cursor:pointer}
.row button.on{border:1.5px solid #1456A8;background:#EEF4FC;color:#1456A8;font-weight:700}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 16px;margin:4px 0 10px}
.ctl label{display:block;font-size:13px;font-weight:700}
.ctl label span{float:right;color:#1456A8}
.ctl input{width:100%}
.pnl{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;padding:6px;margin:0 0 8px}
.res{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;padding:9px 12px;font-size:14px;line-height:1.6}
.res ol{margin:2px 0 6px;padding-left:22px}
.big{font-size:17px;font-weight:700}
</style>
</head>
<body>
<h2 class="sr-only">Calcolo del potenziale di equilibrio di Nernst per K⁺, Na⁺, Cl⁻ e Ca²⁺, passo per passo</h2>
<div class="row" id="ion"></div>
<div class="row" id="tmp"></div>
<div class="row" id="pre"></div>
<div class="ctl">
  <div><label for="si">[X]<sub>in</sub> <span id="vi"></span></label><input type="range" id="si" min="-4" max="3" step="0.01"></div>
  <div><label for="so">[X]<sub>out</sub> <span id="vo"></span></label><input type="range" id="so" min="-4" max="3" step="0.01"></div>
</div>
<div class="pnl" id="ch"></div>
<div class="res" id="res"></div>
<script>
var D={"ui": {"loc": "it-IT", "ionT": "Ione:", "tT": "Temperatura:", "preT": "Esempi:", "vm": "riposo −70 mV", "axis": "Potenziale di equilibrio sull’asse dei millivolt", "s2": "Per passare a log₁₀ si moltiplica per", "perDec": "per ogni fattore 10 di rapporto", "df1": "Forza spingente con la membrana a", "out": "lo ione tende a uscire dalla cellula", "inn": "lo ione tende a entrare nella cellula", "eq": "lo ione è all’equilibrio: nessun flusso netto"}, "pre": [{"n": "K⁺ · mammifero", "ion": 0, "T": 37, "cin": 140, "cout": 4}, {"n": "K⁺ · ipercaliemia", "ion": 0, "T": 37, "cin": 140, "cout": 7}, {"n": "Na⁺ · mammifero", "ion": 1, "T": 37, "cin": 12, "cout": 145}, {"n": "Cl⁻ · mammifero", "ion": 2, "T": 37, "cin": 7, "cout": 110}, {"n": "Ca²⁺ · mammifero", "ion": 3, "T": 37, "cin": 0.0001, "cout": 1.2}, {"n": "K⁺ · assone di calamaro", "ion": 0, "T": 21, "cin": 400, "cout": 20}, {"n": "Cl⁻ · assone di calamaro", "ion": 2, "T": 21, "cin": 108, "cout": 560}, {"n": "K⁺ · muscolo di rana", "ion": 0, "T": 21, "cin": 124, "cout": 2.25}], "ions": [{"n": "K⁺", "z": 1, "c": "#C2571A", "note": "Il K⁺ è lo ione più vicino al potenziale di riposo perché a riposo la membrana è permeabile soprattutto al K⁺ (canali di fuga)."}, {"n": "Na⁺", "z": 1, "c": "#7A4BA6", "note": "Il Na⁺ è lontanissimo dall’equilibrio: appena si aprono i canali Na⁺ entra di colpo. È la base del potenziale d’azione."}, {"n": "Cl⁻", "z": -1, "c": "#3B7D23", "note": "Con z = −1 il segno si inverte: il Cl⁻ più alto fuori dà un potenziale di equilibrio negativo."}, {"n": "Ca²⁺", "z": 2, "c": "#0E7C86", "note": "Con z = 2 il fattore si dimezza (circa 31 mV per decade a 37 °C), ma il rapporto è enorme: il Ca²⁺ libero nel citosol è circa 10 000 volte più basso che fuori."}]},U=D.ui,IONS=D.ions,P=D.pre;
var S={ion:0,T:37,cin:140,cout:4,pre:0},R=8.314,F=96485,VM=-70;
function $(q){return document.querySelector(q);}
function nf(x,d){return x.toLocaleString(U.loc,{maximumFractionDigits:d,minimumFractionDigits:d}).replace(/^-/,'−');}
function conc(x){return x>=10?nf(x,0):x>=1?nf(x,1):x>=0.01?nf(x,3):x.toLocaleString(U.loc,{maximumSignificantDigits:2});}
function tx(x,y,t,a,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.s||12)+'" text-anchor="'+(a||'start')+'" fill="'+(o.c||'#16222E')+'"'+(o.w?' font-weight="'+o.w+'"':'')+'>'+t+'</text>';}
function chips(id,lab,arr,cur,att){$(id).innerHTML='<span class="vl">'+lab+'</span>'+arr.map(function(x,i){return '<button type="button" '+att+'="'+i+'"'+(i===cur?' class="on"':'')+'>'+x+'</button>';}).join('');}
function setPre(i){var p=P[i];S.pre=i;S.ion=p.ion;S.T=p.T;S.cin=p.cin;S.cout=p.cout;$('#si').value=Math.log10(S.cin);$('#so').value=Math.log10(S.cout);draw();}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-p'))setPre(+b.getAttribute('data-p'));
  if(b.hasAttribute('data-i')){var k=+b.getAttribute('data-i');for(var i=0;i<P.length;i++)if(P[i].ion===k){setPre(i);return;}}
  if(b.hasAttribute('data-t')){S.T=[21,37][+b.getAttribute('data-t')];S.pre=-1;draw();}});
$('#si').addEventListener('input',function(e){S.cin=Math.pow(10,+e.target.value);S.pre=-1;draw();});
$('#so').addEventListener('input',function(e){S.cout=Math.pow(10,+e.target.value);S.pre=-1;draw();});
function draw(){var I=IONS[S.ion],z=I.z,TK=S.T+273.15,rtf=R*TK/F*1000,dec=rtf*Math.LN10,ratio=S.cout/S.cin,lg=Math.log10(ratio),E=dec/z*lg;
  chips('#ion',U.ionT,IONS.map(function(x){return x.n;}),S.ion,'data-i');
  chips('#tmp',U.tT,['21 °C','37 °C'],S.T===21?0:1,'data-t');
  chips('#pre',U.preT,P.map(function(p){return p.n;}),S.pre,'data-p');
  $('#vi').textContent=conc(S.cin)+' mM';$('#vo').textContent=conc(S.cout)+' mM';
  // axis −150…+150 mV
  var x0=24,x1=376,y=56;function X(v){return x0+(Math.max(-150,Math.min(150,v))+150)/300*(x1-x0);}
  var o='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="#8696A4" stroke-width="2"/>';
  [-150,-100,-50,0,50,100,150].forEach(function(v){o+='<line x1="'+X(v)+'" y1="'+(y-5)+'" x2="'+X(v)+'" y2="'+(y+5)+'" stroke="#8696A4"/>'+tx(X(v),y+20,(v>0?'+':v<0?'−':'')+Math.abs(v),'middle',{s:11,c:'#55697A'});});
  o+=tx(x1,y+36,'mV','end',{s:11,c:'#55697A'});
  o+='<line x1="'+X(VM)+'" y1="'+(y-12)+'" x2="'+X(VM)+'" y2="'+(y+28)+'" stroke="#55697A" stroke-width="2" stroke-dasharray="4 3"/>'+tx(X(VM),y+52,U.vm,'middle',{s:11.5,w:700,c:'#55697A'});
  var c=I.c,xe=X(E);
  o+='<path d="M'+xe+' '+(y-6)+' l-8 -14 h16 z" fill="'+c+'"/>'+tx(xe,y-26,'E<tspan font-size="9" dy="3">'+I.n+'</tspan><tspan dy="-3"> = '+(E>0?'+':'')+nf(E,0)+' mV</tspan>','middle',{s:13,w:700,c:c});
  $('#ch').innerHTML='<svg viewBox="0 0 400 116" role="img" aria-label="'+U.axis+'">'+o+'</svg>';
  var df=VM-E,mv=df*z>0?U.out:U.inn;if(Math.abs(df)<2)mv=U.eq;
  $('#res').innerHTML='<ol>'+
   '<li>RT/F = '+nf(R,3)+' × '+nf(TK,2)+' K / '+F.toLocaleString(U.loc)+' C·mol⁻¹ = <b>'+nf(rtf,1)+' mV</b> <span style="color:#55697A">(J/C = V)</span></li>'+
   '<li>'+U.s2+' ln 10: '+nf(rtf,1)+' × '+nf(Math.LN10,3)+' = <b>'+nf(dec,1)+' mV</b> '+U.perDec+'; ÷ z ('+(z>0?'+':'−')+Math.abs(z)+') = <b>'+nf(dec/z,1)+' mV</b></li>'+
   '<li>[X]<sub>out</sub>/[X]<sub>in</sub> = '+conc(S.cout)+' / '+conc(S.cin)+' = '+(ratio>=0.001?ratio.toLocaleString(U.loc,{maximumSignificantDigits:3}):ratio.toLocaleString(U.loc,{maximumSignificantDigits:2,notation:'scientific'}))+'; log<sub>10</sub> = '+nf(lg,2)+'</li>'+
   '<li>E = '+nf(dec/z,1)+' × '+nf(lg,2)+' = <span class="big" style="color:'+c+'">'+(E>0?'+':'')+nf(E,0)+' mV</span></li></ol>'+
   '<p>'+U.df1+' −70 mV: V<sub>m</sub> − E = '+(df>0?'+':'')+nf(df,0)+' mV → <b>'+mv+'</b></p>'+(I.note?'<p style="color:#55697A;font-size:13px">'+I.note+'</p>':'');}
setPre(0);
</script>
</body>
</html>
