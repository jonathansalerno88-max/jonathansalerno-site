<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astigmatismo obliquo</title>
<link rel="stylesheet" href="widget.css">
<style>
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px;font-size:14px;color:var(--text-secondary)}
.ctl button{font:inherit;font-size:13px;padding:6px 12px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);cursor:pointer}
.ctl button.act{border:1.5px solid var(--border-accent);color:var(--text-accent)}
</style>
</head>
<body>
<h2 class="sr-only">Astigmatismo obliquo: l'occhio ruota dietro la lente; con una lente piatta lo sguardo laterale produce due fuochi separati, tangenziale e sagittale; con un menisco curvato attorno al centro di rotazione i due fuochi coincidono.</h2>
<div class="ctl">
<button id="bF" onclick="typ='F';upd()">Lente piatta</button>
<button id="bM" onclick="typ='M';upd()">Menisco</button>
<span style="margin-left:12px">Sguardo laterale</span>
<input type="range" id="th" min="0" max="35" value="30" style="flex:1" oninput="upd()">
<span id="thL" style="min-width:40px;text-align:right;color:var(--text-primary)">30°</span>
</div>
<svg width="100%" viewBox="0 0 680 380">
<text class="th" id="cap" x="20" y="24">Lente piatta</text>
<text class="ts" id="cap2" x="20" y="42"> </text>
<line x1="200" y1="200" x2="660" y2="200" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<g id="beam"></g>
<g id="lensG"></g>
<g id="eye">
<circle cx="200" cy="200" r="70" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<path d="M146.4 245 A70 70 0 0 1 146.4 155" fill="none" stroke="#D85A30" stroke-width="3"/>
<path d="M262 168 Q283 200 262 232" fill="#E6F1FB" stroke="#888780" stroke-width="1"/>
<rect x="257" y="174" width="4" height="18" fill="#854F0B"/>
<rect x="257" y="208" width="4" height="18" fill="#854F0B"/>
<ellipse cx="250" cy="200" rx="7" ry="18" fill="#B5D4F4" opacity="0.6"/>
</g>
<g id="rays"></g>
<circle cx="200" cy="200" r="3.5" fill="var(--t)"/>
<text class="ts" x="200" y="292" text-anchor="middle">C = centro di rotazione dell'occhio</text>
<text class="ts" id="lensLbl" x="340" y="362" text-anchor="middle">lente piatta</text>
<circle cx="28" cy="318" r="4" fill="none" stroke="#BA7517" stroke-width="2"/>
<text class="ts" x="40" y="322">T = fuoco tangenziale (raggi nel piano del disegno)</text>
<rect x="24" y="334" width="8" height="8" fill="none" stroke="#185FA5" stroke-width="2"/>
<text class="ts" x="40" y="342">S = fuoco sagittale (raggi perpendicolari al disegno)</text>
<rect x="470" y="250" width="180" height="100" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5"/>
<text class="ts" x="482" y="270">Un punto sulla retina appare</text>
<ellipse id="spot" cx="560" cy="310" rx="3" ry="3" fill="#2C2C2A"/>
<text class="ts" id="spotLbl" x="482" y="342"> </text>
</svg>
<script>
var typ='F',R={x:200,y:200};
function P(r,phi){return {x:R.x+r*Math.cos(phi),y:R.y+r*Math.sin(phi)};}
function upd(){
var deg=parseFloat(document.getElementById('th').value),th=deg*Math.PI/180;
document.getElementById('thL').textContent=deg+'°';
document.getElementById('bF').classList.toggle('act',typ==='F');document.getElementById('bM').classList.toggle('act',typ==='M');
var u={x:Math.cos(th),y:-Math.sin(th)},n={x:Math.sin(th),y:Math.cos(th)};
document.getElementById('eye').setAttribute('transform','rotate('+(-deg)+' 200 200)');
var lg='',L;
if(typ==='F'){lg='<rect x="326" y="60" width="8" height="280" rx="2" fill="#B5D4F4" opacity="0.8" stroke="#185FA5" stroke-width="0.8"/>';var t=130/u.x;L={x:R.x+t*u.x,y:R.y+t*u.y};}
else{var a1=-50*Math.PI/180,a2=50*Math.PI/180,o1=P(136,a1),o2=P(136,a2),i2=P(128,a2),i1=P(128,a1);
lg='<path d="M'+o1.x+' '+o1.y+' A136 136 0 0 1 '+o2.x+' '+o2.y+' L'+i2.x+' '+i2.y+' A128 128 0 0 0 '+i1.x+' '+i1.y+' Z" fill="#B5D4F4" opacity="0.8" stroke="#185FA5" stroke-width="0.8"/>';L={x:R.x+132*u.x,y:R.y+132*u.y};}
document.getElementById('lensG').innerHTML=lg;
var w=8,s='';
var pc={x:R.x+58*u.x,y:R.y+58*u.y},ret={x:R.x-68*u.x,y:R.y-68*u.y};
var k=typ==='F'?60:2,dd=k*th*th;
var T={x:ret.x+dd*u.x,y:ret.y+dd*u.y},S={x:ret.x-dd*0.6*u.x,y:ret.y-dd*0.6*u.y};
[-1,1].forEach(function(sg){
var lp={x:L.x+sg*w*n.x,y:L.y+sg*w*n.y},far={x:lp.x+500*u.x,y:lp.y+500*u.y},pp={x:pc.x+sg*w*n.x,y:pc.y+sg*w*n.y};
s+='<line x1="'+far.x+'" y1="'+far.y+'" x2="'+lp.x+'" y2="'+lp.y+'" stroke="#EF9F27" stroke-width="1.5"/>';
s+='<line x1="'+lp.x+'" y1="'+lp.y+'" x2="'+pp.x+'" y2="'+pp.y+'" stroke="#EF9F27" stroke-width="1.5"/>';
var ex={x:T.x+(T.x-pp.x)*0.25,y:T.y+(T.y-pp.y)*0.25};
s+='<line x1="'+pp.x+'" y1="'+pp.y+'" x2="'+T.x+'" y2="'+T.y+'" stroke="#EF9F27" stroke-width="1.5"/>';
if(dd>2)s+='<line x1="'+T.x+'" y1="'+T.y+'" x2="'+ex.x+'" y2="'+ex.y+'" stroke="#EF9F27" stroke-width="1" opacity="0.6"/>';
});
s+='<circle cx="'+T.x+'" cy="'+T.y+'" r="4" fill="none" stroke="#BA7517" stroke-width="2"/>';
s+='<rect x="'+(S.x-4)+'" y="'+(S.y-4)+'" width="8" height="8" fill="none" stroke="#185FA5" stroke-width="2"/>';
if(dd>4){s+='<text class="ts" x="'+(T.x+8)+'" y="'+(T.y-8)+'">T</text><text class="ts" x="'+(S.x-14)+'" y="'+(S.y+16)+'">S</text>';}
else{s+='<text class="ts" x="'+(T.x-10)+'" y="'+(T.y-10)+'" text-anchor="end">T = S</text>';}
document.getElementById('rays').innerHTML=s;
var sep=dd*1.6;
document.getElementById('cap').textContent=typ==='F'?'Lente piatta':'Menisco (curvato attorno a C)';
document.getElementById('cap2').textContent=deg===0?'sguardo dritto: entrambe le lenti funzionano':(typ==='F'?'sguardo di sbieco: la lente si comporta come astigmatica, due fuochi T e S':'il fascio attraversa la lente quasi perpendicolare: un solo fuoco');
document.getElementById('lensLbl').textContent=typ==='F'?'lente piatta':'menisco';
var sp=document.getElementById('spot');sp.setAttribute('ry',Math.max(3,Math.min(sep*0.8,30)));sp.setAttribute('rx',sep>6?2:3);
document.getElementById('spotLbl').textContent=sep>6?'una linea: astigmatismo obliquo':'un punto: immagine nitida';
}
upd();
</script>
</body>
</html>
