<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I sistemi di secrezione dei batteri</title>
<link rel="stylesheet" href="widget.css">
<style>
svg[viewBox]{max-width:620px;width:100%;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
.top button{font:inherit;font-size:13px;padding:5px 10px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);cursor:pointer}
.top button.act{font-weight:700;border:1.5px solid #16222E;background:#FFFFFF}
.top .sp{flex:1 1 auto}
.top #pz.on{border-color:#B5520C;background:#FCEEDD;color:#7A3E0B}
.pnl{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;padding:6px;margin:0 0 8px;overflow-x:auto}
@media (max-width:600px){.pnl::before{content:attr(data-hint);display:block;font-size:11.5px;color:#55697A;margin:0 2px 4px}}
.txt{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;padding:9px 12px;font-size:14px;line-height:1.55}
.gp{background:#F7FAFC;border-left:3px solid #2E7D5B;padding:4px 8px;border-radius:0 6px 6px 0;font-size:13.5px}
.txt h3{font-size:16px;margin:0 0 4px}
.txt p{margin:0 0 6px}.txt p:last-child{margin:0}
.badge.gb{background:#16222E;color:#FFFFFF;border-color:#16222E}
.badge{display:inline-block;font-weight:600;font-size:12.5px;padding:3px 10px;border-radius:999px;margin:0 6px 6px 0;background:#EEF2F5;color:#16222E;border:1px solid #DDE4EA}
body.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style id="kf"></style>

<body>
<h2 class="sr-only">I sistemi di secrezione batterici, da Sec e Tat al T7SS: quante membrane attraversa la proteina, in quanti passi, con quale energia e dove arriva</h2>
<div class="top" id="tabs"></div>
<div class="pnl" id="sc" data-hint="Scorri il disegno di lato per vedere tutto."></div>
<div class="txt" id="tx"></div>
<script>
var D={"ui": {"cyt": "CITOPLASMA", "peri": "PERIPLASMA", "pg": "peptidoglicano", "ext": "ESTERNO", "envGn": "involucro di un Gram−", "envMb": "involucro di un micobatterio", "im": "membrana interna", "om": "membrana esterna", "mbperi": "arabinogalattano + peptidoglicano", "mbom": "micomembrana (acidi micolici)", "hostm": "membrana della cellula ospite", "hostc": "CITOPLASMA DELLA CELLULA OSPITE", "rival": "membrana del batterio rivale", "rivalc": "BATTERIO RIVALE", "pmf": "energia: gradiente di protoni", "hly": "emolisina", "secretin": "secretina", "barrel": "barile β (BAM)", "ctx": "tossina colerica", "iga": "IgA proteasi", "step1": "passo 1", "step2": "passo 2", "transl": "traslocone", "needle": "ago", "pilus": "pilo", "eff": "effettore", "dna": "DNA o proteina", "tox6": "tossina", "sheath": "guaina che si contrae", "unk": "passaggio nella micomembrana: ancora poco chiaro", "pause": "❚❚ Pausa", "play": "▶ Riprendi"}, "modes": [{"k": "sec", "g": "Gram− e Gram+", "gp": "<b>Nei Gram+</b> funziona allo stesso modo, ma è anche l'ultimo passo: oltre la membrana citoplasmatica c'è solo il peptidoglicano spesso, che la proteina attraversa senza una macchina dedicata. Molte proteine poi vengono agganciate al peptidoglicano dalla <b>sortasi</b> (es. la proteina A di <i>S. aureus</i>).", "n": "Sec", "full": "Sec (via secretoria generale)", "b": ["1 membrana: l'interna", "proteina srotolata", "energia: ATP (SecA) + gradiente di protoni"], "t": ["La via più usata da tutti i batteri. La proteina viene prodotta con una <b>sequenza segnale</b> all'inizio; SecA la spinge, ancora <b>srotolata</b>, attraverso il canale SecYEG della membrana citoplasmatica. Nel periplasma (o fuori, nei Gram+) si ripiega.", "Da sola porta le proteine solo oltre la membrana interna. Nei Gram− è il <b>primo passo</b> per T2SS e T5SS. Lo stesso canale inserisce anche le proteine di membrana: lì si parla di inserzione, non di secrezione."]}, {"k": "tat", "g": "Gram− e Gram+", "gp": "<b>Nei Gram+</b> c'è anche lui e, come Sec, porta la proteina direttamente fuori dalla cellula, perché non c'è una seconda membrana.", "n": "Tat", "full": "Tat (Twin-arginine translocation, traslocazione a doppia arginina)", "b": ["1 membrana: l'interna", "proteina già ripiegata", "energia: gradiente di protoni"], "t": ["Come Sec attraversa solo la membrana interna, ma porta proteine <b>già ripiegate</b>, spesso con il loro cofattore già legato. Le riconosce da un segnale con <b>due arginine</b> di seguito, da cui il nome. Non usa ATP: la spinta viene dal gradiente di protoni."]}, {"k": "t1", "g": "solo Gram−", "gp": "<b>Nei Gram+ non c'è</b>: serve per attraversare la membrana esterna, che i Gram+ non hanno.", "n": "T1SS", "full": "T1SS (Type 1 Secretion System, sistema di secrezione di tipo 1)", "b": ["tutto l'involucro in 1 passo", "energia: ATP", "esempio: emolisina di E. coli"], "t": ["Un tubo unico che va dalla membrana interna all'esterno: un <b>trasportatore ABC</b> (ATP-Binding Cassette) nella membrana interna, una proteina di fusione che attraversa il periplasma (<b>MFP</b>, Membrane Fusion Protein) e il canale <b>TolC</b> nella membrana esterna. La proteina esce in un solo passo, senza fermarsi nel periplasma.", "È il punto di contatto con i trasportatori: la macchina è un ABC, ma il carico è una proteina, quindi si chiama secrezione. La stessa TolC fa da uscita anche per le pompe di efflusso degli antibiotici."]}, {"k": "t2", "g": "solo Gram−", "gp": "<b>Nei Gram+ non c'è</b>: è il passo che porta la proteina oltre la membrana esterna. Nei Gram+ basta Sec.", "n": "T2SS", "full": "T2SS (Type 2 Secretion System)", "b": ["2 passi: Sec, poi la membrana esterna", "energia: ATP", "esempio: tossina colerica"], "t": ["Due passi. Prima la proteina passa la membrana interna con Sec (o Tat) e si ripiega nel periplasma. Poi il T2SS la spinge fuori attraverso un grande canale della membrana esterna, la <b>secretina</b>, con un pistone interno alimentato da ATP.", "Esporta enzimi e tossine nell'ambiente: la <b>tossina colerica</b> di <i>Vibrio cholerae</i>, l'esotossina A di <i>Pseudomonas aeruginosa</i>."]}, {"k": "t3", "g": "solo Gram−", "gp": "<b>Nei Gram+ non c'è</b>: è tipico dei Gram− patogeni (enterobatteri, <i>Pseudomonas</i>, <i>Chlamydia</i>).", "n": "T3SS", "full": "T3SS (Type 3 Secretion System): la siringa", "b": ["3 membrane: anche quella dell'ospite", "energia: ATP", "esempi: Salmonella, Shigella, Yersinia"], "t": ["Una <b>siringa molecolare</b>: un corpo basale ad anelli attraversa le due membrane del batterio, un <b>ago</b> cavo sporge fuori e, quando tocca la cellula ospite, la punta forma un poro nella sua membrana (il <b>traslocone</b>). Le proteine batteriche, gli <b>effettori</b>, passano dal citoplasma del batterio a quello della cellula ospite senza mai trovarsi libere fuori.", "Gli effettori manomettono la cellula: riorganizzano il citoscheletro per farla inglobare il batterio (<i>Salmonella</i>, <i>Shigella</i>) o bloccano la fagocitosi (le proteine Yop di <i>Yersinia</i>). Il T3SS è spesso codificato da <b>plasmidi di virulenza</b> o <b>isole di patogenicità</b>, ed è parente del flagello."]}, {"k": "t4", "g": "soprattutto Gram−; anche Gram+", "gp": "<b>Nei Gram+</b> esistono macchine di tipo IV, più semplici, per la <b>coniugazione</b>: è così che passano i plasmidi di resistenza fra enterococchi e stafilococchi. L'iniezione di proteine nell'ospite è invece una cosa dei Gram−.", "n": "T4SS", "full": "T4SS (Type 4 Secretion System)", "b": ["porta proteine e anche DNA", "energia: ATP", "esempi: H. pylori, coniugazione"], "t": ["È parente della macchina della <b>coniugazione</b>: un complesso che attraversa l'involucro, con un pilo all'esterno. È l'unico che può trasferire anche <b>DNA</b>, oltre alle proteine: è così che i plasmidi, anche quelli di resistenza, passano da un batterio all'altro.", "Nei patogeni inietta proteine nella cellula ospite: <i>Helicobacter pylori</i> inietta <b>CagA</b> nelle cellule dello stomaco; <i>Legionella</i> usa un T4SS per sopravvivere dentro i macrofagi; <i>Bordetella pertussis</i> esporta così la tossina della pertosse."]}, {"k": "t5", "g": "solo Gram−", "gp": "<b>Nei Gram+ non c'è</b>: il barile β si forma nella membrana esterna.", "n": "T5SS", "full": "T5SS (Type 5 Secretion System): gli autotrasportatori", "b": ["2 passi: Sec, poi da sola", "nessuna macchina dedicata", "esempio: IgA proteasi di Neisseria"], "t": ["Il sistema più semplice. La proteina passa la membrana interna con Sec, poi una sua parte forma un <b>barile β</b> nella membrana esterna (con l'aiuto del complesso BAM) e il resto della proteina, il «passeggero», esce attraverso quel barile. In pratica la proteina si fa da sola il passaggio: per questo si chiama autotrasportatore.", "Il passeggero resta sulla superficie (adesine) o viene tagliato e liberato. Esempio: l'<b>IgA proteasi</b> di <i>Neisseria</i> e di <i>Haemophilus</i>, che taglia le IgA delle mucose."]}, {"k": "t6", "g": "solo Gram−", "gp": "<b>Nei Gram+ non c'è</b>: si trova soprattutto nei proteobatteri (<i>Vibrio</i>, <i>Pseudomonas</i>, <i>Burkholderia</i>).", "n": "T6SS", "full": "T6SS (Type 6 Secretion System): l'arpione", "b": ["colpisce altri batteri (e cellule)", "energia: guaina carica + ATP per ricaricarla", "esempi: Vibrio, Pseudomonas"], "t": ["Assomiglia alla coda di un batteriofago rovesciata. Nel citoplasma c'è una <b>guaina</b> tesa come una molla intorno a un tubo con una punta; quando si contrae, spara il tubo attraverso l'involucro e dentro la cellula bersaglio, portando con sé le tossine. Poi la guaina viene smontata e ricaricata con ATP.", "Serve soprattutto nella <b>competizione fra batteri</b>: uccide i vicini rivali, per esempio nell'intestino. Alcuni lo usano anche contro cellule eucariotiche."]}, {"k": "t7", "g": "micobatteri e altri Gram+", "gp": "Il disegno qui non è un Gram−: è l'<b>involucro dei micobatteri</b>. Sistemi di tipo 7 ci sono anche in alcuni <b>Gram+</b>, per esempio il sistema Ess di <i>Staphylococcus aureus</i>.", "n": "T7SS", "full": "T7SS (Type 7 Secretion System, ESX) dei micobatteri", "b": ["involucro dei micobatteri", "energia: ATP (EccC)", "esempio: ESAT-6 di M. tuberculosis"], "t": ["I micobatteri hanno un involucro diverso, con la micomembrana di acidi micolici, e un loro sistema, chiamato <b>ESX</b>. Il sistema <b>ESX-1</b> di <i>M. tuberculosis</i> esporta <b>ESAT-6</b> e <b>CFP-10</b>, che aiutano il bacillo a rompere il fagosoma del macrofago e a uscire nel citoplasma. Come la proteina attraversi la micomembrana non è ancora chiaro.", "Il ceppo del vaccino <b>BCG</b> (Bacillo di Calmette-Guérin) ha perso proprio la regione genetica di ESX-1 (RD1): per questo è attenuato. Ed è per questo che il QuantiFERON, che usa ESAT-6 e CFP-10, non è positivo nei vaccinati con BCG."]}]},U=D.ui,M=D.modes,CUR=4,PZ=false;
function $(q){return document.querySelector(q);}
function tx(x,y,t,a,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.s||12)+'" text-anchor="'+(a||'start')+'" fill="'+(o.c||'#16222E')+'"'+(o.w?' font-weight="'+o.w+'"':'')+(o.h?' stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke"':'')+'>'+t+'</text>';}
var KF='',PC='#B03A3A';
function kf(n,fr){KF+='@keyframes '+n+'{'+fr.map(function(f){return f[0]+'%{transform:translate('+f[1]+'px,'+f[2]+'px);opacity:'+(f[3]==null?1:f[3])+'}';}).join('')+'}';}
function an(n,d){return 'style="animation:'+n+' '+d+'s linear infinite;opacity:0"';}
function tok(n,d,lab,folded){var c=PC,inner=folded?'<circle r="11" fill="#FFFFFF" stroke="'+c+'" stroke-width="2.4"/><path d="M-6 -2 q3 -6 6 0 t6 0" fill="none" stroke="'+c+'" stroke-width="1.6"/>':'<path d="M-16 0 q4 -7 8 0 t8 0 t8 0 t8 0" fill="none" stroke="'+c+'" stroke-width="3" stroke-linecap="round"/>';
  return '<g '+an(n,d)+'>'+inner+(lab?tx(-20,4,lab,'end',{s:10,w:700,c:c,h:1}):'')+'</g>';}
function mem(y,h,lab,col,head){var o='<rect x="0" y="'+y+'" width="640" height="'+h+'" fill="'+col+'"/>';for(var x=6;x<640;x+=12){o+='<circle cx="'+x+'" cy="'+(y+3)+'" r="3.6" fill="'+head+'"/><circle cx="'+x+'" cy="'+(y+h-3)+'" r="3.6" fill="'+head+'"/>';}return o+tx(634,y+h/2+4,lab,'end',{s:10.5,w:700,c:'#55697A',h:1});}
function pill(x,y,lab,c){return '<rect x="'+(x-24)+'" y="'+(y-9)+'" width="48" height="18" rx="9" fill="'+c+'"/>'+tx(x,y+4,lab,'middle',{s:9.5,w:700,c:'#FFFFFF'});}
/* y layers */
var Y={host:[0,30],hm:[30,48],ext:[48,98],om:[98,124],peri:[124,186],im:[186,212],cyt:[212,320]};
function scene(k){KF='';var o='',d=6,mb=k==='t7',host=(k==='t3'||k==='t4'||k==='t6');
  o+='<rect x="0" y="0" width="640" height="320" fill="#FBFCFD"/>';
  o+='<rect x="0" y="'+Y.cyt[0]+'" width="640" height="108" fill="#F3ECFA"/>'+tx(12,312,U.cyt,'start',{s:11,w:700,c:'#55697A'})+tx(628,312,mb?U.envMb:U.envGn,'end',{s:11.5,w:700,c:mb?'#8A6A00':'#2E7D5B'});
  o+='<rect x="0" y="'+Y.peri[0]+'" width="640" height="62" fill="'+(mb?'#F6EED2':'#EAF4EE')+'"/>'+tx(12,Y.peri[0]+16,mb?U.mbperi:U.peri,'start',{s:10.5,w:700,c:'#55697A'});
  if(!mb)o+='<line x1="0" y1="160" x2="640" y2="160" stroke="#8E6CC0" stroke-width="2" stroke-dasharray="7 4"/>'+tx(12,154,U.pg,'start',{s:9.5,c:'#8E6CC0'});
  o+=tx(12,Y.ext[0]+16,U.ext,'start',{s:10.5,w:700,c:'#55697A'});
  o+=mem(Y.im[0],26,U.im,'#FBF3D6','#E8C76A');
  o+=mem(Y.om[0],26,mb?U.mbom:U.om,mb?'#EFE3B8':'#E2F0E7',mb?'#B8962E':'#2E7D5B');
  if(host){o+='<rect x="0" y="0" width="640" height="30" fill="'+(k==='t6'?'#E9EEF8':'#FDECEA')+'"/>'+mem(Y.hm[0],18,k==='t6'?U.rival:U.hostm,'#FFF7F5','#C9776B')+tx(12,18,k==='t6'?U.rivalc:U.hostc,'start',{s:10.5,w:700,c:'#A0473D'});}
  var C='#1F5FA8',F='#D6E6F7';
  function chan(x,y0,y1,w,col,fill){return '<rect x="'+(x-w/2)+'" y="'+y0+'" width="'+w+'" height="'+(y1-y0)+'" rx="6" fill="'+(fill||F)+'" stroke="'+(col||C)+'" stroke-width="2"/>';}
  var X=320;
  if(k==='sec'||k==='tat'){o+=chan(X,182,216,30)+tx(X+26,205,k==='sec'?'SecYEG':'TatABC','start',{s:10,w:700,c:C});
    if(k==='sec')o+=pill(X+52,236,'SecA · ATP','#C2571A');else o+=tx(X+26,236,U.pmf,'start',{s:9.5,w:700,c:'#0F6E56'});
    kf('p',[[0,X,290,0],[8,X,280,1],[45,X,228],[70,X,170],[90,X+90,150],[100,X+120,150,0]]);o+=tok('p',d,'',k==='tat');}
  if(k==='t1'){o+=chan(X,182,216,34,'#C2571A','#F6C7A8')+chan(X,124,186,22)+chan(X,92,128,34);
    o+=tx(X+26,205,'ABC','start',{s:10,w:700,c:'#C2571A'})+tx(X+18,160,'MFP','start',{s:10,w:700,c:C})+tx(X+22,112,'TolC','start',{s:10,w:700,c:C})+pill(X+64,236,'ATP','#C2571A');
    kf('p',[[0,X,290,0],[8,X,280,1],[30,X,214],[70,X,100],[85,X,70],[100,X,60,0]]);o+=tok('p',d,U.hly,false);}
  if(k==='t2'||k==='t5'){var a=250,b=400;o+=chan(a,182,216,28)+tx(a-20,205,'Sec','end',{s:10,w:700,c:C})+pill(a-46,236,'ATP','#C2571A');
    if(k==='t2'){o+=chan(b,92,128,40)+chan(b,128,182,18,'#1F5FA8','#EEF4FB')+pill(b+44,236,'ATP','#C2571A')+tx(b+26,112,U.secretin,'start',{s:10,w:700,c:C});}
    else{o+='<rect x="'+(b-22)+'" y="98" width="44" height="26" rx="12" fill="#CDE8D5" stroke="#2E7D4F" stroke-width="2"/>'+tx(b+28,114,U.barrel,'start',{s:10,w:700,c:'#2E7D4F'});}
    kf('p',[[0,a,290,0],[6,a,280,1],[28,a,214],[44,a,160],[62,b,160],[80,b,96],[92,b+40,70],[100,b+60,64,0]]);o+=tok('p',d,k==='t2'?U.ctx:U.iga,k==='t2');
    o+=tx(a,300,U.step1,'middle',{s:10,w:700,c:'#16222E'})+tx(b,300,U.step2,'middle',{s:10,w:700,c:'#16222E'});}
  if(k==='t3'||k==='t4'){var nc=k==='t3';o+=chan(X,182,216,44)+chan(X,124,186,22)+chan(X,96,128,44);
    o+='<rect x="'+(X-5)+'" y="'+(nc?46:40)+'" width="10" height="'+(nc?52:58)+'" fill="#5D6D7E"/>';
    if(nc)o+='<rect x="'+(X-14)+'" y="28" width="28" height="22" rx="5" fill="#F6C7A8" stroke="#C2571A" stroke-width="1.8"/>'+tx(X+20,22,U.transl,'start',{s:9.5,w:700,c:'#C2571A'});
    o+=tx(X+30,70,nc?U.needle:U.pilus,'start',{s:10,w:700,c:'#5D6D7E'})+pill(X+70,236,'ATP','#C2571A');
    kf('p',[[0,X,290,0],[8,X,280,1],[30,X,214],[55,X,110],[75,X,40],[88,X,14],[100,X-30,10,0]]);o+=tok('p',d,nc?U.eff:U.dna,!nc?false:true);}
  if(k==='t6'){o+='<rect x="'+(X-14)+'" y="214" width="28" height="80" rx="4" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="2" style="transform-box:fill-box;transform-origin:50% 100%;animation:sh 3s linear infinite"/>';
    KF+='@keyframes sh{0%{transform:scaleY(1)}40%{transform:scaleY(1)}48%{transform:scaleY(.45)}90%{transform:scaleY(.45)}100%{transform:scaleY(1)}}';
    o+=chan(X,182,216,34)+chan(X,96,128,34);
    kf('sp',[[0,X,214,0],[40,X,214,1],[48,X,40,1],[60,X,24,1],[70,X,24,0],[100,X,24,0]]);
    o+='<g '+an('sp',3)+'><polygon points="-6,0 6,0 0,-16" fill="#2E7D4F"/></g>';
    kf('p',[[0,X,250,0],[40,X,250,1],[48,X,30,1],[62,X-24,12,1],[72,X-40,10,0],[100,X-40,10,0]]);o+=tok('p',3,U.tox6,true);
    o+=tx(X+22,262,U.sheath,'start',{s:10,w:700,c:'#2E7D4F'});d=3;}
  if(k==='t7'){o+=chan(X,182,216,46)+tx(X+30,205,'ESX (EccC · ATP)','start',{s:10,w:700,c:C});
    o+='<rect x="'+(X-14)+'" y="98" width="28" height="26" rx="6" fill="none" stroke="'+C+'" stroke-width="2" stroke-dasharray="4 3"/>'+tx(X+20,92,U.unk,'start',{s:9.5,c:'#55697A'});
    kf('p',[[0,X,290,0],[8,X,280,1],[30,X,214],[60,X,150],[80,X,90],[92,X+30,66],[100,X+50,60,0]]);o+=tok('p',d,'ESAT-6',true);}
  $('#kf').textContent=KF;
  return '<svg viewBox="0 0 640 320" role="img" aria-label="'+M[CUR].n+'">'+o+'</svg>';}
function render(){var m=M[CUR];
  $('#tabs').innerHTML=M.map(function(x,i){return '<button type="button" data-i="'+i+'"'+(i===CUR?' class="act"':'')+'>'+x.n+'</button>';}).join('')+'<span class="sp"></span><button type="button" id="pz"'+(PZ?' class="on"':'')+'>'+(PZ?U.play:U.pause)+'</button>';
  $('#sc').innerHTML=scene(m.k);
  $('#tx').innerHTML='<h3>'+m.full+'</h3><p><span class="badge gb">'+m.g+'</span>'+m.b.map(function(b){return '<span class="badge">'+b+'</span>';}).join('')+'</p>'+m.t.map(function(p){return '<p>'+p+'</p>';}).join('')+'<p class="gp">'+m.gp+'</p>';}
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.id==='pz'){PZ=!PZ;document.body.classList.toggle('paused',PZ);b.textContent=PZ?U.play:U.pause;b.classList.toggle('on',PZ);return;}
  CUR=+b.getAttribute('data-i');render();});
render();
</script>
</body>
</html>
