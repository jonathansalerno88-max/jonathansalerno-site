<h2 class="sr-only">Come una sostanza attraversa la membrana: diffusione semplice, canale, trasportatore, simporto, antiporto e pompa</h2>

<script>
var D={"ui": {"gh": ["CHI HA PAGATO PRIMA", "la pompa Na⁺/K⁺:", "ha speso ATP per", "tenere basso il Na⁺", "qui dentro"], "atpase": "ATPasi", "out": "FUORI dalla cellula", "inn": "DENTRO la cellula", "conc": "concentrazione", "pause": "❚❚ Pausa", "play": "▶ Riprendi", "rule": "<b>La regola</b><ul>\n<li><span class=\"badge b-pas\">Passivo</span> la sostanza <b>scende</b> lungo il suo gradiente elettrochimico: nessuna energia. Da sola attraverso i lipidi (diffusione semplice) o grazie a una proteina, canale o trasportatore (diffusione facilitata).</li>\n<li><span class=\"badge b-pri\">Attivo primario</span> la sostanza <b>sale</b> e la proteina paga di tasca sua, idrolizzando ATP: è una <b>pompa</b> (ATPasi).</li>\n<li><span class=\"badge b-sec\">Attivo secondario</span> la sostanza <b>sale</b>, ma la proteina non tocca l’ATP: si fa trascinare da un altro ione che <b>scende</b>, di solito il Na⁺, nello <b>stesso trasportatore</b> (simporto o antiporto). Quel gradiente di Na⁺ l’ha creato prima la pompa Na⁺/K⁺: per questo è “secondario”.</li><li><b>Attenzione:</b> simporto e antiporto dicono solo <b>da che parte</b> vanno le due sostanze (stessa direzione o opposte), non <b>chi paga</b>. Sono attivi secondari solo se una delle due <b>sale</b>; se scendono tutte e due sono <b>passivi</b>. Vale invece sempre il contrario: ogni trasporto attivo secondario è un simporto o un antiporto.</li></ul>", "vq": "Che cosa succede ai gradienti?", "np": ["NESSUNO PAGA", "scendono tutte e due:", "nessuna pompa da ringraziare,", "il trasportatore le accoppia soltanto"], "via": {"mem": "attraverso i lipidi", "chan": "canale", "carr": "trasportatore", "pump": "pompa"}, "viaL": {"mem": "attraverso i lipidi (nessuna proteina)", "chan": "canale", "carr": "trasportatore", "pump": "pompa: un trasportatore che si paga con ATP"}, "legT": "Le vie:"}, "modes": [{"k": "diff", "via": "mem", "n": "Diffusione semplice", "cls": "Passivo", "bc": "b-pas", "prot": "nessuna proteina", "t": ["Le molecole piccole e senza carica, come O₂, CO₂ e gli ormoni steroidei, passano da sole attraverso il doppio strato lipidico, dal lato dove sono più concentrate a quello dove lo sono meno.", "Il flusso è proporzionale alla differenza di concentrazione (legge di Fick) e non si satura mai: più gradiente, più flusso. Ioni e molecole polari grandi invece non passano: serve una proteina."]}, {"k": "chan", "via": "chan", "n": "Canale", "cls": "Passivo", "bc": "b-pas", "prot": "un poro", "t": ["Un canale è un poro pieno d’acqua che attraversa la membrana: quando è aperto, gli ioni ci scorrono dentro lungo il loro gradiente elettrochimico, fino a milioni al secondo. È diffusione <b>facilitata</b>: la proteina apre la strada ma non spinge.", "Molti canali si aprono e si chiudono (voltaggio, ligando, ormoni). Esempi nel rene: <b>ENaC</b> (Na⁺), <b>ROMK</b> (K⁺), le <b>acquaporine</b> (acqua). Un canale non può mai portare una sostanza contro gradiente."]}, {"k": "uni", "via": "carr", "n": "Uniporto", "cls": "Passivo", "bc": "b-pas", "prot": "1 sostanza", "t": ["Un trasportatore (carrier) lega la molecola da un lato, cambia forma e la rilascia dall’altro: non è mai aperto sui due lati insieme. Per questo è molto più lento di un canale e si <b>satura</b>: quando tutti i trasportatori sono occupati il flusso non cresce più (V<sub>max</sub>).", "Se porta una sola sostanza a favore di gradiente si chiama <b>uniporto</b> ed è passivo (diffusione facilitata). Esempio: <b>GLUT2</b>, che fa uscire il glucosio dalla cellula del tubulo prossimale verso il sangue."]}, {"k": "sym", "via": "carr", "n": "Simporto", "cls": "Attivo secondario", "bc": "b-sec", "prot": "2 sostanze, stessa direzione", "t": ["Il Na⁺ fuori è tanto e dentro è poco: entrando <b>scende</b> e libera energia. Il trasportatore la usa per portare dentro, nello stesso giro, il glucosio, che invece <b>sale</b> (dentro ce n’è già di più).", "Stessa direzione = <b>simporto</b> (cotrasporto). È attivo <b>secondario</b> perché nessuno qui consuma ATP: il gradiente di Na⁺ l’ha costruito prima la pompa Na⁺/K⁺, tratteggiata in basso: è lei che ha pagato in ATP (nelle cellule del tubulo sta sulla membrana opposta, quella verso il sangue). Esempi: <b>SGLT2</b> (Na⁺ + glucosio), <b>NKCC2</b> (Na⁺, K⁺, 2 Cl⁻)."], "vars": [{"lab": "il glucosio sale (SGLT2)", "cls": "Attivo secondario: il glucosio sale", "bc": "b-sec", "t": ["Il Na⁺ fuori è tanto e dentro è poco: entrando <b>scende</b> e libera energia. Il trasportatore la usa per portare dentro, nello stesso giro, il glucosio, che invece <b>sale</b> (dentro ce n’è già di più).", "Stessa direzione = <b>simporto</b>. Qui è attivo <b>secondario</b> perché il glucosio <b>sale</b> e nessuno nella proteina consuma ATP: il gradiente di Na⁺ l’ha costruito prima la pompa Na⁺/K⁺, tratteggiata in basso, ed è lei che ha pagato (nelle cellule del tubulo sta sulla membrana opposta, quella verso il sangue). Esempi: <b>SGLT2</b> (Na⁺ + glucosio), <b>NKCC2</b> (Na⁺, K⁺, 2 Cl⁻).", "Ma “simporto” da solo non vuol dire “attivo secondario”: prova l’altro caso qui sopra."]}, {"lab": "scendono tutte e due", "cls": "Passivo: nessuno sale", "bc": "b-pas", "t": ["Stesso trasportatore, ma ora il glucosio è più alto fuori che dentro (caso didattico: nella cellula del tubulo il glucosio dentro è più alto). Scendono tutte e due, nessuna sale: non c’è niente da pagare. Il trasporto è <b>passivo</b>, una diffusione facilitata in coppia.", "Quindi “simporto” dice solo che le due sostanze vanno nella stessa direzione: se il trasporto sia attivo secondario o passivo lo decidono i gradienti del momento, non il nome. E a salire non è sempre il glucosio: nell’<b>NBCe1</b> (cotrasportatore Na⁺–HCO₃⁻) del tubulo prossimale, 1 Na⁺ esce verso il sangue insieme a 3 HCO₃⁻, ed è proprio il Na⁺ a salire, spinto dall’HCO₃⁻ e dal voltaggio."]}]}, {"k": "anti", "via": "carr", "n": "Antiporto", "cls": "Attivo secondario", "bc": "b-sec", "prot": "2 sostanze, direzioni opposte", "t": ["Il Na⁺ entra scendendo; in cambio, nello stesso trasportatore, un H⁺ esce <b>salendo</b>, verso il lato dove gli H⁺ sono già di più.", "Direzioni opposte = <b>antiporto</b> (scambiatore). Anche qui l’energia viene dal gradiente del Na⁺, che ha pagato prima la pompa Na⁺/K⁺ tratteggiata in basso: quindi è attivo secondario. Esempio: <b>NHE3</b> del tubulo prossimale, che butta H⁺ nel lume. Attenzione: AE1 e pendrina sono antiporti Cl⁻/HCO₃⁻ che non usano il Na⁺."], "vars": [{"lab": "l’H⁺ sale (NHE3)", "cls": "Attivo secondario: l’H⁺ sale", "bc": "b-sec", "t": ["Il Na⁺ entra scendendo; in cambio, nello stesso trasportatore, un H⁺ esce <b>salendo</b>, verso il lato dove gli H⁺ sono già di più.", "Direzioni opposte = <b>antiporto</b> (scambiatore). Qui è attivo secondario perché l’H⁺ <b>sale</b>, e l’energia viene dal gradiente del Na⁺, pagato prima dalla pompa Na⁺/K⁺ tratteggiata in basso. Esempio: <b>NHE3</b> del tubulo prossimale, che butta H⁺ nel lume. Anche <b>NCX</b> (scambiatore Na⁺/Ca²⁺) funziona così: il Ca²⁺ esce in salita.", "Ma “antiporto” da solo non vuol dire “attivo secondario”: prova l’altro caso qui sopra."]}, {"lab": "scendono tutte e due (AE1 del globulo rosso)", "cls": "Passivo: nessuno sale", "bc": "b-pas", "t": ["Nel globulo rosso, nei tessuti, l’HCO₃⁻ appena prodotto dall’anidrasi carbonica è più alto dentro che fuori ed esce <b>scendendo</b>; il Cl⁻ è più alto fuori ed entra <b>scendendo</b>. Nessuna delle due sale, nessuno paga: antiporto <b>passivo</b>. È lo <b>shift dei cloruri</b>.", "Nei polmoni i gradienti si rovesciano e lo stesso <b>AE1</b> (scambiatore di anioni 1, la banda 3) lavora al contrario: l’HCO₃⁻ entra e il Cl⁻ esce. Antiporto dice solo “direzioni opposte”: il verso, e se qualcuno deve pagare, lo decide la somma dei gradienti."]}]}, {"k": "pump", "via": "pump", "n": "Pompa", "cls": "Attivo primario", "bc": "b-pri", "prot": "ATPasi", "t": ["La pompa idrolizza ATP e con quell’energia porta le sostanze <b>contro</b> gradiente: la Na⁺/K⁺-ATPasi butta fuori 3 Na⁺ e porta dentro 2 K⁺ per ogni ATP, entrambi in salita.", "È la pompa che tiene basso il Na⁺ dentro la cellula: senza di lei SGLT2, NHE3 e gli altri trasporti attivi secondari si fermerebbero. Altri esempi: H⁺-ATPasi e H⁺/K⁺-ATPasi delle cellule intercalate α, Ca²⁺-ATPasi."]}]},U=D.ui,M=D.modes,CUR=0,PZ=false,VAR=0;
