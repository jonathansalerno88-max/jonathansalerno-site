<h2 class="sr-only">Tre vie per attraversare la membrana: diffusione semplice, canale, trasportatore; i canali secondo come si aprono, i trasportatori secondo quante sostanze portano e in che direzione</h2>

<script>
var D={"ui": {"gh": ["CHI HA PAGATO PRIMA", "la pompa Na⁺/K⁺:", "ha speso ATP per", "tenere basso il Na⁺", "qui dentro"], "atpase": "ATPasi", "out": "FUORI dalla cellula", "inn": "DENTRO la cellula", "conc": "concentrazione", "pause": "❚❚ Pausa", "play": "▶ Riprendi", "rule": "<b>Chi paga?</b> È una seconda domanda, che vale solo per i trasportatori.<ul>\n<li><span class=\"badge b-pas\">Passivo</span> la sostanza <b>scende</b> lungo il suo gradiente elettrochimico: nessuna energia. Sempre così nella diffusione semplice e nei canali; nei trasportatori, se nessuno sale.</li>\n<li><span class=\"badge b-sec\">Attivo secondario</span> nel trasportatore una sostanza <b>sale</b>, trascinata da un’altra che <b>scende</b> (di solito il Na⁺). Il gradiente di Na⁺ l’ha creato prima la pompa Na⁺/K⁺: per questo è “secondario”. Serve per forza un simporto o un antiporto.</li>\n<li><span class=\"badge b-pri\">Attivo primario</span> il trasportatore <b>si paga da solo</b> idrolizzando ATP: si chiama <b>pompa</b> (per esempio la Na⁺/K⁺-ATPasi).</li></ul>", "vq": "Che cosa succede ai gradienti?", "np": ["NESSUNO PAGA", "scendono tutte e due:", "nessuna pompa da ringraziare,", "il trasportatore le accoppia soltanto"], "via": {"mem": "attraverso i lipidi", "chan": "canale", "carr": "trasportatore"}, "viaL": {"mem": "attraverso i lipidi (nessuna proteina)", "chan": "canale", "carr": "trasportatore"}, "legT": "Le tre vie:", "chOpen": "aperto", "chClosed": "chiuso", "trig": {"volt": ["−70 mV", "+20 mV"], "lig": ["", ""], "mech": ["", "↕ stiramento"]}}, "modes": [{"k": "diff", "via": "mem", "n": "Diffusione semplice", "cls": "Passivo", "bc": "b-pas", "prot": "nessuna proteina", "t": ["Le molecole piccole e senza carica, come O₂, CO₂ e gli ormoni steroidei, passano da sole attraverso il doppio strato lipidico, dal lato dove sono più concentrate a quello dove lo sono meno.", "Il flusso è proporzionale alla differenza di concentrazione (legge di Fick) e non si satura mai: più gradiente, più flusso. Ioni e molecole polari grandi invece non passano: serve una proteina."]}, {"k": "chan", "via": "chan", "n": "Canale", "cls": "Passivo", "bc": "b-pas", "prot": "un poro", "subq": "Come si apre?", "t": ["Un canale è un poro pieno d’acqua che attraversa la membrana: quando è aperto, gli ioni ci scorrono dentro lungo il loro gradiente elettrochimico, fino a milioni al secondo. Non può mai portare una sostanza contro gradiente: è sempre <b>passivo</b>. I canali si distinguono per <b>che cosa li apre</b>."], "subs": [{"g": "leak", "lab": "sempre aperto", "t": ["I canali <b>di fuga</b> restano aperti: gli ioni passano ogni volta che c’è un gradiente. Esempio: i canali K⁺ a due pori (K2P), che fanno uscire K⁺ a riposo e tengono la cellula negativa, intorno a −70 mV.", "Nel rene molti canali contano soprattutto per <b>quanti</b> ce ne sono in membrana: l’ADH fa inserire le acquaporine AQP2, l’aldosterone aumenta gli ENaC. ROMK è il canale K⁺ della cellula principale."]}, {"g": "volt", "lab": "voltaggio-dipendente", "t": ["Il canale ha un sensore di voltaggio: a riposo, a −70 mV, è chiuso; quando la membrana si depolarizza si apre e il Na⁺ entra di colpo. È il canale del potenziale d’azione (Na<sub>v</sub>), che dopo pochi millisecondi si inattiva. Lo stesso principio vale per i canali K⁺ (K<sub>v</sub>) e Ca²⁺ (Ca<sub>v</sub>) voltaggio-dipendenti."]}, {"g": "lig", "lab": "ligando-dipendente", "t": ["Si apre quando una molecola segnale si lega al canale. Qui l’acetilcolina (ACh) sul recettore nicotinico della placca motrice: il canale si apre e il Na⁺ entra. Il ligando può arrivare da fuori (neurotrasmettitori come ACh, glutammato, GABA) o da dentro la cellula (cAMP, cGMP, Ca²⁺)."]}, {"g": "mech", "lab": "meccanosensibile", "t": ["Si apre quando la membrana viene stirata o deformata. Esempi: Piezo1 e Piezo2, nel tatto e nei barocettori del seno carotideo e dell’arco aortico, che misurano la pressione arteriosa (gli stessi del riflesso simpatico nel widget del rene). Lasciano entrare cationi, Na⁺ e Ca²⁺."]}]}, {"k": "carr", "via": "carr", "n": "Trasportatore", "subq": "Quante sostanze, in che direzione?", "t": ["Un trasportatore (carrier) lega la molecola da un lato, cambia forma e la rilascia dall’altro: non è mai aperto sui due lati insieme. Per questo è molto più lento di un canale e si <b>satura</b>: quando tutti i trasportatori sono occupati il flusso non cresce più (V<sub>max</sub>)."], "subs": [{"g": "uni", "lab": "uniporto", "cls": "Passivo", "bc": "b-pas", "prot": "1 sostanza", "t": ["Una sola sostanza, a favore di gradiente: <b>uniporto</b>, passivo (diffusione facilitata). Esempio: <b>GLUT2</b>, che fa uscire il glucosio dalla cellula del tubulo prossimale verso il sangue."]}, {"g": "sym", "lab": "simporto", "prot": "2 sostanze, stessa direzione", "vq": "Chi paga?", "vars": [{"lab": "il Na⁺ (il glucosio sale · SGLT2)", "cls": "Attivo secondario: il glucosio sale", "bc": "b-sec", "t": ["Il Na⁺ fuori è tanto e dentro è poco: entrando <b>scende</b> e libera energia. Il trasportatore la usa per portare dentro, nello stesso giro, il glucosio, che invece <b>sale</b> (dentro ce n’è già di più).", "Stessa direzione = <b>simporto</b>. Qui è attivo <b>secondario</b> perché il glucosio <b>sale</b> e nessuno nella proteina consuma ATP: il gradiente di Na⁺ l’ha costruito prima la pompa Na⁺/K⁺, tratteggiata in basso, ed è lei che ha pagato (nelle cellule del tubulo sta sulla membrana opposta, quella verso il sangue). Esempi: <b>SGLT2</b> (Na⁺ + glucosio), <b>NKCC2</b> (Na⁺, K⁺, 2 Cl⁻).", "Ma “simporto” da solo non vuol dire “attivo secondario”: prova gli altri casi in “Chi paga?” qui sopra."]}, {"lab": "nessuno (scendono tutte e due)", "cls": "Passivo: nessuno sale", "bc": "b-pas", "t": ["Stesso trasportatore, ma ora il glucosio è più alto fuori che dentro (caso didattico: nella cellula del tubulo il glucosio dentro è più alto). Scendono tutte e due, nessuna sale: non c’è niente da pagare. Il trasporto è <b>passivo</b>, una diffusione facilitata in coppia.", "Quindi “simporto” dice solo che le due sostanze vanno nella stessa direzione: se il trasporto sia attivo secondario o passivo lo decidono i gradienti del momento, non il nome. E a salire non è sempre il glucosio: nell’<b>NBCe1</b> (cotrasportatore Na⁺–HCO₃⁻) del tubulo prossimale, 1 Na⁺ esce verso il sangue insieme a 3 HCO₃⁻, ed è proprio il Na⁺ a salire, spinto dall’HCO₃⁻ e dal voltaggio."]}]}, {"g": "anti", "lab": "antiporto", "prot": "2 sostanze, direzioni opposte", "vq": "Chi paga?", "vars": [{"lab": "il Na⁺ (l’H⁺ sale · NHE3)", "cls": "Attivo secondario: l’H⁺ sale", "bc": "b-sec", "t": ["Il Na⁺ entra scendendo; in cambio, nello stesso trasportatore, un H⁺ esce <b>salendo</b>, verso il lato dove gli H⁺ sono già di più.", "Direzioni opposte = <b>antiporto</b> (scambiatore). Qui è attivo secondario perché l’H⁺ <b>sale</b>, e l’energia viene dal gradiente del Na⁺, pagato prima dalla pompa Na⁺/K⁺ tratteggiata in basso. Esempio: <b>NHE3</b> del tubulo prossimale, che butta H⁺ nel lume. Anche <b>NCX</b> (scambiatore Na⁺/Ca²⁺) funziona così: il Ca²⁺ esce in salita.", "Ma “antiporto” da solo non vuol dire “attivo secondario”: prova gli altri casi in “Chi paga?” qui sopra."]}, {"lab": "nessuno (AE1 del globulo rosso)", "cls": "Passivo: nessuno sale", "bc": "b-pas", "t": ["Nel globulo rosso, nei tessuti, l’HCO₃⁻ appena prodotto dall’anidrasi carbonica è più alto dentro che fuori ed esce <b>scendendo</b>; il Cl⁻ è più alto fuori ed entra <b>scendendo</b>. Nessuna delle due sale, nessuno paga: antiporto <b>passivo</b>. È lo <b>shift dei cloruri</b>.", "Nei polmoni i gradienti si rovesciano e lo stesso <b>AE1</b> (scambiatore di anioni 1, la banda 3) lavora al contrario: l’HCO₃⁻ entra e il Cl⁻ esce. Antiporto dice solo “direzioni opposte”: il verso, e se qualcuno deve pagare, lo decide la somma dei gradienti."]}, {"lab": "l’ATP (pompa Na⁺/K⁺)", "cls": "Attivo primario: paga l’ATP", "bc": "b-pri", "prot": "pompa (ATPasi): 3 Na⁺ fuori, 2 K⁺ dentro", "t": ["Anche la pompa è un trasportatore: si apre a turno da un lato e dall’altro e si satura. Ma si paga da sola, idrolizzando ATP: la Na⁺/K⁺-ATPasi butta fuori 3 Na⁺ e porta dentro 2 K⁺ per ogni ATP, tutti e due in salita. È attivo <b>primario</b>.", "È lei che tiene basso il Na⁺ dentro la cellula, cioè che “paga prima” per SGLT2, NHE3 e tutti gli altri attivi secondari. Altre pompe: H⁺-ATPasi e H⁺/K⁺-ATPasi delle cellule intercalate α, Ca²⁺-ATPasi."]}]}]}]},U=D.ui,M=D.modes,CUR=0,PZ=false,SUB=0,VAR=0;
