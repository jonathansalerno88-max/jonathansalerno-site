, il termine di velocità [M L⁻¹ T⁻²], Pa; ρ = densità del sangue [M L⁻³], kg/m³; v = velocità [L T⁻¹], m/s"], [3, "∫ perdite viscose", "= attrito che diventa calore (Poiseuille) [M L⁻¹ T⁻²], Pa"], [4, "ρ∫(∂v/∂t)ds ≈ ρL·dv/dt", "= termine inerziale [M L⁻¹ T⁻²], Pa; dv/dt = accelerazione [L T⁻²], m/s²; L = lunghezza della colonna che accelera [L], m"]], "bzN": "P₁ − P₂ viene dalle curve del Wiggers; velocità e viscoso sono piccoli e seguono il flusso; l'inerziale è ricavato per differenza, come si fa dai tracciati di pressione e flusso. Valori indicativi.", "bkT": "La bici e il cancelletto: la valvola aortica, nello stesso battito", "bkV": "ventricolo", "bkA": "aorta", "bkG": "cancelletto = valvola aortica", "bkClang": "clang! = S2", "bkPh": [["Diastole", "nel ventricolo arriva sangue nuovo e la strada resta in basso; il cancelletto chiuso regge il dislivello, e l'aorta, ritraendosi, spinge avanti verso la periferia il sangue di prima"], ["Contrazione isovolumetrica", "il ciclista si alza sui pedali e la strada sale con lui (la pressione del ventricolo cresce), ma finché il cancelletto è chiuso non si muove"], ["Eiezione rapida", "il cancelletto si apre: pedala forte, in leggera discesa (il ventricolo sta sopra l'aorta), e accelera"], ["Eiezione lenta", "smette di pedalare e la strada ora sale un po' (il ventricolo sta sotto l'aorta): va avanti per inerzia, sempre più piano; il cancelletto comincia a richiudersi"], ["Protodiastole", "in cima si ferma e il globulo si allarga all'indietro: è il piccolo reflusso (1–2 mL) che spinge il cancelletto e lo chiude"], ["Rilasciamento isovolumetrico", "clang (S2): appoggiato al cancelletto chiuso resta in cima, mentre dietro la strada sprofonda (il ventricolo crolla)"]], "bkRd": "Altezza della strada = pressione: dietro il cancelletto quella del ventricolo, oltre il cancelletto quella dell'aorta (le differenze piccole sono ingrandite).", "bkAR": "Se il cancelletto non si chiude, la bici torna giù per tutta la discesa: è l'insufficienza aortica.", "wgNote": {"t": "Protodiastole (Wiggers)", "b": "breve intervallo emodinamico, prima di S2, dalla fine dell'eiezione alla chiusura dell'aortica. È il tempo in cui le cuspidi si accostano, spinte da un piccolo reflusso. La pressione del ventricolo cala, ma crolla solo dopo la chiusura, nel rilasciamento isovolumetrico.", "n": "Da non confondere con:", "i": ["la fine dell'eiezione ridotta, in cui la pressione del ventricolo è già sotto quella aortica ma il sangue esce ancora per inerzia (Sugawara 1997);", "il «protodiastolico» dell'auscultazione, che viene subito dopo S2."]}, "wgSys": "sistole meccanica (da S1 a S2)", "wgPush": ["P ventricolo > P aorta", "il sangue accelera"], "wgIner": ["P ventricolo < P aorta", "esce ancora, per inerzia"], "wgProto": "protodiastole", "wgDia": "diastole", "wgSnd": "toni cardiaci (S3 e S4 tra parentesi: di solito non si sentono nell'adulto sano)", "wvAo": "si apre l'aortica", "wvAc": ["si chiude l'aortica", "(incisura dicrota)"], "wvMo": ["si apre", "la mitrale"], "mkSV0": "Volume nel ventricolo: {v} mL", "pbT": "P ventricolo", "pbAo": "soglia aortica", "pbMi": "soglia mitrale", "stA": "Stato dell'atrio:", "stV": "Stato del ventricolo:", "stC": "contratto", "stR": "rilassato", "stX": "si sta rilassando", "mkEd": ["1 · Fine della diastole", "l'atrio ha finito di spingere: il ventricolo è pieno (telediastolico)"], "mkQrs": ["1 · Fine della diastole: parte il QRS", "i ventricoli si depolarizzano ma non si contraggono ancora (ritardo elettromeccanico): la mitrale è ancora aperta"], "mkLeg": ["rosa = muscolo: quando si contrae, la camera si stringe e la parete si ispessisce", "rosso scuro = sangue: le camere sono sempre piene", "frecce bianche = flusso · lucchetto = valvola chiusa", "a fine eiezione nel ventricolo restano circa 50 mL: non si svuota mai"], "mkSVa": "La spinta dell'atrio: il ventricolo sale a {v} mL", "mkSV1": "Gittata sistolica: sono usciti {n} mL", "mkSV2": "Gittata sistolica = 120 − 50 = 70 mL", "mkLA": te del sodio", "to": "transitoria in uscita", "CaL": "tipo L, «long-lasting»", "Ks": "rettificatore ritardato lento", "Kr": "rettificatore ritardato rapido", "K1": "rettificatore entrante", "f": "corrente «funny»", "CaT": "tipo T, «transient»", "K": "rettificatore ritardato", "Nav": "voltaggio-dipendente", "Kv": "voltaggio-dipendente", "K2P": "di fuga, sempre aperti"}, "ap_neuron": "neurone", "ap_cardio": "cardiomiocita", "ap_sa": "nodo SA", "ap_none": "niente", "apThr": "soglia", "apTime": "tempo", "mD_rest": "↺ Riposo", "mD_na": "⚡ Canali Na⁺", "mD_ca": "🧲 Canali Ca²⁺", "mD_lig": "🔑 Ligando (acetilcolina)", "mD_mech": "〽 Stiramento (meccanosensibile)", "mStretch": "stiramento", "mX_rest": "A riposo sono aperti soprattutto i canali K⁺: V<sub>m</sub> sta vicino a E<sub>K</sub>.", "mX_na": "Si aprono i canali Na⁺ voltaggio-dipendenti (P<sub>Na</sub> da 0,05 a 20, come all'apice del potenziale d'azione): V<sub>m</sub> sale verso E<sub>Na</sub>.", "mX_ca": "Si aprono i canali Ca²⁺ di tipo L, come nella fase 0 del nodo SA e AV e nel muscolo liscio. E<sub>Ca</sub> è altissimo, ma il Ca²⁺ è pochissimo: serve una permeabilità enorme (P<sub>Ca</sub> = 300) per portare V<sub>m</sub> sopra lo zero.", "mX_lig": "L'acetilcolina si lega al recettore nicotinico della placca motrice: il canale fa passare Na⁺ e K⁺ quasi allo stesso modo. V<sub>m</sub> va verso circa 0 mV, a metà fra E<sub>Na</sub> ed E<sub>K</sub>, e lì si ferma (potenziale di placca).", "mX_mech": "Lo stiramento della membrana apre i canali Piezo, cationici non selettivi (Na⁺, K⁺ e un po' di Ca²⁺): stesso risultato del ligando, verso circa 0 mV, ma con un altro innesco (tatto, barocettori).", "mCaEq": "Con il Ca²⁺ (z = 2) la forma semplice con il logaritmo non vale più: V<sub>m</sub> è il voltaggio a cui la somma delle correnti GHK di tutti gli ioni fa zero. Qui {v} mV.", "findIt": "Scoprilo qui! →", "mDep": "⚡ Depolarizza la cellula", "mRun": "… potenziale d'azione in corso", "mX_ap": "Parte il potenziale d'azione del {c}, rallentato: la linea nera V<sub>m</sub> segue la curva sullo sfondo, e così il voltmetro. Nella vasca cambiano le permeabilità: sale aprendo i canali Na⁺ (nel nodo SA e nel plateau del cardiomiocita i canali Ca²⁺), scende aprendo i canali K⁺.", "mRest": "↺ Torna a riposo (chiudi i canali Na⁺)", "mBack": ["← un ione", "alla volta"], "mT": "Più ioni insieme: Goldman", "mQ": "Ora passano insieme K⁺, Na⁺ e Cl⁻, ciascuno dal suo canale; il Ca²⁺ a riposo quasi non passa. Il potenziale di membrana si ferma <b>a metà strada</b> fra i loro potenziali di equilibrio, più vicino a quello dello ione più permeabile, il K⁺. Non lo dà Nernst, che vale per un ione alla volta: lo dà l'equazione di <b>Goldman–Hodgkin–Katz</b>.", "mCap": "P<sub>K</sub> : P<sub>Na</sub> : P<sub>Cl</sub> : P<sub>Ca</sub> = {pk} : {pn} : {pc} : {pa} (permeabilità relative, numeri puri; a riposo 1 : 0,05 : 0,45 : 0). Concentrazioni come nella vasca. 61,5 mV = 2,303 · RT/F a 37 °C.", "gT": "Potenziale di membrana", "q1": "Se la membrana lascia passare <b>un solo ione</b>, il potenziale di membrana coincide con il potenziale di equilibrio di quello ione, calcolato con Nernst.", "q2": "E se gli ioni sono più di uno, come succede davvero?", "eqC2": "In grassetto lo ione scelto a sinistra: è il potenziale di membrana se passa solo lui (come nel voltmetro). Tratteggiati gli altri ioni. Concentrazioni dentro / fuori (mM): {c}. Calcolati a {t} °C. Valori indicativi.", "restV": "V<tspan baseline-shift=\"sub\" font-size=\"9\">m</tspan> = {v} mV (Goldman) ≠ E<tspan baseline-shift=\"sub\" font-size=\"9\">{l}</tspan> = {e} mV (Nernst)", "restV0": "V<tspan baseline-shift=\"sub\" font-size=\"9\">m</tspan> = {v} mV (Goldman)", "restW": "nella cellula vera passano più ioni insieme, ognuno con la sua permeabilità", "gMeas": "misurato", "gF": "Equazione di Goldman–Hodgkin–Katz", "gTipA": "Perché il voltmetro segna un altro valore?", "gTip": "<b>Perché il voltmetro segna un altro valore?</b> Nella figura a sinistra la membrana lascia passare un solo ione, il {g}: V<sub>m</sub> va al suo potenziale di Nernst, E<sub>{l}</sub> = {vm} mV. Nella cellula vera passano più ioni insieme, K⁺, Na⁺ e Cl⁻, ciascuno con la sua <b>permeabilità</b>. Il potenziale di riposo è una media dei loro potenziali pesata dalle permeabilità: è l'equazione di Goldman–Hodgkin–Katz, qui {G} mV. Vince lo ione più permeabile, a riposo il K⁺: per questo il riposo è vicino a E<sub>K</sub>, ma un po' più positivo per il Na⁺ che entra.", "gC": "P<sub>K</sub> : P<sub>Na</sub> : P<sub>Cl</sub> = {p} (permeabilità relative, numeri puri). Concentrazioni dentro / fuori (mM): {c}. {k} mV = 2,303 · RT/F a {t} °C. Il Ca²⁺ non è incluso: a riposo la sua permeabilità è trascurabile. MDP = potenziale diastolico massimo.", "gRef": "Rapporti di permeabilità: per il calamaro Hodgkin AL, Katz B. <i>J Physiol</i> 1949;108:37–77; per le altre cellule valori indicativi, scelti per riprodurre il potenziale misurato.", "eqT": "Potenziali di equilibrio nelle cellule", "eqRest": "riposo", "eqMDP": "MDP", "eqC": "Concentrazioni dentro / fuori (mM): {c}. Calcolati a {t} °C. MDP = potenziale diastolico massimo. Valori indicativi.", "cells": {"squid": "Assone gigante di calamaro", "frog": "Muscolo scheletrico di rana", "neuron": "Neurone di mammifero", "cardio": "Cardiomiocita ventricolare umano", "sa": "Cellula del nodo SA (mammifero)", "skm": "Muscolo scheletrico di mammifero"}, "rsT": ["Reset:", "valori", "fisiologici"], "sRef": ["Metti l'elettrodo", "di riferimento"], "sRec": ["Metti l'elettrodo", "di registrazione"], "sBat": ["Metti generatore", "di tensione (pila)"], "sPump": ["Metti generatore", "di corrente (pompa)"], "sInv": ["Inverti i poli", "della batteria"], "nernV": "→ V<tspan baseline-shift=\"sub\" font-size=\"9\">m</tspan> = E<tspan baseline-shift=\"sub\" font-size=\"9\">{l}</tspan> = {v} mV: è il potenziale di Nernst", "velo": "↑ velo di carica sulla membrana: {i} dentro, {o} fuori (pochissimi ioni)", "btOff2": ["⏏ Stacca", "la batteria"], "btOn2": ["⚡ Attacca", "la batteria"], "inv2": ["⇄ Inverti", "i poli"], "batOff": "batteria staccata: V<tspan baseline-shift=\"sub\" font-size=\"8\">m</tspan> libero", "ci": "Concentrazione dentro", "co": "Concentrazione fuori", "eqb": "Porta V<sub>m</sub> = E", "rs": "Valori fisiologici", "eqNA": "senza carica non c'è E", "cnt": "Passati: <b>{o}</b> verso fuori · <b>{i}</b> verso dentro", "names": {"K": "il K⁺", "Na": "il Na⁺", "Cl": "il Cl⁻", "Ca": "il Ca²⁺", "glu": "il glucosio"}, "Names": {"K": "K⁺", "Na": "Na⁺", "Cl": "Cl⁻", "Ca": "Ca²⁺", "glu": "Glucosio"}, "btn": {"K": "K⁺", "Na": "Na⁺", "Cl": "Cl⁻", "Ca": "Ca²⁺", "glu": "glucosio"}, "dirOut": "verso fuori", "dirIn": "verso dentro", "wIn": "dentro", "wOut": "fuori", "neg": "negativo", "posi": "positivo", "hPas": "{N}: passivo, {d}", "hEq": "{N}: all'equilibrio", "hAct": "{N}: attivo, {d}", "Rv": "8,314", "Fv": "96 485", "k58T": "Da dove viene il 58?", "k58": "<p>È la formula di Nernst completa, riscritta in due passaggi:</p><p class=\"eq\"><span class=\"fE\">E</span> = (<span class=\"fR\">R</span> · <span class=\"fT\">T</span>) / (<span class=\"fz\">z</span> · <span class=\"fF\">F</span>) · ln(<span class=\"fco\">C<sub>out</sub></span> / <span class=\"fci\">C<sub>in</sub></span>)</p><ol><li><b>da ln a log₁₀</b>: ln x = 2,303 · log₁₀ x (2,303 = ln 10);</li><li><b>girando la frazione cambia il segno</b>: ln(C<sub>out</sub> / C<sub>in</sub>) = − ln(C<sub>in</sub> / C<sub>out</sub>).</li></ol><p class=\"eq\"><span class=\"fE\">E</span> = − (2,303 · <span class=\"fR\">R</span> · <span class=\"fT\">T</span> / <span class=\"fF\">F</span>) / <span class=\"fz\">z</span> · log₁₀(<span class=\"fci\">C<sub>in</sub></span> / <span class=\"fco\">C<sub>out</sub></span>)</p><p>Il numero davanti è <span class=\"fk\">2,303 · R · T / F</span>:</p><p class=\"eq\">2,303 × <span class=\"fR\">8,314</span> × <span class=\"fT\">293</span> / <span class=\"fF\">96 485</span> = 0,058 V = <b>58 mV</b> (20 °C, laboratorio)</p><p class=\"eq\">2,303 × <span class=\"fR\">8,314</span> × <span class=\"fT\">310</span> / <span class=\"fF\">96 485</span> = 0,0615 V = <b>61,5 mV</b> (37 °C, corpo; molti libri scrivono 61)</p><p>Unità: [J/(mol·K)] × [K] / [C/mol] = J/C = V ✓. Legenda: <span class=\"fz\">z</span> = carica dello ione [numero puro].</p><p><b>A cosa serve</b>: ogni volta che il rapporto delle concentrazioni cresce di 10 volte, E cambia di 58 mV (61,5 a 37 °C) per uno ione con una carica, e della metà per il Ca²⁺, che ne ha due (z = 2).</p>", "elT": "Per misurare V<sub>m</sub> inserisci i due elettrodi del voltmetro", "elRef": "Elettrodo di riferimento", "elRec": "Microelettrodo di registrazione", "elRefS": "riferimento", "elRecS": "registrazione", "pIn": "dentro la cellula", "pOut": "fuori", "pUp": "togli", "elM0": "Il voltmetro non legge niente: gli elettrodi sono fuori dalla vasca.", "el1": "Serve anche l'altro elettrodo: un voltmetro misura sempre una <b>differenza</b> fra due punti.", "elSame": "0 mV: i due elettrodi sono nello stesso liquido, quindi non c'è nessuna differenza da misurare.", "elInv": "Segno rovesciato: il voltmetro legge registrazione − riferimento, qui fuori − dentro. Per convenzione V<sub>m</sub> = dentro − fuori: il riferimento va <b>fuori</b>, il microelettrodo <b>dentro</b>.", "elOk": "✓ Misurato: V<sub>m</sub> = dentro − fuori = <b>{v} mV</b>. Il riferimento sta fuori (lo zero), il microelettrodo ha bucato la membrana ed è nella cellula.", "elArr": "Misura prima V<sub>m</sub>: inserisci gli elettrodi", "cmpNo": "Per confrontare V<sub>m</sub> con E, prima misura V<sub>m</sub>: inserisci gli elettrodi (riquadro in alto).", "cmp": "Adesso V<sub>m</sub> = {vm}, cioè {dv} mV rispetto a E → {r}", "cmpEq": "<b>equilibrio</b>: lo stesso {g} esce e rientra", "cmpD": "movimento netto <b>{d}</b>", "lvG0": "Il glucosio non ha carica (z = 0): non ha un potenziale di equilibrio.", "lvG": "Il movimento netto si ferma solo quando dentro e fuori la concentrazione è uguale. Adesso: dentro {ci}, fuori {co} → {r}", "lvL": "<span class=\"fE\">E</span> = potenziale di equilibrio [mV] · <span class=\"fR\">R</span> = costante dei gas, 8,314 J/(mol·K) · <span class=\"fT\">T</span> = temperatura assoluta [K] · <span class=\"fF\">F</span> = costante di Faraday, 96 485 C/mol (C = A·s) · <span class=\"fk\">{k}</span> = 2,303 · R · T / F a {t} °C [mV] · <span class=\"fz\">z</span> = carica dello ione [numero puro] · <span class=\"fci\">[ ]<sub>in</sub></span>, <span class=\"fco\">[ ]<sub>out</sub></span> = concentrazioni dentro e fuori [mM = mol/m³]", "lvT": "La formula, in tempo reale", "lvC": "comprimi", "lvE": "espandi", "nG": "Formula generica di Nernst", "nS": "A {t} °C, in mV e con log₁₀, per il {g}: si mettono i valori di R, T e F.", "nR": "la costante dei gas, un'energia per mole e per kelvin (J = kg·m²/s²)", "nT": "la temperatura assoluta, in kelvin: {t} °C + 273 = {k} K", "nF": "la costante di Faraday, la carica elettrica di una mole di cariche elementari (C = A·s)", "nL": "<b>da ln a log₁₀</b>: ln x = 2,303 · log₁₀ x (2,303 = ln 10). Girando la frazione, [X]<sub>in</sub> / [X]<sub>out</sub> invece di [X]<sub>out</sub> / [X]<sub>in</sub>, compare il segno meno.", "dT": "Il passaggio da ln a log₁₀, riga per riga", "dAt": "Perché ln x = 2,303 · log₁₀ x?", "dA": "log₁₀ x è l'esponente da dare a 10 per ottenere x: x = 10<sup>log₁₀ x</sup>. Prendi il ln di tutti e due i lati: ln x = log₁₀ x · ln 10, e ln 10 = 2,303. Con i numeri di adesso: x = {x}, log₁₀ x = {lg}, 2,303 × {lg} = {p} = ln x ✓", "dBt": "Perché il segno meno?", "dB": "Il logaritmo di una frazione è una differenza: ln(a/b) = ln a − ln b. Se giri la frazione scambi i due termini, quindi cambia solo il segno: ln({b} / {a}) = {s1}{v}, ln({a} / {b}) = {s2}{v}. Si gira per avere dentro/fuori, come nella formula breve.", "nU": "Unità: J/(mol·K) × K / (C/mol) = J/C = V. Quindi:", "lvN": "① Potenziale di equilibrio (Nernst): il voltaggio a cui le frecce blu e rossa si pareggiano", "lvD": "② Quanto V<sub>m</sub> è lontano da E: è la spinta netta (freccia viola)", "res0": "Δ<span class=\"mt\">μ</span> = 0 → <b>equilibrio</b>: lo stesso {g} esce e rientra, movimento netto zero.", "resD": "Δ<span class=\"mt\">μ</span> {s} 0 → movimento netto spontaneo <b>{d}</b>.", "chem0": "<b>① Chimico</b>: la concentrazione è uguale dentro e fuori, quindi nessuna spinta chimica (0 kJ/mol).", "chem": "<b>① Chimico</b>: dentro {ci}, fuori {co}. È più concentrato {w}, quindi il gradiente chimico lo spinge <b>{d}</b> ({v} kJ/mol).", "el0": "<b>② Elettrico</b>: {n} non ha carica, il voltaggio non lo sposta (0 kJ/mol). Il gradiente elettrochimico coincide con quello chimico.", "elV0": "<b>② Elettrico</b>: V<sub>m</sub> = 0 mV, nessuna spinta elettrica (0 kJ/mol).", "el": "<b>② Elettrico</b>: dentro la cellula è {s} ({vm} mV) e {n} è {c}. Il voltaggio lo spinge <b>{d}</b> ({v} kJ/mol).", "sum": "<b>③ Somma</b>: Δ<span class=\"mt\">μ</span> = {a} {b} = <b>{v} kJ/mol</b>. La freccia viola è il verso del <b>movimento netto</b>: {w} passano in tutte e due le direzioni, ma più <b>{d}</b> che al contrario (guarda il conteggio sotto le frecce).", "sumEq": "<b>③ Somma</b>: Δ<span class=\"mt\">μ</span> ≈ 0, le due frecce si annullano. È l'<b>equilibrio</b>: {n} va avanti e indietro: esce e lo stesso rientra, movimento netto zero (guarda lo ione cerchiato di viola). Nella realtà sono ioni diversi, ma per ogni uscita c'è un'entrata: il conto è lo stesso.", "vPas": "<b>Passivo</b>: {n} va {d}, nel verso della freccia viola. <b>Scende</b> lungo il gradiente elettrochimico, senza spendere energia.", "vNote": "Attenzione: va {d} anche se è più concentrato {w}. Sale il gradiente di concentrazione ma scende quello elettrochimico, quindi resta passivo. Decide la somma, non la concentrazione da sola.", "vAct": "<b>Attivo</b>: {p} porta {n} <b>{d}</b>, contro la freccia viola. <b>Sale</b> lungo il gradiente elettrochimico, quindi serve energia: {s}.", "vActEq": "<b>Attivo?</b> All'equilibrio non c'è nessuna salita: spostare {n} costa quasi zero. Allontana V<sub>m</sub> da E per vedere quanto lavora la pompa.", "nern": "<b>Potenziale di equilibrio</b> (Nernst): E<sub>{l}</sub> = <b>{E} mV</b>. Con «Porta V<sub>m</sub> = E» le frecce rossa e blu si annullano. Con V<sub>m</sub> sopra E {n} {up}, sotto {dn}: il flusso si inverte, per questo E si chiama anche <b>potenziale di inversione</b>.", "nern0": "<b>Nessun potenziale di equilibrio</b>: senza carica l'equilibrio arriva solo quando le concentrazioni dentro e fuori sono uguali.", "exits": "esce", "enters": "entra", "pChan": "canale {g}", "pGlut": "GLUT", "pPump": "pompa", "src": {"atp": "la pompa idrolizza ATP (<b>attivo primario</b>)", "na": "lo stesso trasportatore sfrutta il Na⁺ che entra scendendo (<b>attivo secondario</b>)", "k": "lo stesso trasportatore sfrutta il K⁺ che esce scendendo (<b>attivo secondario</b>)", "gen": "ATP (attivo primario) oppure un altro ione che scende (attivo secondario)"}, "pn": {"nka": "la Na⁺/K⁺-ATPasi", "pmca": "la PMCA (Ca²⁺-ATPasi)", "nkcc": "NKCC1", "kcc": "KCC2", "sglt": "SGLT1", "gen": "un trasportatore attivo"}, "eGen": "energia", "rule": "<b>La regola</b><ul><li><span class=\"badge b-pas\">Passivo</span> la sostanza va nel verso della freccia viola: <b>scende</b> lungo il gradiente elettrochimico. Non serve energia. Sono passivi la diffusione semplice, i canali e i trasportatori passivi (come GLUT).</li><li><span class=\"badge b-pri\">Attivo</span> la sostanza va contro la freccia viola: <b>sale</b>. Serve energia, che viene dall'ATP (<b>attivo primario</b>, le pompe) oppure da un altro ione che scende nello stesso trasportatore (<b>attivo secondario</b>).</li><li>La freccia viola è la somma della blu (concentrazione) e della rossa (voltaggio). Per una molecola senza carica la rossa non c'è.</li></ul>", "note": "All'inizio la batteria è staccata e la membrana è all'equilibrio. Con la batteria attaccata le concentrazioni cambiano finché E arriva alla tensione della batteria; staccata, V<sub>m</sub> va a E. Temperatura 37 °C (310 K) o 20 °C (293 K), da scegliere nel riquadro della formula; le velocità dell'animazione sono indicative."};

function num(v,d,sg){var s=Math.abs(v).toFixed(d);if(L.dec===',')s=s.replace('.',',');if(Math.abs(v)<Math.pow(10,-d)/2)return s;return (v<0?'−':(sg?'+':''))+s;}

function fill(t,o){return t.replace(/\{(\w+)\}/g,function(m,k){return o[k]!=null?o[k]:m;});}
