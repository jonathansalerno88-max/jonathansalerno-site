⁻ in cambio non esce", "enz": "anidrasi carbonica (nella cellula)", "run": "gira: H⁺ al sangue, HCO₃⁻ alla pendrina", "stop": "ferma: troppo HCO₃⁻ nella cellula"}, "dec": ",", "ghostLab": "ha pagato prima", "ghostNa": {"n": "Na⁺/K⁺-ATPasi", "i1": "3 Na⁺", "i2": "2 K⁺", "far": "blood", "note": "Na⁺ basso qui"}, "sec": "Secondario perché:", "secNa": "il trasportatore non usa ATP. Sfrutta la discesa del Na⁺, ma il gradiente del Na⁺ l'ha creato prima la Na⁺/K⁺-ATPasi, spendendo ATP sul lato del sangue. È energia di seconda mano: se la pompa si ferma, si ferma anche lui.", "payNa": "ha pagato prima: Na⁺/K⁺-ATPasi (ATP)", "story": "Una sola domanda decide tutto: <b>la sostanza scende o sale lungo il suo gradiente?</b> Se scende, il trasporto è passivo. Se sale, qualcuno deve pagare: l'ATP direttamente (attivo primario) oppure un altro ione che intanto scende, nella stessa proteina e nello stesso ciclo (attivo secondario). Scegli un trasportatore e guarda le barre: sono le concentrazioni ai due lati.", "rp": "<b>Passivo</b>scende lungo il suo gradiente. Senza proteina (diffusione semplice) o con un canale o un trasportatore (diffusione facilitata).", "rr": "<b>Attivo primario</b>sale contro gradiente e la pompa consuma ATP direttamente (ATPasi).", "rs": "<b>Attivo secondario</b>sale contro gradiente trascinato da un altro ione che scende, nello stesso trasportatore: simporto (stessa direzione) o antiporto (opposta). <i>Secondario</i> perché l'ATP l'ha speso prima un'altra pompa per creare quel gradiente: energia di seconda mano.", "rq": "Per gli ioni conta il gradiente <b>elettrochimico</b>: concentrazione e carica. La cellula è negativa dentro (circa −70 mV): attira i cationi (Na⁺, K⁺, H⁺) e respinge gli anioni (Cl⁻).", "t1": "Esplora", "t2": "Mettiti alla prova", "side": {"lum": "lume (urina)", "cell": "cellula", "blood": "sangue"}, "prot": {"none": "nessuna proteina", "chan": "canale", "carr": "trasportatore", "pump": "pompa (ATPasi)"}, "cls": {"pas": "passivo", "pri": "attivo primario", "sec": "attivo secondario"}, "mode": {"uni": "uniporto", "sym": "simporto", "anti": "antiporto"}, "coupled": "accoppiati", "up": "sale", "down": "scende", "why": "Perché:", "drug": "Farmaci:", "clin": "In clinica:", "qn": "Domanda {i} di {n}", "score": "punteggio {s}/{n}", "q1": "1. Che proteina è?", "q2": "2. Che trasporto è?", "right": "Giusto.", "wrong": "Non proprio.", "next": "Avanti →", "again": "Ricomincia"}, "groups": [{"k": "prox", "n": "Prossimale"}, {"k": "loop", "n": "Ansa di Henle"}, {"k": "dist", "n": "Distale"}, {"k": "cdp", "n": "Collettore · cellula principale"}, {"k": "cda", "n": "Collettore · intercalata α"}, {"k": "cdb", "n": "Collettore · intercalata β"}, {"k": "all", "n": "Ovunque"}, {"k": "none", "n": "Senza proteina"}], "tr": [{"id": "sglt2", "g": "prox", "n": "SGLT2", "full": "cotrasportatore sodio-glucosio di tipo 2", "where": "tubulo prossimale, lato lume", "A": "lum", "B": "cell", "prot": "carr", "cls": "sec", "mode": "sym", "subs": [{"s": "Na⁺", "cA": 140, "cB": 12, "lA": "140 mM", "lB": "12 mM", "dir": "AB", "up": false}, {"s": "glucosio", "cA": 1, "cB": 5, "lA": "1 mM", "lB": "5 mM", "dir": "AB", "up": true, "sh": "glu"}], "why": "Il glucosio entra in salita (5 mM nella cellula contro circa 1 nel lume), trascinato dal Na⁺ che scende. Una sola proteina, due sostanze, un solo ciclo: simporto, attivo secondario. Paga il Na⁺, il cui gradiente l'ha creato la Na⁺/K⁺-ATPasi.", "drug": "gliflozine (dapagliflozin, empagliflozin).", "clin": "Glicosuria. Più sale arriva alla macula densa, che chiude l'afferente: la pressione nel glomerulo scende e il rene è protetto. Sono uno dei quattro pilastri dello scompenso."}, {"id": "nhe3", "g": "prox", "n": "NHE3", "full": "scambiatore sodio-idrogeno di tipo 3", "where": "tubulo prossimale, lato lume", "A": "lum", "B": "cell", "prot": "carr", "cls": "sec", "mode": "anti", "subs": [{"s": "Na⁺", "cA": 140, "cB": 12, "lA": "140 mM", "lB": "12 mM", "dir": "AB", "up": false}, {"s": "H⁺", "cA": 0.16, "cB": 0.063, "lA": "pH 6,8", "lB": "pH 7,2", "dir": "BA", "up": true}], "why": "Il Na⁺ entra scendendo e paga l'uscita dell'H⁺, che sale verso un lume più acido. Direzioni opposte nella stessa proteina: antiporto, attivo secondario.", "drug": "nessuno di uso comune; l'acetazolamide lo frena in modo indiretto (meno H⁺ disponibile nella cellula).", "clin": "L'angiotensina II (recettori AT1) e il simpatico (α1) lo stimolano: è uno dei modi con cui trattengono sodio. Serve anche a recuperare il bicarbonato filtrato."}, {"id": "glut2", "g": "prox", "n": "GLUT2", "full": "trasportatore del glucosio di tipo 2", "where": "tubulo prossimale, lato sangue", "A": "cell", "B": "blood", "prot": "carr", "cls": "pas", "mode": "uni", "subs": [{"s": "glucosio", "cA": 6, "cB": 5, "lA": "6 mM", "lB": "5 mM", "dir": "AB", "up": false, "sh": "glu"}], "why": "Il glucosio ripreso dall'SGLT2 si accumula nella cellula ed esce verso il sangue scendendo. Il trasportatore porta una sola sostanza (uniporto) e non usa energia: diffusione facilitata, passivo.", "drug": "nessuno.", "clin": "Senza GLUT2 il glucosio resterebbe intrappolato nella cellula (sindrome di Fanconi-Bickel)."}, {"id": "aqp1", "g": "loop", "n": "AQP1", "full": "acquaporina 1", "where": "tubulo prossimale e ansa discendente", "A": "lum", "B": "cell", "prot": "chan", "cls": "pas", "mode": "", "subs": [{"s": "H₂O", "cA": 2, "cB": 1, "lA": "300 → 600 mOsm", "lB": "più concentrato", "dir": "AB", "up": false, "sh": "H₂O"}], "why": "L'acqua scende da dove è più diluita a dove è più concentrata (l'interstizio della midollare), attraverso un poro: canale, passivo.", "drug": "nessuno.", "clin": "Sempre presenti, senza bisogno di ormoni: nel prossimale e nell'ansa discendente l'acqua segue il sale da sola."}, {"id": "nkcc2", "g": "loop", "n": "NKCC2", "full": "cotrasportatore Na⁺-K⁺-2Cl⁻", "where": "ramo ascendente spesso, lato lume", "A": "lum", "B": "cell", "prot": "carr", "cls": "sec", "mode": "sym", "subs": [{"s": "Na⁺", "cA": 140, "cB": 12, "lA": "140 mM", "lB": "12 mM", "dir": "AB", "up": false}, {"s": "K⁺", "cA": 4, "cB": 140, "lA": "4 mM", "lB": "140 mM", "dir": "AB", "up": true}, {"s": "2 Cl⁻", "cA": 120, "cB": 20, "lA": "120 mM", "lB": "20 mM, −70 mV", "dir": "AB", "up": true, "sh": "Cl⁻"}], "why": "Il Na⁺ scende e trascina con sé un K⁺ e due Cl⁻. Il K⁺ sale chiaramente (140 mM dentro la cellula). Il Cl⁻ sale per la carica: la cellula è negativa e lo respinge. Stessa direzione: simporto, attivo secondario.", "drug": "diuretici dell'ansa: furosemide, torasemide, bumetanide.", "clin": "È anche il sensore della macula densa. Bloccarlo fa arrivare più sale a valle e far perdere più K⁺. Un suo parente (NKCC1) sta nell'orecchio interno: ototossicità ad alte dosi."}, {"id": "ncc", "g": "dist", "n": "NCC", "full": "cotrasportatore Na⁺-Cl⁻", "where": "tubulo distale, lato lume", "A": "lum", "B": "cell", "prot": "carr", "cls": "sec", "mode": "sym", "subs": [{"s": "Na⁺", "cA": 60, "cB": 12, "lA": "60 mM", "lB": "12 mM", "dir": "AB", "up": false}, {"s": "Cl⁻", "cA": 60, "cB": 20, "lA": "60 mM", "lB": "20 mM, −70 mV", "dir": "AB", "up": true}], "why": "Il Na⁺ scende e trascina il Cl⁻, che per la carica sale. Stessa direzione: simporto, attivo secondario.", "drug": "tiazidici: idroclorotiazide, clortalidone, indapamide; metolazone.", "clin": "Iponatriemia, ipokaliemia, iperuricemia e ipercalcemia (si riprende più calcio). Sindrome di Gitelman: l'NCC non funziona."}, {"id": "enac", "goal": "la cellula principale serve a <b>riassorbire Na⁺</b> (e acqua, se c'è l'ADH) e a <b>secernere K⁺</b>.", "g": "cdp", "n": "ENaC", "full": "canale epiteliale del sodio", "where": "dotto collettore, cellula principale, lato lume", "A": "lum", "B": "cell", "prot": "chan", "cls": "pas", "mode": "", "subs": [{"s": "Na⁺", "cA": 50, "cB": 12, "lA": "50 mM", "lB": "12 mM", "dir": "AB", "up": false}], "why": "Il Na⁺ scende dal lume alla cellula attraverso un poro: canale, passivo. Il gradiente c'è perché la Na⁺/K⁺-ATPasi tiene basso il Na⁺ dentro, ma questo non rende attivo il canale.", "drug": "amiloride, triamterene (bloccano il canale); spironolattone ed eplerenone bloccano il recettore dell'aldosterone che lo fa produrre.", "clin": "L'aldosterone lo aumenta. Il Na⁺ che entra lascia il lume negativo, e K⁺ e H⁺ escono. Sindrome di Liddle: ENaC sempre aperto, con ipertensione e ipokaliemia."}, {"id": "romk", "g": "cdp", "n": "ROMK", "full": "canale del potassio della midollare esterna", "where": "ansa ascendente spessa e dotto collettore, lato lume", "A": "lum", "B": "cell", "prot": "chan", "cls": "pas", "mode": "", "subs": [{"s": "K⁺", "cA": 20, "cB": 140, "lA": "20 mM", "lB": "140 mM", "dir": "BA", "up": false}], "why": "Il K⁺ esce dalla cellula (140 mM) verso il lume (circa 20 mM), aiutato dal lume negativo: canale, passivo.", "drug": "nessuno di uso comune.", "clin": "Nell'ansa ricicla il K⁺ che serve all'NKCC2; nel collettore è la via da cui si perde potassio. Sindrome di Bartter di tipo 2: ROMK che non funziona."}, {"id": "aqp2", "goal": "la cellula principale serve a <b>riassorbire Na⁺</b> (e acqua, se c'è l'ADH) e a <b>secernere K⁺</b>.", "g": "cdp", "n": "AQP2", "full": "acquaporina 2", "where": "dotto collettore, cellula principale, lato lume", "A": "lum", "B": "cell", "prot": "chan", "cls": "pas", "mode": "", "subs": [{"s": "H₂O", "cA": 2, "cB": 1, "lA": "urina diluita", "lB": "interstizio concentrato", "dir": "AB", "up": false, "sh": "H₂O"}], "why": "L'acqua passa per un poro scendendo verso l'interstizio più concentrato: canale, passivo. L'ADH decide solo se il poro c'è (lo inserisce in membrana), non dà energia.", "drug": "vaptani (tolvaptan, che blocca i recettori V2); il litio le riduce (diabete insipido nefrogenico).", "clin": "Senza ADH il collettore è impermeabile all'acqua e l'urina esce diluita."}, {"id": "hatp", "goal": "la cellula α (intercalata di tipo A) serve a <b>secernere H⁺</b> nel lume perché venga escreto con l'urina, e a restituire HCO₃⁻ al sangue: toglie acido al corpo nell'acidosi.", "g": "cda", "n": "H⁺-ATPasi", "full": "pompa protonica", "where": "intercalata α, lato lume", "A": "lum", "B": "cell", "prot": "pump", "cls": "pri", "mode": "", "subs": [{"s": "H⁺", "cA": 31.6, "cB": 0.063, "lA": "pH 4,5", "lB": "pH 7,2", "dir": "BA", "up": true}], "why": "L'H⁺ esce verso un lume fino a 500 volte più acido (pH 4,5 contro 7,2): la salita è ripida e serve ATP, attivo primario. Il lume negativo aiuta, ma non basta.", "drug": "nessuno.", "clin": "Se non funziona: acidosi tubulare renale distale (tipo 1), con l'urina che non scende sotto pH 5,5."}, {"id": "hkatp", "price": "<b>Il prezzo:</b> ogni K⁺ recuperato costa un H⁺ buttato via.<br><b>Da dove viene l'H⁺:</b> la cellula lo fabbrica da sé, dal CO₂. L'HCO₃⁻ che resta va al sangue, quindi secernere un H⁺ equivale a toglierne uno al sangue.<svg viewBox=\"0 0 640 182\" role=\"img\" aria-label=\"Lume, cellula e sangue: la cellula fabbrica l'H⁺ dal CO₂, lo manda nell'urina e manda il bicarbonato al sangue, mentre il K⁺ viene recuperato\" style=\"display:block;width:100%;height:auto;margin:6px 0;border-radius:8px\"><rect x=\"0\" y=\"0\" width=\"208\" height=\"182\" fill=\"#FFF6CF\"/><rect x=\"208\" y=\"0\" width=\"224\" height=\"182\" fill=\"#F3ECFA\"/><rect x=\"432\" y=\"0\" width=\"208\" height=\"182\" fill=\"#FBE3E3\"/><rect x=\"200\" y=\"0\" width=\"16\" height=\"182\" fill=\"#E8C76A\"/><rect x=\"424\" y=\"0\" width=\"16\" height=\"182\" fill=\"#E8C76A\"/><text x=\"10\" y=\"16\" font-size=\"12\" font-weight=\"700\" text-anchor=\"start\" fill=\"#55697A\">lume (urina)</text><text x=\"320\" y=\"16\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#55697A\">cellula</text><text x=\"630\" y=\"16\" font-size=\"12\" font-weight=\"700\" text-anchor=\"end\" fill=\"#55697A\">sangue</text><rect x=\"194\" y=\"26\" width=\"28\" height=\"138\" rx=\"11\" fill=\"#F6B89A\" stroke=\"#C2571A\" stroke-width=\"1.8\"/><text x=\"208\" y=\"177\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#C2571A\">pompa · ATP</text><path d=\"M340 70 V42 H132\" fill=\"none\" stroke=\"#C2571A\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><path d=\"M122 42 l11 -6 v12 Z\" fill=\"#C2571A\"/><path d=\"M398 70 V42 H500\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><path d=\"M510 42 l-11 -6 v12 Z\" fill=\"#2E7D32\"/><path d=\"M512 118 H270 V98\" fill=\"none\" stroke=\"#55697A\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><path d=\"M270 90 l-6 10 h12 Z\" fill=\"#55697A\"/><path d=\"M84 150 H500\" fill=\"none\" stroke=\"#1F5FA8\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><path d=\"M510 150 l-11 -6 v12 Z\" fill=\"#1F5FA8\"/><circle cx=\"432\" cy=\"42\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#2E7D32\" stroke-width=\"1.8\"/><text x=\"432\" y=\"45\" font-size=\"8\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#2E7D32\">AE1</text><text x=\"270\" y=\"86\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#16222E\">CO₂ + H₂O</text><text x=\"312\" y=\"86\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#55697A\">→</text><text x=\"340\" y=\"86\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#C2571A\">H⁺</text><text x=\"366\" y=\"86\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#55697A\">+</text><text x=\"398\" y=\"86\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#2E7D32\">HCO₃⁻</text><text x=\"334\" y=\"104\" font-size=\"10\" font-weight=\"400\" text-anchor=\"middle\" fill=\"#55697A\">anidrasi carbonica</text><text x=\"98\" y=\"38\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#C2571A\">H⁺</text><text x=\"98\" y=\"62\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B03A3A\">perso con l'urina</text><text x=\"546\" y=\"38\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#2E7D32\">HCO₃⁻</text><text x=\"546\" y=\"62\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#2E7D32\">al sangue: più alcalino</text><text x=\"546\" y=\"122\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#55697A\">CO₂</text><text x=\"60\" y=\"155\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1F5FA8\">K⁺</text><text x=\"556\" y=\"144\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1F5FA8\">K⁺</text><text x=\"556\" y=\"166\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1F5FA8\">recuperato</text></svg><span class=\"trow\"><span class=\"tc g\">＋ K⁺ recuperato</span><span class=\"tc r\">− H⁺ perso con l'urina</span><span class=\"ta\">→</span><span class=\"tc k\">il corpo perde acido: alcalosi</span></span>Per questo ipokaliemia e alcalosi metabolica vanno spesso insieme: se manca potassio la pompa lavora di più, e il sangue si alcalinizza.", "goal": "la cellula α (intercalata di tipo A) serve a <b>secernere H⁺</b> nel lume perché venga escreto con l'urina, e a restituire HCO₃⁻ al sangue: toglie acido al corpo nell'acidosi.", "g": "cda", "n": "H⁺/K⁺-ATPasi", "full": "pompa idrogeno-potassio", "where": "intercalata α, lato lume", "A": "lum", "B": "cell", "prot": "pump", "cls": "pri", "mode": "", "subs": [{"s": "H⁺", "cA": 31.6, "cB": 0.063, "lA": "pH 4,5", "lB": "pH 7,2", "dir": "BA", "up": true}, {"s": "K⁺", "cA": 5, "cB": 140, "lA": "5 mM", "lB": "140 mM", "dir": "AB", "up": true}], "why": "H⁺ fuori e K⁺ dentro, tutti e due in salita, consumando ATP: attivo primario. È simile alla pompa protonica dello stomaco.", "drug": "gli inibitori di pompa (omeprazolo) bloccano la versione gastrica.", "clin": "Lavora di più quando il potassio è basso: recupera K⁺ e perde H⁺ (alcalosi)."}, {"id": "ae1", "seq": true, "clx": "same", "knob": {"kind": "hb", "rows": {"HCO₃⁻": "il sangue ne ha già tanto: non esce", "Cl⁻": ""}, "lab": "HCO₃⁻ nel plasma", "min": 10, "max": 40, "dv": 16, "ph0": 7.1, "ph1": -2.5, "neutral": true, "flux": "scambio dell'AE1", "ph": "pH dell'urina", "pl": "HCO₃⁻ nuovo al sangue", "plHi": "poco", "plDn": "tanto", "blT": "Che cosa succede nel sangue", "b1": "L'AE1 manda nel sangue HCO₃⁻ nuovo (ora al {p}%).", "b2": "Per ogni HCO₃⁻ restituito, un H⁺ va nell'urina: il bicarbonato del plasma sale.", "b3hi": "Con il bicarbonato del plasma già alto il gradiente verso il sangue sparisce: l'AE1 rallenta e la cellula α si spegne. È giusto: nell'alcalosi lavora la cellula β.", "b3dn": "Con il bicarbonato del plasma basso (acidosi) il gradiente è grande: l'AE1 lavora a pieno, l'urina si acidifica e il plasma recupera bicarbonato.", "co2": "Il Cl⁻ che entra con l'AE1 non si accumula: esce di nuovo verso il sangue dai canali del cloro (ClC-Kb). Il cloro gira in tondo, il bicarbonato esce.", "m": ["Alcalosi (HCO₃⁻ del plasma alto): l'HCO₃⁻ non riesce più a uscire verso il sangue, si accumula nella cellula e frena l'anidrasi carbonica. La cellula α smette di secernere H⁺: l'urina diventa meno acida.", "Valori intermedi: l'AE1 scambia a velocità media e la cellula α secerne H⁺ in modo moderato.", "Acidosi (HCO₃⁻ del plasma basso): l'HCO₃⁻ esce verso il sangue a pieno ritmo, l'anidrasi carbonica gira e la H⁺-ATPasi butta H⁺ nell'urina, che scende verso pH 5. Il plasma recupera bicarbonato nuovo: l'acidosi si corregge."]}, "caRun": "gira: H⁺ nell'urina, HCO₃⁻ al sangue con l'AE1", "ca": true, "goal": "la cellula α (intercalata di tipo A) serve a <b>secernere H⁺</b> nel lume perché venga escreto con l'urina, e a restituire HCO₃⁻ al sangue: toglie acido al corpo nell'acidosi.", "ghost": {"n": "H⁺-ATPasi", "i1": "H⁺", "i2": "", "far": "lum", "note": "HCO₃⁻ alto qui"}, "sec": "il trasportatore non usa ATP. Sfrutta la discesa dell'HCO₃⁻, che si accumula nella cellula perché la H⁺-ATPasi butta fuori l'H⁺ spendendo ATP e l'anidrasi carbonica produce nuovo bicarbonato. È energia di seconda mano.", "g": "cda", "n": "AE1", "full": "scambiatore anionico 1 (banda 3)", "where": "intercalata α, lato sangue", "A": "cell", "B": "blood", "prot": "carr", "cls": "sec", "mode": "anti", "subs": [{"s": "HCO₃⁻", "cA": 30, "cB": 24, "lA": "30 mM", "lB": "24 mM", "dir": "AB", "up": false, "sh": "HCO₃"}, {"s": "Cl⁻", "cA": 20, "cB": 105, "lA": "20 mM, −70 mV", "lB": "105 mM", "dir": "BA", "up": true}], "why": "L'HCO₃⁻, prodotto nella cellula dall'anidrasi carbonica, esce verso il sangue scendendo e paga l'ingresso del Cl⁻, che per la carica sale. Direzioni opposte: antiporto, attivo secondario.", "drug": "nessuno.", "clin": "Ogni H⁺ buttato nell'urina corrisponde a un HCO₃⁻ restituito al sangue. AE1 difettoso: acidosi tubulare distale. È la stessa proteina della banda 3 dei globuli rossi."}, {"id": "pen", "seq": "b", "clx": "ghost", "goal": "la cellula β (intercalata di tipo B) serve a <b>secernere HCO₃⁻</b> nel lume perché venga <b>escreto</b> con l'urina: toglie base al corpo nell'alcalosi. Ogni HCO₃⁻ secreto corrisponde a un H⁺ restituito al sangue.", "ca": true, "knob": {"kind": "cl", "ph0": 5.6, "ph1": 2.4, "pl": "HCO₃⁻ del plasma", "plHi": "resta alto", "plDn": "scende", "blT": "Che cosa succede nel sangue", "b1": "La H⁺-ATPasi manda nel sangue gli H⁺ prodotti dall'anidrasi (ora al {p}%).", "b2": "Ogni H⁺ incontra un HCO₃⁻ del plasma: H⁺ + HCO₃⁻ → CO₂ + H₂O, e il CO₂ si espira.", "b3hi": "Pochi H⁺ arrivano nel sangue: l'HCO₃⁻ del plasma non viene consumato e resta alto. Questa è l'alcalosi metabolica.", "b3dn": "Così l'HCO₃⁻ del plasma viene consumato e scende: l'alcalosi si corregge.", "co2": "Il CO₂ non è il problema: passa liberamente le membrane e lo regolano i polmoni. Nell'alcalosi il respiro rallenta un po' (la pCO₂ sale di circa 0,7 mmHg per ogni mmol/L di HCO₃⁻ in più): è la compensazione respiratoria, non la causa.", "lab": "Cl⁻ che arriva nel lume", "min": 2, "max": 120, "dv": 80, "flux": "scambio della pendrina", "ph": "pH dell'urina", "m": ["Poco Cl⁻ nel lume (vomito, diuretici, perdita di cloro): la pendrina si ferma e l'HCO₃⁻ si accumula nell   var Q=t.seq==='b'?U.sqb:U.sq;$('#dg').innerHTML=(t.seq?'<div class="sqctl"><button type="button" id="sqp">'+(PZ?Q.play:Q.pause)+'</button><button type="button" id="sqr">'+Q.restart+'</button></div>':'')+draw(t,false)+(t.seq?'<div class="sqb"><span class="goal2"><b>'+Q.goalT+'</b> '+Q.goal+'</span><ol><li class="c1"><b>1</b>'+Q.s1+'</li><li class="c2"><b>2</b>'+Q.s2+'</li><li class="c3"><b>3</b>'+Q.s3+'</li><li class="c4"><b>4</b>'+Q.s4+'</li><li class="c5"><b>5</b>'+Q.s5+'</li></ol></div>':'');$('#kn').innerHTML=knobHtml(byId(SEL));$('#info').innerHTML=info(t);ruleOn(t.cls);}
var PZ=false;
$('#dg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.id==='sqp'){PZ=!PZ;document.body.classList.toggle('paused',PZ);b.textContent=PZ?U.sq.play:U.sq.pause;b.classList.toggle('on',PZ);}
  if(b.id==='sqr'){PZ=false;document.body.classList.remove('paused');renderEx();}});
$('#kn').addEventListener('input',function(e){if(e.target.id!=='kv')return;KV[SEL]=+e.target.value;var t=knobbed(byId(SEL));$('#dg').innerHTML=draw(t,false);
  $('#kn .kvv').textContent=Math.round(KV[SEL])+' mM';$('#kres').innerHTML=knobRes(byId(SEL));return;
  var sv=$('#kv').value;$('#kn').innerHTML=knobHtml(byId(SEL));var k=$('#kv');k.focus();k.value=sv;});
function lensAt(e,show){var L=document.querySelector('.lens'),N=document.querySelector('.lnote');if(!L)return;if(!show){L.hidden=true;return;}
var w=L.offsetWidth||290,x=Math.min(Math.max(e.clientX+20,4),window.innerWidth-w-4),y=Math.max(e.clientY-w/2,4);L.style.left=x+'px';L.style.top=y+'px';L.hidden=false;if(N)N.hidden=false;}
$('#pick').addEventListener('mousemove',function(e){lensAt(e,!!e.target.closest('.kmap'));});
$('#pick').addEventListener('mouseleave',function(e){lensAt(e,false);});
$('#pick').addEventListener('click',function(e){if(!e.target.closest('.kmap'))return;var L=document.querySelector('.lens');if(L&&!L.hidden&&e.detail===0)return;if(matchMedia('(hover: none)').matches){if(L.hidden)lensAt(e,true);else L.hidden=true;}});
function nsw(e){var n=e.target.closest('.nsw');if(!n||(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' '))return;e.preventDefault();if(n.getAttribute('data-hi'))HISTO=!HISTO;else if(n.getAttribute('data-ci'))CIRC=!CIRC;else NT=n.getAttribute('data-nt');renderEx();}
$('#pick').addEventListener('click',nsw);$('#pick').addEventListener('keydown',nsw);
$('#pick').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;SEL=b.getAttribute('data-id');renderEx();});

// quiz
var QO=[],QI=0,SC=0,SN=0,A1=null,A2=null;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),k=a[i];a[i]=a[j];a[j]=k;}return a;}
function newQuiz(){QO=shuffle(T.slice());QI=0;SC=0;SN=0;renderQ();}
function renderQ(){var t=QO[QI];A1=null;A2=null;ruleOn('');
  $('#qt').textContent=U.qn.replace('{i}',QI+1).replace('{n}',QO.length)+': '+t.n+' · '+t.where;$('#sc').textContent=U.score.replace('{s}',SC).replace('{n}',SN);
  $('#qdg').innerHTML=draw(t,true);$('#q1').textContent=U.q1;$('#q2').textContent=U.q2;
  $('#a1').innerHTML=['none','chan','carr','pump'].map(function(k){return '<button type="button" data-k="'+k+'">'+U.prot[k]+'</button>';}).join('');
  $('#a2').innerHTML=['pas','pri','sec'].map(function(k){return '<button type="button" data-k="'+k+'">'+U.cls[k]+'</button>';}).join('');
  $('#qfb').innerHTML='';$('#nx').hidden=true;}
function check(){if(A1===null||A2===null)return;var t=QO[QI],ok1=A1===t.prot,ok2=A2===t.cls;SN++;if(ok1&&ok2)SC++;
  [['#a1',t.prot],['#a2',t.cls]].forEach(function(p){[].forEach.call($(p[0]).querySelectorAll('button'),function(b){b.disabled=true;var k=b.getAttribute('data-k');if(k===p[1])b.classList.add('ok');else if(b.classList.contains('sel'))b.classList.add('no');});});
  $('#qfb').innerHTML='<p class="fb '+(ok1&&ok2?'ok':'no')+'"><b>'+(ok1&&ok2?U.right:U.wrong)+'</b> '+t.why+(t.cls==='sec'?'<br><b>'+U.sec+'</b> '+(t.sec||U.secNa):'')+'</p>';
  $('#qdg').innerHTML=draw(t,false);ruleOn(t.cls);$('#sc').textContent=U.score.replace('{s}',SC).replace('{n}',SN);
  $('#nx').hidden=false;$('#nx').textContent=QI<QO.length-1?U.next:U.again;}
['#a1','#a2'].forEach(function(id,i){$(id).addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;
  [].forEach.call($(id).querySelectorAll('button'),function(x){x.classList.remove('sel');x.style.outline='';});b.classList.add('sel');b.style.outline='2px solid #1456A8';
  if(i===0)A1=b.getAttribute('data-k');else A2=b.getAttribute('data-k');check();});});
$('#nx').addEventListener('click',function(){if(QI<QO.length-1){QI++;renderQ();}else newQuiz();});

function setMode(m){MODE=m;$('#ex').hidden=m!=='ex';$('#qz').hidden=m!=='qz';$('#t1').classList.toggle('act',m==='ex');$('#t2').classList.toggle('act',m==='qz');if(m==='qz')newQuiz();else renderEx();}
$('#t1').addEventListener('click',function(){setMode('ex');});$('#t2').addEventListener('click',function(){setMode('qz');});
$('#ttl').textContent=U.title;$('#story').innerHTML=U.story;$('#rp').innerHTML=U.rp;$('#rr').innerHTML=U.rr;$('#rs').innerHTML=U.rs;$('#rq').innerHTML=U.rq;
$('#t1').textContent=U.t1;$('#t2').textContent=U.t2;
(function(){var m=/[?&]t=([a-z0-9]+)/.exec(location.search);if(m&&T.some(function(x){return x.id===m[1];}))SEL=m[1];})();
setMode('ex');
</script>
