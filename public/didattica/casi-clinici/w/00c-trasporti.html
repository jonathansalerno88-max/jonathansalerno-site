e); spironolattone ed eplerenone bloccano il recettore dell'aldosterone che lo fa produrre.", "clin": "L'aldosterone lo aumenta. Il Na⁺ che entra lascia il lume negativo, e K⁺ e H⁺ escono. Sindrome di Liddle: ENaC sempre aperto, con ipertensione e ipokaliemia."}, {"id": "romk", "g": "cd", "n": "ROMK", "full": "canale del potassio della midollare esterna", "where": "ansa ascendente spessa e dotto collettore, lato lume", "A": "lum", "B": "cell", "prot": "chan", "cls": "pas", "mode": "", "subs": [{"s": "K⁺", "cA": 20, "cB": 140, "lA": "20 mM", "lB": "140 mM", "dir": "BA", "up": false}], "why": "Il K⁺ esce dalla cellula (140 mM) verso il lume (circa 20 mM), aiutato dal lume negativo: canale, passivo.", "drug": "nessuno di uso comune.", "clin": "Nell'ansa ricicla il K⁺ che serve all'NKCC2; nel collettore è la via da cui si perde potassio. Sindrome di Bartter di tipo 2: ROMK che non funziona."}, {"id": "aqp2", "goal": "la cellula principale serve a <b>riassorbire Na⁺</b> (e acqua, se c'è l'ADH) e a <b>secernere K⁺</b>.", "g": "cd", "n": "AQP2", "full": "acquaporina 2", "where": "dotto collettore, cellula principale, lato lume", "A": "lum", "B": "cell", "prot": "chan", "cls": "pas", "mode": "", "subs": [{"s": "H₂O", "cA": 2, "cB": 1, "lA": "urina diluita", "lB": "interstizio concentrato", "dir": "AB", "up": false, "sh": "H₂O"}], "why": "L'acqua passa per un poro scendendo verso l'interstizio più concentrato: canale, passivo. L'ADH decide solo se il poro c'è (lo inserisce in membrana), non dà energia.", "drug": "vaptani (tolvaptan, che blocca i recettori V2); il litio le riduce (diabete insipido nefrogenico).", "clin": "Senza ADH il collettore è impermeabile all'acqua e l'urina esce diluita."}, {"id": "hatp", "goal": "la cellula α (intercalata di tipo A) serve a <b>secernere H⁺</b> nel lume perché venga escreto con l'urina, e a restituire HCO₃⁻ al sangue: toglie acido al corpo nell'acidosi.", "g": "cd", "n": "H⁺-ATPasi", "full": "pompa protonica", "where": "intercalata α, lato lume", "A": "lum", "B": "cell", "prot": "pump", "cls": "pri", "mode": "", "subs": [{"s": "H⁺", "cA": 31.6, "cB": 0.063, "lA": "pH 4,5", "lB": "pH 7,2", "dir": "BA", "up": true}], "why": "L'H⁺ esce verso un lume fino a 500 volte più acido (pH 4,5 contro 7,2): la salita è ripida e serve ATP, attivo primario. Il lume negativo aiuta, ma non basta.", "drug": "nessuno.", "clin": "Se non funziona: acidosi tubulare renale distale (tipo 1), con l'urina che non scende sotto pH 5,5."}, {"id": "hkatp", "goal": "la cellula α (intercalata di tipo A) serve a <b>secernere H⁺</b> nel lume perché venga escreto con l'urina, e a restituire HCO₃⁻ al sangue: toglie acido al corpo nell'acidosi.", "g": "cd", "n": "H⁺/K⁺-ATPasi", "full": "pompa idrogeno-potassio", "where": "intercalata α, lato lume", "A": "lum", "B": "cell", "prot": "pump", "cls": "pri", "mode": "", "subs": [{"s": "H⁺", "cA": 31.6, "cB": 0.063, "lA": "pH 4,5", "lB": "pH 7,2", "dir": "BA", "up": true}, {"s": "K⁺", "cA": 5, "cB": 140, "lA": "5 mM", "lB": "140 mM", "dir": "AB", "up": true}], "why": "H⁺ fuori e K⁺ dentro, tutti e due in salita, consumando ATP: attivo primario. È simile alla pompa protonica dello stomaco.", "drug": "gli inibitori di pompa (omeprazolo) bloccano la versione gastrica.", "clin": "Lavora di più quando il potassio è basso: recupera K⁺ e perde H⁺ (alcalosi)."}, {"id": "ae1", "seq": true, "clx": "same", "knob": {"kind": "hb", "rows": {"HCO₃⁻": "il sangue ne ha già tanto: non esce", "Cl⁻": ""}, "lab": "HCO₃⁻ nel plasma", "min": 10, "max": 40, "dv": 16, "ph0": 7.1, "ph1": -2.5, "neutral": true, "flux": "scambio dell'AE1", "ph": "pH dell'urina", "pl": "HCO₃⁻ nuovo al sangue", "plHi": "poco", "plDn": "tanto", "blT": "Che cosa succede nel sangue", "b1": "L'AE1 manda nel sangue HCO₃⁻ nuovo (ora al {p}%).", "b2": "Per ogni HCO₃⁻ restituito, un H⁺ va nell'urina: il bicarbonato del plasma sale.", "b3hi": "Con il bicarbonato del plasma già alto il gradiente verso il sangue sparisce: l'AE1 rallenta e la cellula α si spegne. È giusto: nell'alcalosi lavora la cellula β.", "b3dn": "Con il bicarbonato del plasma basso (acidosi) il gradiente è grande: l'AE1 lavora a pieno, l'urina si acidifica e il plasma recupera bicarbonato.", "co2": "Il Cl⁻ che entra con l'AE1 non si accumula: esce di nuovo verso il sangue dai canali del cloro (ClC-Kb). Il cloro gira in tondo, il bicarbonato esce.", "m": ["Alcalosi (HCO₃⁻ del plasma alto): l'HCO₃⁻ non riesce più a uscire verso il sangue, si accumula nella cellula e frena l'anidrasi carbonica. La cellula α smette di secernere H⁺: l'urina diventa meno acida.", "Valori intermedi: l'AE1 scambia a velocità media e la cellula α secerne H⁺ in modo moderato.", "Acidosi (HCO₃⁻ del plasma basso): l'HCO₃⁻ esce verso il sangue a pieno ritmo, l'anidrasi carbonica gira e la H⁺-ATPasi butta H⁺ nell'urina, che scende verso pH 5. Il plasma recupera bicarbonato nuovo: l'acidosi si corregge."]}, "caRun": "gira: H⁺ nell'urina, HCO₃⁻ al sangue con l'AE1", "ca": true, "goal": "la cellula α (intercalata di tipo A) serve a <b>secernere H⁺</b> nel lume perché venga escreto con l'urina, e a restituire HCO₃⁻ al sangue: toglie acido al corpo nell'acidosi.", "ghost": {"n": "H⁺-ATPasi", "i1": "H⁺", "i2": "", "far": "lum", "note": "HCO₃⁻ alto qui"}, "sec": "il trasportatore non usa ATP. Sfrutta la discesa dell'HCO₃⁻, che si accumula nella cellula perché la H⁺-ATPasi butta fuori l'H⁺ spendendo ATP e l'anidrasi carbonica produce nuovo bicarbonato. È energia di seconda mano.", "g": "cd", "n": "AE1", "full": "scambiatore anionico 1 (banda 3)", "where": "intercalata α, lato sangue", "A": "cell", "B": "blood", "prot": "carr", "cls": "sec", "mode": "anti", "subs": [{"s": "HCO₃⁻", "cA": 30, "cB": 24, "lA": "30 mM", "lB": "24 mM", "dir": "AB", "up": false, "sh": "HCO₃"}, {"s": "Cl⁻", "cA": 20, "cB": 105, "lA": "20 mM, −70 mV", "lB": "105 mM", "dir": "BA", "up": true}], "why": "L'HCO₃⁻, prodotto nella cellula dall'anidrasi carbonica, esce verso il sangue scendendo e paga l'ingresso del Cl⁻, che per la carica sale. Direzioni opposte: antiporto, attivo secondario.", "drug": "nessuno.", "clin": "Ogni H⁺ buttato nell'urina corrisponde a un HCO₃⁻ restituito al sangue. AE1 difettoso: acidosi tubulare distale. È la stessa proteina della banda 3 dei globuli rossi."}, {"id": "pen", "seq": "b", "clx": "ghost", "goal": "la cellula β (intercalata di tipo B) serve a <b>secernere HCO₃⁻</b> nel lume perché venga <b>escreto</b> con l'urina: toglie base al corpo nell'alcalosi. Ogni HCO₃⁻ secreto corrisponde a un H⁺ restituito al sangue.", "ca": true, "knob": {"kind": "cl", "ph0": 5.6, "ph1": 2.4, "pl": "HCO₃⁻ del plasma", "plHi": "resta alto", "plDn": "scende", "blT": "Che cosa succede nel sangue", "b1": "La H⁺-ATPasi manda nel sangue gli H⁺ prodotti dall'anidrasi (ora al {p}%).", "b2": "Ogni H⁺ incontra un HCO₃⁻ del plasma: H⁺ + HCO₃⁻ → CO₂ + H₂O, e il CO₂ si espira.", "b3hi": "Pochi H⁺ arrivano nel sangue: l'HCO₃⁻ del plasma non viene consumato e resta alto. Questa è l'alcalosi metabolica.", "b3dn": "Così l'HCO₃⁻ del plasma viene consumato e scende: l'alcalosi si corregge.", "co2": "Il CO₂ non è il problema: passa liberamente le membrane e lo regolano i polmoni. Nell'alcalosi il respiro rallenta un po' (la pCO₂ sale di circa 0,7 mmHg per ogni mmol/L di HCO₃⁻ in più): è la compensazione respiratoria, non la causa.", "lab": "Cl⁻ che arriva nel lume", "min": 2, "max": 120, "dv": 80, "flux": "scambio della pendrina", "ph": "pH dell'urina", "m": ["Poco Cl⁻ nel lume (vomito, diuretici, perdita di cloro): la pendrina si ferma e l'HCO₃⁻ si accumula nella cellula. L'eccesso di prodotto frena l'anidrasi carbonica, non si formano più H⁺ e la H⁺-ATPasi non manda più H⁺ nel sangue. Il bicarbonato in eccesso nel plasma non viene smaltito: l'alcalosi metabolica si mantiene.", "Con un po' di Cl⁻ la pendrina riparte: scambia Cl⁻ (dentro) con HCO₃⁻ (fuori). L'urina diventa più alcalina e il bicarbonato del sangue comincia a scendere.", "Somministrando cloro (soluzione fisiologica NaCl, o KCl se il potassio è basso) arriva Cl⁻ al lume: la pendrina scambia a pieno ritmo e l'anidrasi carbonica gira. Ogni HCO₃⁻ buttato nell'urina corrisponde a un H⁺ mandato nel sangue, che neutralizza un HCO₃⁻ del plasma: l'alcalosi si corregge. È l'alcalosi cloro-responsiva, con Cl⁻ urinario basso (< 20 mmol/L) all'inizio."]}, "ghost": {"n": "H⁺-ATPasi", "i1": "H⁺", "i2": "", "far": "blood", "note": "HCO₃⁻ alto qui"}, "sec": "il trasportatore non usa ATP. Sfrutta la discesa dell'HCO₃⁻, che si accumula nella cellula perché la H⁺-ATPasi butta fuori l'H⁺ spendendo ATP e l'anidrasi carbonica produce nuovo bicarbonato. È energia di seconda mano.", "g": "cd", "n": "pendrina", "full": "scambiatore Cl⁻/HCO₃⁻ apicale", "where": "intercalata β, lato lume", "A": "lum", "B": "cell", "prot": "carr", "cls": "sec", "mode": "anti", "subs": [{"s": "HCO₃⁻", "cA": 10, "cB": 30, "lA": "10 mM", "lB": "30 mM", "dir": "BA", "up": false, "sh": "HCO₃"}, {"s": "Cl⁻", "cA": 60, "cB": 20, "lA": "60 mM", "lB": "20 mM, −70 mV", "dir": "AB", "up": true}], "why": "È l'immagine speculare dell'AE1: l'HCO₃⁻ esce verso il lume scendendo e paga l'ingresso del Cl⁻. Antiporto, attivo secondario.", "drug": "nessuno.", "clin": "Serve nell'alcalosi. Il Cl⁻ che riprende accompagna il Na⁺ dell'ENaC, per questo angiotensina II e aldosterone la stimolano. Mutata nella sindrome di Pendred (sordità e gozzo)."}, {"id": "nak", "g": "all", "n": "Na⁺/K⁺-ATPasi", "full": "pompa sodio-potassio", "where": "tutti i tratti, lato sangue", "A": "cell", "B": "blood", "prot": "pump", "cls": "pri", "mode": "", "subs": [{"s": "3 Na⁺", "cA": 12, "cB": 140, "lA": "12 mM", "lB": "140 mM", "dir": "AB", "up": true, "sh": "Na⁺"}, {"s": "2 K⁺", "cA": 140, "cB": 4, "lA": "140 mM", "lB": "4 mM", "dir": "BA", "up": true, "sh": "K⁺"}], "why": "Porta 3 Na⁺ fuori e 2 K⁺ dentro, tutti e due in salita, consumando ATP: attivo primario. Crea i gradienti che fanno funzionare quasi tutti gli altri.", "drug": "digossina (la blocca, soprattutto nel cuore).", "clin": "L'aldosterone ne aumenta il numero nel collettore. Tiene il Na⁺ basso e il K⁺ alto dentro tutte le cellule."}, {"id": "co2", "g": "none", "n": "CO₂", "full": "anidride carbonica", "where": "tutte le cellule", "A": "cell", "B": "blood", "prot": "none", "cls": "pas", "mode": "", "subs": [{"s": "CO₂", "cA": 2, "cB": 1.4, "lA": "pCO₂ 50", "lB": "pCO₂ 46", "dir": "AB", "up": false}], "why": "Il CO₂ è piccolo e liposolubile: attraversa da solo il doppio strato lipidico, scendendo lungo il suo gradiente. Nessuna proteina: diffusione semplice, passivo.", "drug": "—", "clin": "Così passano anche O₂ e le sostanze liposolubili. Nel prossimale il CO₂ entra nella cellula e l'anidrasi carbonica lo trasforma in H⁺ e HCO₃⁻."}]},U=D.ui,T=D.tr,SEL=T[0].id,MODE='ex';

  $('#qt').textContent=U.qn.replace('{i}',QI+1).replace('{n}',QO.length)+': '+t.n+' · '+t.where;$('#sc').textContent=U.score.replace('{s}',SC).replace('{n}',SN);
  $('#qdg').innerHTML=draw(t,true);$('#q1').textContent=U.q1;$('#q2').textContent=U.q2;
  $('#a1').innerHTML=['none','chan','carr','pump'].map(function(k){return '<button type="button" data-k="'+k+'">'+U.prot[k]+'</button>';}).join('');
  $('#a2').innerHTML=['pas','pri','sec'].map(function(k){return '<button type="button" data-k="'+k+'">'+U.cls[k]+'</button>';}).join('');
  $('#qfb').innerHTML='';$('#nx').hidden=true;}
function check(){if(A1===null||A2===null)return;var t=QO[QI],ok1=A1===t.prot,ok2=A2===t.cls;SN++;if(ok1&&ok2)SC++;
  [['#a1',t.prot],['#a2',t.cls]].forEach(function(p){[].forEach.call($(p[0]).querySelectorAll('button'),function(b){b.disabled=true;var k=b.getAttribute('data-k');if(k===p[1])b.classList.add('ok');else if(b.classList.contains('sel'))b.classList.add('no');});});
  $('#qfb').innerHTML='<p class="fb '+(ok1&&ok2?'ok':'no')+'"><b>'+(ok1&&ok2?U.right:U.wrong)+'</b> '+t.why+(t.cls==='sec'?'<br><b>'+U.sec+'</b> '+(t.sec||U.secNa):'')+'</p>';
  $('#qdg').innerHTML=draw(t,false);ruleOn(t.cls);$('#sc').textContent=U.score.replace('{s}',SC).replace('{n}',SN);
  $('#nx').hidden=false;$('#nx').textContent=QI<QO.length-1?U.next:U.again;}
['#a1','#a2'].forEach(function(id,i){$(id).addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;
  [].forEach.call($(id).querySelectorAll('button'),function(x){x.classList.remove('sel');x.style.outline='';});b.classList.add('sel');b.style.outline='2px solid #1456A8';
  if(i===0)A1=b.getAttribute('data-k');else A2=b.getAttribute('data-k');check();});});
$('#nx').addEventListener('click',function(){if(QI<QO.length-1){QI++;renderQ();}else newQuiz();});

function setMode(m){MODE=m;$('#ex').hidden=m!=='ex';$('#qz').hidden=m!=='qz';$('#t1').classList.toggle('act',m==='ex');$('#t2').classList.toggle('act',m==='qz');if(m==='qz')newQuiz();else renderEx();}
$('#t1').addEventListener('click',function(){setMode('ex');});$('#t2').addEventListener('click',function(){setMode('qz');});
$('#ttl').textContent=U.title;$('#story').innerHTML=U.story;$('#rp').innerHTML=U.rp;$('#rr').innerHTML=U.rr;$('#rs').innerHTML=U.rs;$('#rq').innerHTML=U.rq;
$('#t1').textContent=U.t1;$('#t2').textContent=U.t2;
setMode('ex');
</script>
</body>
</html>
