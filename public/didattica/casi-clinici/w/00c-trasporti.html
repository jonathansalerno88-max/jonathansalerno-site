si", "full": "pompa idrogeno-potassio", "where": "intercalata α, lato lume", "A": "cell", "B": "lum", "prot": "pump", "cls": "pri", "mode": "", "subs": [{"s": "H⁺", "cA": 0.063, "cB": 31.6, "lA": "pH 7,2", "lB": "pH 4,5", "dir": "AB", "up": true}, {"s": "K⁺", "cA": 140, "cB": 5, "lA": "140 mM", "lB": "5 mM", "dir": "BA", "up": true}], "why": "H⁺ fuori e K⁺ dentro, tutti e due in salita, consumando ATP: attivo primario. È simile alla pompa protonica dello stomaco.", "drug": "gli inibitori di pompa (omeprazolo) bloccano la versione gastrica.", "clin": "Lavora di più quando il potassio è basso: recupera K⁺ e perde H⁺ (alcalosi)."}, {"id": "ae1", "ghost": {"n": "H⁺-ATPasi", "i1": "H⁺", "i2": "", "far": "lum", "note": "HCO₃⁻ alto qui"}, "sec": "il trasportatore non usa ATP. Sfrutta la discesa dell'HCO₃⁻, che si accumula nella cellula perché la H⁺-ATPasi butta fuori l'H⁺ spendendo ATP e l'anidrasi carbonica produce nuovo bicarbonato. È energia di seconda mano.", "g": "cd", "n": "AE1", "full": "scambiatore anionico 1 (banda 3)", "where": "intercalata α, lato sangue", "A": "cell", "B": "blood", "prot": "carr", "cls": "sec", "mode": "anti", "subs": [{"s": "HCO₃⁻", "cA": 30, "cB": 24, "lA": "30 mM", "lB": "24 mM", "dir": "AB", "up": false, "sh": "HCO₃"}, {"s": "Cl⁻", "cA": 20, "cB": 105, "lA": "20 mM, −70 mV", "lB": "105 mM", "dir": "BA", "up": true}], "why": "L'HCO₃⁻, prodotto nella cellula dall'anidrasi carbonica, esce verso il sangue scendendo e paga l'ingresso del Cl⁻, che per la carica sale. Direzioni opposte: antiporto, attivo secondario.", "drug": "nessuno.", "clin": "Ogni H⁺ buttato nell'urina corrisponde a un HCO₃⁻ restituito al sangue. AE1 difettoso: acidosi tubulare distale. È la stessa proteina della banda 3 dei globuli rossi."}, {"id": "pen", "ghost": {"n": "H⁺-ATPasi", "i1": "H⁺", "i2": "", "far": "blood", "note": "HCO₃⁻ alto qui"}, "sec": "il trasportatore non usa ATP. Sfrutta la discesa dell'HCO₃⁻, che si accumula nella cellula perché la H⁺-ATPasi butta fuori function draw(t,blind){var o='',W=640,M0=280,M1=360,n=t.subs.length,H=Math.max(230,96+n*72);
  o+='<rect x="0" y="0" width="'+M0+'" height="'+H+'" fill="'+(t.A==='lum'?'#FFF6CF':t.A==='cell'?'#F3ECFA':'#FBE3E3')+'"/>';
  o+='<rect x="'+M1+'" y="0" width="'+(W-M1)+'" height="'+H+'" fill="'+(t.B==='lum'?'#FFF6CF':t.B==='cell'?'#F3ECFA':'#FBE3E3')+'"/>';
  o+=tx(12,22,U.side[t.A],'start',{s:13,w:700,c:'#55697A'})+tx(W-12,22,U.side[t.B],'end',{s:13,w:700,c:'#55697A'});
  // lipid bilayer
  for(var yy=0;yy<H;yy+=12){o+='<circle cx="'+(M0+8)+'" cy="'+(yy+6)+'" r="5" fill="#E8C76A"/><circle cx="'+(M1-8)+'" cy="'+(yy+6)+'" r="5" fill="#E8C76A"/>';}
  o+='<rect x="'+(M0+13)+'" y="0" width="'+(M1-M0-26)+'" height="'+H+'" fill="#FBF3D6"/>';
  // the protein
  var cy0=46,cy1=H-20,pc='#7A8B99';
  if(blind){o+='<rect x="'+(M0-6)+'" y="'+cy0+'" width="'+(M1-M0+12)+'" height="'+(cy1-cy0)+'" rx="14" fill="#E3E8EC" stroke="#8696A4" stroke-width="2" stroke-dasharray="6 4"/>'+tx((M0+M1)/2,(cy0+cy1)/2+10,'?','middle',{s:30,w:700,c:'#8696A4'});}
  else if(t.prot==='chan'){o+='<rect x="'+(M0+4)+'" y="'+cy0+'" width="22" height="'+(cy1-cy0)+'" rx="9" fill="#9DB8DE" stroke="#1F5FA8" stroke-width="1.6"/><rect x="'+(M1-26)+'" y="'+cy0+'" width="22" height="'+(cy1-cy0)+'" rx="9" fill="#9DB8DE" stroke="#1F5FA8" stroke-width="1.6"/>';pc='#1F5FA8';}
  else if(t.prot==='carr'||t.prot==='pump'){var f=t.prot==='pump'?'#F6C7A8':'#D9C2EE',s=t.prot==='pump'?'#C2571A':'#6A3A96';pc=s;
    o+='<rect x="'+(M0-6)+'" y="'+cy0+'" width="'+(M1-M0+12)+'" height="'+(cy1-cy0)+'" rx="26" fill="'+f+'" stroke="'+s+'" stroke-width="2"/>';
    if(t.prot==='pump')o+='<rect x="'+((M0+M1)/2-32)+'" y="'+(cy1-34)+'" width="64" height="22" rx="11" fill="#C2571A"/>'+tx((M0+M1)/2,cy1-19,'ATP → ADP','middle',{s:11,w:700,c:'#FFFFFF'});
    if(n>1)o+='<path d="M'+(M0+20)+' '+(cy0+18)+' L'+(M0+20)+' '+(cy1-18)+'" stroke="'+s+'" stroke-width="2" stroke-dasharray="3 3"/>'+tx(M0+26,(cy0+cy1)/2+4,U.coupled,'start',{s:10,w:700,c:s});}
  if(!blind)o+=tx((M0+M1)/2,H-4,U.prot[t.prot],'middle',{s:11,w:700,c:pc});
  // each substance: concentration bars on the two sides, an arrow that goes down (green) or up (red)
  t.subs.forEach(function(q,i){var y=78+i*72,lA=Math.log(q.cA*10+1)/Math.log(10),lB=Math.log(q.cB*10+1)/Math.log(10),mx=Math.max(lA,lB,1),hA=6+36*lA/mx,hB=6+36*lB/mx;
    var col=blind?'#55697A':(q.up?'#C0392B':'#2E7D32');
    o+='<rect x="70" y="'+(y+20-hA)+'" width="26" height="'+hA+'" rx="3" fill="#9AA5AE" opacity=".55"/>'+tx(83,y+34,q.lA,'middle',{s:10.5,w:700,c:'#55697A'});
    o+='<rect x="'+(W-96)+'" y="'+(y+20-hB)+'" width="26" height="'+hB+'" rx="3" fill="#9AA5AE" opacity=".55"/>'+tx(W-83,y+34,q.lB,'middle',{s:10.5,w:700,c:'#55697A'});
    var ab=q.dir==='AB',x1=ab?120:W-120,x2=ab?W-120:120,dd=ab?1:-1;
    o+='<line x1="'+x1+'" y1="'+y+'" x2="'+(x2-dd*10)+'" y2="'+y+'" stroke="'+col+'" stroke-width="3"/><path d="M'+x2+' '+y+' l'+(-dd*12)+' -7 v14Z" fill="'+col+'"/>';
    o+='<g class="mv" style="--d:'+(dd*(W-260))+'px;animation-delay:'+(i*0.5)+'s"><circle cx="'+(ab?130:W-130)+'" cy="'+y+'" r="13" fill="#FFFFFF" stroke="'+col+'" stroke-width="2"/>'+tx(ab?130:W-130,y+4,q.sh||q.s,'middle',{s:q.s.length>3?8.5:10.5,w:700,c:col})+'</g>';
    o+=tx(ab?150:W-150,y-12,q.s+(blind?'':' · '+(q.up?U.up:U.down)),ab?'start':'end',{s:11.5,w:700,c:col});});
  // secondary active: draw, dashed, the pump that really paid, on the other membrane of the same cell
  if(!blind&&t.cls==='sec'){var g=t.ghost||U.ghostNa,right=t.B==='cell',X=220,gc='#C2571A',cf='#F3ECFA',ff=g.far==='lum'?'#FFF6CF':'#FBE3E3',G='';
    var mem=function(x){var r='';for(var yy=0;yy<H;yy+=12)r+='<circle cx="'+(x+8)+'" cy="'+(yy+6)+'" r="5" fill="#E8C76A" opacity=".7"/><circle cx="'+(x+72)+'" cy="'+(yy+6)+'" r="5" fill="#E8C76A" opacity=".7"/>';return r+'<rect x="'+(x+13)+'" y="0" width="54" height="'+H+'" fill="#FBF3D6" opacity=".7"/>';};
    var ar=function(x1,x2,yy,lab){var d=x2>x1?1:-1;return '<line x1="'+x1+'" y1="'+yy+'" x2="'+(x2-d*10)+'" y2="'+yy+'" stroke="'+gc+'" stroke-width="2.4" stroke-dasharray="6 4"/><path d="M'+x2+' '+yy+' l'+(-d*11)+' -6 v12Z" fill="'+gc+'"/>'+tx((x1+x2)/2,yy-8,lab,'middle',{s:10.5,w:700,c:gc});};
    var mid=H/2,lp=function(x,yy,t,fill,c){var w=t.length*6.4+14;return '<rect x="'+f1(x-w/2)+'" y="'+(yy-12)+'" width="'+f1(w)+'" height="17" rx="8.5" fill="'+fill+'"/>'+tx(x,yy+1,t,'middle',{s:10.5,w:700,c:c});};
    if(right){G+='<rect x="640" y="0" width="60" height="'+H+'" fill="'+cf+'"/>'+mem(700)+'<rect x="780" y="0" width="80" height="'+H+'" fill="'+ff+'"/>';
      G+='<rect x="694" y="'+(mid-58)+'" width="92" height="116" rx="22" fill="#FFFFFF" fill-opacity=".6" stroke="'+gc+'" stroke-width="2" stroke-dasharray="6 4"/>';
      G+=ar(650,850,mid-30,g.i1)+(g.i2?ar(850,650,mid+30,g.i2):'')+tx(740,mid+4,'ATP','middle',{s:12,w:700,c:gc});
      G+=tx(848,22,U.side[g.far],'end',{s:12,w:700,c:'#55697A'})+lp(740,mid-68,g.n,gc,'#FFFFFF')+lp(740,mid+76,U.ghostLab,'#FFFFFF',gc)+tx(670,H-10,g.note,'middle',{s:9.5,w:700,c:'#6A3A96'});
      o+=G;}
    else{G+='<rect x="0" y="0" width="80" height="'+H+'" fill="'+ff+'"/>'+mem(80)+'<rect x="160" y="0" width="60" height="'+H+'" fill="'+cf+'"/>';
      G+='<rect x="74" y="'+(mid-58)+'" width="92" height="116" rx="22" fill="#FFFFFF" fill-opacity=".6" stroke="'+gc+'" stroke-width="2" stroke-dasharray="6 4"/>';
      G+=ar(210,10,mid-30,g.i1)+(g.i2?ar(10,210,mid+30,g.i2):'')+tx(120,mid+4,'ATP','middle',{s:12,w:700,c:gc});
      G+=tx(12,22,U.side[g.far],'start',{s:12,w:700,c:'#55697A'})+lp(120,mid-68,g.n,gc,'#FFFFFF')+lp(120,mid+76,U.ghostLab,'#FFFFFF',gc)+tx(214,H-10,g.note,'end',{s:9.5,w:700,c:'#6A3A96'});
      o=G+'<g transform="translate('+X+' 0)">'+o+'</g>';}
    return '<svg viewBox="0 0 860 '+H+'" role="img" aria-label="'+t.n+'">'+o+'</svg>';}
  return '<svg viewBox="0 0 640 '+H+'" role="img" aria-label="'+t.n+'">'+o+'</svg>';}

function ruleOn(c){['rp','rr','rs'].forEach(function(id,i){$('#'+id).classList.toggle('on',c===['pas','pri','sec'][i]);});}
function info(t){var c=CLS[t.cls];
  return '<p><span class="badge '+c[0]+'">'+U.cls[t.cls]+(t.mode?' · '+U.mode[t.mode]:'')+'</span><span class="badge b-ty">'+U.prot[t.prot]+'</span></p><p><b>'+t.n+'</b> ('+t.full+') · '+t.where+'</p>'+
    '<p><b>'+U.why+'</b> '+t.why+'</p>'+(t.cls==='sec'?'<p class="sec2"><b>'+U.sec+'</b> '+(t.sec||U.secNa)+'</p>':'')+'<p><b>'+U.drug+'</b> '+t.drug+'</p><p style="grid-column:1/-1"><b>'+U.clin+'</b> '+t.clin+'</p>';}
function renderEx(){var t=byId(SEL);
  $('#pick').innerHTML=D.groups.map(function(g){return '<div class="grp"><span class="lab">'+g.n+'</span><div class="chips">'+T.filter(function(x){return x.g===g.k;}).map(function(x){return '<button type="button" data-id="'+x.id+'"'+(x.id===SEL?' class="act"':'')+'>'+x.n+'</button>';}).join('')+'</div></div>';}).join('');
  $('#dg').innerHTML=draw(t,false);$('#info').innerHTML=info(t);ruleOn(t.cls);}
$('#pick').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;SEL=b.getAttribute('data-id');renderEx();});

// quiz
var QO=[],QI=0,SC=0,SN=0,A1=null,A2=null;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),k=a[i];a[i]=a[j];a[j]=k;}return a;}
function newQuiz(){QO=shuffle(T.slice());QI=0;SC=0;SN=0;renderQ();}
function renderQ(){var t=QO[QI];A1=null;A2=null;ruleOn('');
  $('#qt').textContent=U.qn.replace('{i}',QI+1).replace('{n}',QO.length)+': '+t.n+' · '+t.where;$('#sc').textContent=U.score.replace('{s}',SC).replace('{n}',SN);
  $('#qdg').innerHTML=draw(t,true);$('#q1').textContent=U.q1;$('#q2').textContent=U.q2;
  $('#a1').innerHTML=['none','chan','carr','pump'].map(function(k){return '<button type="button" data-k="'+k+'">'+U.prot[k]+'</button>';}).join('');
  $('#a2').innerHTML=['pas','pri','sec'].map(function(k){return '<button type="button" data-k="'+k+'">'+U.cls[k]+'</button>';}).join('');
  $('#qfb').innerHTML='';$('#nx').hidden=true;}
function check(){if(A1===null||A2===null)return;var t=QO[QI],ok1=A1===t.prot,ok2=A2===t.cls;SN++;if(ok1&&ok2)SC++;
  [['#a1',t.prot],['#a2',t.cls]].forEach(function(p){[].forEach.call($(p[0]).querySelectorAll('button'),function(b){b.disabled=true;var k=b.getAttribute('data-k');if(k===p[1])b.classList.add('ok');else if(b.classList.contains('sel'))b.classList.add('no');});});
  $('#qfb').innerHTML='<p class="fb '+(ok1&&ok2?'ok':'no')+'"><b>'+(ok1&&ok2?U.right:U.wrong)+'</b> '+t.why+(t.cls==='sec'?'<br><b>'+U.sec+'</b> '+(t.sec||U.secNa):'')+'</p>';
  $('#qdg').innerHTML=draw(t,false);ruleOn(t.cls);$('#sc').textContent=U.score.replace('{s}',SC).replace('{n}',SN);
  $('#nx').hidden=false;$('#nx').textContent=QI<QO.length-1?U.next:U.again;}
['#a1','#a2'].forEach(function(id,i){$(id).addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;
  [].forEach.call($(id).querySelectorAll('button'),function(x){x.classList.remove('sel');x.style.outline='';});b.classList.add('sel');b.style.outline='2px solid #1456A8';
  if(i===0)A1=b.getAttribute('data-k');else A2=b.getAttribute('data-k');check();});});
$('#nx').addEventListener('click',function(){if(QI<QO.length-1){QI++;renderQ();}else newQuiz();});

function setMode(m){MODE=m;$('#ex').hidden=m!=='ex';$('#qz').hidden=m!=='qz';$('#t1').classList.toggle('act',m==='ex');$('#t2').classList.toggle('act',m==='qz');if(m==='qz')newQuiz();else renderEx();}
$('#t1').addEventListener('click',function(){setMode('ex');});$('#t2').addEventListener('click',function(){setMode('qz');});
$('#ttl').textContent=U.title;$('#story').innerHTML=U.story;$('#rp').innerHTML=U.rp;$('#rr').innerHTML=U.rr;$('#rs').innerHTML=U.rs;$('#rq').innerHTML=U.rq;
$('#t1').textContent=U.t1;$('#t2').textContent=U.t2;
setMode('ex');
</script>
</body>
</html>
