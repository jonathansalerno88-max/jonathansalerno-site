:root{
  --paper:#FBFCFD; --ink:#16222E; --mut:#55697A; --faint:#8696A4;
  --rule:#DDE4EA; --surface:#FFFFFF; --surface2:#EFF3F6;
  --link:#1456A8; --good:#1F6B4A; --warn:#8A5A11; --flag:#B3261E;
  --goodbg:#E8F3ED; --warnbg:#FBF1DF; --flagbg:#FBEAE8;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E151B; --ink:#E2E9EF; --mut:#9BAAB7; --faint:#6C7D8C;
  --rule:#27343F; --surface:#17212B; --surface2:#1E2A35;
  --link:#6FA8EA; --good:#4FB286; --warn:#E0A33F; --flag:#E97567;
  --goodbg:#16302A; --warnbg:#332814; --flagbg:#36201E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E151B; --ink:#E2E9EF; --mut:#9BAAB7; --faint:#6C7D8C;
  --rule:#27343F; --surface:#17212B; --surface2:#1E2A35;
  --link:#6FA8EA; --good:#4FB286; --warn:#E0A33F; --flag:#E97567;
  --goodbg:#16302A; --warnbg:#332814; --flagbg:#36201E; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased}
.page{max-width:42rem; margin:0 auto; padding:clamp(2rem,6vw,4rem) 16px clamp(3rem,7vw,5rem)}

a{color:var(--link); text-decoration:none; border-bottom:1px solid color-mix(in srgb,var(--link) 30%,transparent)}
a:hover{border-bottom-color:var(--link)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--link); outline-offset:2px; border-radius:3px}

.masthead{display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap}
.back{font-size:.8125rem; color:var(--mut); border:0}
.back:hover{color:var(--link)}
h1{font-family:var(--serif); font-weight:500; font-size:clamp(1.9rem,5vw,2.6rem);
  line-height:1.1; letter-spacing:-.018em; margin:.9rem 0 .55rem}
.standfirst{color:var(--mut); margin:0; max-width:34rem; font-size:1rem}

#lang{font-family:var(--sans); font-size:12.5px; padding:5px 9px; border-radius:7px;
  border:1px solid var(--rule); background:var(--surface); color:var(--ink); cursor:pointer}

.calc{margin-top:clamp(2.2rem,5.5vw,3.2rem); border-top:1px solid var(--rule); padding-top:1.4rem}
.calc h2{font-family:var(--serif); font-weight:500; font-size:1.375rem;
  margin:0 0 .3rem; letter-spacing:-.008em}
.calc .intro{margin:0 0 1.1rem; color:var(--mut); font-size:.9375rem; max-width:33rem}

.fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr)); gap:.75rem}
.f label{display:block; font-size:.75rem; color:var(--faint); margin-bottom:.25rem;
  font-family:var(--mono); letter-spacing:.01em}
.f input,.f select{width:100%; min-width:0; font-family:var(--mono); font-size:15px;
  padding:7px 9px; border:1px solid var(--rule); border-radius:6px;
  background:var(--surface); color:var(--ink)}
.f input{text-align:right}

.result{margin-top:1.1rem; display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap}
.result .n{font-family:var(--mono); font-size:2rem; font-variant-numeric:tabular-nums;
  letter-spacing:-.025em; line-height:1}
.result .u{font-size:.875rem; color:var(--mut)}
.badge{font-size:.75rem; font-weight:600; padding:3px 9px; border-radius:999px}
.b-good{background:var(--goodbg); color:var(--good)}
.b-warn{background:var(--warnbg); color:var(--warn)}
.b-flag{background:var(--flagbg); color:var(--flag)}
.b-none{background:var(--surface2); color:var(--faint)}

.formula{margin:.7rem 0 0; font-family:var(--mono); font-size:.8125rem; color:var(--mut);
  background:var(--surface2); padding:7px 10px; border-radius:6px; overflow-x:auto}

table{width:100%; border-collapse:collapse; margin-top:1rem; font-size:.875rem}
th{text-align:left; font-weight:600; font-size:.6875rem; color:var(--faint);
  font-family:var(--mono); letter-spacing:.03em; padding:0 .6rem .4rem 0;
  border-bottom:1px solid var(--rule)}
th:last-child,td:last-child{text-align:right}
td{padding:.42rem .6rem .42rem 0; border-bottom:1px solid var(--rule); color:var(--mut); vertical-align:top}
td:first-child{font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
tr.on td{color:var(--ink); font-weight:500}
tr.on td:first-child{position:relative}
tr.on td:first-child::before{content:"\25B8"; position:absolute; left:-.75rem; color:var(--link)}

.note{margin:.95rem 0 0; font-size:.875rem; color:var(--mut); max-width:33rem}
.note b{color:var(--ink); font-weight:600}
.src{margin:.7rem 0 0; font-size:.8125rem; color:var(--faint)}
.src a{color:var(--faint); border-bottom-color:color-mix(in srgb,var(--faint) 40%,transparent)}
.src a:hover{color:var(--link); border-bottom-color:var(--link)}

.disclaimer{margin-top:clamp(2.4rem,6vw,3.4rem); padding:.95rem 1.1rem; border-radius:8px;
  background:var(--surface2); color:var(--mut); font-size:.875rem}
.disclaimer p{margin:0}
footer{margin-top:2rem; padding-top:1rem; border-top:1px solid var(--rule);
  color:var(--faint); font-size:.8125rem}
footer p{margin:0}
</style>
</head>

 pyN1:'<b>O erro habitual.</b> O primeiro termo são os cigarros por dia a dividir por vinte, não os maços por dia. Introduzir 20 no campo dos maços dá uma exposição vinte vezes superior à real. Note-se ainda que o limiar de rastreio é de <b>20</b> pack-years e não de 30: a USPSTF baixou-o em 2021 e o material mais antigo ainda indica o valor anterior.',
 pyS:'Fontes: USPSTF, recomendação sobre o rastreio do cancro do pulmão (2021); relatório GOLD.',

 alUnit:'g de etanol / semana', alUnits:'unidades',

 alBand:['Menos de 140 g/sem.','140–280 g/sem.','Mais de 280 g/sem.'],
 std:['OMS — 10 g','Itália, ISS — 12 g','Reino Unido — 8 g','Estados Unidos — 14 g'],

 alN1:'<b>Porque importa.</b> A mesma semana de consumo é comunicada como um número diferente de unidades consoante a definição nacional adotada. Ler um trabalho britânico e compará-lo com dados portugueses sem passar pelos gramas é comparar duas coisas diferentes. Os gramas de etanol viajam, as unidades não.',
 alS2:'Fontes: ' + a(IARC_URL,'IARC Monographs vol. 100E') + ' (álcool, cancerígeno do Grupo 1); ' + a(ISS_URL,'ISS Itália') + '; orientações do Governo britânico.',
 paH:'Atividade física semanal',
 paI:'A meta da OMS é expressa em minutos equivalentes de intensidade moderada, em que a atividade vigorosa conta a dobrar.',
 paM:'moderada min/sem.', paV:'vigorosa min/sem.', paU:'min equivalentes/sem.',
 paF:'equivalentes = moderada + 2 × vigorosa = ',
 paBand:['Abaixo da meta da OMS','Dentro da meta da OMS','Acima da meta — benefício adicional'],
 paN1:'<b>Como avaliar a intensidade.</b> O talk test é a regra prática: durante a atividade moderada consegue-se falar mas não cantar; durante a vigorosa não se conseguem dizer mais do que poucas palavras sem parar para respirar.',
 paS:'Fonte: OMS, diretrizes sobre atividade física e comportamento sedentário (2020).',

 foot:'Jonathan Salerno — Florença'
}};

/* numeric bands: max selects the band, a/b are the figures shown */
var BMI_BANDS = [
  {max:18.5, t:'lt', b:18.5, d:1, tone:'warn'},
  {max:25,   t:'r',  a:18.5, b:24.9, d:1, tone:'good'},
  {max:30,   t:'r',  a:25,   b:29.9, d:1, tone:'warn'},
  {max:35,   t:'r',  a:30,   b:34.9, d:1, tone:'flag'},
  {max:40,   t:'r',  a:35,   b:39.9, d:1, tone:'flag'},
  {max:Infinity, t:'ge', a:40, d:1, tone:'flag'}
];
var PY_BANDS = [
  {max:10, t:'lt', b:10, d:0, tone:'good'},
  {max:20, t:'r',  a:10, b:19, d:0, tone:'warn'},
  {max:Infinity, t:'ge', a:20, d:0, tone:'flag'}
];
var PA_BANDS = [
  {max:150, t:'lt', b:150, d:0, tone:'warn'},
  {max:300, t:'r',  a:150, b:300, d:0, tone:'good'},
  {max:Infinity, t:'gt', a:300, d:0, tone:'good'}
];
var AL_BANDS = [{max:140, tone:'good'},{max:280, tone:'warn'},{max:Infinity, tone:'flag'}];
var STD_G   = [10, 12, 8, 14];
var DRINK_P = [[330,5],[125,12],[125,11],[40,40],[null,null]];

var L = 'en';
function t(k){ return T[L][k]; }
function num(id){ var v = parseFloat(document.getElementById(id).value); return isFinite(v) && v >= 0 ? v : null; }
function fmt(x,d){ return x.toLocaleString(T[L].loc, {minimumFractionDigits:d, maximumFractionDigits:d}); }
function range(b){
  if (b.t === 'lt') return '< ' + fmt(b.b, b.d);
  if (b.t === 'ge') return '≥ ' + fmt(b.a, b.d);
  if (b.t === 'gt') return '> ' + fmt(b.a, b.d);
  return fmt(b.a, b.d) + ' – ' + fmt(b.b, b.d);
}
function band(v, bands){ for (var i=0;i<bands.length;i++) if (v < bands[i].max) return bands[i]; return bands[bands.length-1]; }
function setBadge(el, tone, text){ el.className = 'badge ' + (tone ? 'b-'+tone : 'b-none'); el.textContent = text; }
function rows(tb, list, active, colA, colB){
  tb.innerHTML = '';
  list.forEach(function(b,i){
    var tr = document.createElement('tr');
    if (b === active) tr.className = 'on';
    var x = document.createElement('td'); x.textContent = colA(b,i);
    var y = document.createElement('td'); y.textContent = colB(b,i);
    tr.appendChild(x); tr.appendChild(y); tb.appendChild(tr);
  });
}

function bmi(){
  var w = num('bmiW'), h = num('bmiHt');
  var v = (w && h) ? w / Math.pow(h/100, 2) : null;
  var b = v ? band(v, BMI_BANDS) : null;
  document.getElementById('bmiN').textContent = v ? fmt(v,1) : '—';
  setBadge(document.getElementById('bmiB'), b && b.tone, b ? t('bmiCat')[BMI_BANDS.indexOf(b)] : '—');
  rows(document.getElementById('bmiT'), BMI_BANDS, b, range, function(x,i){ return t('bmiCat')[i]; });
}
function py(){
  var c = num('pyC'), y = num('pyY');
  var v = (c !== null && y !== null) ? (c/20)*y : null;
  var b = (v !== null) ? band(v, PY_BANDS) : null;
  document.getElementById('pyF').textContent = t('pyWord') + ' = (' + (c !== null ? c : '?')
    + ' / 20) × ' + (y !== null ? y : '?') + (v !== null ? ' = ' + fmt(v,1) : '');
  document.getElementById('pyN').textContent = v !== null ? fmt(v,1) : '—';
  setBadge(document.getElementById('pyB'), b && b.tone, b ? t('pyBand')[PY_BANDS.indexOf(b)] : '—');
  rows(document.getElementById('pyT'), PY_BANDS, b, range, function(x,i){ return t('pyBand')[i]; });
}
function al(){
  var si = document.getElementById('alS').selectedIndex; if (si < 0) si = 0;
  var g1 = STD_G[si];
  var v = num('alV'), ab = num('alA'), q = num('alQ');
  var g = (v !== null && ab !== null && q !== null) ? q * v * (ab/100) * 0.8 : null;
  var b = (g !== null) ? band(g, AL_BANDS) : null;
  document.getElementById('alN').textContent = g !== null ? fmt(g,0) : '—';
  document.getElementById('alNU').textContent = t('alUnit');
  setBadge(document.getElementById('alB'), b && b.tone, b ? t('alBand')[AL_BANDS.indexOf(b)] : '—');
  document.getElementById('alSub').innerHTML = g === null ? '' :
    t('alSub').replace('{u}', fmt(g/g1,1)).replace('{k}', fmt(g*7,0));
  rows(document.getElementById('alT'), STD_G, STD_G[si],
    function(x,i){ return t('std')[i]; },
    function(x){ return g === null ? '—' : fmt(g/x,1) + ' ' + t('alUnits'); });
  var tb = document.getElementById('alT');
  Array.prototype.forEach.call(tb.children, function(tr,i){ tr.className = (i === si) ? 'on' : ''; });
}
function pa(){
  var m = num('paM'), vg = num('paV');
  var v = (m !== null && vg !== null) ? m + 2*vg : null;
  var b = (v !== null) ? band(v, PA_BANDS) : null;
  document.getElementById('paF').textContent = t('paF') + (m !== null ? m : '?')
    + ' + 2 × ' + (vg !== null ? vg : '?') + (v !== null ? ' = ' + fmt(v,0) : '');
  document.getElementById('paN').textContent = v !== null ? fmt(v,0) : '—';
  setBadge(document.getElementById('paB'), b && b.tone, b ? t('paBand')[PA_BANDS.indexOf(b)] : '—');
  rows(document.getElementById('paT'), PA_BANDS, b, range, function(x,i){ return t('paBand')[i]; });
}
function all(){ bmi(); py(); al(); pa(); }

function fillSelects(){
  var s = document.getElementById('alS'), si = s.selectedIndex < 0 ? 0 : s.selectedIndex;
  s.innerHTML = '';
  t('std').forEach(function(label,i){
    var o = document.createElement('option'); o.value = String(i); o.textContent = label; s.appendChild(o);
  });
  s.selectedIndex = si;
  var d = document.getElementById('alD'), di = d.selectedIndex < 0 ? 0 : d.selectedIndex;
  d.innerHTML = '';
  t('drink').forEach(function(label,i){
    var o = document.createElement('option'); o.value = String(i); o.textContent = label; d.appendChild(o);
  });
  d.selectedIndex = di;
}
function render(){
  document.documentElement.lang = (L === 'pt') ? 'pt-PT' : L;
  document.title = t('title');
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function(el){
    var v = T[L][el.getAttribute('data-t')];
    if (typeof v !== 'string') return;
    if (v.indexOf('<') >= 0) el.innerHTML = v; else el.textContent = v;
  });
  document.getElementById('lang').value = L;
  fillSelects();
  all();
}
function setLang(l){
  L = T[l] ? l : 'en';
  try { localStorage.setItem('ct-lang', L); } catch(e) {}
  render();
}

document.getElementById('lang').addEventListener('change', function(){ setLang(this.value); });
document.getElementById('alD').addEventListener('change', function(){
  var p = DRINK_P[this.selectedIndex];
  if (p && p[0] !== null){
    document.getElementById('alV').value = p[0];
    document.getElementById('alA').value = p[1];
  }
  al();
});
['bmiW','bmiHt'].forEach(function(id){ document.getElementById(id).addEventListener('input', bmi); });
['pyC','pyY'].forEach(function(id){ document.getElementById(id).addEventListener('input', py); });
['alV','alA','alQ'].forEach(function(id){ document.getElementById(id).addEventListener('input', al); });
document.getElementById('alS').addEventListener('change', al);
['paM','paV'].forEach(function(id){ document.getElementById(id).addEventListener('input', pa); });

var saved = null;
try { saved = localStorage.getItem('ct-lang'); } catch(e) {}
if (!saved){
  var nav = (navigator.language || 'en').slice(0,2).toLowerCase();
  saved = T[nav] ? nav : 'en';
}
setLang(saved);
</script>
</body>
</html>
