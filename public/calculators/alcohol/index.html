var PIZZA_KCAL = 850;   /* a pizzeria margherita */

/* the official document behind each definition, in the order of STD_G */
var STD_URL = [U.audit, U.iss, U.ukUnit, U.niaaa, U.mhlw];

/* The long labels carry their detail after an em dash or inside brackets.
   The select keeps the short name; the detail goes underneath, where it fits. */
function splitLabel(s){
  var i = s.indexOf(' — ');
  if (i > 0) return [s.slice(0, i), s.slice(i + 3)];
  var m = s.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
  if (m) return [m[1], m[2]];
  return [s, ''];
}
function size(m){ return m >= 1000 ? fmt(m/1000,0) + ' L' : fmt(m,0) + ' ml'; }

var state = CATS.map(function(c){ return {ty:c.dT, fm:c.dF, q:c.dQ}; });
state[CKI].named = -1;
state[CKI].heavy = false;
var stdIdx = 0;

/* fold accents so "jagerbomb" finds Jägerbomb and "pina colada" finds Piña Colada */
function norm(x){
  var y = x;
  try { y = x.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch(e) {}
  return y.toLowerCase().replace(/[^a-z0-9]/g, '');
}
function findCk(q){
  q = norm(q); if (!q) return -1;
  var i;
  for (i=0;i<CK.length;i++) if (norm(CK[i][0]) === q) return i;
  for (i=0;i<CK.length;i++) if (norm(CK[i][0]).indexOf(q) === 0) return i;
  for (i=0;i<CK.length;i++) if (norm(CK[i][0]).indexOf(q) >= 0) return i;
  return -1;
}

function buildCards(){
  var host = document.getElementById('cards');
  host.innerHTML = '';
  CATS.forEach(function(c, ci){
    var d = document.createElement('div'); d.className = 'card'; d.id = 'card' + ci;

        + '<datalist id="ck"></datalist></div>'
        + '<p class="out" id="recipe" style="margin:0 0 .55rem"></p>'
      : '';
    var heavy = (ci === CKI)
      ? '<label id="lheavy" style="display:flex;gap:.45rem;align-items:center;margin-top:.55rem;'
        + 'font-size:.8125rem;color:var(--mut);cursor:pointer">'
        + '<input type="checkbox" id="heavy" style="margin:0"><span id="sheavy"></span></label>'
      : '';
    d.innerHTML =
      '<div class="hd"><span class="emo" id="ce' + ci + '"></span>'
      + '<span class="nm" id="nm' + ci + '"></span>'
      + '<span class="sug" id="sg' + ci + '"></span></div>'
      + extra
      + '<div class="row">'
      +   '<div class="f" id="wty' + ci + '"><label for="ty' + ci + '" id="lty' + ci + '"></label><select id="ty' + ci + '"></select>'
      +     '<p class="hint" id="ex' + ci + '"></p></div>'
      +   '<div class="f" id="wfm' + ci + '"><label id="lfm' + ci + '"></label>'
      +     '<div class="glasses" id="fm' + ci + '" role="radiogroup"></div>'
      +     '<p class="hint" id="gh' + ci + '"></p></div>'
      +   '<div class="f"><label for="q' + ci + '" id="lq' + ci + '"></label>'
      +     '<input id="q' + ci + '" type="number" min="0" step="1" value="' + c.dQ + '"></div>'
      + '</div>' + heavy
      + '<p class="out" id="o' + ci + '"></p>';
    host.appendChild(d);
  });
  CATS.forEach(function(c, ci){
    document.getElementById('ty' + ci).addEventListener('change', function(){ state[ci].ty = this.selectedIndex; calc(); });
    document.getElementById('q' + ci).addEventListener('input', function(){
      var v = parseFloat(this.value); state[ci].q = (isFinite(v) && v >= 0) ? v : 0; calc(); });
  });
  document.getElementById('find').addEventListener('input', function(){
    state[CKI].named = findCk(this.value);
    if (state[CKI].named >= 0 && !state[CKI].q){
      state[CKI].q = 1; document.getElementById('q' + CKI).value = 1;
    }
    calc();
  });
  document.getElementById('heavy').addEventListener('change', function(){
    state[CKI].heavy = this.checked; calc();
  });
}

/* One pizza per 850 kcal, the last one cut to the remainder. */
function pizzaSVG(frac){
  var R = 13, C = 15, clip = '', body;
  if (frac < 0.999){
    var a0 = -Math.PI/2, a1 = a0 + 2*Math.PI*frac, big = frac > 0.5 ? 1 : 0;
    var id = 'pz' + (Math.random()*1e9|0);
    clip = '<clipPath id="' + id + '"><path d="M' + C + ' ' + C
         + ' L' + (C+R*Math.cos(a0)).toFixed(2) + ' ' + (C+R*Math.sin(a0)).toFixed(2)
         + ' A' + R + ' ' + R + ' 0 ' + big + ' 1 '
         + (C+R*Math.cos(a1)).toFixed(2) + ' ' + (C+R*Math.sin(a1)).toFixed(2) + ' Z"/></clipPath>';
    body = '<g clip-path="url(#' + id + ')">';
  } else body = '<g>';
  return '<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">' + clip + body
    + '<circle cx="15" cy="15" r="13" fill="#E8C98A" stroke="#C9A066" stroke-width="1"/>'
    + '<circle cx="15" cy="15" r="10" fill="#D9503C"/>'
    + '<circle cx="11" cy="12" r="2.3" fill="#FBF6EC"/><circle cx="19" cy="13" r="2" fill="#FBF6EC"/>'
    + '<circle cx="14" cy="19" r="2.1" fill="#FBF6EC"/>'
    + '<circle cx="17.5" cy="17.5" r="1.3" fill="#3F8F4F"/><circle cx="10.5" cy="17" r="1.1" fill="#3F8F4F"/>'
    + '</g></svg>';
}
function drawPizzas(n){
  var wrap = document.getElementById('pizzaWrap'), host = document.getElementById('pizzas');
  if (!n){ wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  var whole = Math.floor(n), rest = n - whole, html = '', MAXI = 10;
  for (var i = 0; i < Math.min(whole, MAXI); i++) html += pizzaSVG(1);
  if (whole <= MAXI && rest > 0.02) html += pizzaSVG(rest);
  if (whole > MAXI) html += '<span style="font-family:var(--mono);font-size:.8125rem;color:var(--mut)">'
    + '\u00d7 ' + fmt(n,1) + '</span>';
  host.innerHTML = html;
  document.getElementById('pizzaLine').innerHTML =
    t('alPizza').replace('{n}', fmt(n,1)) + ' <span style="color:var(--faint)">' + t('alPizzaNote') + '</span>';
}

function glassEdge(){

/* One button per serving: the glass it is drunk from, the volume, the common name. */
function drawGlasses(ci, c, sel){
  var host = document.getElementById('fm' + ci), edge = glassEdge(), fill = LIQUID[c.k], h = '';
  c.fmts.forEach(function(m, j){
    var g = GLASSMAP[c.k][j], px = g[1];
    h += '<button type="button" class="gl" role="radio" aria-checked="' + (j === sel) + '" data-i="' + j + '">'

      +   '<span class="ml">' + size(m) + '</span>'
      +   '<span class="gn">' + (t('fmtN')[c.k][j] || '') + '</span>'
      + '</button>';
  });
  host.innerHTML = h;
  Array.prototype.forEach.call(host.children, function(btn){
    btn.addEventListener('click', function(){
      state[ci].fm = parseInt(this.getAttribute('data-i'), 10); calc();
    });
  });
}

function calc(){
  var grams = 0, sugar = 0;
  CATS.forEach(function(c, ci){
    var s = state[ci];
    var named = (ci === CKI && s.named >= 0) ? CK[s.named] : null;
    var ty = c.types[s.ty];
    var ml = named ? named[2] : c.fmts[s.fm];
    var sband = named ? named[3] : ty[1];
    var k = (ci === CKI && s.heavy) ? HEAVY : 1;
    var perServe = named ? named[1] * 0.8 : ml * (ty[0]/100) * 0.8;
    var g = s.q * perServe * k;
    grams += g;
    sugar += s.q * (ml/100) * SUGAR_KCAL[sband] * k;

    document.getElementById('ce' + ci).innerHTML =
      glassSVG(CATGLASS[c.k], 2, LIQUID[c.k], glassEdge(), 8);
    document.getElementById('nm' + ci).textContent = named ? named[0] : t('alCats')[ci];
    var sg = document.getElementById('sg' + ci);
    sg.textContent = t('sug')[sband]; sg.className = 'sug s-' + sband;
    document.getElementById('lty' + ci).textContent = t('alType');
    document.getElementById('lfm' + ci).textContent = t('alFmt');
    document.getElementById('lq' + ci).textContent = t('alQty');
    opts(document.getElementById('ty' + ci), c.types.map(function(x, j){
      return splitLabel(t('alTypes')[c.k][j])[0] + '  ' + abvRange(x); }), s.ty);
    var det = splitLabel(t('alTypes')[c.k][s.ty])[1];
    document.getElementById('ex' + ci).textContent =
      t('alAt').replace('{v}', abv(ty[0])) + (det ? '  ·  ' + det : '');
    drawGlasses(ci, c, s.fm);
    document.getElementById('gh' + ci).textContent = (c.k === 'beer') ? t('alGlassNote') : '';

    if (ci === CKI){
      var typed = document.getElementById('find').value.trim();
      document.getElementById('lfind').textContent = t('alFind');
      document.getElementById('find').placeholder = t('alFindPh');
      document.getElementById('sheavy').textContent = t('alHeavy');
      document.getElementById('recipe').textContent = named
        ? named[4] + '  =  ' + fmt(named[1] * 0.8, 0) + ' g ' + t('alPerServe')
        : (typed ? t('alNotFound') : '');
      document.getElementById('wty' + ci).style.display = named ? 'none' : '';
      document.getElementById('wfm' + ci).style.display = named ? 'none' : '';
    }

    document.getElementById('card' + ci).className = 'card' + (s.q > 0 ? ' active' : '');
    document.getElementById('o' + ci).textContent = s.q > 0
      ? (named
          ? fmt(s.q,0) + ' × ' + fmt(named[1] * 0.8, 0) + ' g'
            + (k > 1 ? ' × ' + fmt(k,1) : '') + ' = ' + fmt(g,0) + ' g'
          : fmt(s.q,0) + ' × ' + size(ml) + ' · ' + abv(ty[0]) + '% = ' + fmt(g,0) + ' g')
      : '—';
  });

  var b = band(grams, BANDS), i = BANDS.indexOf(b);
  document.getElementById('out').textContent = fmt(grams,0);
  setBadge(document.getElementById('bg'), grams > 0 ? b.tone : null, grams > 0 ? t('alBands')[i] : '—');
  /* One verdict: where the week falls in the standard the reader picked, and the
     reminder that no band is a clean bill of health. The two never travel apart. */
  var sub = document.getElementById('sub');
  sub.className = grams > 0 ? 'verdict ' + ['v-ok','v-mid','v-hi'][i] : '';
  sub.innerHTML = grams > 0 ? t('alV')[i] + ' ' + t('alCal') : '';
  drawCmp(grams);
  var total = grams*7 + sugar;
  document.getElementById('kcal').textContent = grams > 0
    ? t('alKcal').replace('{a}', fmt(grams*7,0)).replace('{s}', fmt(sugar,0))
                 .replace('{t}', fmt(total,0)) : '';
  drawPizzas(grams > 0 ? total / PIZZA_KCAL : 0);
  rows(document.getElementById('tb'), STD_G, stdIdx, [
    function(g, k2){ return t('alStdOpts')[k2]; },
    function(g){ return grams > 0 ? fmt(grams/g,1) + ' ' + t('alUnits') : '—'; }
  ]);
  Array.prototype.forEach.call(document.getElementById('tb').children, function(tr, k2){
    tr.className += (tr.className ? ' ' : '') + 'tap-row';
    tr.style.cursor = 'pointer';
    var i = document.createElement('span'); i.className = 'i'; i.textContent = '\u24D8';
    tr.firstChild.appendChild(i);
    tr.onclick = function(){ popIdx = (popIdx === k2 && stdIdx === k2) ? null : k2; stdIdx = k2; calc(); };
  });
  drawPop();
  srcList(document.getElementById('srcs'), t('alSrcs'));
}

/* The week against the one threshold, twice: once in grams, which is the
   physical quantity, and once in the reader's chosen unit, which is only a way
   of reporting it. Same comparison, so the two lines always agree. */
var LIMIT = 140;
function drawCmp(grams){
  var wrap = document.getElementById('cmpWrap');
  if (!(grams > 0)) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  var g = STD_G[stdIdx], bare = t('stdBare')[stdIdx];
  function verdict(mine, limit){
    var k = Math.abs(mine - limit) < limit * 0.005 ? 1 : mine < limit ? 0 : 2;
    return '<span class="v v' + k + '">' + t('cmpV')[k] + '</span>';
  }
  document.getElementById('cmp').innerHTML =
      '<tr><td>' + t('cmpG') + '</td><td class="n">' + fmt(grams,0) + ' g</td>'
    +     '<td class="n">' + LIMIT + ' g</td><td>' + verdict(grams, LIMIT) + '</td></tr>'
    + '<tr><td>' + t('cmpU') + ' ' + bare + '</td>'
    +     '<td class="n">' + fmt(grams/g,1) + '</td>'
    +     '<td class="n">' + fmt(LIMIT/g,1) + '</td><td>' + verdict(grams, LIMIT) + '</td></tr>';
  document.getElementById('cmpSrc').innerHTML =
    t('cmpSrc').replace('{n}', fmt(LIMIT/10,0))
               .replace('{a}', '<a href="' + U.audit + '" target="_blank" rel="noopener">')
               .replace('{/a}', ' \u2197</a>');
}

/* Which row has its source open, or null. The panel is rebuilt with the table,
   so it stays under its own row however the numbers change. */
var popIdx = null;
function drawPop(){
  var tb = document.getElementById('tb'), old = tb.querySelector('.poprow');
  if (old) tb.removeChild(old);
  if (popIdx === null) return;
  var tr = tb.children[popIdx];
  if (!tr) { popIdx = null; return; }
  var d = t('stdDoc')[popIdx];
  /* the panel opens as a row of the table itself, so it pushes the rows below
     down instead of covering them: every definition stays one tap away */
  var row = document.createElement('tr'), td = document.createElement('td');
  row.className = 'poprow'; td.colSpan = 2;
  var p = document.createElement('div');
  p.className = 'pop'; p.setAttribute('role', 'dialog');
  p.innerHTML = '<button class="x" type="button" aria-label="' + t('popClose') + '">\u00d7</button>'
    + '<p>' + d.d + '</p>'
    + '<a href="' + STD_URL[popIdx] + '" target="_blank" rel="noopener">' + d.s + ' \u2197</a>';
  p.querySelector('.x').onclick = function(){ popIdx = null; drawPop(); };
  td.appendChild(p); row.appendChild(td);
  if (tr.nextSibling) tb.insertBefore(row, tr.nextSibling); else tb.appendChild(row);
}
/* Capture phase: the row's own handler rebuilds the table, which would detach
   the clicked cell and make this look like a click from outside. */
document.addEventListener('click', function(e){
  if (popIdx !== null && !e.target.closest('#tw')) { popIdx = null; drawPop(); }
}, true);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && popIdx !== null) { popIdx = null; drawPop(); }
});

buildCards();
fillFind();
initTool(calc);
</script>
