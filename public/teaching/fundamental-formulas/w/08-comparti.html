<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The three compartments: solutes and water</title>
<link rel="stylesheet" href="widget.css">
<style>
body{margin:0;padding:8px 10px 10px}
.pn{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;padding:8px 10px;color:#16222E}
svg{display:block;width:100%;height:auto;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.fl{display:flex;align-items:center;gap:9px;font:600 14.5px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;margin:2px 2px 6px;cursor:pointer;user-select:none}
.fl input{width:19px;height:19px;margin:0;flex:0 0 auto}
.rd{font-size:14px;line-height:1.45;margin:6px 2px 2px;min-height:3.1em}
.rd b{font-weight:700}
.lg{font-size:12px;line-height:1.4;color:#55697A;margin:4px 2px 0}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<p class="sr" id="sr"></p>
<div class="pn">
 <label class="fl"><input type="checkbox" id="fg"><span id="fgl"></span></label>
 <svg id="sv" viewBox="0 0 720 350" role="img"></svg>
 <p class="rd" id="rd"></p>
 <p class="lg" id="lg"></p>
</div>
<script>
(function(){
var it=document.documentElement.lang==='it';function T(a,b){return it?a:b;}
var NS='http://www.w3.org/2000/svg',sv=document.getElementById('sv');
function el(n,a,t){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;sv.appendChild(e);return e;}
var CS='#E8896B',CW='#7DBBEA',CN='#F2B62E',CK='#57C7A3',CA='#C9CED4',INK='#16222E',MU='#55697A';
var Y0=262,C=[{n:T('plasma','plasma'),L:3,k:0},{n:T('interstizio','interstitium'),L:11,k:0},{n:T('cellule','cells'),L:28,k:1}];
var pA=200/28,pB=12,xa=[118,288,458],xb=110,acc=0;
C.forEach(function(c,i){
 c.A={sx:xa[i],sw:62,sy:Y0-c.L*pA,sh:c.L*pA,wx:xa[i]+62,wy:Y0-c.L*pA,ww:62,wh:c.L*pA,lx:xa[i]+62,ly:Y0+22};
 c.B={sx:xb+acc*pB,sw:c.L*pB,sy:Y0-180,sh:180,wx:xb+acc*pB,wy:Y0+8,ww:c.L*pB,wh:12,lx:xb+acc*pB+c.L*pB/2,ly:Y0+58};
 acc+=c.L;
 c.sol=el('rect',{fill:CS,stroke:'#FFFFFF','stroke-width':1});
 c.up=el('rect',{fill:CA,stroke:'#FFFFFF','stroke-width':1});
 c.cat=el('rect',{fill:c.k?CK:CN,stroke:'#FFFFFF','stroke-width':1});
 c.wat=el('rect',{fill:CW,stroke:'#FFFFFF','stroke-width':1});
 c.lev=el('path',{stroke:INK,'stroke-width':1.2,'stroke-dasharray':'5 4',fill:'none'});
 c.tS=el('text',{'font-size':13,'font-weight':700,fill:INK,'text-anchor':'middle'},T('soluti','solutes'));
 c.tW=el('text',{'font-size':13,'font-weight':700,fill:INK,'text-anchor':'middle'},T('acqua','water'));
 c.tC=el('text',{'font-size':15,'font-weight':700,fill:INK,'text-anchor':'middle'},c.k?'K⁺':'Na⁺');
 c.tU=el('text',{'font-size':12.5,'font-weight':600,fill:INK,'text-anchor':'middle'},T('anioni e altro','anions and other'));
 c.nm=el('text',{'font-size':14,'font-weight':700,fill:INK,'text-anchor':'middle'},c.n);
 c.sb=el('text',{'font-size':12,fill:MU,'text-anchor':'middle'});
});
var axL=el('path',{d:'M92 '+(Y0-212)+' V'+Y0+' H640',stroke:MU,'stroke-width':1,fill:'none'});
var gA=el('g',{}),gB=el('g',{});
function tx(g,x,y,s,a,c,w){var e=document.createElementNS(NS,'text');e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('font-size',12);e.setAttribute('fill',c||MU);e.setAttribute('text-anchor',a||'end');if(w)e.setAttribute('font-weight',w);e.textContent=s;g.appendChild(e);return e;}
function ln(g,d,c,w){var e=document.createElementNS(NS,'path');e.setAttribute('d',d);e.setAttribute('stroke',c);e.setAttribute('stroke-width',w||1);e.setAttribute('fill','none');g.appendChild(e);return e;}
tx(gA,14,Y0-214,T('soluti, mOsm','solutes, mOsm'),'start','#C45A38',700);tx(gA,84,Y0-196,'8120');tx(gA,84,Y0+4,'0');
ln(gA,'M640 '+(Y0-212)+' V'+Y0,'#3F97CE',1.2);tx(gA,648,Y0-214,T('acqua, L','water, L'),'start','#3F97CE',700);tx(gA,648,Y0-196,'28','start','#3F97CE');tx(gA,648,Y0+4,'0','start','#3F97CE');
tx(gB,14,Y0-214,T('concentrazione, mOsm/L','concentration, mOsm/L'),'start',INK,700);tx(gB,84,Y0-176,'290');tx(gB,84,Y0+4,'0');
ln(gB,'M'+(xb+36)+' '+(Y0-192)+' V'+(Y0+24),'#B03A3A',2.4);ln(gB,'M'+(xb+168)+' '+(Y0-192)+' V'+(Y0+24),'#1456A8',2.4);
[[0,'0'],[3,'3'],[14,'14'],[42,'42 L']].forEach(function(q){tx(gB,xb+q[0]*pB,Y0+38,q[1],'middle','#3F97CE',700);});
tx(gB,xb+36+5,Y0-196,T('parete del capillare','capillary wall'),'start','#B03A3A',600);tx(gB,xb+168+5,Y0-196,T('membrana cellulare','cell membrane'),'start','#1456A8',600);
var t=0,tg=0,raf=0;
function mix(a,b){return a+(b-a)*t;}
function draw(){
 var e=t<.5?2*t*t:1-2*(1-t)*(1-t),sT=t;t=e;
 C.forEach(function(c){var A=c.A,B=c.B,sx=mix(A.sx,B.sx),sy=mix(A.sy,B.sy),sw=mix(A.sw,B.sw),sh=mix(A.sh,B.sh),wx=mix(A.wx,B.wx),wy=mix(A.wy,B.wy),ww=mix(A.ww,B.ww),wh=mix(A.wh,B.wh);
  function R(r,x,y,w,h,o){r.setAttribute('x',x.toFixed(1));r.setAttribute('y',y.toFixed(1));r.setAttribute('width',Math.max(0,w).toFixed(1));r.setAttribute('height',Math.max(0,h).toFixed(1));if(o!=null)r.setAttribute('opacity',o.toFixed(2));}
  R(c.sol,sx,sy,sw,sh);R(c.up,sx,sy,sw,sh*.52,t);R(c.cat,sx,sy+sh*.52,sw,sh*.48,t);R(c.wat,wx,wy,ww,wh);
  c.lev.setAttribute('d','M'+(A.sx-8)+' '+A.sy.toFixed(1)+' H'+(A.wx+A.ww+8));c.lev.setAttribute('opacity',(1-t).toFixed(2));
  var big=c.L>5;
  function P(o,x,y,op){o.setAttribute('x',x.toFixed(1));o.setAttribute('y',y.toFixed(1));o.setAttribute('opacity',(big?op:0).toFixed(2));}
  P(c.tS,sx+sw/2,sy+sh/2+5,1-t*2.2<0?0:1-t*2.2);P(c.tW,wx+ww/2,wy+wh/2+5,1-t*2.2<0?0:1-t*2.2);
  P(c.tC,sx+sw/2,sy+sh*.76+5,t<.55?0:(t-.55)/.45);P(c.tU,sx+sw/2,sy+sh*.26+5,t<.55?0:(t-.55)/.45);
  c.nm.setAttribute('x',mix(A.lx,B.lx).toFixed(1));c.nm.setAttribute('y',mix(A.ly,B.ly).toFixed(1));
  c.sb.setAttribute('x',mix(A.lx,B.lx).toFixed(1));c.sb.setAttribute('y',(mix(A.ly,B.ly)+17).toFixed(1));
  c.sb.textContent=t<.5?(c.L*290)+' mOsm · '+c.L+' L':c.L+' L';
 });
 gA.setAttribute('opacity',Math.max(0,1-t*2).toFixed(2));gB.setAttribute('opacity',Math.max(0,t*2-1).toFixed(2));
 t=sT;
}
function step(){var d=tg-t;if(Math.abs(d)<.02){t=tg;draw();raf=0;return;}t+=(d>0?1:-1)*.028;draw();raf=requestAnimationFrame(step);}
function txt(){
 document.getElementById('rd').innerHTML=tg?T('<b>Larghezza = acqua. Altezza = concentrazione. Area = soluti.</b> Il tetto è piatto: l’osmolalità è la stessa nei tre comparti. La cellula ha più soluti perché è più larga, non perché è più concentrata.','<b>Width = water. Height = concentration. Area = solutes.</b> The roof is flat: osmolality is the same in the three compartments. The cell holds more solutes because it is wider, not because it is more concentrated.'):T('<b>Altezza = quantità.</b> In ogni comparto la colonna dei soluti e quella dell’acqua arrivano alla stessa linea: tanti soluti, tanta acqua. Spunta la casella e guarda l’acqua sdraiarsi sulla base.','<b>Height = amount.</b> In every compartment the solute column and the water column reach the same line: so many solutes, so much water. Tick the box and watch the water lie down along the base.');
}
document.getElementById('fgl').textContent=T('Trasforma: l’acqua diventa la larghezza','Transform: water becomes the width');
document.getElementById('lg').innerHTML=T('Soluti in <b>mOsm</b> (milliosmoli: millimoli di particelle sciolte); acqua in <b>L</b>; concentrazione in <b>mOsm/L</b>. Valori tipici per un adulto di 70 kg, 290 mOsm/L in ogni comparto; la divisione tra Na⁺ o K⁺ e il resto è indicativa.','Solutes in <b>mOsm</b> (milliosmoles: millimoles of dissolved particles); water in <b>L</b>; concentration in <b>mOsm/L</b>. Typical values for a 70 kg adult, 290 mOsm/L in every compartment; the split between Na⁺ or K⁺ and the rest is indicative.');
document.getElementById('sr').textContent=T('Tre comparti d’acqua: plasma 3 litri e 870 milliosmoli, interstizio 11 litri e 3190 milliosmoli, cellule 28 litri e 8120 milliosmoli. Una casella trasforma le colonne in tre rettangoli larghi quanto i litri e alti tutti 290 milliosmoli per litro.','Three compartments of water: plasma 3 litres and 870 milliosmoles, interstitium 11 litres and 3190 milliosmoles, cells 28 litres and 8120 milliosmoles. A checkbox turns the columns into three rectangles as wide as the litres and all 290 milliosmoles per litre tall.');
document.getElementById('fg').addEventListener('change',function(){tg=this.checked?1:0;txt();if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){t=tg;draw();return;}if(!raf)raf=requestAnimationFrame(step);});
txt();draw();
})();
</script>
</body>
</html>
