<title>Fick in the lung: try it</title>

<style>
svg[viewBox]{min-width:0!important;max-width:100%!important;width:100%}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;font-size:13px}
.row .vl{font-weight:700;color:#55697A}

.tm.ch{border-color:#B5520C;background:#FCEEDD}

.cap.cb{border-color:#7A4BA6}.cap.cb .ct{background:#7A4BA6}
.cap.ch2{border-color:#0E7C86;padding:12px 10px 6px}.cap.ch2 .ct{background:#0E7C86}

<h2 class="sr-only">A breathing lung: exercise, ventilation, area, thickness, oxygen and altitude decide the saturation</h2>
<div class="row" id="pre"></div>
<div class="ctl" id="ctl"></div>
<div class="pnl"><svg id="sv" viewBox="0 0 640 250" role="img" aria-label="A breathing lung: exercise, ventilation, area, thickness, oxygen and altitude decide the saturation"></svg><div class="dead" id="dead"><div><b id="dT"></b><br><span id="dM"></span><br><button type="button" id="again"></button></div></div></div>
<div class="res" id="res"></div>
<script>
var D={"ui": {"loc": "en-GB", "preT": "Situation:", "pause": "❚❚ Pause", "play": "▶ Resume", "lab": {"hb": "Haemoglobin", "q": "Cardiac output", "bohr": "Bohr effect", "hald": "Haldane effect", "w": "Exercise", "ve": "Ventilation", "A": "Area A", "T": "Thickness T", "Fi": "Inspired oxygen (FiO₂)", "h": "Altitude"}, "hint": {"hb": "normal 13–17 g/dL; less = anaemia", "q": "100% = right for the exercise; less = heart failure, shock", "bohr": "in the tissues CO₂ and acidity shift the haemoglobin curve to the right: O₂ comes off more easily", "hald": "haemoglobin that has given up O₂ binds more CO₂ and H⁺: venous blood carries more CO₂ without its pressure rising too much", "w": "more exercise = more blood through the lungs and less time in the capillary", "ve": "100% = right for the exercise; less = hypoventilation, 0 = apnoea", "A": "normal 50–100 m²; reduced in emphysema", "T": "normal 0.2–0.5 µm; increased in fibrosis and oedema", "Fi": "air 21%; more with oxygen therapy", "h": "higher up, lower pressure and less oxygen in the air"}, "tip": {"P1": "<h4>P₁ · alveolar O₂ (P<sub>A</sub>O₂)</h4><p>Set by the <b>alveolar gas equation</b>: P<sub>A</sub>O₂ = FiO₂ · (P<sub>B</sub> − 47) − P<sub>a</sub>CO₂ / 0.8. Now: {FI} × ({PB} − 47) − {CO2} / 0.8 ≈ <b>{PA} mmHg</b>.</p><ul><li><b>FiO₂</b>, the inspired O₂ fraction: 21% in air; ↑ with oxygen therapy → P₁ ↑.</li><li><b>P<sub>B</sub></b>, barometric pressure: 760 mmHg at sea level; ↓ at altitude (about 430 mmHg at Capanna Margherita) → P₁ ↓.</li><li><b>47 mmHg</b>, water vapour: alveolar air is saturated with water at 37 °C. It is fixed, and weighs more at altitude.</li><li><b>P<sub>a</sub>CO₂</b>, which depends on ventilation: breathe too little and CO₂ rises and takes O₂’s place → P₁ ↓; hyperventilate and CO₂ falls → P₁ ↑. 0.8 is the respiratory quotient.</li><li><b>Lung zones.</b> Upright, the apices are well ventilated and poorly perfused (high V̇/Q̇): P<sub>A</sub>O₂ about 130 mmHg. The bases are well perfused and less ventilated (low V̇/Q̇): about 90 mmHg. Here I use a single average alveolus.</li></ul>", "P2": "<h4>P₂ · O₂ in the arriving venous blood (P<sub>v̄</sub>O₂)</h4><p>Set by the <b>cardiovascular Fick principle</b>: V̇O₂ = Q · (CaO₂ − CvO₂), so CvO₂ = CaO₂ − V̇O₂ / Q. <b>CaO₂</b> and <b>CvO₂</b> are the O₂ <b>content</b> of arterial and venous blood: how many mL of O₂ are in a decilitre of blood (C for content, P for pressure, S for saturation). Now: {CA} − {VO2} / ({Q} × 10) = <b>{CV} mL/dL</b>, which on the haemoglobin curve is <b>{PV} mmHg</b>. (× 10 turns Q from litres into decilitres.)</p><ul><li><b>V̇O₂</b>, how much the tissues use: ↑ with exercise, fever, shivering, hyperthyroidism → P₂ ↓.</li><li><b>Q</b>, cardiac output: ↓ in heart failure and shock → blood flows more slowly and tissues take more → P₂ ↓. More output → P₂ ↑.</li><li><b>CaO₂</b>, arterial O₂ content: 1.34 × Hb × SaO₂ + 0.003 × PaO₂. ↓ in anaemia (less haemoglobin) and hypoxaemia (less saturation) → P₂ ↓.</li><li><b>The haemoglobin curve</b> turns content into pressure: on its steep part a small fall in P₂ releases a lot of O₂.</li><li><b>Bohr effect</b>: in the tissues venous pH falls to about {DPH} and the curve shifts right (P50 {P50} mmHg instead of 26.8). To give up the same O₂, P₂ stays higher: O₂ reaches the tissues at a higher pressure. In the lung CO₂ leaves and the curve shifts back left, so blood reloads better. The Haldane effect is the same thing seen from the CO₂ side.</li></ul>", "V": "<h4>V̇O₂ · O₂ crossing the barrier</h4><p>What the blood takes up passing through the lung: Q × (CaO₂ − CvO₂) = {Q} × 10 × ({CA} − {CV}) ≈ <b>{VO} mL/min</b>. In a steady state it equals tissue consumption: about 250 mL/min at rest, up to 3000 on exercise.</p>", "D": "<h4>D · diffusion constant of O₂</h4><p>Depends on the gas, not on the person: proportional to solubility / √molecular weight. That is why it does not change with disease.</p>", "A": "<h4>A · exchange area</h4><p>Normal 50–100 m². ↓ in emphysema, after resection, in atelectasis and in pulmonary embolism (alveoli not perfused). ↑ on exercise, when apical capillaries open up.</p>", "T": "<h4>T · barrier thickness</h4><p>Normal 0.2–0.5 µm. ↑ in fibrosis, pulmonary oedema and interstitial pneumonias: blood has less time to load, especially on exercise.</p>"}, "tipHint": "Hover over (or tap) a term of the equation to see what it depends on.", "do2T": "O₂ delivered to the tissues (DO₂)", "vo2T": "O₂ used (V̇O₂)", "do2L": "<b>The real goal:</b> DO₂ = Q × CaO₂ = {Q} L/min × {CA} mL/dL × 10 ≈ {DO2} mL/min. The tissues extract {EX}% of it (normal: about 25% at rest, up to about 75% at maximal exercise).", "hidden": "But saturation is misleading: little O₂ arrives and the tissues must extract too much.", "hidden2": "And little O₂ reaches the tissues.", "vigB": "<b>The Bohr effect does not change how much O₂ is in venous blood. It changes which pressure that amount corresponds to.</b><br>Venous content CvO₂ stays at {CV} mL/dL, with or without Bohr, because the tissues use the same amount. With the curve shifted right (P50 {P50} mmHg instead of 26.8) the same venous saturation, {SV}%, corresponds to <b>{PV} mmHg</b> instead of <b>{PV0} mmHg</b>.", "capB": "Bohr effect: moves P₂", "capBoff": "Bohr off", "capH": "Haldane effect: changes the CO₂ gradient", "capHoff": "Haldane off", "co2L": "CO₂: venous blood {PVC} mmHg → alveolus {PAC} mmHg (gradient {DC} mmHg).", "noHald": "Without Haldane about twice the gradient is needed to carry the same CO₂.", "alv": "alveolus", "dConst": "constant", "dLab": "of O₂", "aLab": "area", "p1Lab": "alveolus", "p2Lab": "arriving venous blood", "tLab": "thickness", "inC": "in", "outC": "out", "transit": "time in the capillary", "grad": "gradient at the start of the capillary", "sOk": "Normal saturation.", "sLow": "Low saturation.", "sHyp": "Hypoxaemia.", "sCya": "Severe hypoxaemia: cyanosis.", "deadS": "Has lost consciousness.", "deadT": "Loses consciousness!", "again": "Start again", "wApnea": "Not breathing: alveolar air is not renewed and P₁ collapses.", "wHypo": "Breathing too little: CO₂ rises and alveolar O₂ falls.", "wAlt": "There is little oxygen in the air: P₁ is low.", "wShort": "Blood already arrives nearly empty: the tissues cannot take all the O₂ they use.", "wDiff": "The limit is the barrier: blood leaves the capillary before it has loaded.", "note": "Toy model: alveolar gas equation for alveolar PO₂, then O₂ rising along the capillary by Fick (normal D<sub>L</sub> 25 mL·min⁻¹·mmHg⁻¹), and the haemoglobin curve. Times sped up, numbers indicative."}, "pre": [{"n": "Healthy at rest", "w": 0, "ve": 100, "A": 70, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Healthy on exercise", "w": 100, "ve": 100, "A": 70, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Fibrosis at rest", "w": 0, "ve": 100, "A": 70, "T": 2.5, "Fi": 21, "h": 0}, {"n": "Fibrosis on exercise", "w": 50, "ve": 100, "A": 70, "T": 2.5, "Fi": 21, "h": 0}, {"n": "Fibrosis on exercise + oxygen", "w": 50, "ve": 100, "A": 70, "T": 2.5, "Fi": 40, "h": 0}, {"n": "Emphysema on exercise", "w": 70, "ve": 100, "A": 25, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Opioids (hypoventilation)", "w": 0, "ve": 50, "A": 70, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Apnoea", "w": 0, "ve": 0, "A": 70, "T": 0.5, "Fi": 21, "h": 0}, {"n": "Capanna Margherita, 4559 m", "w": 0, "ve": 150, "A": 70, "T": 0.5, "Fi": 21, "h": 4559}, {"n": "Anaemia (Hb 7 g/dL)", "w": 0, "ve": 100, "A": 70, "T": 0.5, "Fi": 21, "h": 0, "hb": 7}, {"n": "Heart failure (output 50%)", "w": 0, "ve": 100, "A": 70, "T": 0.5, "Fi": 21, "h": 0, "q": 50}]},U=D.ui,P=D.pre;
var LASTH='',HK='P1',S={sp:0,hb:15,q:100,w:0,ve:100,A:70,T:0.5,Fi:21,h:0,bohr:true,hald:true},PA=100,SAT=97,DEAD=false,PZ=false,t0=null,ph=0,flow=0,lowT=0;
function $(q){return document.querySelector(q);}
function f(x,d){return x.toLocaleString(U.loc,{maximumFractionDigits:d,minimumFractionDigits:d});}
var SL=[['w',0,100,1,'%'],['ve',0,300,5,'%'],['A',10,100,1,'m²'],['T',0.3,5,0.1,'µm'],['Fi',21,100,1,'%'],['h',0,8800,100,'m'],['hb',5,20,0.5,'g/dL'],['q',30,150,5,'%']];
function ctl(){$('#ctl').innerHTML=SL.map(function(s){return '<div><label for="s_'+s[0]+'">'+U.lab[s[0]]+' <span id="v_'+s[0]+'"></span></label><input type="range" id="s_'+s[0]+'" min="'+s[1]+'" max="'+s[2]+'" step="'+s[3]+'"><small>'+U.hint[s[0]]+'</small></div>';}).join('')+
  ['bohr','hald'].map(function(k){return '<div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="c_'+k+'" style="width:auto"> <span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:'+(k==='bohr'?'#7A4BA6':'#0E7C86')+'"></span>'+U.lab[k]+'</label><small>'+U.hint[k]+'</small></div>';}).join('');
  ['bohr','hald'].forEach(function(k){$('#c_'+k).addEventListener('change',function(e){S[k]=e.target.checked;});});
  SL.forEach(function(s){$('#s_'+s[0]).addEventListener('input',function(e){S[s[0]]=+e.target.value;S.sp=-1;sync();});});}
function sync(){['bohr','hald'].forEach(function(k){$('#c_'+k).checked=S[k];});SL.forEach(function(s){$('#s_'+s[0]).value=S[s[0]];$('#v_'+s[0]).textContent=f(S[s[0]],s[3]<1?1:0)+' '+s[4];});
  $('#pre').innerHTML='<span class="vl">'+U.preT+'</span>'+P.map(function(p,i){return '<button type="button" data-p="'+i+'"'+(i===S.sp?' class="on"':'')+'>'+p.n+'</button>';}).join('')+'<span class="sp"></span><button type="button" id="pz"'+(PZ?' class="on"':'')+'>'+(PZ?U.play:U.pause)+'</button>';}
function setPre(i){var p=P[i];S.sp=i;['w','ve','A','T','Fi','h'].forEach(function(k){S[k]=p[k];});S.hb=p.hb||15;S.q=p.q||100;revive();sync();}
$('#pre').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.id==='pz'){PZ=!PZ;sync();return;}setPre(+b.getAttribute('data-p'));});
$('#again').addEventListener('click',function(){revive();});
function revive(){DEAD=false;lowT=0;PA=ss().PAss;SAT=sat(model().Pend);$('#dead').style.display='none';}
function sat(p,p50){p=Math.max(p,0.1);return 100/(1+Math.pow((p50||26.8)/p,2.7));}
// steady state of the alveolus: alveolar gas equation with the ventilation chosen
function ss(){var w=S.w/100,Pb=760*Math.exp(-S.h/7990),PI=S.Fi/100*(Pb-47),va=S.ve/100,co2=40/Math.max(va,0.01);
  var PAss=Math.max(15,PI-co2/0.8);if(va<0.01)PAss=15;return {PI:PI,PAss:Math.min(PAss,PI),PaCO2:Math.min(co2,120),Pb:Pb};}
// P2 (mixed venous PO2) from the Fick principle: CvO2 = CaO2 - VO2/Q, then back to PO2 on the haemoglobin curve
var CVMIN=2;
function cont(p,p50){return 1.34*S.hb*sat(p,p50)/100+0.003*p;}
function pOf(c,p50){var lo=0.5,hi=700;for(var k=0;k<40;k++){var mid=(lo+hi)/2;if(cont(mid,p50)<c)lo=mid;else hi=mid;}return (lo+hi)/2;}
function model(){var w=S.w/100,tt=0.75/(1+2*w),DL=25*(S.A/70)/(S.T/0.5),tau=0.1*25/DL,need=250+2750*w,Q=(5+15*w)*S.q/100,dpH=0.03+0.17*w,P50v=S.bohr?26.8*Math.pow(10,0.48*dpH):26.8;
  var Pv=Math.min(40,PA),Pend=PA,Ca=0,Cv=0,up=need;
  for(var k=0;k<40;k++){Pend=PA-(PA-Pv)*Math.exp(-tt/tau);Ca=cont(Pend);Cv=Ca-need/(Q*10);if(Cv<CVMIN)Cv=Math.min(CVMIN,Ca);var nv=pOf(Cv,P50v);Pv=Pv+0.5*(nv-Pv);}
  Pend=PA-(PA-Pv)*Math.exp(-tt/tau);Ca=cont(Pend);up=Q*10*(Ca-Cv);
  var dC=6*(0.8*need/Q)/40*(S.hald?1:2);
  return {P50v:P50v,dpH:dpH,dCO2:dC,tt:tt,DL:DL,tau:tau,Pv:Pv,Pend:Pend,need:need,Q:Q,Ca:Ca,Cv:Cv,up:up,short:up<need*0.97};}
function why(m,s){if(S.ve<10)return U.wApnea;if(m.short&&SAT>=60)return U.wShort;if(s.PaCO2>50)return U.wHypo;if(s.PI<100)return U.wAlt;if(PA-m.Pend>8)return U.wDiff;return '';}
function draw(m,s){var o='<rect width="640" height="250" fill="#FFFFFF"/>';
  // person: head and trunk with two lungs that inflate with the breath
  var br=S.ve<1||DEAD?0:(Math.sin(ph)+1)/2,amp=Math.min(1.5,S.ve/100)*(0.6+0.6*S.w/100),sc=1+0.06*br*amp;
  var lip=SAT>=90?'#C0504D':SAT>=80?'#8E6FA8':'#4F6DB0',skin=SAT>=85?(S.hb<10?'#F3ECE6':'#F2D6C4'):'#D9D6E6';if(S.hb<10&&SAT>=90)lip='#D9A3A1';
  o+='<g transform="translate(130,0)"><circle cx="0" cy="44" r="28" fill="'+skin+'" stroke="#9A8478"/>'+(DEAD?'<path d="M-12 38 l7 6 M-12 44 l7 -6 M5 38 l7 6 M5 44 l7 -6" stroke="#16222E" stroke-width="2"/>':'<circle cx="-9" cy="40" r="2.6" fill="#16222E"/><circle cx="9" cy="40" r="2.6" fill="#16222E"/>')+
    '<path d="M-9 56 Q0 '+(60+4*br)+' 9 56" stroke="'+lip+'" stroke-width="3.5" fill="none" stroke-linecap="round"/>'+
    '<path d="M-70 92 Q-72 76 -40 74 L40 74 Q72 76 70 92 L62 240 L-62 240Z" fill="#EEF2F5" stroke="#B9C5CF"/>'+
    '<path d="M0 70 L0 108 M0 108 L-18 124 M0 108 L18 124" stroke="#8696A4" stroke-width="5" fill="none" stroke-linecap="round"/>'+
    '<g transform="translate(-30,160) scale('+sc+') translate(30,-160)"><path d="M-14 112 C-46 104 -58 150 -54 196 C-52 220 -20 222 -12 206 Z" fill="#F4B7B4" stroke="#C0504D" stroke-width="1.5"/></g>'+
    '<g transform="translate(30,160) scale('+sc+') translate(-30,-160)"><path d="M14 112 C46 104 58 150 54 196 C52 220 20 222 12 206 Z" fill="#F4B7B4" stroke="#C0504D" stroke-width="1.5"/></g>'+
    '<path d="M-58 212 Q0 '+(232+8*br*amp)+' 58 212" stroke="#B5520C" stroke-width="2.5" fill="none"/>';
  o+='</g>';
  // zoom on one alveolus and its capillary: red cells change colour along the capillary
  var x0=300,x1=620,yc=150;o+='<line x1="230" y1="150" x2="'+x0+'" y2="120" stroke="#B9C5CF" stroke-dasharray="4 3"/>';
  o+='<path d="M'+x0+' 128 Q460 '+(30-10*br*Math.min(1,S.ve/100))+' '+x1+' 128 Z" fill="#E6F1F9" stroke="#1F6FB2" stroke-width="1.5"/>';
  o+='<text x="460" y="96" font-size="12" font-weight="700" text-anchor="middle" fill="#1F6FB2">'+U.alv+' P<tspan font-size="9" dy="3">A</tspan><tspan dy="-3">O₂ '+f(PA,0)+' mmHg</tspan></text>';
  var Tpx=Math.min(14,4+S.T*2);o+='<rect x="'+x0+'" y="128" width="'+(x1-x0)+'" height="'+Tpx+'" fill="#F2DE96" opacity=".7"/>';
  o+='<rect x="'+x0+'" y="'+(128+Tpx)+'" width="'+(x1-x0)+'" height="34" rx="6" fill="#FBEDEC" stroke="#C0504D"/>';
  for(var i=0;i<9;i++){var u=((flow+i/9)%1),x=x0+8+u*(x1-x0-16),t=u*m.tt,p=PA-(PA-m.Pv)*Math.exp(-t/m.tau),sv=sat(p)/100;
    var r=Math.round(90+150*sv),g=Math.round(70-30*sv),b=Math.round(160-120*sv);o+='<ellipse cx="'+x.toFixed(1)+'" cy="'+(128+Tpx+17)+'" rx="11" ry="7" fill="rgb('+r+','+g+','+b+')"/>';}
  o+='<text x="'+x0+'" y="'+(128+Tpx+50)+'" font-size="11" fill="#55697A">'+U.inC+' '+f(m.Pv,0)+' mmHg</text><text x="'+x1+'" y="'+(128+Tpx+50)+'" font-size="11" fill="#55697A" text-anchor="end">'+U.outC+' '+f(m.Pend,0)+' mmHg</text>';
  o+='<text x="'+((x0+x1)/2)+'" y="'+(128+Tpx+66)+'" font-size="11" fill="#55697A" text-anchor="middle">'+U.transit+' '+f(m.tt,2)+' s</text>';
  $('#sv').innerHTML=o;
  var DO2=m.Q*m.Ca*10,EX=Math.min(100,m.need/Math.max(DO2,1)*100),exLim=35+50*S.w/100,mx=Math.max(DO2,m.need)*1.1,low=EX>exLim;
  var do2='<div class="do2"><div class="lab"><span>'+U.do2T+'</span><span>'+f(DO2,0)+' mL/min</span></div><div class="bar"><i style="width:'+(DO2/mx*100).toFixed(1)+'%;background:#2E7D4F"></i></div>'+
   '<div class="lab"><span>'+U.vo2T+'</span><span>'+f(m.need,0)+' mL/min</span></div><div class="bar"><i style="width:'+(m.need/mx*100).toFixed(1)+'%;background:#B5520C"></i></div>'+
   '<p style="font-size:13px">'+U.do2L.replace('{Q}',f(m.Q,1)).replace('{CA}',f(m.Ca,1)).replace('{DO2}',f(DO2,0)).replace('{EX}',f(EX,0))+'</p></div>';
  var st=SAT>=94?['#27500A',U.sOk]:SAT>=90?['#8A4A0B',U.sLow]:SAT>=80?['#A32D2D',U.sHyp]:['#A32D2D',U.sCya];
  var VO=m.up;
  function ar(v,n,tol){return Math.abs(v-n)<=tol?'':(v>n?' ↑':' ↓');}
  function tile(sym,val,lab,chg,k){return '<div class="tm'+(chg?' ch':'')+(HK===k?' hk':'')+'" data-k="'+k+'" tabindex="0"><span class="sy">'+sym+'</span><b>'+val+'</b><small>'+lab+'</small></div>';}
  var V={PV0:f(pOf(m.Cv,26.8),0),SV:f(sat(m.Pv,m.P50v),0),P50:f(m.P50v,1),DPH:f(7.40-m.dpH,2),PVC:f(s.PaCO2+m.dCO2,0),PAC:f(s.PaCO2,0),DC:f(m.dCO2,0),FI:f(S.Fi/100,2),PB:f(s.Pb,0),CO2:f(s.PaCO2,0),PA:f(PA,0),CA:f(m.Ca,1),CV:f(m.Cv,1),VO2:f(m.need,0),Q:f(m.Q,0),PV:f(m.Pv,0),VO:f(m.up,0)};
  var tip=HK?((HK==='P2'&&S.bohr?'<div class="vig">'+U.vigB+'</div>':'')+U.tip[HK]).replace(/\{(\w+)\}/g,function(_,k){return V[k];}):'<span style="color:#55697A">'+U.tipHint+'</span>';
  var aV=ar(VO,250,15),aA=ar(S.A,70,2),aT=ar(S.T,0.5,0.05),aP1=ar(PA,100,3),aP2=ar(m.Pv,40,2);
  var H='<div class="eqr">'+tile('V̇O₂',f(VO,0)+aV,'mL/min',aV,'V')+'<span class="op">=</span>'+tile('D',U.dConst,U.dLab,'','D')+'<span class="op">·</span>'+tile('A',f(S.A,0)+' m²'+aA,U.aLab,aA,'A')+
   '<span class="op">·</span><span class="op">(</span>'+tile('P₁',f(PA,0)+' mmHg'+aP1,U.p1Lab,aP1,'P1')+'<span class="op">−</span>'+'<span class="cap cb'+(S.bohr?'':' off')+'"><span class="ct">'+(S.bohr?U.capB:U.capBoff)+'</span>'+tile('P₂',f(m.Pv,0)+' mmHg'+aP2,U.p2Lab,aP2,'P2')+'</span>'+'<span class="op">)</span><span class="op">/</span>'+tile('T',f(S.T,1)+' µm'+aT,U.tLab,aT,'T')+'</div>'+
   '<div class="tip">'+tip+'</div>'+
   do2+'<div class="cap ch2'+(S.hald?'':' off')+'" style="display:block;margin:8px 0 6px"><span class="ct">'+(S.hald?U.capH:U.capHoff)+'</span><p style="font-size:13px;color:#16222E;margin:0">'+U.co2L.replace('{PVC}',f(s.PaCO2+m.dCO2,0)).replace('{PAC}',f(s.PaCO2,0)).replace('{DC}',f(m.dCO2,0))+(S.hald?'':' <b style="color:#B5520C">'+U.noHald+'</b>')+'</p>'+'</div>'+
   '<p><b style="color:'+st[0]+'">SpO₂ '+f(SAT,0)+' % · '+(DEAD?U.deadS:st[1])+'</b> '+(SAT<94||DEAD?why(m,s):'')+(low&&!DEAD?' <b style="color:#A32D2D">'+(SAT>=94?U.hidden:U.hidden2)+'</b>':'')+'</p>';if(H!==LASTH){$('#res').innerHTML=H;LASTH=H;}}
function tick(ts){if(t0===null)t0=ts;var dt=Math.min(0.05,(ts-t0)/1000);t0=ts;var s=ss(),m=model();
  if(!PZ){var rate=(12+28*S.w/100)*(S.ve<1?0:Math.min(1.6,0.5+S.ve/200));ph+=dt*rate/60*2*Math.PI*1.5;flow=(flow+dt/(m.tt*4))%1;
    if(!DEAD){PA+=(s.PAss-PA)*Math.min(1,dt/1.5);var tg=sat(m.Pend);SAT+=(tg-SAT)*Math.min(1,dt/0.8);
      if(SAT<60||m.short){lowT+=dt;if(lowT>1.5){DEAD=true;$('#dT').textContent=U.deadT;$('#dM').textContent=why(m,s)||U.wDiff;$('#again').textContent=U.again;$('#dead').style.display='flex';}}else lowT=0;}}
  draw(m,s);requestAnimationFrame(tick);}
$('#res').addEventListener('mouseover',function(e){var t=e.target.closest('.tm');if(t)HK=t.getAttribute('data-k');});
$('#res').addEventListener('pointerdown',function(e){var t=e.target.closest('.tm');if(t)HK=t.getAttribute('data-k');});
$('#res').addEventListener('focusin',function(e){var t=e.target.closest('.tm');if(t)HK=t.getAttribute('data-k');});
ctl();setPre(0);requestAnimationFrame(tick);
