<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formula animations</title>
<link rel="stylesheet" href="widget.css">
<style>
body{margin:0;padding:8px 10px 10px}
.fm{text-align:center;margin:2px 0 6px;min-height:46px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 5px;font-size:18px;line-height:1.1}
.fm b{display:inline-block;transition:font-size .15s}
.fm span{color:#55697A}
canvas{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:10px;background:#FFFFFF}
.out{display:flex;align-items:center;gap:10px;margin:8px 0 6px;font-size:14px;flex-wrap:wrap}
.out .lab{font-weight:700;min-width:64px}
.bar{position:relative;flex:1 1 180px;height:16px;border-radius:8px;background:#EEF2F5;border:1px solid var(--border);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:8px}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#16222E}
.out .val{font-weight:700;min-width:150px}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px 18px;margin:6px 0 4px}
.sl label{display:block;font-size:13px;line-height:1.3}
.sl label b{font-size:15px}
.sl label em{font-style:normal;float:right;font-weight:700}
.sl label small{display:block;color:#55697A;font-size:12px}
.sl input{width:100%;margin:2px 0 0}
.up{color:#0E7C66;font-weight:700}.dn{color:#B03A3A;font-weight:700}
.scn{display:flex;gap:8px;align-items:stretch}.scn canvas{flex:1 1 0;min-width:0}#man{flex:0 0 150px;border:1px solid var(--border);border-radius:10px;background:#FFFFFF;display:flex;align-items:flex-end;justify-content:center}#man[hidden]{display:none}#man svg{display:block;width:100%;height:auto}.mech{margin:6px 0 2px;padding:6px 10px;border-left:4px solid #1456A8;background:#EEF4FC;font-size:13.5px;line-height:1.4}.mech b{color:#1456A8}@media (max-width:520px){#man{flex-basis:96px}}
.pre{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.pre button{font:inherit;font-size:13px;padding:4px 11px;border-radius:999px;border:1.5px solid #1456A8;background:#FFFFFF;color:#1456A8;font-weight:700;cursor:pointer}.pre button.on{background:#1456A8;color:#FFFFFF}
.rs{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--border-strong);background:#FFFFFF;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<h2 class="sr-only" id="sr"></h2>
<div class="fm" id="fm" aria-hidden="true"></div>
<div class="scn"><div id="man" hidden></div><canvas id="cv" width="680" height="250"></canvas></div>
<p class="mech" id="mech" hidden></p>
<div class="out"><span class="lab" id="ol"></span><div class="bar"><i id="bi"></i><u id="bu"></u></div><span class="val" id="ov"></span></div>

<div class="sl" id="sl"></div>
<button type="button" class="rs" id="rs"></button>
