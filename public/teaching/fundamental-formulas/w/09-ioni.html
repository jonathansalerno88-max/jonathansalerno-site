.bt{font:700 14.5px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;padding:8px 14px;border-radius:9px;border:2px solid #1456A8;background:#1456A8;color:#FFFFFF;cursor:pointer;margin:2px 2px 6px}

.ck{display:flex;align-items:center;gap:8px;font:700 14px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;margin:4px 2px 6px;cursor:pointer;user-select:none}
.ck input{width:19px;height:19px;margin:0;flex:0 0 auto;accent-color:#6A3A96}
.ck[hidden]{display:none}
.ct{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 2px 6px}
.ct[hidden]{display:none}
.bt.pb{margin:0;min-width:112px;border-color:#6A3A96;background:#6A3A96}
.bt.pg{margin:0;background:#FFFFFF;color:#16222E;border-color:#55697A}
.st{font:700 13px/1 system-ui,-apple-system,Segoe UI,sans-serif;width:30px;height:30px;border-radius:50%;border:2px solid #9AA7B2;background:#FFFFFF;color:#55697A;cursor:pointer;padding:0}
.st.on{border-color:#6A3A96;background:#6A3A96;color:#FFFFFF}
.st.dn{border-color:#6A3A96;color:#6A3A96}
.rd{font-size:14px;line-height:1.45;margin:6px 2px 2px}
.rd b{font-weight:700}
.fm{font-size:17px;font-weight:700;margin:4px 2px;line-height:1.5}
.lg{font-size:12px;line-height:1.4;color:#55697A;margin:4px 2px 0}
.lgd{margin:8px 2px 2px;border:1px solid #D5DCE3;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.4}
.lgd summary{cursor:pointer;font-weight:700;font-size:13.5px}
.lgd ul{list-style:none;margin:8px 0 2px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:5px 16px}
.lgd li{display:flex;gap:8px;align-items:flex-start}
.lgd i{flex:0 0 16px;width:16px;height:16px;border-radius:3px;margin-top:1px;border:1px solid rgba(22,34,46,.25);box-sizing:border-box}
.lgd p{margin:8px 0 2px;color:#55697A;font-size:12.5px}
.lgd ol.cs{margin:8px 0 4px;padding-left:22px;font-size:14.5px;font-weight:700;line-height:1.7}
.lgd ol.cs{list-style:decimal}
.lgd ol.cs li{display:list-item;padding-left:2px}
.pn{position:relative}
svg text{pointer-events:none}
.tip{position:absolute;z-index:5;pointer-events:none;background:#16222E;color:#FFFFFF;font:600 13px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;padding:5px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-135%)}
.tip[hidden]{display:none}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.35}}
.pls{animation:pls 1.1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pls{animation:none}}
.sr{position:absolute;left:-9999px}
</style>

var CAP=[[T('0 · Gibbs-Donnan spento','0 · Gibbs-Donnan off'),T('Le proteine ci sono, con le loro 17 cariche negative. Il Na⁺ è pari ai due lati: 145 e 145. Il Cl⁻ no: 102 nel plasma contro 117 fuori. <b>Il Cl⁻ non è contento</b>: attraversa la parete liberamente e vorrebbe pareggiare la concentrazione.','The proteins are there, with their 17 negative charges. Na⁺ is equal on both sides: 145 and 145. Cl⁻ is not: 102 in plasma against 117 outside. <b>Cl⁻ is not happy</b>: it crosses the wall freely and wants to level its concentration.')],
[T('1 · Il Cl⁻ entra nel plasma','1 · Cl⁻ enters plasma'),T('Il Cl⁻ va dove ce n’è meno. Ma così il plasma ha cariche negative in più: <b>l’elettroneutralità non è rispettata</b>. Separare cariche costa un’energia enorme, un ΔG altissimo e positivo: non può durare. <b>Serve Na⁺</b> per pareggiare le cariche. Nella realtà il Cl⁻ «precede» solo di una quantità minuscola: qui lo scarto è esagerato per vederlo.','Cl⁻ goes where there is less of it. But now plasma has extra negative charges: <b>electroneutrality is violated</b>. Separating charges costs an enormous energy, a very high positive ΔG: it cannot last. <b>Na⁺ is needed</b> to balance the charges. In reality Cl⁻ gets “ahead” only by a minute amount: the gap is exaggerated here so you can see it.')],
[T('2 · Entra il Na⁺','2 · Na⁺ enters'),T('Il Na⁺ accompagna il Cl⁻ e le cariche tornano pari, 165 e 165. Ora gli ioni sono fermi: ΔG = 0 per tutti e due, con più Na⁺ e meno Cl⁻ nel plasma che fuori. <b>Ma c’è un problema di osmoli</b>: le colonne del plasma sono più alte di quelle dell’interstizio (fascia che lampeggia, +12 mEq/L per colonna), cioè nel plasma ci sono più particelle.','Na⁺ accompanies Cl⁻ and the charges level again, 165 and 165. Now the ions are at rest: ΔG = 0 for both, with more Na⁺ and less Cl⁻ in plasma than outside. <b>But there is an osmole problem</b>: the plasma columns are taller than those of the interstitium (flashing band, +12 mEq/L per column), meaning plasma holds more particles.')],
[T('3 · Entra l’acqua: le proteine si diluiscono','3 · Water enters: the proteins are diluted'),T('O una parete rigida impedisce al vaso di gonfiarsi, o l’acqua entra. Entrando diluisce le proteine: la fascia rosa scende da 17 a 9 (nel disegno la diluizione è esagerata, per vederla). Ma se scende solo lei, la colonna degli anioni resta più bassa di quella dei cationi, 157 contro 165: <b>di nuovo l’elettroneutralità violata</b>. Due strade: entra altro Cl⁻, esce un po’ di Na⁺, oppure tutte e due.','Either a rigid wall keeps the vessel from swelling, or water enters. As it enters it dilutes the proteins: the pink band falls from 17 to 9 (the dilution is exaggerated in the drawing, to make it visible). But if it alone falls, the anion column is left shorter than the cation column, 157 against 165: <b>electroneutrality is violated again</b>. Two ways out: more Cl⁻ enters, a little Na⁺ leaves, or both.')],
[T('4 · Tutte e due: gli ioni si riaggiustano','4 · Both: the ions readjust'),T('Entra un po’ di Cl⁻ (da 111 a 114) ed esce un po’ di Na⁺ (da 153 a 149): colonne di nuovo pari, 161 e 161. Gli ioni non restano scontenti: si spostano finché il ΔG torna zero per entrambi, in un nuovo equilibrio un po’ più debole del precedente. È un <b>equilibrio dinamico</b>: guarda i pallini alla parete, Na⁺ e Cl⁻ continuano ad attraversarla nei due sensi, tanti entrano quanti escono. Le proteine sono cambiate di quasi la metà, gli ioni di meno del 3%: <b>l’acqua diluisce le proteine, non gli ioni</b>. Per questo la differenza non si annulla mai, e a fermare l’acqua è una pressione, quella idrostatica del sangue: è Starling. <b>In clinica</b>: dopo un’infusione di soluzione fisiologica il sodio cambia poco, mentre albumina ed ematocrito scendono.','A little Cl⁻ enters (from 111 to 114) and a little Na⁺ leaves (from 153 to 149): columns level again, 161 and 161. The ions do not stay unhappy: they shift until ΔG is zero again for both, in a new equilibrium slightly weaker than the previous one. It is a <b>dynamic equilibrium</b>: watch the dots at the wall, Na⁺ and Cl⁻ keep crossing it in both directions, as many in as out. Proteins changed by almost half, ions by less than 3%: <b>water dilutes the proteins, not the ions</b>. This is why the difference never vanishes, and what stops the water is a pressure, the hydrostatic pressure of blood: that is Starling. <b>In the clinic</b>: after an infusion of normal saline sodium changes little, while albumin and haematocrit fall.')],
[T('5 · Il Na⁺ resta in ostaggio','5 · Na⁺ is held hostage'),T('Nel plasma c’è più Na⁺ che fuori, circa 149 contro 145. Vorrebbe tornare nell’interstizio, ma non può: il plasma, per via delle proteine, è leggermente negativo e lo trattiene. Da solo lascerebbe cariche spaiate; in coppia con il Cl⁻ nemmeno, perché fuori di Cl⁻ ce n’è già di più. <b>È entrato legittimamente e non può più uscire.</b> Questo è lo stato reale: rimetti la spunta per tornare al grafico.','Plasma has more Na⁺ than outside, about 149 against 145. It would like to go back to the interstitium, but it cannot: because of the proteins, plasma is slightly negative and holds it. Alone it would leave unpaired charges; paired with Cl⁻ it cannot either, because there is already more Cl⁻ outside. <b>It entered legitimately and can no longer leave.</b> This is the real state: tick the box again to return to the chart.')]];

 if(tg&&mode==='C'){document.getElementById('rd').innerHTML='<p class="fm"><span style="color:#B03A3A">AG</span> = <span style="color:'+CNa+'">Na⁺</span> − (<span style="color:#2F7FC0">Cl⁻</span> + <span style="color:#5C8F2A">HCO₃⁻</span>) = <span style="color:'+CNa+'">142</span> − (<span style="color:#2F7FC0">103</span> + <span style="color:#5C8F2A">25</span>) = <span style="color:#B03A3A">14 mEq/L</span></p><p class="rd">'+T('<b>Il gap non è un buco.</b> Le due colonne sono alte uguali: il plasma è neutro. Il laboratorio misura Na⁺, Cl⁻ e HCO₃⁻; quello che manca per pareggiare sono gli anioni non misurati (soprattutto albumina) meno i cationi non misurati: 25 − 11 = 14.','<b>The gap is not a hole.</b> The two columns are equally tall: plasma is neutral. The laboratory measures Na⁺, Cl⁻ and HCO₃⁻; what is missing to balance are the unmeasured anions (mostly albumin) minus the unmeasured cations: 25 − 11 = 14.')+'</p><p class="lg"><b style="color:#B03A3A">AG</b> ('+T('anion gap, gap anionico','anion gap')+') [N L⁻³], mEq/L; <b style="color:'+CNa+'">Na⁺</b>, <b style="color:#2F7FC0">Cl⁻</b>, <b style="color:#5C8F2A">HCO₃⁻</b> = '+T('concentrazioni nel plasma','concentrations in plasma')+' [N L⁻³], mEq/L (mEq = mmol × '+T('carica dello ione','charge of the ion')+'). '+T('Qui i valori sono quelli del referto, per litro di plasma; nel grafico a tre comparti sono per litro d’acqua. L’intervallo normale dipende dal laboratorio.','Here the values are those of the lab report, per litre of plasma; in the three-compartment chart they are per litre of water. The normal range depends on the laboratory.')+'</p>';return;}
 var f=function(v){return it?String(v).replace('.',','):String(v);};
 document.getElementById('rd').innerHTML=tg?'<p class="rd">'+T('<b>Nota i due assi verticali.</b> A sinistra <b>mmol</b>: la quantità totale di Na⁺ e K⁺ dei tre comparti (concentrazione × litri di ogni comparto). A destra <b>litri</b>: l’acqua totale.','<b>Note the double y axis.</b> On the left <b>mmol</b>: the total amount of Na⁺ and K⁺ of the three compartments (concentration × litres of each compartment). On the right <b>litres</b>: the total water.')+'</p>':'<p class="rd">'+T('<b>Nota i due assi verticali.</b> A sinistra <b>mEq/L</b>, per gli ioni; a destra <b>litri</b>, per l’acqua. Le concentrazioni sono per litro d’acqua del comparto: per questo il Na⁺ del plasma è 153 e non il 142 del referto, che è per litro di plasma (circa il 7% del plasma non è acqua).','<b>Note the double y axis.</b> On the left <b>mEq/L</b>, for the ions; on the right <b>litres</b>, for the water. Concentrations are per litre of water of the compartment: this is why plasma Na⁺ is 153 and not the 142 of the lab report, which is per litre of plasma (about 7% of plasma is not water).')+'</p>'+DON+'<p class="rd" style="display:none"></p><p class="fm" style="font-size:15.5px"><span style="color:#B03A3A">mEq</span> = <span style="color:#1456A8">mmol</span> × <span style="color:#6A3A96">z</span></p><p class="rd">'+T('<b style="color:#6A3A96">z</b> è il numero di cariche dello ione (la valenza). Per gli ioni semplici è fisso: Na⁺ vale 1, Ca²⁺ vale 2, quindi 1 mmol di Ca²⁺ = 2 mEq. Non sempre però z è la valenza che si legge nella formula: a pH 7,4 il fosfato è una miscela di HPO₄²⁻ e H₂PO₄⁻, circa 4 a 1, quindi 1 mmol porta circa 1,8 mEq e non 3.','<b style="color:#6A3A96">z</b> is the number of charges of the ion (its valence). For simple ions it is fixed: Na⁺ counts 1, Ca²⁺ counts 2, so 1 mmol of Ca²⁺ = 2 mEq. But z is not always the valence you read in the formula: at pH 7.4 phosphate is a mixture of HPO₄²⁻ and H₂PO₄⁻, about 4 to 1, so 1 mmol carries about 1.8 mEq and not 3.')+'</p><details class="lgd"><summary>'+T('Come si calcola l’1,8 del fosfato','How the 1.8 of phosphate is calculated')+'</summary><ol class="cs"><li>log (<span style="color:#8E1D4A">'+T('rapporto','ratio')+'</span>) = <span style="color:#1456A8">pH</span> − <span style="color:#C2571A">pKa</span> = <span style="color:#1456A8">'+T('7,4','7.4')+'</span> − <span style="color:#C2571A">'+T('6,8','6.8')+'</span> = '+T('0,6','0.6')+'</li><li><span style="color:#8E1D4A">'+T('rapporto','ratio')+'</span> = 10<sup>'+T('0,6','0.6')+'</sup> ≈ <span style="color:#8E1D4A">4</span>: '+T('4 molecole di <span style="color:#0E7C5A">HPO₄²⁻</span> per ogni molecola di <span style="color:#B87A00">H₂PO₄⁻</span>','4 molecules of <span style="color:#0E7C5A">HPO₄²⁻</span> for every molecule of <span style="color:#B87A00">H₂PO₄⁻</span>')+'</li><li>'+T('Su 5 molecole le cariche sono','In 5 molecules the charges are')+' <span style="color:#0E7C5A">4 × 2</span> + <span style="color:#B87A00">1 × 1</span> = 9</li><li><span style="color:#6A3A96">z</span> = 9 / 5 = <span style="color:#6A3A96">'+T('1,8','1.8')+'</span>: 1 mmol = '+T('1,8','1.8')+' mEq</li></ol><p><b style="color:#1456A8">pH</b> '+T('del plasma','of plasma')+' [1]; <b style="color:#C2571A">pKa</b> '+T('della reazione','of the reaction')+' H₂PO₄⁻ ⇌ HPO₄²⁻ + H⁺ [1]; <b style="color:#8E1D4A">'+T('rapporto','ratio')+'</b> = HPO₄²⁻ / H₂PO₄⁻ [1]; <b style="color:#6A3A96">z</b> = '+T('cariche medie per molecola','mean charges per molecule')+' [1]. '+T('Le altre due forme, H₃PO₄ e PO₄³⁻, a questo pH sono meno di una molecola su diecimila. Lo stesso giro vale per ogni acido debole: pH − pKa dà il logaritmo del rapporto.','The other two forms, H₃PO₄ and PO₄³⁻, are fewer than one molecule in ten thousand at this pH. The same route works for any weak acid: pH − pKa gives the logarithm of the ratio.')+'</p></details><p class="lg"><b style="color:#B03A3A">mEq</b> = '+T('milliequivalenti, quantità di carica','milliequivalents, amount of charge')+' [N]; <b style="color:#1456A8">mmol</b> = '+T('millimoli, quantità di sostanza','millimoles, amount of substance')+' [N]; <b style="color:#6A3A96">z</b> = '+T('cariche per ione, numero puro','charges per ion, pure number')+' [1].</p>';}

document.getElementById('sr').textContent=T('Grafico a colonne dei tre comparti: acqua, cationi e anioni di plasma, interstizio e cellula muscolare. Un pulsante raccoglie tutta l’acqua (42 litri) in una colonna e tutto il sodio e il potassio in un’altra. Una casella mostra l’effetto Gibbs-Donnan tra plasma e interstizio.','Column chart of the three compartments: water, cations and anions of plasma, interstitium and muscle cell. A button gathers all the water (42 litres) into one column and all the sodium and potassium into another. A checkbox shows the Gibbs-Donnan effect between plasma and interstitium.');

(function(){var L=[[COL.na,'Na⁺',T('sodio, z = 1','sodium, z = 1')],[COL.k,'K⁺',T('potassio, z = 1','potassium, z = 1')],[COL.mg,'Mg²⁺',T('magnesio, z = 2','magnesium, z = 2')],[COL.cl,'Cl⁻',T('cloruro, z = 1','chloride, z = 1')],[COL.hc,'HCO₃⁻',T('bicarbonato, z = 1','bicarbonate, z = 1')],[COL.pr,T('proteine','proteins'),T('cariche negative delle proteine (nel plasma soprattutto albumina); z alto e variabile col pH','negative charges of proteins (in plasma mostly albumin); z high and variable with pH')],[COL.org,T('fosfati, organici','phosphates, organic'),T('fosfati e anioni organici della cellula; fosfato z ≈ 1,8 a pH 7,4','phosphates and organic anions of the cell; phosphate z ≈ 1.8 at pH 7.4')],[COL.ot,T('altri','others'),T('fuori dalle cellule Ca²⁺ (z = 2) e Mg²⁺ (z = 2) tra i cationi; solfato (z = 2), fosfato (z ≈ 1,8) e acidi organici tra gli anioni','outside the cells Ca²⁺ (z = 2) and Mg²⁺ (z = 2) among the cations; sulphate (z = 2), phosphate (z ≈ 1.8) and organic acids among the anions')],['#D6EEFB',T('acqua','water'),T('litri del comparto, da leggere sull’asse azzurro a destra','litres of the compartment, read on the blue axis on the right'),'1.5px dashed #5AA9DA'],['#B03A3A',T('parete del capillare','capillary wall'),T('separa plasma e interstizio','separates plasma and interstitium')],['#1456A8',T('membrana cellulare','cell membrane'),T('separa interstizio e cellula','separates interstitium and cell')],['#1F8A4C',T('lucchetto aperto','open padlock'),T('lo ione attraversa quella barriera. Parete del capillare: Na⁺, K⁺ e Cl⁻. Membrana cellulare a riposo: K⁺ e Cl⁻','the ion crosses that barrier. Capillary wall: Na⁺, K⁺ and Cl⁻. Cell membrane at rest: K⁺ and Cl⁻')],['#B03A3A',T('lucchetto chiuso','closed padlock'),T('non la attraversa, o quasi. Le proteine (Pr) in entrambe le barriere; il Na⁺ nella membrana cellulare, dove passa pochissimo e la pompa lo riporta fuori','it does not cross, or barely. Proteins (Pr) at both barriers; Na⁺ at the cell membrane, where it barely crosses and the pump takes it back out')],['#FFE14D','ATP',T('pompa Na⁺/K⁺: 3 Na⁺ fuori, 2 K⁺ dentro per ogni ATP','Na⁺/K⁺ pump: 3 Na⁺ out, 2 K⁺ in per ATP')]];
 document.getElementById('lgb').innerHTML='<ul>'+L.map(function(q){return '<li><i style="background:'+q[0]+(q[3]?';border:'+q[3]:'')+'"></i><span><b>'+q[1]+'</b>: '+q[2]+'</span></li>';}).join('')+'</ul><p>'+T('<b>z</b> = numero di cariche per ione: mEq = mmol × z. <b>+</b> = cationi, <b>−</b> = anioni. Il numero sopra ogni comparto è il totale di una colonna in <b>mEq/L</b> (mEq = milliequivalenti: mmol × carica dello ione). Asse a sinistra: mEq/L. Asse a destra: litri.','<b>z</b> = number of charges per ion: mEq = mmol × z. <b>+</b> = cations, <b>−</b> = anions. The number above each compartment is the total of one column in <b>mEq/L</b> (mEq = milliequivalents: mmol × charge of the ion). Left axis: mEq/L. Right axis: litres.')+'</p>';})();
txt();setD();
