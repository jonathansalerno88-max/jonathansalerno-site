<!doctype html>
<html lang="en">
<head>

<title>The three compartments: ions and water</title>
<link rel="stylesheet" href="widget.css">
<style>

<body>

<div class="pn">
 <button type="button" class="bt" id="bt"></button>

<script>
(function(){

 {x:478,n:T('cellula muscolare','muscle cell'),L:28,tot:196,c:[['na',12,'Na⁺'],['mg',34,'Mg²⁺'],['k',150,'K⁺']],a:[['pr',55,PR],['hc',14,'HCO₃⁻, Cl⁻'],['org',127,T('fosfati,|organici','phosphates,|organic')]]}];

[0,1,2].forEach(function(i){var g=G[i];g.c.forEach(function(q){if(q[0]==='na'){q.B={x:XB,y:yNa-q[1]*g.L*hB,w:WB,h:q[1]*g.L*hB};yNa-=q[1]*g.L*hB;}});});
G.forEach(function(g){
 var r=mk('rect',{fill:'#D6EEFB',stroke:'#5AA9DA','stroke-width':1.2,'stroke-dasharray':'4 3'});mov.push({e:r,A:{x:g.x,y:Y0-g.wh,w:W,h:g.wh},B:g.wB});
 var lt=mk('text',{x:g.x+W/2,y:g.wh>40?Y0-g.wh+15:Y0-g.wh/2+4,'font-size':11.5,'font-weight':700,fill:INK,'text-anchor':'middle'},g.L+' L');fad.push(lt);
 [g.c,g.a].forEach(function(col,ci){var cx=g.x+W+ci*W,y=Y0;col.forEach(function(q){var h=q[1]*S;y-=h;
   var r=mk('rect',{fill:COL[q[0]],stroke:'#FFFFFF','stroke-width':1});
   if(q.B)mov.push({e:r,A:{x:cx,y:y,w:W,h:h},B:q.B});else{r.setAttribute('x',cx);r.setAttribute('y',y);r.setAttribute('width',W);r.setAttribute('height',h);fad.push(r);}
   if(q[2]&&q[2].indexOf('|')>0){var ab=q[2].split('|'),t2=mk('text',{x:cx+W/2,y:y+h/2-3,'font-size':11.5,'font-weight':600,fill:INK,'text-anchor':'middle'},ab[0]);mk('tspan',{x:cx+W/2,dy:14},ab[1],t2);fad.push(t2);}
   else if(q[2]&&h>=13)fad.push(mk('text',{x:cx+W/2,y:y+h/2+4,'font-size':q[2].length>9?11:12.5,'font-weight':600,fill:INK,'text-anchor':'middle'},q[2]));
 });});
 mk('text',{x:g.x+2*W,y:Y0-g.tot*S-6,'font-size':11.5,fill:MU,'text-anchor':'middle'},g.tot,gA);
 mk('text',{x:g.x+87,y:Y0+36,'font-size':13.5,'font-weight':700,fill:INK,'text-anchor':'middle'},g.n,gA);
 [[29,T('acqua','water')],[87,'+'],[145,'−']].forEach(function(q){mk('text',{x:g.x+q[0],y:Y0+16,'font-size':11,fill:MU,'text-anchor':'middle'},q[1],gA);});
});
[[245,T('parete del capillare','capillary wall'),'#B03A3A'],[451,T('membrana cellulare','cell membrane'),'#1456A8']].forEach(function(q){mk('rect',{x:q[0],y:Y0-205*S,width:22,height:205*S,rx:4,fill:q[2],'fill-opacity':.85},null,gA);mk('text',{x:q[0]+15,y:Y0-150,'font-size':11.5,'font-weight':600,fill:'#FFFFFF','text-anchor':'middle',transform:'rotate(-90 '+(q[0]+15)+' '+(Y0-150)+')'},q[1],gA);});
var py=Y0-66;mk('circle',{cx:462,cy:py,r:15,fill:'#FFE14D',stroke:INK,'stroke-width':1.2},null,gA);mk('text',{x:462,y:py+4,'font-size':10.5,'font-weight':700,fill:INK,'text-anchor':'middle'},'ATP',gA);
mk('path',{d:'M445 '+(py+6)+' H397 m0 0 l7 -4 v8z',stroke:INK,'stroke-width':1.6,fill:INK},null,gA);mk('text',{x:418,y:py+20,'font-size':11,'font-weight':700,fill:INK,'text-anchor':'middle'},'3 Na⁺',gA);
mk('path',{d:'M479 '+(py-6)+' H527 m0 0 l-7 -4 v8z',stroke:INK,'stroke-width':1.6,fill:INK},null,gA);mk('text',{x:506,y:py-11,'font-size':11,'font-weight':700,fill:INK,'text-anchor':'middle'},'2 K⁺',gA);
sv.appendChild(gA);
// B decoration
var R0=function(v){return Math.round(v);};
mk('path',{d:'M'+(XB-22)+' '+(Y0-212)+' V'+Y0+' H'+(XB+2*WB+22)+' V'+(Y0-212),stroke:MU,'stroke-width':1,fill:'none'},null,gB);
mk('path',{d:'M'+(XB-30)+' '+(Y0-200)+' H'+(XB+2*WB+30),stroke:INK,'stroke-width':1.2,'stroke-dasharray':'5 4',fill:'none'},null,gB);
mk('text',{x:XB-28,y:Y0-196,'font-size':12,'font-weight':700,fill:INK,'text-anchor':'end'},R0(TOT),gB);mk('text',{x:XB-28,y:Y0+4,'font-size':12,fill:MU,'text-anchor':'end'},'0',gB);
mk('text',{x:XB-28,y:Y0-216,'font-size':12,'font-weight':700,fill:INK,'text-anchor':'end'},'mmol',gB);
mk('text',{x:XB+2*WB+28,y:Y0-196,'font-size':12,'font-weight':700,fill:CW},WT,gB);mk('text',{x:XB+2*WB+28,y:Y0+4,'font-size':12,fill:CW},'0',gB);
mk('text',{x:XB+2*WB+28,y:Y0-216,'font-size':12,'font-weight':700,fill:CW},'L',gB);

mk('text',{x:XB+WB/2,y:Y0-KT*hB/2+5,'font-size':15,'font-weight':700,fill:INK,'text-anchor':'middle'},'K⁺ '+R0(KT),gB);

function draw(){var e=t<.5?2*t*t:1-2*(1-t)*(1-t);
 mov.forEach(function(m){['x','y','w','h'].forEach(function(k){var v=m.A[k]+(m.B[k]-m.A[k])*e;m.e.setAttribute(k==='w'?'width':k==='h'?'height':k,Math.max(0,v).toFixed(2));});});
 var oa=Math.max(0,1-e*2.5).toFixed(2);fad.forEach(function(f){f.setAttribute('opacity',oa);});gA.setAttribute('opacity',oa);gB.setAttribute('opacity',Math.max(0,(e-.6)/.4).toFixed(2));}

 var f=function(v){return it?String(v).replace('.',','):String(v);};
 document.getElementById('rd').innerHTML=tg?'<p class="fm">(<span style="color:'+CNa+'">'+R0(NaT)+'</span> + <span style="color:'+CK+'">'+R0(KT)+'</span>) / <span style="color:'+CW+'">'+WT+'</span> = <span style="color:#B03A3A">'+f(RES.toFixed(0))+' mmol/L</span></p><p class="rd">'+T('<b>Nel plasma però il sodio è 142, non '+RES.toFixed(0)+'.</b> Le cellule hanno più cationi per litro, perché i loro anioni (proteine, fosfati) portano molte cariche in poche particelle; e circa il 7% del plasma non è acqua. Per questo Edelman, misurando le persone, trovò una retta e non una proporzione esatta.','<b>Yet sodium in plasma is 142, not '+RES.toFixed(0)+'.</b> Cells have more cations per litre, because their anions (proteins, phosphates) carry many charges on few particles; and about 7% of plasma is not water. This is why Edelman, measuring people, found a straight line and not an exact proportion.')+'</p><p class="lg"><b style="color:'+CNa+'">'+R0(NaT)+'</b> = '+T('sodio di tutti e tre i comparti','sodium of all three compartments')+' [N], mmol; <b style="color:'+CK+'">'+R0(KT)+'</b> = '+T('potassio di tutti e tre','potassium of all three')+' [N], mmol; <b style="color:'+CW+'">'+WT+'</b> = '+T('acqua totale','total water')+' [L³], L; <b style="color:#B03A3A">'+RES.toFixed(0)+'</b> [N L⁻³], mmol/L. '+T('Quantità = concentrazione × litri del comparto, con i valori arrotondati del grafico.','Amount = concentration × litres of the compartment, with the rounded values of the chart.')+'</p>':'<p class="rd">'+T('Premi il pulsante: l’acqua dei tre comparti si impila in una colonna, il sodio e il potassio in un’altra. Gli altri ioni escono di scena.','Press the button: the water of the three compartments stacks into one column, sodium and potassium into another. The other ions leave the stage.')+'</p>';}

txt();draw();
