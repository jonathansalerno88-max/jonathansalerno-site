 [C/mol] = J/C = V ✓. Legend: <span class=\"fz\">z</span> = charge of the ion [pure number].</p><p><b>What it is for</b>: every time the concentration ratio grows tenfold, E changes by 58 mV (61.5 at 37 °C) for an ion with one charge, and by half that for Ca²⁺, which has two (z = 2).</p>", "elT": "To measure V<sub>m</sub>, insert the two electrodes of the voltmeter", "elRef": "Reference electrode", "elRec": "Recording microelectrode", "elRefS": "reference", "elRecS": "recording", "pIn": "inside the cell", "pOut": "outside", "pUp": "remove", "elM0": "The voltmeter reads nothing: the electrodes are out of the bath.", "el1": "The other electrode is needed too: a voltmeter always measures a <b>difference</b> between two points.", "elSame": "0 mV: both electrodes are in the same fluid, so there is no difference to measure.", "elInv": "Sign reversed: the voltmeter reads recording − reference, here outside − inside. By convention V<sub>m</sub> = inside − outside: the reference goes <b>outside</b>, the microelectrode <b>inside</b>.", "elOk": "✓ Measured: V<sub>m</sub> = inside − outside = <b>{v} mV</b>. The reference sits outside (the zero), the microelectrode has pierced the membrane and is in the cell.", "elArr": "Measure V<sub>m</sub> first: insert the electrodes", "cmpNo": "To compare V<sub>m</sub> with E, first measure V<sub>m</sub>: insert the electrodes (box at the top).", "cmp": "Now V<sub>m</sub> = {vm}, that is {dv} mV from E → {r}", "cmpEq": "<b>equilibrium</b>: the same {g} goes out and comes back in", "cmpD": "net movement <b>{d}</b>", "lvG0": "Glucose has no charge (z = 0): it has no equilibrium potential.", "lvG": "The net movement stops only when the concentration is the same inside and outside. Now: {ci} inside, {co} outside → {r}", "lvL": "<span class=\"fE\">E</span> = equilibrium potential [mV] · <span class=\"fR\">R</span> = gas constant, 8.314 J/(mol·K) · <span class=\"fT\">T</span> = absolute temperature [K] · <span class=\"fF\">F</span> = Faraday cons     o+='<div class="nf">'+C('fE','E')+' = '+FQ(C('fR','R')+' '+C('fT','T'),C('fz','z')+' '+C('fF','F'))+' <span>ln</span> '+FQ(C('fco','[X]<sub>out</sub>'),C('fci','[X]<sub>in</sub>'))+'</div>';
    var tc=S.T===310?'37':'20';
    o+='<p class="lh">'+fill(L.nS,{t:tc,g:I.g})+'</p>';
    o+='<ul class="nv"><li>'+C('fR','R = '+L.Rv)+' J/(mol·K): '+L.nR+'</li><li>'+C('fT','T = '+S.T)+' K: '+fill(L.nT,{t:tc,k:S.T})+'</li><li>'+C('fF','F = '+L.Fv)+' C/mol: '+L.nF+'</li></ul>';
    var Rq=C('fR','R')+' '+C('fT','T'),Zq=C('fz','z')+' '+C('fF','F'),XOq=C('fco','[X]<sub>out</sub>'),XIq=C('fci','[X]<sub>in</sub>'),rr=S.ci/S.co,D=L.dec;
    function n3(v,d){return num(v,d,false);}
    o+='<div class="der"><p class="dt">'+L.dT+'</p>';
    o+='<div class="nf sm">'+C('fE','E')+' = '+FQ(Rq,Zq)+' <span>ln</span> '+FQ(XOq,XIq)+'</div>';
    o+='<div class="nf sm">= '+FQ(Rq,Zq)+' · <b class="da">2'+D+'303</b> · <span>log<sub>10</sub></span> '+FQ(XOq,XIq)+'<span class="tg">(a)</span></div>';
    o+='<div class="nf sm">= '+FQ('<b class="db">−</b> <b class="da">2'+D+'303</b> · '+Rq,Zq)+' · <span>log<sub>10</sub></span> '+FQ(XIq,XOq)+'<span class="tg">(b)</span></div>';
    o+='<p class="dx"><b class="da">(a) '+L.dAt+'</b> '+fill(L.dA,{x:nc(rr),ln:n3(Math.log(rr),2),lg:n3(Math.log10(rr),3),p:n3(2.302585*Math.log10(rr),2)})+'</p>';
    o+='<p class="dx"><b class="db">(b) '+L.dBt+'</b> '+fill(L.dB,{a:nc(S.ci),b:nc(S.co),v:n3(Math.abs(Math.log(rr)),2),s1:Math.log(S.co/S.ci)<0?'−':'+',s2:Math.log(S.ci/S.co)<0?'−':'+'})+'</p></div>';
    o+='<div class="nf sm">'+FQ(C('fR','R')+' '+C('fT','T'),C('fF','F'))+' × 2'+L.dec+'303 = '+FQ(C('fR',L.Rv)+' × '+C('fT',String(S.T)),C('fF',L.Fv))+' × 2'+L.dec+'303 = '+num(k/1000,4)+' V = <b>'+C('fk',ks+' mV')+'</b></div>';
    o+='<p class="lh">'+L.nU+'</p>';
    o+='<div class="nf">'+C('fE','E<sub>'+l+'</sub>')+' <span class="u2">(mV)</span> = '+FQ(C('fk','−'+ks),C('fz','z'))+' <span>log<sub>10</sub></span> '+FQ(XI,XO)+'</div>';
    o+='<div class="nf">= '+FQ(C('fk','−'+ks),C('fz',num(z,0,true)))+' <span>log<sub>10</sub></span> '+FQ(C('fci',nc(S.ci)),C('fco',nc(S.co)))+' = <b>'+C('fE',num(c.E,0,true)+' mV')+'</b></div>';
    if(!measured())o+='<p class="res">'+L.cmpNo+'</p>';else o+='<p class="res">'+fill(L.cmp,{vm:C('fV',num(S.vm,0)+' mV'),dv:num(dv,0,true),r:c.eq?fill(L.cmpEq,{g:I.g}):fill(L.cmpD,{d:dn})})+'</p>';
    o+='<p class="lg">'+fill(L.lvL,{k:ks,t:S.T===310?'37':'20'})+'</p>';
  }else{
    o+='<p class="eq big">'+L.lvG0+'</p>';
    o+='<p class="res">'+fill(L.lvG,{ci:C('fci',fc(S.ci)),co:C('fco',fc(S.co)),r:c.eq?fill(L.cmpEq,{g:I.g}):fill(L.cmpD,{d:dn})})+'</p>';
  }
  o+='</details>';
  $('#tx').innerHTML=o;
  $('#lvd').addEventListener('toggle',function(){if(S.lvO!==this.open){S.lvO=this.open;this.querySelector('.sh').textContent=S.lvO?L.lvC:L.lvE;}});
  document.querySelectorAll('.tb button').forEach(function(b){b.onclick=function(){S.T=+b.dataset.t;RT=8.314*S.T;reset();scene();};});}
function ctlSync(){var c=calc();$('#vm').value=Math.round(S.vb);$('#vmo').textContent=num(S.vb,0)+' mV';
  $('#ci').value=Math.log10(S.ci);$('#co').value=Math.log10(S.co);$('#cio').textContent=fc(S.ci);$('#coo').textContent=fc(S.co);
  var b=$('#eqb');b.disabled=!c.z||c.E<-120||c.E>140;b.innerHTML=c.z?L.eqb+' ('+num(c.E,0,true)+' mV)':L.eqNA;
  document.querySelectorAll('#ions button').forEach(function(x){x.classList.toggle('act',x.dataset.k===S.ion);});
  document.querySelectorAll('#modes button[data-m]').forEach(function(x){x.classList.toggle('act',x.dataset.m===S.mode);});}
function reset(){EV=[];}
function gInit(){if(gfree()){S.u=(S.ci+S.co)/24;}}
function setIon(k){S.ion=k;S.ci=ION[k].ci;S.co=ION[k].co;if(S.free&&S.mode==='pas'){var c=calc();if(c.z)S.vm=Math.max(-120,Math.min(140,c.E));}reset();scene();}
(function(){
  $('#modes').innerHTML='<button data-m="pas" class="m-pas">'+L.pas+'</button><button data-m="act" class="m-act">'+L.act+'</button><span class="sp"></span><button id="pz"></button>';
  document.querySelectorAll('#modes button[data-m]').forEach(function(b){b.onclick=function(){S.mode=b.dataset.m;if(S.mode==='act'&&S.free){S.free=false;S.vm=S.vb;}reset();scene();};});
  var pz=$('#pz');function pzs(){pz.textContent=S.pz?L.play:L.pause;pz.classList.toggle('on',S.pz);}pz.onclick=function(){S.pz=!S.pz;pzs();};pzs();
  $('#vm').oninput=function(){S.vb=+this.value;if(!(S.free&&S.mode==='pas'))S.vm=S.vb;reset();scene();};
  $('#ci').oninput=function(){S.ci=Number(Math.pow(10,+this.value).toPrecision(2));gInit();reset();scene();};
  $('#co').oninput=function(){S.co=Number(Math.pow(10,+this.value).toPrecision(2));gInit();reset();scene();};
  $('#eqb').onclick=function(){var c=calc();if(c.z){S.vb=c.E;S.free=false;S.vm=c.E;reset();scene();}};
  window.selIon=function(k){setIon(k);};
  window.doReset=function(){S.vb=-120;S.free=true;S.mode='pas';S.ins=true;flags();setIon(S.ion);};
  window.togglePlug=function(){window.toggleFree();};
  window.tRef=function(){S.ref=S.ref==='up'?'out':'up';reset();scene();};
  window.tRec=function(){S.rec=S.rec==='up'?'in':'up';reset();scene();};
  window.swapPoles=function(){S.vb=Math.max(-120,Math.min(140,-S.vb));if(!(S.free&&S.mode==='pas'))S.vm=S.vb;reset();scene();};
  window.toggleFree=function(){if(S.mode!=='pas')return;S.free=!S.free;if(!S.free)S.vm=S.vb;if(S.free&&S.pz){S.pz=false;pzs();}gInit();reset();scene();};
  $('#rs').innerHTML=L.rs;$('#rs').onclick=function(){S.vb=-120;S.free=true;S.mode='pas';S.ins=true;flags();setIon(S.ion);};
  $('#rl').innerHTML=L.rule;$('#fn').innerHTML=L.note;
  flags();setIon('K');requestAnimationFrame(step);})();
