tB": "net dipole", "play": "▶ Resume", "vm": "Battery voltage (sets V<sub>m</sub> while plugged in)", "insOffS": "insulator removed: the membrane is leaky", "batShort": "battery short-circuited: V = 0", "fIns": "Remove the insulator (leaky membrane)", "fCirc": "Show the equivalent circuit", "cIn": "INSIDE", "cOut": "OUTSIDE (reference, 0 mV)", "cCap": "insulator:", "cCap2": "bilayer", "cShort1": "insulator removed:", "cShort2": "short circuit", "cRes": "{g} channels", "cBat": "cell = chemical gradient", "cNoQ": "glucose: no charge, no current", "cIo": "out", "cIi": "in", "cExt": "external battery", "cOpen": "switch open", "cShortB": "shorted", "cLeg": "<b>From membrane to circuit</b><ul><li><b>Insulating bilayer</b> → <b>capacitor C<sub>m</sub></b> (≈ 1 µF/cm²): it holds the charge layer, + on one plate and − on the other.</li><li><b>Channels</b> → <b>resistor</b>, that is conductance g: more open channels, more current.</li><li><b>Concentration gradient</b> → <b>cell E</b> (Nernst): the chemical push, written in volts.</li><li><b>External battery</b> → <b>source with a switch</b> (voltage clamp).</li><li><b>Insulator removed</b> → <b>short circuit</b> across the capacitor: V<sub>m</sub> goes to 0.</li></ul>", "cI": "I<sub>{l}</sub> = g<sub>{l}</sub> · (V<sub>m</sub> − E<sub>{l}</sub>) = g<sub>{l}</sub> · ({vm} − {E}) = g<sub>{l}</sub> · ({d} mV) → {r}", "cI0": "no current: equilibrium", "cIoT": "outward current (+ charges leave)", "cIiT": "inward current (+ charges enter)", "batOn": "battery {v} mV", "refT": "Sources of the values in the right-hand panel:", "refs": {"squid": "squid giant axon concentrations and resting potential from Hille B. <i>Ion Channels of Excitable Membranes</i>, 3rd ed., Sinauer 2001, ch. 1.", "frog": "frog skeletal muscle concentrations and resting potential from Hille B. <i>Ion Channels of Excitable Membranes</i>, 3rd ed., Sinauer 2001, ch. 1.", "neuron": "typical mammalian neuron values from Boron WF, Boulpaep EL. <i>Medical Physiology</i>, 3rd ed., Elsevier 2017, ch. 6; Hall JE, Hall ME. <i>Guyton and Hall Textbook of Medical Physiology</i>, 14th ed., 2021.", "cardio": "K⁺, Na⁺ and Ca²⁺ of the human ventricular cardiomyocyte and resting potential from ten Tusscher KHWJ et al. A model for human ventricular tissue. <i>Am J Physiol Heart Circ Physiol</i> 2004;286:H1573–89, and Boron & Boulpaep 2017; internal Cl⁻ is an estimate (about 20–30 mM in the literature).", "sa": "concentrations as in the cardiomyocyte; SA node MDP from Boron WF, Boulpaep EL. <i>Medical Physiology</i>, 3rd ed., 2017, and Hall & Hall 2021.", "skm": "mammalian skeletal muscle concentrations and resting potential from Hille B. <i>Ion Channels of Excitable Membranes</i>, 3rd ed., Sinauer 2001, ch. 1."}, "apLgC": "<b>Ventricular myocyte</b> · 0: I<sub>Na</sub> (Na<sub>v</sub>1.5), Na⁺ in · 1: I<sub>to</sub> (K<sub>v</sub>4.3), K⁺ out · 2: I<sub>Ca,L</sub> (Ca<sub>v</sub>1.2), Ca²⁺ in, against I<sub>Ks</sub>, K⁺ out · 3: I<sub>Kr</sub> (K<sub>v</sub>11.1, hERG) and I<sub>Ks</sub> (K<sub>v</sub>7.1 + minK), K⁺ out · 4: I<sub>K1</sub> (K<sub>ir</sub>2.1), K⁺, holds the resting potential.", "apLgS": "<b>SA node</b> · 4: I<sub>f</sub> (HCN4, “funny”), Na⁺ in, then I<sub>Ca,T</sub> (Ca<sub>v</sub>3.1), Ca²⁺ in · 0: I<sub>Ca,L</sub> (Ca<sub>v</sub>1.3 and 1.2), Ca²⁺ in · 3: I<sub>K</sub> (mainly I<sub>Kr</sub>), K⁺ out.", "apLgN": "<b>Neuron</b> · rise: voltage-gated Na<sub>v</sub> channels, Na⁺ in · fall and undershoot: K<sub>v</sub> channels, K⁺ out · rest: K2P leak channels.", "mDepT": "Depolarise the cell:", "apBg": "In the background:", "axT": "Electrical axis of the heart on Einthoven's figure: drag the vector", "axLead": "Lead II", "axN": "Normal axis", "axLAD": "Left axis deviation", "axRAD": "Right axis deviation", "axEx": "Extreme axis", "axPos": "towards II → positive QRS", "axNeg": "away from II → negative QRS", "axIso": "⊥ to II → equiphasic QRS", "axIsoL": "equiphasic: {l}", "hT": "The depolarisation front in the heart: each little arrow is a dipole", "hNet": "net dipole", "hRA": "RA", "hLA": "LA", "hRV": "RV", "hLV": "LV", "hLeg": ["red = depolarised muscle", "red arrows: depolarisation", "blue arrows: repolarisation"], "hPIdle": ["At rest", "press “Depolarise the cell”", "to start the front"], "hPSA": ["The SA node fires", "the ECG does not show it"], "hPP": ["P wave", "the front crosses the atria,", "starting from the SA node"], "hPPR": ["PR segment", "the AV node slows down, then His", "and branches: tiny mass, no vector"], "hPq": ["q wave", "the septum depolarises", "from left to right"], "hPR": ["R wave", "apex and free walls,", "from endocardium to epicardium"], "hPS": ["S wave", "the bases of the ventricles", "depolarise last"], "hPST": ["ST segment", "all depolarised: no front,", "so the vector is ≈ 0"], "hPT": ["T wave", "the epicardium repolarises first:", "blue dipoles point as in the QRS"], "hPD": ["Diastole", "all at rest again"], "axPhP": "P wave (atria)", "axPhQRS": "QRS (ventricles)", "axPhT": "T wave (repolarisation)", "axPhIso": "Isoelectric", "axInst": "instantaneous vector", "axInst0": "vector ≈ 0", "axRun": "purple: the loop of the tip", "ecgC": "PR = AV node · QRS = phase 0 · ST = plateau · T = phase 3", "ecgSA": "the SA node fires before the P wave: the ECG does not show it", "saGhost": "without I<tspan baseline-shift=\"sub\" font-size=\"7\">f</tspan>: it would go to E<tspan baseline-shift=\"sub\" font-size=\"7\">K</tspan>", "saNote": "<b>SA node: it never reaches rest.</b> During repolarisation V<sub>m</sub> would fall towards E<sub>K</sub> (grey dashes). But while it is still falling, below about −40/−50 mV, the HCN channels open: Na⁺ comes in (I<sub>f</sub>), the fall stops at about −60 mV (MDP) and phase 4 starts again at once. There is no true hyperpolarisation: repolarisation is enough.", "cm": {"Na": "sodium current", "to": "transient outward", "CaL": "L-type, long-lasting", "Ks": "slow delayed rectifier", "Kr": "rapid delayed rectifier", "K1": "inward rectifier", "f": "“funny” current", "CaT": "T-type, transient", "K": "delayed rectifier", "Nav": "voltage-gated", "Kv": "voltage-gated", "K2P": "two-pore, leak"}, "ap_neuron": "neuron", "ap_cardio": "cardiomyocyte", "ap_sa": "SA node", "ap_none": "none", "apThr": "threshold", "apTime": "time", "mD_rest": "↺ Rest", "mD_na": "⚡ Na⁺ channels", "mD_ca": "🧲 Ca²⁺ channels", "mD_lig": "🔑 Ligand (acetylcholine)", "mD_mech": "〽 Stretch (mechanosensitive)", "mStretch": "stretch", "mX_rest": "At rest mainly the K⁺ channels are open: V<sub>m</sub> sits close to E<sub>K</sub>.", "mX_na": "The voltage-gated Na⁺ channels open (P<sub>Na</sub> from 0.05 to 20, as at the peak of an action potential): V<sub>m</sub> rises towards E<sub>Na</sub>.", "mX_ca": "L-type Ca²⁺ channels open, as in phase 0 of the SA and AV nodes and in smooth muscle. E<sub>Ca</sub> is very high, but there is very little Ca²⁺: a huge permeability (P<sub>Ca</sub> = 300) is needed to bring V<sub>m</sub> above zero.", "mX_lig": "Acetylcholine binds the nicotinic receptor of the end plate: the channel lets Na⁺ and K⁺ through almost equally. V<sub>m</sub> goes to about 0 mV, halfway between E<sub>Na</sub> and E<sub>K</sub>, and stops there (end-plate potential).", "mX_mech": "Stretching the membrane opens Piezo channels, non-selective for cations (Na⁺, K⁺ and a little Ca²⁺): same result as the ligand, towards about 0 mV, but a different trigger (touch, baroreceptors).", "mC3rest": "between E<sub>K</sub> ({k}) and E<sub>Na</sub> ({n}), close to E<sub>K</sub>: K⁺ is the most permeable", "mC3na": "now close to E<sub>Na</sub> ({n}): with its channels open, Na⁺ is the most permeable", "mC3ca": "now rising towards E<sub>Ca</sub>: the Ca²⁺ channels have opened", "mC3lig": "now close to 0 mV: the receptor lets Na⁺ and K⁺ through together", "mC3mech": "now close to 0 mV: Piezo channels let the cations through together", "mCaEq": "With Ca²⁺ (z = 2) the simple log form no longer holds: V<sub>m</sub> is the voltage at which the sum of the GHK currents of all the ions is zero. Here {v} mV.", "findIt": "Find it here! →", "mDep": "⚡ Depolarise the cell", "mC3ap": "V<sub>m</sub> follows the action potential: the permeabilities change, not the concentrations", "mRun": "… action potential running", "mX_ap": "The action potential of the {c} starts, slowed down: the black line V<sub>m</sub> follows the curve in the background, and so does the voltmeter. In the bath the permeabilities change: it rises by opening Na⁺ channels (Ca²⁺ channels in the SA node and in the myocyte plateau), and falls by opening K⁺ channels.", "mC3n": "now close to E<sub>Na</sub> ({n}): with its channels open, Na⁺ is the most permeable", "mRest": "↺ Back to rest (close the Na⁺ channels)", "mBack": ["← one ion", "at a time"], "mT": "Several ions together: Goldman", "mQ": "Now K⁺, Na⁺ and Cl⁻ cross together, each through its own channel; Ca²⁺ hardly passes at rest. The membrane potential settles <b>halfway</b> between their equilibrium potentials, closer to that of the most permeable ion, K⁺. Nernst does not give it, since it works one ion at a time: the <b>Goldman–Hodgkin–Katz</b> equation does.", "mCap": "P<sub>K</sub> : P<sub>Na</sub> : P<sub>Cl</sub> : P<sub>Ca</sub> = {pk} : {pn} : {pc} : {pa} (relative permeabilities, pure numbers; at rest 1 : 0.05 : 0.45 : 0). Concentrations as in the bath. 61.5 mV = 2.303 · RT/F at 37 °C.", "mRow": "{g}: V<sub>m</sub> − E<sub>{l}</sub> = {d} mV → {w}", "mOut": "goes out", "mIn": "comes in", "mEq": "at equilibrium", "mShut": "{g}: P ≈ 0, hardly passes at rest", "mC1": "No ion is at equilibrium. Going out: {o}. Coming in: {i}.", "mC2": "Yet V<sub>m</sub> stays put at {v} mV: the currents balance (Goldman)", "mC3": "between E<sub>K</sub> ({k}) and E<sub>Na</sub> ({n}), close to E<sub>K</sub>: K⁺ is the most permeable", "gT": "Membrane potential", "q1": "If the membrane lets <b>a single ion</b> through, the membrane potential coincides with the equilibrium potential of that ion, computed with Nernst.", "q2": "But what if there is more than one ion, as there actually is?", "eqC2": "In bold the ion chosen on the left: it is the membrane potential if only that ion passes (as on the voltmeter). The other ions are dashed. Concentrations inside / outside (mM): {c}. Computed at {t} °C. Indicative values.", "restV": "V<tspan baseline-shift=\"sub\" font-size=\"9\">m</tspan> = {v} mV (Goldman) ≠ E<tspan baseline-shift=\"sub\" font-size=\"9\">{l}</tspan> = {e} mV (Nernst)", "restV0": "V<tspan baseline-shift=\"sub\" font-size=\"9\">m</tspan> = {v} mV (Goldman)", "restW": "in a real cell several ions pass at once, each with its own permeability", "gMeas": "measured", "gF": "Goldman–Hodgkin–Katz equation", "gTipA": "Why does the voltmeter read a different value?", "gTip": "<b>Why does the voltmeter read a different value?</b> In the figure on the left the membrane lets only one ion through, {g}: V<sub>m</sub> goes to its Nernst potential, E<sub>{l}</sub> = {vm} mV. In a real cell several ions pass at once, K⁺, Na⁺ and Cl⁻, each with its own <b>permeability</b>. The resting potential is an average of their potentials weighted by the permeabilities: the Goldman–Hodgkin–Katz equation, here {G} mV. The most permeable ion wins, K⁺ at rest: that is why rest is close to E<sub>K</sub>, but a little more positive because of the Na⁺ that leaks in.", "gC": "P<sub>K</sub> : P<sub>Na</sub> : P<sub>Cl</sub> = {p} (relative permeabilities, pure numbers). Concentrations inside / outside (mM): {c}. {k} mV = 2.303 · RT/F at {t} °C. Ca²⁺ is left out: its resting permeability is negligible. MDP = maximum diastolic potential.", "gRef": "Permeability ratios: for the squid Hodgkin AL, Katz B. <i>J Physiol</i> 1949;108:37–77; for the other cells indicative values, chosen to reproduce the measured potential.", "eqT": "Equilibrium potentials in cells", "eqRest": "rest", "eqMDP": "MDP", "eqC": "Concentrations inside / outside (mM): {c}. Computed at {t} °C. MDP = maximum diastolic potential. Indicative values.", "cells": {"squid": "Squid giant axon", "frog": "Frog skeletal muscle", "neuron": "Mammalian neuron", "cardio": "Human ventricular cardiomyocyte", "sa": "Mammalian SA node cell", "skm": "Mammalian skeletal muscle"}, "rsT": ["Reset:", "physiological", "values"], "sRef": ["Put the reference", "electrode"], "sRec": ["Put the recording", "electrode"], "sBat": ["Put a voltage", "generator (battery)"], "sPump": ["Put a current", "generator (pump)"], "sInv": ["Switch", "the battery"], "nernV": "→ V<tspan baseline-shift=\"sub\" font-size=\"9\">m</tspan> = E<tspan baseline-shift=\"sub\" font-size=\"9\">{l}</tspan> = {v} mV: that is the Nernst potential", "velo": "↑ charge layer on the membrane: {i} inside, {o} outside (very few ions)", "btOff2": ["⏏ Unplug", "the battery"], "btOn2": ["⚡ Plug in", "the battery"], "inv2": ["⇄ Swap", "the poles"], "batOff": "battery unplugged: V<tspan baseline-shift=\"sub\" font-size=\"8\">m</tspan> free", "ci": "Concentration inside", "co": "Concentration outside", "eqb": "Set V<sub>m</sub> = E", "rs": "Physiological values", "eqNA": "no charge, no E", "cnt": "Crossed: <b>{o}</b> outward · <b>{i}</b> inward", "names": {"K": "K⁺", "Na": "Na⁺", "Cl": "Cl⁻", "Ca": "Ca²⁺", "glu": "glucose"}, "Names": {"K": "K⁺", "Na": "Na⁺", "Cl": "Cl⁻", "Ca": "Ca²⁺", "glu": "Glucose"}, "btn": {"K": "K⁺", "Na": "Na⁺", "Cl": "Cl⁻", "Ca": "Ca²⁺", "glu": "glucose"}, "dirOut": "outward", "dirIn": "inward", "wIn": "inside", "wOut": "outside", "neg": "negative", "posi": "positive", "hPas": "{N}: passive, {d}", "hEq": "{N}: at equilibrium", "hAct": "{N}: active, {d}", "Rv": "8.314", "Fv": "96,485", "k58T": "Where does the 58 come from?", "k58": "<p>It is the full Nernst equation, rewritten in two steps:</p><p class=\"eq\"><span class=\"fE\">E</span> = (<span class=\"fR\">R</span> · <span class=\"fT\">T</span>) / (<span class=\"fz\">z</span> · <span class=\"fF\">F</span>) · ln(<span class=\"fco\">C<sub>out</sub></span> / <span class=\"fci\">C<sub>in</sub></span>)</p><ol><li><b>from ln to log₁₀</b>: ln x = 2.303 · log₁₀ x (2.303 = ln 10);</li><li><b>flipping the fraction flips the sign</b>: ln(C<sub>out</sub> / C<sub>in</sub>) = − ln(C<sub>in</sub> / C<sub>out</sub>).</li></ol><p class=\"eq\"><span class=\"fE\">E</span> = − (2.303 · <span class=\"fR\">R</span> · <span class=\"fT\">T</span> / <span class=\"fF\">F</span>) / <span class=\"fz\">z</span> · log₁₀(<span class=\"fci\">C<sub>in</sub></span> / <span class=\"fco\">C<sub>out</sub></span>)</p><p>The number in front is <span class=\"fk\">2.303 · R · T / F</span>:</p><p class=\"eq\">2.303 × <span class=\"fR\">8.314</span> × <span class=\"fT\">293</span> / <span class=\"fF\">96,485</span> = 0.058 V = <b>58 mV</b> (20 °C, lab)</p><p class=\"eq\">2.303 × <span class=\"fR\">8.314</span> × <span class=\"fT\">310</span> / <span class=\"fF\">96,485</span> = 0.0615 V = <b>61.5 mV</b> (37 °C, body; many books write 61)</p><p>Units: [J/(mol·K)] × [K] / [C/mol] = J/C = V ✓. Legend: <span class=\"fz\">z</span> = charge of the ion [pure number].</p><p><b>What it is for</b>: every time the concentration ratio grows tenfold, E changes by 58 mV (61.5 at 37 °C) for an ion with one charge, and by half that for Ca²⁺, which has two (z = 2).</p>", "elT": "To measure V<sub>m</sub>, insert the two electrodes of the voltmeter", "elRef": "Reference electrode", "elRec": "Recording microelectrode", "elRefS": "reference", "elRecS": "recording", "pIn": "inside the cell", "pOut": "outside", "pUp": "remove", "elM0": "The voltmeter reads nothing: the electrodes are out of the bath.", "el1": "The other electrode is needed too: a voltmeter always measures a <b>difference</b> between two points.", "elSame": "0 mV: both electrodes are in the same fluid, so there is no difference to measure.", "elInv": "Sign reversed: the voltmeter reads recording − reference, here outside − inside. By convention V<sub>m</sub> = inside − outside: the reference goes <b>outside</b>, the microelectrode <b>inside</b>.", "elOk": "✓ Measured: V<sub>m</sub> = inside − outside = <b>{v} mV</b>. The reference sits outside (the zero), the microelectrode has pierced the membrane and is in the cell.", "elArr": "Measure V<sub>m</sub> first: insert the electrodes", "cmpNo": "To compare V<sub>m</sub> with E, first measure V<sub>m</sub>: insert the electrodes (box at the top).", "cmp": "Now V<sub>m</sub> = {vm}, that is {dv} mV from E → {r}", "cmpEq": "<b>equilibrium</b>: the same {g} goes out and comes back in", "cmpD": "net movement <b>{d}</b>", "lvG0": "Glucose has no charge (z = 0): it has no equilibrium potential.", "lvG": "The net movement stops only when the concentration is the same inside and outside. Now: {ci} inside, {co} outside → {r}", "lvL": "<span class=\"fE\">E</span> = equilibrium potential [mV] · <span class=\"fR\">R</span> = gas constant, 8.314 J/(mol·K) · <span class=\"fT\">T</span> = absolute temperature [K] · <span class=\"fF\">F</span> = Faraday constant, 96,485 C/mol (C = A·s) · <span class=\"fk\">{k}</span> = 2.303 · R · T / F at {t} °C [mV] · <span class=\"fz\">z</span> = charge of the ion [pure number] · <span class=\"fci\">[ ]<sub>in</sub></span>, <span class=\"fco\">[ ]<sub>out</sub></span> = concentrations inside and outside [mM = mol/m³]", "lvT": "The formula, live", "lvC": "collapse", "lvE": "expand", "nG": "General Nernst equation", "nS": "At {t} °C, in mV and with log₁₀, for {g}: put in the values of R, T and F.", "nR": "the gas constant, an energy per mole and per kelvin (J = kg·m²/s²)", "nT": "the absolute temperature, in kelvin: {t} °C + 273 = {k} K", "nF": "the Faraday constant, the electric charge of one mole of elementary charges (C = A·s)", "nL": "<b>from ln to log₁₀</b>: ln x = 2.303 · log₁₀ x (2.303 = ln 10). Flipping the fraction, [X]<sub>in</sub> / [X]<sub>out</sub> instead of [X]<sub>out</sub> / [X]<sub>in</sub>, brings in the minus sign.", "dT": "From ln to log₁₀, line by line", "dAt": "Why ln x = 2.303 · log₁₀ x?", "dA": "log₁₀ x is the power you raise 10 to in order to get x: x = 10<sup>log₁₀ x</sup>. Take ln of both sides: ln x = log₁₀ x · ln 10, and ln 10 = 2.303. With the numbers now: x = {x}, log₁₀ x = {lg}, 2.303 × {lg} = {p} = ln x ✓", "dBt": "Why the minus sign?", "dB": "The log of a fraction is a difference: ln(a/b) = ln a − ln b. Flip the fraction and you swap the two terms, so only the sign changes: ln({b} / {a}) = {s1}{v}, ln({a} / {b}) = {s2}{v}. It is flipped to get inside/outside, as in the short formula.", "nU": "Units: J/(mol·K) × K / (C/mol) = J/C = V. So:", "lvN": "① Equilibrium potential (Nernst): the voltage at which the blue and red arrows balance", "lvD": "② How far V<sub>m</sub> is from E: this is the net push (purple arrow)", "res0": "Δ<span class=\"mt\">μ</span> = 0 → <b>equilibrium</b>: the same {g} goes out and comes back in, net movement zero.", "resD": "Δ<span class=\"mt\">μ</span> {s} 0 → spontaneous net movement <b>{d}</b>.", "chem0": "<b>① Chemical</b>: the concentration is the same inside and outside, so there is no chemical push (0 kJ/mol).", "chem": "<b>① Chemical</b>: {ci} inside, {co} outside. It is more concentrated {w}, so the chemical gradient pushes it <b>{d}</b> ({v} kJ/mol).", "el0": "<b>② Electrical</b>: {n} has no charge, so the voltage does not move it (0 kJ/mol). The electrochemical gradient is just the chemical one.", "elV0": "<b>② Electrical</b>: V<sub>m</sub> = 0 mV, so there is no electrical push (0 kJ/mol).", "el": "<b>② Electrical</b>: the inside of the cell is {s} ({vm} mV) and {n} is {c}. The voltage pushes it <b>{d}</b> ({v} kJ/mol).", "sum": "<b>③ Sum</b>: Δ<span class=\"mt\">μ</span> = {a} {b} = <b>{v} kJ/mol</b>. The purple arrow is the direction of the <b>net movement</b>: {w} cross both ways, but more go <b>{d}</b> than the other way (see the count under the arrows).", "sumEq": "<b>③ Sum</b>: Δ<span class=\"mt\">μ</span> ≈ 0, the two arrows cancel. This is <b>equilibrium</b>: {n} goes back and forth: it goes out and the same one comes back in, net movement zero (watch the ion circled in purple). In reality they are different ions, but for every exit there is an entry: the count is the same.", "vPas": "<b>Passive</b>: {n} moves {d}, the way the purple arrow points. It goes <b>down</b> its electrochemical gradient, with no energy spent.", "vNote": "Note: it moves {d} even though it is more concentrated {w}. It goes up its concentration gradient but down its electrochemical gradient, so it is still passive. The sum decides, not the concentration alone.", "vAct": "<b>Active</b>: {p} carries {n} <b>{d}</b>, against the purple arrow. It goes <b>up</b> its electrochemical gradient, so it needs energy: {s}.", "vActEq": "<b>Active?</b> At equilibrium there is no uphill: moving {n} costs almost nothing. Move V<sub>m</sub> away from E to see how hard the pump works.", "nern": "<b>Equilibrium potential</b> (Nernst): E<sub>{l}</sub> = <b>{E} mV</b>. With “Set V<sub>m</sub> = E” the red and blue arrows cancel. With V<sub>m</sub> above E {n} {up}, below it {dn}: the flux reverses, which is why E is also called the <b>reversal potential</b>.", "nern0": "<b>No equilibrium potential</b>: without a charge, equilibrium comes only when the concentrations inside and outside are equal.", "exits": "leaves", "enters": "enters", "pChan": "{g} channel", "pGlut": "GLUT", "pPump": "pump", "src": {"atp": "the pump hydrolyses ATP (<b>primary active</b>)", "na": "the same transporter uses Na⁺ coming in down its gradient (<b>secondary active</b>)", "k": "the same transporter uses K⁺ going out down its gradient (<b>secondary active</b>)", "gen": "ATP (primary active) or another ion going down its gradient (secondary active)"}, "pn": {"nka": "the Na⁺/K⁺-ATPase", "pmca": "PMCA (the Ca²⁺-ATPase)", "nkcc": "NKCC1", "kcc": "KCC2", "sglt": "SGLT1", "gen": "an active transporter"}, "eGen": "energy", "rule": "<b>The rule</b><ul><li><span class=\"badge b-pas\">Passive</span> the substance moves the way the purple arrow points: <b>down</b> its electrochemical gradient. No energy is needed. Simple diffusion, channels and passive transporters (like GLUT) are passive.</li><li><span class=\"badge b-pri\">Active</span> the substance moves against the purple arrow: <b>up</b>. It needs energy, from ATP (<b>primary active</b>, the pumps) or from another ion going down in the same transporter (<b>secondary active</b>).</li><li>The purple arrow is the sum of the blue one (concentration) and the red one (voltage). For an uncharged molecule there is no red arrow.</li></ul>", "note": "At the start the battery is unplugged and the membrane is at equilibrium. With the battery plugged in the concentrations change until E reaches the battery voltage; unplugged, V<sub>m</sub> goes to E. Temperature 37 °C (310 K) or 20 °C (293 K), chosen in the formula box; animation speeds are indicative."};
