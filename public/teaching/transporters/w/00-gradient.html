<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The electrochemical gradient: passive or active</title>
<link rel="stylesheet" href="widget.css">
<style>
svg[viewBox]{min-width:0!important;max-width:540px!important;width:100%;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
.top button{font:inherit;font-size:13px;padding:5px 11px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);cursor:pointer}
.top button.act{font-weight:700;border:1.5px solid #16222E;background:#FFFFFF}

.top .sp{flex:1 1 auto}
.top #pz.on{border-color:#B5520C;background:#FCEEDD;color:#7A3E0B}
.top button.m-pas.act{border-color:#1F5FA8;color:#1F5FA8}.top button.m-act.act{border-color:#B0420C;color:#B0420C}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;border:1px solid var(--border);border-radius:10px;background:#FFFFFF;padding:8px 12px;margin:0 0 8px;font-size:13px}
.ctl label{display:flex;flex-direction:column;gap:2px;color:#55697A;font-weight:600}
.ctl .row{display:flex;align-items:center;gap:8px}
.ctl input[type=range]{flex:1;min-width:0}
.ctl output{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;color:#16222E;min-width:7.2em;text-align:right;font-weight:600}
.ctl .vmr input{accent-color:#C0392B}.ctl .vmr output{color:#C0392B}
.ctl .bt{display:flex;gap:6px;align-items:end;flex-wrap:wrap}
.ctl .bt button{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--border-strong);background:#FFFFFF;color:#16222E;cursor:pointer}
.ctl .bt button:disabled{opacity:.5;cursor:default}
.pnl{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;padding:6px;margin:0 0 8px}
.cnt{font-size:12.5px;color:#55697A;margin:-2px 4px 8px;text-align:center}
.txt{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;padding:9px 12px;font-size:14px;line-height:1.55}
.txt h3{font-size:16px;margin:0 0 6px}
.txt p{margin:0 0 6px}.txt p:last-child{margin:0}
.txt .vd{border-left:3px solid #6A3A96;padding-left:9px}
.txt .nt{font-size:13px;color:#55697A}
.rule{margin-top:8px;background:#F7FAFC}.rule ul{margin:4px 0 0;padding-left:20px}
.badge{display:inline-block;font-weight:700;font-size:13px;padding:2px 9px;border-radius:999px;margin:0 4px 2px 0;background:#FFFFFF;border:1.5px solid}
.b-pas{color:#1F5FA8}.b-pri{color:#B0420C}
.mt{display:inline-block;position:relative}.mt::after{content:'~';position:absolute;left:0;right:0;top:-.62em;text-align:center;font-size:.85em;font-weight:400}
.fn{font-size:12px;color:#8696A4;margin:8px 2px 0}
@media (max-width:600px){.ctl{grid-template-columns:1fr}}
</style>
</head>
<body>
<h2 class="sr-only">The electrochemical gradient: a voltmeter reads the membrane potential; ions cross the membrane along the sum of the chemical and electrical gradients (passive) or against it (active, with energy)</h2>
<div class="top" id="ions"></div>
<div class="top" id="modes"></div>
<div class="ctl">
  <label class="vmr"><span>Membrane potential V<sub>m</sub></span><span class="row"><input type="range" id="vm" min="-120" max="140" step="1"><output id="vmo"></output></span></label>

  <label><span>Concentration outside</span><span class="row"><input type="range" id="co" min="-4" max="2.5" step="0.05"><output id="coo"></output></span></label>
</div>
<div class="pnl"><svg id="sv" viewBox="0 0 460 478" role="img" aria-label="The electrochemical gradient: a voltmeter reads the membrane potential; ions cross the membrane along the sum of the chemical and electrical gradients (passive) or against it (active, with energy)"></svg></div>
<div class="cnt" id="ct"></div>
<div class="txt" id="tx"></div>
<div class="txt rule" id="rl"></div>
<p class="fn" id="fn"></p>
<script>
var L={"lang": "en", "title": "The electrochemical gradient: passive or active", "sr": "The electrochemical gradient: a voltmeter reads the membrane potential; ions cross the membrane along the sum of the chemical and electrical gradients (passive) or against it (active, with energy)", "dec": ".", "inside": "INSIDE", "outside": "OUTSIDE", "cyto": "cell", "ecf": "extracellular fluid", "toIn": "← inward", "toOut": "outward →", "chemT": "chemical gradient", "elecT": "electrical gradient", "netT": "electrochemical = sum", "pas": "Passive transport", "act": "Active transport", "pause": "❚❚ Pause", "play": "▶ Resume", "vm": "Membrane potential V<sub>m</sub>", "ci": "Concentration inside", "co": "Concentration outside", "eqb": "Set V<sub>m</sub> = E", "rs": "Physiological values", "eqNA": "no charge, no E", "cnt": "Crossed: <b>{o}</b> outward · <b>{i}</b> inward", "names": {"K": "K⁺", "Na": "Na⁺", "Cl": "Cl⁻", "Ca": "Ca²⁺", "glu": "glucose"}, "Names": {"K": "K⁺", "Na": "Na⁺", "Cl": "Cl⁻", "Ca": "Ca²⁺", "glu": "Glucose"}, "btn": {"K": "K⁺", "Na": "Na⁺", "Cl": "Cl⁻", "Ca": "Ca²⁺", "glu": "glucose"}, "dirOut": "outward", "dirIn": "inward", "wIn": "inside", "wOut": "outside", "neg": "negative", "posi": "positive", "hPas": "{N}: passive, {d}", "hEq": "{N}: at equilibrium", "hAct": "{N}: active, {d}", "chem0": "<b>① Chemical</b>: the concentration is the same inside and outside, so there is no chemical push (0 kJ/mol).", "chem": "<b>① Chemical</b>: {ci} inside, {co} outside. It is more concentrated {w}, so the chemical gradient pushes it <b>{d}</b> ({v} kJ/mol).", "el0": "<b>② Electrical</b>: {n} has no charge, so the voltage does not move it (0 kJ/mol). The electrochemical gradient is just the chemical one.", "elV0": "<b>② Electrical</b>: V<sub>m</sub> = 0 mV, so there is no electrical push (0 kJ/mol).", "el": "<b>② Electrical</b>: the inside of the cell is {s} ({vm} mV) and {n} is {c}. The voltage pushes it <b>{d}</b> ({v} kJ/mol).", "sum": "<b>③ Sum</b>: Δ<span class=\"mt\">μ</span> = {a} {b} = <b>{v} kJ/mol</b>. The purple arrow points <b>{d}</b>.", "sumEq": "<b>③ Sum</b>: Δ<span class=\"mt\">μ</span> ≈ 0, the two arrows cancel. This is <b>equilibrium</b>: {n} moves back and forth at random and the net flux is zero.", "vPas": "<b>Passive</b>: {n} moves {d}, the way the purple arrow points. It goes <b>down</b> its electrochemical gradient, with no energy spent.", "vNote": "Note: it moves {d} even though it is more concentrated {w}. It goes up its concentration gradient but down its electrochemical gradient, so it is still passive. The sum decides, not the concentration alone.", "vAct": "<b>Active</b>: {p} carries {n} <b>{d}</b>, against the purple arrow. It goes <b>up</b> its electrochemical gradient, so it needs energy: {s}.", "vActEq": "<b>Active?</b> At equilibrium there is no uphill: moving {n} costs almost nothing. Move V<sub>m</sub> away from E to see how hard the pump works.", "nern": "<b>Equilibrium potential</b> (Nernst): E<sub>{l}</sub> = <b>{E} mV</b>. With “Set V<sub>m</sub> = E” the red and blue arrows cancel. With V<sub>m</sub> above E {n} {up}, below it {dn}: the flux reverses, which is why E is also called the <b>reversal potential</b>.", "nern0": "<b>No equilibrium potential</b>: without a charge, equilibrium comes only when the concentrations inside and outside are equal.", "exits": "leaves", "enters": "enters", "pChan": "channel", "pGlut": "GLUT", "pPump": "pump", "src": {"atp": "the pump hydrolyses ATP (<b>primary active</b>)", "na": "the same transporter uses Na⁺ coming in down its gradient (<b>secondary active</b>)", "k": "the same transporter uses K⁺ going out down its gradient (<b>secondary active</b>)", "gen": "ATP (primary active) or another ion going down its gradient (secondary active)"}, "pn": {"nka": "the Na⁺/K⁺-ATPase", "pmca": "PMCA (the Ca²⁺-ATPase)", "nkcc": "NKCC1", "kcc": "KCC2", "sglt": "SGLT1", "gen": "an active transporter"}, "eGen": "energy", "rule": "<b>The rule</b><ul><li><span class=\"badge b-pas\">Passive</span> the substance moves the way the purple arrow points: <b>down</b> its electrochemical gradient. No energy is needed. Simple diffusion, channels and passive transporters (like GLUT) are passive.</li><li><span class=\"badge b-pri\">Active</span> the substance moves against the purple arrow: <b>up</b>. It needs energy, from ATP (<b>primary active</b>, the pumps) or from another ion going down in the same transporter (<b>secondary active</b>).</li><li>The purple arrow is the sum of the blue one (concentration) and the red one (voltage). For an uncharged molecule there is no red arrow.</li></ul>", "note": "Concentrations held constant; temperature 37 °C (310 K). Animation speeds are indicative."};
var ION={K:{z:1,ci:140,co:5,c:'#C2571A',g:'K⁺'},Na:{z:1,ci:12,co:145,c:'#7A4BA6',g:'Na⁺'},Cl:{z:-1,ci:7,co:110,c:'#2E7D4F',g:'Cl⁻'},Ca:{z:2,ci:0.0001,co:1.2,c:'#0E7C86',g:'Ca²⁺'},glu:{z:0,ci:1,co:5,c:'#B03A3A',g:'Glc'}};
var RT=8.314*310,F=96485,CB='#1F5FA8',CR='#C0392B',CP='#6A3A96';
var S={ion:'K',mode:'pas',vm:-70,ci:140,co:5,pz:false,nO:0,nI:0};
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;if(RM)S.pz=true;
function $(q){return document.querySelector(q);}
function num(v,d,sg){var s=Math.abs(v).toFixed(d);if(L.dec===',')s=s.replace('.',',');if(Math.abs(v)<Math.pow(10,-d)/2)return s;return (v<0?'−':(sg?'+':''))+s;}
function fc(c){var s;if(c>=10)s=c.toFixed(0);else s=String(Number(c.toPrecision(2)));if(L.dec===',')s=s.replace('.',',');s+=' mM';if(c<0.01){var n=c*1e6;s+=' ('+(n>=10?n.toFixed(0):String(Number(n.toPrecision(2)))).replace('.',L.dec)+' nM)';}return s;}
function fill(t,o){return t.replace(/\{(\w+)\}/g,function(m,k){return o[k]!=null?o[k]:m;});}
function tx(x,y,t,a,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.s||12)+'" text-anchor="'+(a||'start')+'" fill="'+(o.c||'#16222E')+'"'+(o.w?' font-weight="'+o.w+'"':'')+(o.f?' font-family="'+o.f+'"':'')+(o.h?' stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke"':'')+(o.id?' id="'+o.id+'"':'')+'>'+t+'</text>';}
function calc(){var I=ION[S.ion],z=I.z,ch=RT*Math.log(S.ci/S.co)/1000,el=z*F*S.vm/1e6,net=ch+el;
  var E=z?RT/(z*F)*Math.log(S.co/S.ci)*1000:null;return {z:z,ch:ch,el:el,net:net,E:E,eq:Math.abs(net)<0.05};}
// which protein does the uphill job, for the physiological cases
function pump(dir){var k=S.ion;

  if(k==='Ca'&&dir==='out')return ['pmca','atp','PMCA','ATP → ADP + Pᵢ'];
  if(k==='Cl'&&dir==='in')return ['nkcc','na','NKCC1','Na⁺ ↓'];
  if(k==='Cl'&&dir==='out')return ['kcc','k','KCC2','K⁺ ↓'];

function upDir(c){if(!c.eq)return c.net>0?'in':'out';return c.ch>0?'in':'out';}
var XV=function(v){return 138+(v+150)/300*184;};
function arrow(y,v,col){var len=Math.min(205,Math.abs(v)*20),o='';
  if(len<4)return '<circle cx="230" cy="'+y+'" r="5" fill="'+col+'"/>';
  var d=v>0?1:-1,x1=230+d*len,xs=x1-d*Math.min(16,len*.6);

  if(Math.abs(v)*20>205){var xm=230+d*120;o+='<path d="M'+(xm-4)+' '+(y+9)+' L'+(xm+2)+' '+(y-9)+' M'+(xm+3)+' '+(y+9)+' L'+(xm+9)+' '+(y-9)+'" stroke="#FFFFFF" stroke-width="2.4"/>';}
  return o;}
function scene(){var I=ION[S.ion],c=calc(),o='';
  // voltmeter
  o+='<rect x="114" y="4" width="232" height="98" rx="12" fill="#E9ECEF" stroke="#4D5B66" stroke-width="1.5"/>';
  o+='<rect x="128" y="12" width="204" height="44" rx="6" fill="#FFFFFF" stroke="#8696A4"/>';

  for(var v=-150;v<=150;v+=25){var mj=v%50===0;o+='<line x1="'+XV(v)+'" y1="'+(mj?32:37)+'" x2="'+XV(v)+'" y2="47" stroke="#16222E" stroke-width="1"/>';}
  [-100,0,100].forEach(function(v){o+=tx(XV(v),27,(v>0?'+':v<0?'−':'')+Math.abs(v),'middle',{s:10});});
  o+='<rect id="ndl" x="'+(XV(S.vm)-2)+'" y="30" width="4" height="22" fill="'+CR+'"/>';
  o+='<rect x="178" y="62" width="104" height="30" rx="15" fill="#FFFFFF" stroke="#4D5B66"/>';
  o+=tx(230,82,num(S.vm,0)+' mV','middle',{s:16,c:CR,w:600,f:'IBM Plex Mono,monospace',id:'rd'});
  // wires and electrodes
  o+='<path d="M150 102 L150 184 M310 102 L310 184" stroke="#16222E" stroke-width="2" fill="none"/>';
  o+='<rect x="145" y="178" width="10" height="28" rx="5" fill="#16222E"/><rect x="305" y="178" width="10" height="28" rx="5" fill="#16222E"/>';
  // beaker, two compartments
  o+='<rect x="22" y="132" width="204" height="186" fill="#E6F4EA"/><rect x="234" y="132" width="204" height="186" fill="#E2EEF8"/>';
  o+='<path d="M20 118 L20 320 L440 320 L440 118" stroke="#16222E" stroke-width="2.5" fill="none"/>';
  o+=tx(66,150,L.inside,'middle',{s:13,w:700,c:'#2E5E3E'})+tx(66,163,L.cyto,'middle',{s:10,c:'#55697A'});
  o+=tx(394,150,L.outside,'middle',{s:13,w:700,c:'#1F4E79'})+tx(394,163,L.ecf,'middle',{s:10,c:'#55697A'});
  o+=tx(124,311,'['+I.g+'] '+fc(S.ci),'middle',{s:12.5,w:600,c:I.c,h:1})+tx(336,311,'['+I.g+'] '+fc(S.co),'middle',{s:12.5,w:600,c:I.c,h:1});
  // membrane: a bilayer, with a protein in the middle
  o+='<rect x="225" y="124" width="10" height="196" fill="#F2DE96" stroke="#9A7400" stroke-width="1"/>';
  o+='<line x1="230" y1="124" x2="230" y2="320" stroke="#9A7400" stroke-width=".8" stroke-dasharray="3 3"/>';
  // charges along the membrane
  var nq=Math.min(6,Math.round(Math.abs(S.vm)/22)),ys=[142,158,174,272,288,300];
  for(var i=0;i<nq;i++){var l=S.vm<0?'−':'+',r=S.vm<0?'+':'−';o+=tx(214,ys[i]+4,l,'middle',{s:14,w:700,c:l==='−'?'#1F5FA8':'#C0392B'})+tx(246,ys[i]+4,r,'middle',{s:14,w:700,c:r==='−'?'#1F5FA8':'#C0392B'});}
  var up=upDir(c),pm=pump(up);
  if(S.mode==='pas'){
    if(S.ion==='glu'){o+='<rect x="216" y="196" width="28" height="56" rx="9" fill="#CDE8D5" stroke="#2E7D4F" stroke-width="1.6"/><rect x="227" y="204" width="6" height="40" rx="3" fill="#FFFFFF"/>';o+=tx(230,190,L.pGlut,'middle',{s:12,w:700,c:'#2E7D4F',h:1});}
    else{o+='<rect x="217" y="196" width="10" height="56" rx="4" fill="#BBD5EE" stroke="#1F6FB2" stroke-width="1.4"/><rect x="233" y="196" width="10" height="56" rx="4" fill="#BBD5EE" stroke="#1F6FB2" stroke-width="1.4"/>';o+=tx(230,190,L.pChan+' '+I.g,'middle',{s:12,w:700,c:'#1F6FB2',h:1});}
  }else{
    o+='<rect x="212" y="194" width="36" height="60" rx="11" fill="#F6C7A8" stroke="#C2571A" stroke-width="1.6"/><rect x="227" y="202" width="6" height="44" rx="3" fill="#FFFFFF"/>';
    o+=tx(230,188,pm[2],'middle',{s:12,w:700,c:'#B0420C',h:1});
  }
  o+='<g id="pin"></g><g id="pout"></g><g id="fly"></g>';
  o+='<g id="en" opacity="0">'+tx(pm[1]==='k'?318:142,268,pm[3],'middle',{s:12,w:700,c:'#B0420C',h:1})+'</g>';
  // arrows
  o+='<line x1="230" y1="340" x2="230" y2="474" stroke="#8696A4" stroke-width="1.2" stroke-dasharray="3 3"/>';
  o+=tx(24,342,L.toIn,'start',{s:12,c:'#55697A',w:600})+tx(436,342,L.toOut,'end',{s:12,c:'#55697A',w:600});
  var rows=[[372,c.ch,CB,L.chemT],[414,c.el,CR,L.elecT],[456,c.net,CP,L.netT]];
  rows.forEach(function(r){o+=tx(230,r[0]-15,r[3]+'  '+num(r[1],2,true)+' kJ/mol','middle',{s:13,w:700,c:r[2],h:1});o+=arrow(r[0],r[1],r[2]);});
  $('#sv').innerHTML=o;
  build(c);text(c,pm,up);ctlSync(c);}
// particles: random walk in each compartment; crossings fly through the protein
var P=[],FL=[],RATE={o:0,i:0},AC={o:0,i:0},ENT=0;
function nOf(cv){var m=Math.max(S.ci,S.co);return Math.max(1,Math.round(22*cv/m));}
function mk(side){var x0=side?252:34,x1=side?426:208;return {s:side,x:x0+Math.random()*(x1-x0),y:182+Math.random()*110,vx:0,vy:0};}
function build(c){P=[];FL=[];var I=ION[S.ion],gi=$('#pin'),go=$('#pout'),h='',k='';
  var ni=nOf(S.ci),no=nOf(S.co);for(var i=0;i<ni;i++)P.push(mk(0));for(var j=0;j<no;j++)P.push(mk(1));
  P.forEach(function(p,ix){var t='<text id="p'+ix+'" font-size="13" font-weight="700" text-anchor="middle" fill="'+I.c+'">'+I.g+'</text>';if(p.s)k+=t;else h+=t;});
  gi.innerHTML=h;go.innerHTML=k;P.forEach(function(p,ix){p.n=document.getElementById('p'+ix);});
  if(S.mode==='pas'){var ph=F*S.vm/1000/RT,m=Math.max(S.ci,S.co),jo=S.ci/m*Math.exp(c.z*ph/2),ji=S.co/m*Math.exp(-c.z*ph/2),k2=2.4/Math.max(jo,ji);RATE={o:k2*jo,i:k2*ji};}
  else{var u=upDir(c);RATE={o:u==='out'?1.6:0,i:u==='in'?1.6:0};}
  AC={o:Math.random(),i:Math.random()};draw();}
function draw(){P.forEach(function(p){p.n.setAttribute('x',p.x.toFixed(1));p.n.setAttribute('y',p.y.toFixed(1));});}
function spawn(dir){var I=ION[S.ion],out=dir==='o',y0=176+Math.random()*112,y2=176+Math.random()*112;
  var f={t:0,a:[out?196:264,y0],b:[230,224],c:[out?262+Math.random()*50:198-Math.random()*50,y2]};
  var n=document.createElementNS('http://www.w3.org/2000/svg','text');n.setAttribute('font-size','13');n.setAttribute('font-weight','700');n.setAttribute('text-anchor','middle');n.setAttribute('fill',I.c);n.setAttribute('stroke','#FFFFFF');n.setAttribute('stroke-width','3');n.setAttribute('paint-order','stroke');n.textContent=I.g;
  $('#fly').appendChild(n);f.n=n;FL.push(f);if(out)S.nO++;else S.nI++;
  if(S.mode==='act'){ENT=1;}cnt();}
function cnt(){$('#ct').innerHTML=fill(L.cnt,{o:S.nO,i:S.nI});}
var last=0;
function step(ts){var dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
  if(!S.pz&&dt>0){
    P.forEach(function(p){p.vx+=(Math.random()-.5)*160*dt;p.vy+=(Math.random()-.5)*160*dt;p.vx*=.96;p.vy*=.96;var sp=Math.hypot(p.vx,p.vy);if(sp>26){p.vx*=26/sp;p.vy*=26/sp;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;var x0=p.s?252:34,x1=p.s?426:208;if(p.x<x0){p.x=x0;p.vx=Math.abs(p.vx);}if(p.x>x1){p.x=x1;p.vx=-Math.abs(p.vx);}if(p.y<182){p.y=182;p.vy=Math.abs(p.vy);}if(p.y>294){p.y=294;p.vy=-Math.abs(p.vy);}});
    draw();
    AC.o+=RATE.o*dt;AC.i+=RATE.i*dt;while(AC.o>=1){AC.o-=1;spawn('o');}while(AC.i>=1){AC.i-=1;spawn('i');}
    FL=FL.filter(function(f){f.t+=dt/1.3;var t=f.t,x,y;if(t<.45){var u=t/.45;x=f.a[0]+(f.b[0]-f.a[0])*u;y=f.a[1]+(f.b[1]-f.a[1])*u;}else{var w=Math.min(1,(t-.45)/.55);x=f.b[0]+(f.c[0]-f.b[0])*w;y=f.b[1]+(f.c[1]-f.b[1])*w;}
      f.n.setAttribute('x',x.toFixed(1));f.n.setAttribute('y',y.toFixed(1));f.n.setAttribute('opacity',t>.8?Math.max(0,(1-t)/.2).toFixed(2):'1');if(t>=1){f.n.remove();return false;}return true;});
    var en=$('#en');if(en){ENT=Math.max(0,ENT-dt*1.6);en.setAttribute('opacity',ENT.toFixed(2));}
  }
  requestAnimationFrame(step);}
function text(c,pm,up){var I=ION[S.ion],n=L.names[S.ion],N=L.Names[S.ion],z=c.z,o='';
  var dOut=L.dirOut,dIn=L.dirIn,dn=c.net>0?dOut:dIn;

  o+='<h3>'+h+'</h3>';
  o+='<p>'+(Math.abs(c.ch)<0.005?L.chem0:fill(L.chem,{ci:fc(S.ci),co:fc(S.co),w:c.ch>0?L.wIn:L.wOut,d:c.ch>0?dOut:dIn,v:num(c.ch,2,true)}))+'</p>';
  if(!z)o+='<p>'+fill(L.el0,{n:n})+'</p>';
  else if(Math.abs(S.vm)<0.5)o+='<p>'+L.elV0+'</p>';
  else o+='<p>'+fill(L.el,{s:S.vm<0?L.neg:L.posi,vm:num(S.vm,0),n:n,c:z>0?L.posi:L.neg,d:c.el>0?dOut:dIn,v:num(c.el,2,true)})+'</p>';
  o+='<p>'+(c.eq?fill(L.sumEq,{n:n}):fill(L.sum,{a:num(c.ch,2,true),b:(c.el<0?'− ':'+ ')+num(Math.abs(c.el),2),v:num(c.net,2,true),d:dn}))+'</p>';
  if(S.mode==='pas'){if(!c.eq){o+='<p class="vd">'+fill(L.vPas,{n:n,d:dn})+'</p>';if(Math.abs(c.ch)>=0.005&&(c.ch>0)!==(c.net>0))o+='<p class="vd nt">'+fill(L.vNote,{d:dn,w:c.ch>0?L.wIn:L.wOut})+'</p>';}}
  else o+='<p class="vd">'+(c.eq?fill(L.vActEq,{n:n}):fill(L.vAct,{p:L.pn[pm[0]],n:n,d:up==='in'?dIn:dOut,s:L.src[pm[1]]}))+'</p>';
  if(z){var l=I.g.replace(/[⁺⁻²]/g,'');o+='<p class="nt">'+fill(L.nern,{l:l,E:num(c.E,0,true),n:n,up:z>0?L.exits:L.enters,dn:z>0?L.enters:L.exits})+'</p>';}
  else o+='<p class="nt">'+L.nern0+'</p>';
  $('#tx').innerHTML=o;}
function lg(c){return Math.log10(c);}
function ctlSync(c){$('#vm').value=Math.round(S.vm);$('#vmo').textContent=num(S.vm,0)+' mV';
  $('#ci').value=lg(S.ci);$('#co').value=lg(S.co);$('#cio').textContent=fc(S.ci);$('#coo').textContent=fc(S.co);
  var b=$('#eqb');b.disabled=!c.z||c.E<-120||c.E>140;b.innerHTML=c.z?L.eqb+' ('+num(c.E,0,true)+' mV)':L.eqNA;
  document.querySelectorAll('#ions button').forEach(function(x){x.classList.toggle('act',x.dataset.k===S.ion);});
  document.querySelectorAll('#modes button[data-m]').forEach(function(x){x.classList.toggle('act',x.dataset.m===S.mode);});}
function reset(){S.nO=0;S.nI=0;cnt();FL.forEach(function(f){f.n.remove();});}
function setIon(k){S.ion=k;S.ci=ION[k].ci;S.co=ION[k].co;reset();scene();}
(function(){var h='';Object.keys(ION).forEach(function(k){h+='<button data-k="'+k+'"><span class="dt" style="background:'+ION[k].c+'"></span>'+L.btn[k]+'</button>';});$('#ions').innerHTML=h;
  $('#modes').innerHTML='<button data-m="pas" class="m-pas">'+L.pas+'</button><button data-m="act" class="m-act">'+L.act+'</button><span class="sp"></span><button id="pz"></button>';
  document.querySelectorAll('#ions button').forEach(function(b){b.onclick=function(){setIon(b.dataset.k);};});
  document.querySelectorAll('#modes button[data-m]').forEach(function(b){b.onclick=function(){S.mode=b.dataset.m;reset();scene();};});
  var pz=$('#pz');function pzs(){pz.textContent=S.pz?L.play:L.pause;pz.classList.toggle('on',S.pz);}pz.onclick=function(){S.pz=!S.pz;pzs();};pzs();
  $('#vm').oninput=function(){S.vm=+this.value;reset();scene();};
  $('#ci').oninput=function(){S.ci=Number(Math.pow(10,+this.value).toPrecision(2));reset();scene();};
  $('#co').oninput=function(){S.co=Number(Math.pow(10,+this.value).toPrecision(2));reset();scene();};
  $('#eqb').onclick=function(){var c=calc();if(c.z){S.vm=c.E;reset();scene();}};
  $('#rs').innerHTML=L.rs;$('#rs').onclick=function(){S.vm=-70;setIon(S.ion);};
