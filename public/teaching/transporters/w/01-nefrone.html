econdary active"}, "mode": {"uni": "uniport", "sym": "symport", "anti": "antiport"}, "coupled": "coupled", "up": "goes up", "down": "goes down", "why": "Why:", "drug": "Drugs:", "clin": "Clinically:", "qn": "Question {i} of {n}", "score": "score {s}/{n}", "q1": "1. Which protein is it?", "q2": "2. Which transport is it?", "right": "Right.", "wrong": "Not quite.", "next": "Next →", "again": "Start again"}, "groups": [{"k": "prox", "n": "Proximal"}, {"k": "loop", "n": "Loop of Henle"}, {"k": "dist", "n": "Distal"}, {"k": "cdp", "n": "Collecting duct · principal cell"}, {"k": "cda", "n": "Collecting duct · α intercalated"}, {"k": "cdb", "n": "Collecting duct · β intercalated"}, {"k": "all", "n": "Everywhere"}, {"k": "none", "n": "No protein"}], "tr": [{"id": "sglt2", "g": "prox", "n": "SGLT2", "full": "sodium-glucose cotransporter 2", "where": "proximal tubule, lumen side", "A": "lum", "B": "cell", "prot": "carr", "cls": "sec", "mode": "sym", "subs": [{"s": "Na⁺", "cA": 140, "cB": 12, "lA": "140 mM", "lB": "12 mM", "dir": "AB", "up": false}, {"s": "glucose", "cA": 1, "cB": 5, "lA": "1 mM", "lB": "5 mM", "dir": "AB", "up": true, "sh": "glu"}], "why": "Glucose enters uphill (5 mM in the cell against about 1 in the lumen), pulled by Na⁺ going down. One protein, two substances, one cycle: symport, secondary active. Na⁺ pays, and its gradient was made by the Na⁺/K⁺-ATPase.", "drug": "gliflozins (dapagliflozin, empagliflozin).", "clin": "Glycosuria. More salt reaches the macula densa, which narrows the afferent: glomerular pressure falls and the kidney is protected. One of the four pillars of heart failure."}, {"id": "nhe3", "g": "prox", "n": "NHE3", "full": "sodium-hydrogen exchanger 3", "where": "proximal tubule, lumen side", "A": "lum", "B": "cell", "prot": "carr", "cls": "sec", "mode": "anti", "subs": [{"s": "Na⁺", "cA": 140, "cB": 12, "lA": "140 mM", "lB": "12 mM", "dir": "AB", "up": false}, {"s": "H⁺", "cA": 0.16, "cB": 0.063, "lA": "pH 6.8", "lB": "pH 7.2", "dir": "BA", "up": true}], "why": "Na⁺ enters going down and pays for H⁺ to leave, uphill towards a more acidic lumen. Opposite directions in the same protein: antiport, secondary active.", "drug": "none in common use; acetazolamide slows it indirectly (less H⁺ available in the cell).", "clin": "Angiotensin II (AT1 receptors) and the sympathetic system (α1) stimulate it: one of the ways they retain sodium. It also recovers filtered bicarbonate."}, {"id": "glut2", "g": "prox", "n": "GLUT2", "full": "glucose transporter 2", "where": "proximal tubule, blood side", "A": "cell", "B": "blood", "prot": "carr", "cls": "pas", "mode": "uni", "subs": [{"s": "glucose", "cA": 6, "cB": 5, "lA": "6 mM", "lB": "5 mM", "dir": "AB", "up": false, "sh": "glu"}], "why": "Glucose taken up by SGLT2 builds up in the cell and leaves towards the blood going down. The carrier moves one substance (uniport) and uses no energy: facilitated diffusion, passive.", "drug": "none.", "clin": "Without GLUT2 glucose would be trapped in the cell (Fanconi-Bickel syndrome)."}, {"id": "aqp1", "g": "loop", "n": "AQP1", "full": "aquaporin 1", "where": "proximal tubule and descending limb", "A": "lum", "B": "cell", "prot": "chan", "cls": "pas", "mode": "", "subs": [{"s": "H₂O", "cA": 2, "cB": 1, "lA": "300 → 600 mOsm", "lB": "more concentrated", "dir": "AB", "up": false, "sh": "H₂O"}], "why": "Water goes down from where it is more dilute to where it is more concentrated (the medullary interstitium), through a pore: channel, passive.", "drug": "none.", "clin": "Always present, no hormone needed: in the proximal tubule and descending limb water follows salt by itself."}, {"id": "nkcc2", "g": "loop", "n": "NKCC2", "full": "Na⁺-K⁺-2Cl⁻ cotransporter", "where": "thick ascending limb, lumen side", "A": "lum", "B": "cell", "prot": "carr", "cls": "sec", "mode": "sym", "subs": [{"s": "Na⁺", "cA": 140, "cB": 12, "lA": "140 mM", "lB": "12 mM", "dir": "AB", "up": false}, {"s": "K⁺", "cA": 4, "cB": 140, "lA": "4 mM", "lB": "140 mM", "dir": "AB", "up": true}, {"s": "2 Cl⁻", "cA": 120, "cB": 20, "lA": "120 mM", "lB": "20 mM, −70 mV", "dir": "AB", "up": true, "sh": "Cl⁻"}], "why": "Na⁺ goes down and pulls one K⁺ and two Cl⁻ with it. K⁺ clearly goes up (140 mM inside the cell). Cl⁻ goes up because of charge: the cell is negative and repels it. Same direction: symport, secondary active.", "drug": "loop diuretics: furosemide, torasemide, bumetanide.", "clin": "It is also the sensor of the macula densa. Blocking it sends more salt downstream and loses more K⁺. A relative (NKCC1) is in the inner ear: ototoxicity at high doses."}, {"id": "ncc", "g": "dist", "n": "NCC", "full": "Na⁺-Cl⁻ cotransporter", "where": "distal tubule, lumen side", "A": "lum", "B": "cell", "prot": "carr", "cls": "sec", "mode": "sym", "subs": [{"s": "Na⁺", "cA": 60, "cB": 12, "lA": "60 mM", "lB": "12 mM", "dir": "AB", "up": false}, {"s": "Cl⁻", "cA": 60, "cB": 20, "lA": "60 mM", "lB": "20 mM, −70 mV", "dir": "AB", "up": true}], "why": "Na⁺ goes down and pulls Cl⁻, which goes up because of charge. Same direction: symport, secondary active.", "drug": "thiazides: hydrochlorothiazide, chlortalidone, indapamide; metolazone.", "clin": "Hyponatraemia, hypokalaemia, hyperuricaemia and hypercalcaemia (more calcium is reabsorbed). Gitelman syndrome: NCC does not work."}, {"id": "enac", "goal": "the principal cell is there to <b>reabsorb Na⁺</b> (and water, if ADH is present) and to <b>secrete K⁺</b>.", "g": "cdp", "n": "ENaC", "full": "epithelial sodium channel", "where": "collecting duct, principal cell, lumen side", "A": "lum", "B": "cell", "prot": "chan", "cls": "pas", "mode": "", "subs": [{"s": "Na⁺", "cA": 50, "cB": 12, "lA": "50 mM", "lB": "12 mM", "dir": "AB", "up": false}], "why": "Na⁺ goes down from the lumen into the cell through a pore: channel, passive. The gradient exists because the Na⁺/K⁺-ATPase keeps Na⁺ low inside, but that does not make the channel active.", "drug": "amiloride, triamterene (block the channel); spironolactone and eplerenone block the aldosterone receptor that makes it.", "clin": "Aldosterone increases it. The Na⁺ that enters leaves the lumen negative, and K⁺ and H⁺ go out. Liddle syndrome: ENaC always open, with hypertension and hypokalaemia."}, {"id": "romk", "g": "cdp", "n": "ROMK", "full": "renal outer medullary potassium channel", "where": "thick ascending limb and collecting duct, lumen side", "A": "lum", "B": "cell", "prot": "chan", "cls": "pas", "mode": "", "subs": [{"s": "K⁺", "cA": 20, "cB": 140, "lA": "20 mM", "lB": "140 mM", "dir": "BA", "up": false}], "why": "K⁺ leaves the cell (140 mM) towards the lumen (about 20 mM), helped by the negative lumen: channel, passive.", "drug": "none in common use.", "clin": "In the loop it recycles the K⁺ that NKCC2 needs; in the collecting duct it is the route by which potassium is lost. Bartter syndrome type 2: ROMK does not work."}, {"id": "aqp2", "goal": "the principal cell is there to <b>reabsorb Na⁺</b> (and water, if ADH is present) and to <b>secrete K⁺</b>.", "g": "cdp", "n": "AQP2", "full": "aquaporin 2", "where": "collecting duct, principal cell, lumen side", "A": "lum", "B": "cell", "prot": "chan", "cls": "pas", "mode": "", "subs": [{"s": "H₂O", "cA": 2, "cB": 1, "lA": "dilute urine", "lB": "concentrated interstitium", "dir": "AB", "up": false, "sh": "H₂O"}], "why": "Water passes through a pore going down towards the more concentrated interstitium: channel, passive. ADH only decides whether the pore is there (it inserts it into the membrane), it gives no energy.", "drug": "vaptans (tolvaptan, which blocks V2 receptors); lithium reduces them (nephrogenic diabetes insipidus).", "clin": "Without ADH the collecting duct is impermeable to water and the urine is dilute."}, {"id": "hatp", "goal": "the α cell (type A intercalated) is there to <b>secrete H⁺</b> into the lumen so that it is excreted in the urine, and to return HCO₃⁻ to the blood: it removes acid from the body in acidosis.", "g": "cda", "n": "H⁺-ATPase", "full": "proton pump", "where": "α intercalated cell, lumen side", "A": "lum", "B": "cell", "prot": "pump", "cls": "pri", "mode": "", "subs": [{"s": "H⁺", "cA": 31.6, "cB": 0.063, "lA": "pH 4.5", "lB": "pH 7.2", "dir": "BA", "up": true}], "why": "H⁺ leaves towards a lumen up to 500 times more acidic (pH 4.5 against 7.2): the climb is steep and needs ATP, primary active. The negative lumen helps, but is not enough.", "drug": "none.", "clin": "If it fails: distal renal tubular acidosis (type 1), with urine that cannot go below pH 5.5."}, {"id": "hkatp", "price": "<b>The price:</b> every K⁺ recovered costs one H⁺ thrown away.<br><b>Where the H⁺ comes from:</b> the cell makes it itself, from CO₂. The HCO₃⁻ left over goes to the blood, so secreting one H⁺ is the same as taking one H⁺ away from the blood.<svg viewBox=\"0 0 640 182\" role=\"img\" aria-label=\"Lumen, cell and blood: the cell makes H⁺ from CO₂, sends it into the urine and sends the bicarbonate to the blood, while K⁺ is recovered\" style=\"display:block;width:100%;height:auto;margin:6px 0;border-radius:8px\"><rect x=\"0\" y=\"0\" width=\"208\" height=\"182\" fill=\"#FFF6CF\"/><rect x=\"208\" y=\"0\" width=\"224\" height=\"182\" fill=\"#F3ECFA\"/><rect x=\"432\" y=\"0\" width=\"208\" height=\"182\" fill=\"#FBE3E3\"/><rect x=\"200\" y=\"0\" width=\"16\" height=\"182\" fill=\"#E8C76A\"/><rect x=\"424\" y=\"0\" width=\"16\" height=\"182\" fill=\"#E8C76A\"/><text x=\"10\" y=\"16\" font-size=\"12\" font-weight=\"700\" text-anchor=\"start\" fill=\"#55697A\">lumen (urine)</text><text x=\"320\" y=\"16\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#55697A\">cell</text><text x=\"630\" y=\"16\" font-size=\"12\" font-weight=\"700\" text-anchor=\"end\" fill=\"#55697A\">blood</text><rect x=\"194\" y=\"26\" width=\"28\" height=\"138\" rx=\"11\" fill=\"#F6B89A\" stroke=\"#C2571A\" stroke-width=\"1.8\"/><text x=\"208\" y=\"177\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#C2571A\">pump · ATP</text><path d=\"M340 70 V42 H132\" fill=\"none\" stroke=\"#C2571A\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><path d=\"M122 42 l11 -6 v12 Z\" fill=\"#C2571A\"/><path d=\"M398 70 V42 H500\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><path d=\"M510 42 l-11 -6 v12 Z\" fill=\"#2E7D32\"/><path d=\"M512 118 H270 V98\" fill=\"none\" stroke=\"#55697A\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><path d=\"M270 90 l-6 10 h12 Z\" fill=\"#55697A\"/><path d=\"M84 150 H500\" fill=\"none\" stroke=\"#1F5FA8\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><path d=\"M510 150 l-11 -6 v12 Z\" fill=\"#1F5FA8\"/><circle cx=\"432\" cy=\"42\" r=\"11\" fill=\"#FFFFFF\" stroke=\"#2E7D32\" stroke-width=\"1.8\"/><text x=\"432\" y=\"45\" font-size=\"8\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#2E7D32\">AE1</text><text x=\"270\" y=\"86\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#16222E\">CO₂ + H₂O</text><text x=\"312\" y=\"86\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#55697A\">→</text><text x=\"340\" y=\"86\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#C2571A\">H⁺</text><text x=\"366\" y=\"86\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#55697A\">+</text><text x=\"398\" y=\"86\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#2E7D32\">HCO₃⁻</text><text x=\"334\" y=\"104\" font-size=\"10\" font-weight=\"400\" text-anchor=\"middle\" fill=\"#55697A\">carbonic anhydrase</text><text x=\"98\" y=\"38\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#C2571A\">H⁺</text><text x=\"98\" y=\"62\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#B03A3A\">lost in the urine</text><text x=\"546\" y=\"38\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#2E7D32\">HCO₃⁻</text><text x=\"546\" y=\"62\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#2E7D32\">to the blood: more alkaline</text><text x=\"546\" y=\"122\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#55697A\">CO₂</text><text x=\"60\" y=\"155\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1F5FA8\">K⁺</text><text x=\"556\" y=\"144\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1F5FA8\">K⁺</text><text x=\"556\" y=\"166\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1F5FA8\">recovered</text></svg><span class=\"trow\"><span class=\"tc g\">＋ K⁺ recovered</span><span class=\"tc r\">− H⁺ lost in the urine</span><span class=\"ta\">→</span><span class=\"tc k\">the body loses acid: alkalosis</span></span>This is why hypokalaemia and metabolic alkalosis so often go together: when potassium is low the pump works harder, and the blood turns alkaline.", "goal": "the α cell (type A intercalated) is there to <b>secrete H⁺</b> into the lumen so that it is excreted in the urine, and to return HCO₃⁻ to the blood: it removes acid from the body in acidosis.", "g": "cda", "n": "H⁺/K⁺-ATPase", "full": "hydrogen-potassium pump", "where": "α intercalated cell, lumen side", "A": "lum", "B": "cell", "prot": "pump", "cls": "pri", "mode": "", "subs": [{"s": "H⁺", "cA": 31.6, "cB": 0.063, "lA": "pH 4.5", "lB": "pH 7.2", "dir": "BA", "up": true}, {"s": "K⁺", "cA": 5, "cB": 140, "lA": "5 mM", "lB": "140 mM", "dir": "AB", "up": true}], "why": "H⁺ out and K⁺ in, both uphill, spending ATP: primary active. It is similar to the proton pump of the stomach.", "drug": "proton pump inhibitors (omeprazole) block the gastric version.", "clin": "It works harder when potassium is low: it recovers K⁺ and loses H⁺ (alkalosis)."}, {"id": "ae1", "seq": true, "clx": "same", "knob": {"kind": "hb", "rows": {"HCO₃⁻": "the blood already has plenty: none goes out", "Cl⁻": ""}, "lab": "Plasma HCO₃⁻", "min": 10, "max": 40, "dv": 16, "ph0": 7.1, "ph1": -2.5, "neutral": true, "flux": "AE1 exchange", "ph": "urine pH", "pl": "new HCO₃⁻ to the blood", "plHi": "little", "plDn": "a lot", "blT": "What happens in the blood", "b1": "AE1 sends new HCO₃⁻ into the blood (now at {p}%).", "b2": "For every HCO₃⁻ returned, one H⁺ goes into the urine: plasma bicarbonate rises.", "b3hi": "With plasma bicarbonate already high the gradient towards the blood disappears: AE1 slows down and the α cell switches off. That is right: in alkalosis the β cell does the work.", "b3dn": "With plasma bicarbonate low (acidosis) the gradient is large: AE1 works at full speed, the urine is acidified and the plasma recovers bicarbonate.", "co2": "The Cl⁻ that enters with AE1 does not build up: it leaves again towards the blood through chloride channels (ClC-Kb). Chloride goes round in a circle, bicarbonate goes out.", "m": ["Alkalosis (plasma HCO₃⁻ high): HCO₃⁻ can no longer leave towards the blood, it piles up in the cell and slows carbonic anhydrase. The α cell stops secreting H⁺: the urine becomes less acidic.", "Intermediate values: AE1 exchanges at medium speed and the α cell secretes H⁺ moderately.", "Acidosis (plasma HCO₃⁻ low): HCO₃⁻ leaves towards the blood at full speed, carbonic anhydrase runs and the H⁺-ATPase throws H⁺ into the urine, which falls towards pH 5. The plasma recovers new bicarbonate: the acidosis is corrected."]}, "caRun": "running: H⁺ into urine, HCO₃⁻ to the blood via AE1", "ca": true, "goal": "the α cell (type A intercalated) is there to <b>secrete H⁺</b> into the lumen so that it is excreted in the urine, and to return HCO₃⁻ to the blood: it removes acid from the body in acidosis.", "ghost": {"n": "H⁺-ATPase", "i1": "H⁺", "i2": "", "far": "lum", "note": "HCO₃⁻ high here"}, "sec": "the carrier uses no ATP. It uses HCO₃⁻ going down, which builds up in the cell because the H⁺-ATPase throws H⁺ out spending ATP and carbonic anhydrase makes new bicarbonate. It is second-hand energy.", "g": "cda", "n": "AE1", "full": "anion exchanger 1 (band 3)", "where": "α intercalated cell, blood side", "A": "cell", "B": "blood", "prot": "carr", "cls": "sec", "mode": "anti", "subs": [{"s": "HCO₃⁻", "cA": 30, "cB": 24, "lA": "30 mM", "lB": "24 mM", "dir": "AB", "up": false, "sh": "HCO₃"}, {"s": "Cl⁻", "cA": 20, "cB": 105, "lA": "20 mM, −70 mV", "lB": "105 mM", "dir": "BA", "up": true}], "why": "HCO₃⁻, made in the cell by carbonic anhydrase, leaves towards the blood going down and pays for Cl⁻ to enter, which goes up because of charge. Opposite directions: antiport, secondary active.", "drug": "none.", "clin": "Every H⁺ thrown into the urine matches an HCO₃⁻ returned to the blood. Faulty AE1: distal tubular acidosis. It is the same protein as band 3 of red cells."}, {"id": "pen", "seq": "b", "clx": "ghost", "goal": "the β cell (type B intercalated) is there to <b>secrete HCO₃⁻</b> into the lumen so that it is <b>excreted</b> in the urine: it removes base from the body in alkalosis. Every HCO₃⁻ secreted matches an H⁺ returned to the blood.", "ca": true, "knob": {"kind": "cl", "ph0": 5.6, "ph1": 2.4, "pl": "plasma HCO₃⁻", "plHi": "stays high", "plDn": "falls", "blT": "What happens in the blood", "b1": "The H⁺-ATPase sends into the blood the H⁺ made by carbonic anhydrase (now at {p}%).", "b2": "Each H⁺ meets a plasma HCO₃⁻: H⁺ + HCO₃⁻ → CO₂ + H₂O, and the CO₂ is breathed out.", "b3hi": "Few H⁺ reach the blood: plasma HCO₃⁻ is not used up and stays high. This is metabolic alkalosis.", "b3dn": "So plasma HCO₃⁻ is used up and falls: the alkalosis is corrected.", "co2": "CO₂ is not the problem: it crosses membranes freely and the lungs control it. In alkalosis breathing slows a little (pCO₂ rises about 0.7 mmHg for every mmol/L of extra HCO₃⁻): that is respiratory compensation, not the cause.", "lab": "Cl⁻ reaching the lumen", "min": 2, "max": 120, "dv": 80, "flux": "pendrin exchange", "ph": "urine pH", "m": ["Little Cl⁻ in the lumen (vomiting, diuretics, chloride loss): pendrin stops and HCO₃⁻ piles up in the cell. The excess product slows carbonic anhydrase, no more H⁺ is made and the H⁺-ATPase no longer sends H⁺ to the blood. The excess bicarbonate in the plasma is not removed: metabolic alkalosis is maintained.", "With some Cl⁻ pendrin starts again: it exchanges Cl⁻ (in) for HCO₃⁻ (out). The urine becomes more alkaline and blood bicarbonate starts to fall.", "Giving chloride (normal saline NaCl, or KCl if potassium is low) brings Cl⁻ to the lumen: pendrin exchanges at full speed and carbonic anhydrase runs. Every HCO₃⁻ thrown into the urine matches an H⁺ sent to the blood, which neutralises a plasma HCO₃⁻: the alkalosis is corrected. This is chloride-responsive alkalosis, with low urinary Cl⁻ (< 20 mmol/L) at the start."]}, "ghost": {"n": "H⁺-ATPase", "i1": "H⁺", "i2": "", "far": "blood", "note": "HCO₃⁻ high here"}, "sec": "the carrier uses no ATP. It uses HCO₃⁻ going down, which builds up in the cell because the H⁺-ATPase throws H⁺ out spending ATP and carbonic anhydrase makes new bicarbonate. It is second-hand energy.", "g": "cdb", "n": "pendrin", "full": "apical Cl⁻/HCO₃⁻ exchanger", "where": "β intercalated cell, lumen side", "A": "lum", "B": "cell", "prot": "carr", "cls": "sec", "mode": "anti", "subs": [{"s": "HCO₃⁻", "cA": 10, "cB": 30, "lA": "10 mM", "lB": "30 mM", "dir": "BA", "up": false, "sh": "HCO₃"}, {"s": "Cl⁻", "cA": 60, "cB": 20, "lA": "60 mM", "lB": "20 mM, −70 mV", "dir": "AB", "up": true}], "why": "The mirror image of AE1: HCO₃⁻ leaves towards the lumen going down and pays for Cl⁻ to enter. Antiport, secondary active.", "drug": "none.", "clin": "Used in alkalosis. The Cl⁻ it takes back goes with the Na⁺ of ENaC, which is why angiotensin II and aldosterone stimulate it. Mutated in Pendred syndrome (deafness and goitre)."}, {"id": "nak", "g": "all", "n": "Na⁺/K⁺-ATPase", "full": "sodium-potassium pump", "where": "every segment, blood side", "A": "cell", "B": "blood", "prot": "pump", "cls": "pri", "mode": "", "subs": [{"s": "3 Na⁺", "cA": 12, "cB": 140, "lA": "12 mM", "lB": "140 mM", "dir": "AB", "up": true, "sh": "Na⁺"}, {"s": "2 K⁺", "cA": 140, "cB": 4, "lA": "140 mM", "lB": "4 mM", "dir": "BA", "up": true, "sh": "K⁺"}], "why": "It moves 3 Na⁺ out and 2 K⁺ in, both uphill, spending ATP: primary active. It makes the gradients that drive almost all the others.", "drug": "digoxin (blocks it, mainly in the heart).", "clin": "Aldosterone increases it in the collecting duct. It keeps Na⁺ low and K⁺ high inside every cell."}, {"id": "co2", "g": "none", "n": "CO₂", "full": "carbon dioxide", "where": "every cell", "A": "cell", "B": "blood", "prot": "none", "cls": "pas", "mode": "", "subs": [{"s": "CO₂", "cA": 2, "cB": 1.4, "lA": "pCO₂ 50", "lB": "pCO₂ 46", "dir": "AB", "up": false}], "why": "CO₂ is small and lipid-soluble: it crosses the lipid bilayer by itself, going down its gradient. No protein: simple diffusion, passive.", "drug": "—", "clin": "O₂ and lipid-soluble substances cross the same way. In the proximal tubule CO₂ enters the cell and carbonic anhydrase turns it into H⁺ and HCO₃⁻."}]},U=D.ui,T=D.tr,SEL=T[0].id,MODE='ex';

  $('#qdg').innerHTML=draw(t,true);$('#q1').textContent=U.q1;$('#q2').textContent=U.q2;
  $('#a1').innerHTML=['none','chan','carr','pump'].map(function(k){return '<button type="button" data-k="'+k+'">'+U.prot[k]+'</button>';}).join('');
  $('#a2').innerHTML=['pas','pri','sec'].map(function(k){return '<button type="button" data-k="'+k+'">'+U.cls[k]+'</button>';}).join('');
  $('#qfb').innerHTML='';$('#nx').hidden=true;}
function check(){if(A1===null||A2===null)return;var t=QO[QI],ok1=A1===t.prot,ok2=A2===t.cls;SN++;if(ok1&&ok2)SC++;
  [['#a1',t.prot],['#a2',t.cls]].forEach(function(p){[].forEach.call($(p[0]).querySelectorAll('button'),function(b){b.disabled=true;var k=b.getAttribute('data-k');if(k===p[1])b.classList.add('ok');else if(b.classList.contains('sel'))b.classList.add('no');});});
  $('#qfb').innerHTML='<p class="fb '+(ok1&&ok2?'ok':'no')+'"><b>'+(ok1&&ok2?U.right:U.wrong)+'</b> '+t.why+(t.cls==='sec'?'<br><b>'+U.sec+'</b> '+(t.sec||U.secNa):'')+'</p>';
  $('#qdg').innerHTML=draw(t,false);ruleOn(t.cls);$('#sc').textContent=U.score.replace('{s}',SC).replace('{n}',SN);
  $('#nx').hidden=false;$('#nx').textContent=QI<QO.length-1?U.next:U.again;}
['#a1','#a2'].forEach(function(id,i){$(id).addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;
  [].forEach.call($(id).querySelectorAll('button'),function(x){x.classList.remove('sel');x.style.outline='';});b.classList.add('sel');b.style.outline='2px solid #1456A8';
  if(i===0)A1=b.getAttribute('data-k');else A2=b.getAttribute('data-k');check();});});
$('#nx').addEventListener('click',function(){if(QI<QO.length-1){QI++;renderQ();}else newQuiz();});

function setMode(m){MODE=m;$('#ex').hidden=m!=='ex';$('#qz').hidden=m!=='qz';$('#t1').classList.toggle('act',m==='ex');$('#t2').classList.toggle('act',m==='qz');if(m==='qz')newQuiz();else renderEx();}
$('#t1').addEventListener('click',function(){setMode('ex');});$('#t2').addEventListener('click',function(){setMode('qz');});
$('#ttl').textContent=U.title;$('#story').innerHTML=U.story;$('#rp').innerHTML=U.rp;$('#rr').innerHTML=U.rr;$('#rs').innerHTML=U.rs;$('#rq').innerHTML=U.rq;
$('#t1').textContent=U.t1;$('#t2').textContent=U.t2;
(function(){var m=/[?&]t=([a-z0-9]+)/.exec(location.search);if(m&&T.some(function(x){return x.id===m[1];}))SEL=m[1];})();
setMode('ex');
</script>
<script>(function(){var last=0;function send(){var h=Math.ceil(document.body.getBoundingClientRect().height)+2;if(h!==last){last=h;try{parent.postMessage({gradH:h},'*');}catch(e){}}}if(window.ResizeObserver)new ResizeObserver(send).observe(document.body);window.addEventListener('load',send);setInterval(send,1000);})();</script>
