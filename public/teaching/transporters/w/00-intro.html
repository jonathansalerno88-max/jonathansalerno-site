<script>
var D={"ui": {"gh": ["WHO PAID BEFORE", "the Na⁺/K⁺ pump:", "it spent ATP to", "keep Na⁺ low", "in here"], "atpase": "ATPase", "out": "OUTSIDE the cell", "inn": "INSIDE the cell", "conc": "concentration", "pause": "❚❚ Pause", "play": "▶ Resume", "rule": "<b>Who pays?</b> A second question, which applies only to carriers.<ul>\n<li><span class=\"badge b-pas\">Passive</span> the substance goes <b>down</b> its electrochemical gradient: no energy. Always so in simple diffusion and channels; in carriers, if nothing goes up.</li>\n<li><span class=\"badge b-sec\">Secondary active</span> in the carrier one substance goes <b>up</b>, dragged by another going <b>down</b> (usually Na⁺). The Na⁺ gradient was built beforehand by the Na⁺/K⁺ pump: hence “secondary”. It needs a symport or an antiport.</li>\n<li><span class=\"badge b-pri\">Primary active</span> the carrier <b>pays for itself</b> by hydrolysing ATP: it is called a <b>pump</b> (for example Na⁺/K⁺-ATPase).</li></ul>", "vq": "What do the gradients do?", "np": ["NOBODY PAYS", "both go down:", "no pump to thank,", "the carrier just couples them"], "via": {"mem": "through the lipids", "chan": "channel", "carr": "carrier"}, "viaL": {"mem": "through the lipids (no protein)", "chan": "channel", "carr": "carrier"}, "legT": "The three routes:", "chOpen": "open", "chClosed": "closed", "trig": {"volt": ["−70 mV", "+20 mV"], "lig": ["", ""], "mech": ["", "↕ stretch"]}}, "modes": [{"k": "diff", "via": "mem", "n": "Simple diffusion", "cls": "Passive", "bc": "b-pas", "prot": "no protein", "t": ["Small, uncharged molecules such as O₂, CO₂ and steroid hormones cross the lipid bilayer on their own, from the side where they are more concentrated to the side where they are less.", "The flux is proportional to the concentration difference (Fick’s law) and never saturates: more gradient, more flux. Ions and large polar molecules cannot cross: they need a protein."]}, {"k": "chan", "via": "chan", "n": "Channel", "cls": "Passive", "bc": "b-pas", "prot": "a pore", "subq": "What opens it?", "t": ["A channel is a water-filled pore across the membrane: when it is open, ions flow through it down their electrochemical gradient, up to millions per second. It can never move a substance against its gradient: it is always <b>passive</b>. Channels differ in <b>what opens them</b>."], "subs": [{"g": "leak", "lab": "always open", "t": ["<b>Leak</b> channels stay open: ions pass whenever there is a gradient. Example: the two-pore K⁺ channels (K2P), which let K⁺ out at rest and keep the cell negative, around −70 mV.", "In the kidney many channels matter mostly for <b>how many</b> sit in the membrane: ADH inserts AQP2 aquaporins, aldosterone increases ENaC. ROMK is the K⁺ channel of the principal cell."]}, {"g": "volt", "lab": "voltage-gated", "t": ["The channel has a voltage sensor: at rest, at −70 mV, it is closed; when the membrane depolarises it opens and Na⁺ rushes in. This is the channel of the action potential (Na<sub>v</sub>), which inactivates after a few milliseconds. The same principle applies to voltage-gated K⁺ (K<sub>v</sub>) and Ca²⁺ (Ca<sub>v</sub>) channels."]}, {"g": "lig", "lab": "ligand-gated", "t": ["It opens when a signal molecule binds to it. Here acetylcholine (ACh) on the nicotinic receptor of the motor end plate: the channel opens and Na⁺ enters. The ligand can come from outside (neurotransmitters such as ACh, glutamate, GABA) or from inside the cell (cAMP, cGMP, Ca²⁺)."]}, {"g": "mech", "lab": "mechanosensitive", "t": ["It opens when the membrane is stretched or deformed. Examples: Piezo1 and Piezo2, in touch and in the baroreceptors of the carotid sinus and aortic arch, which sense arterial pressure (the same ones as in the sympathetic reflex of the kidney figure). They let cations in, Na⁺ and Ca²⁺."]}]}, {"k": "carr", "via": "carr", "n": "Carrier", "subq": "How many substances, which direction?", "t": ["A carrier binds the molecule on one side, changes shape and releases it on the other: it is never open on both sides at once. That is why it is much slower than a channel and <b>saturates</b>: when all carriers are busy the flux stops rising (V<sub>max</sub>)."], "subs": [{"g": "uni", "lab": "uniport", "cls": "Passive", "bc": "b-pas", "prot": "1 substance", "t": ["A single substance, down its gradient: a <b>uniporter</b>, passive (facilitated diffusion). Example: <b>GLUT2</b>, which lets glucose leave the proximal tubule cell towards the blood."]}, {"g": "sym", "lab": "symport", "prot": "2 substances, same direction", "vq": "Who pays?", "vars": [{"lab": "Na⁺ (glucose goes up · SGLT2)", "cls": "Secondary active: glucose goes up", "bc": "b-sec", "t": ["Na⁺ is high outside and low inside: as it enters it goes <b>down</b> and releases energy. The carrier uses it to bring in, in the same cycle, glucose, which goes <b>up</b> (there is already more inside).", "Same direction = <b>symport</b>. Here it is <b>secondary</b> active because glucose goes <b>up</b> and nobody in the protein spends ATP: the Na⁺ gradient was built beforehand by the Na⁺/K⁺ pump, dashed at the bottom, and that is who paid (in tubule cells it sits on the opposite membrane, the one facing the blood). Examples: <b>SGLT2</b> (Na⁺ + glucose), <b>NKCC2</b> (Na⁺, K⁺, 2 Cl⁻).", "But “symport” alone does not mean “secondary active”: try the other cases under “Who pays?” above."]}, {"lab": "nobody (both go down)", "cls": "Passive: nothing goes up", "bc": "b-pas", "t": ["Same carrier, but now glucose is higher outside than inside (a teaching case: in the tubule cell glucose is higher inside). Both go down, neither goes up: there is nothing to pay for. Transport is <b>passive</b>, facilitated diffusion in pairs.", "So “symport” only says the two substances go the same way: whether transport is secondary active or passive is decided by the gradients of the moment, not by the name. And it is not always glucose that goes up: in the <b>NBCe1</b> (Na⁺–HCO₃⁻ cotransporter) of the proximal tubule, 1 Na⁺ leaves towards the blood with 3 HCO₃⁻, and it is Na⁺ itself that goes up, pushed by HCO₃⁻ and by the voltage."]}]}, {"g": "anti", "lab": "antiport", "prot": "2 substances, opposite directions", "vq": "Who pays?", "vars": [{"lab": "Na⁺ (H⁺ goes up · NHE3)", "cls": "Secondary active: H⁺ goes up", "bc": "b-sec", "t": ["Na⁺ enters going down; in exchange, in the same carrier, an H⁺ leaves going <b>up</b>, towards the side where H⁺ is already higher.", "Opposite directions = <b>antiport</b> (exchanger). Here it is secondary active because H⁺ goes <b>up</b>, and the energy comes from the Na⁺ gradient, paid for beforehand by the Na⁺/K⁺ pump dashed at the bottom. Example: <b>NHE3</b> of the proximal tubule, which pushes H⁺ into the lumen. <b>NCX</b> (Na⁺/Ca²⁺ exchanger) works the same way: Ca²⁺ leaves uphill.", "But “antiport” alone does not mean “secondary active”: try the other cases under “Who pays?” above."]}, {"lab": "nobody (red cell AE1)", "cls": "Passive: nothing goes up", "bc": "b-pas", "t": ["In the red cell, in the tissues, the HCO₃⁻ just made by carbonic anhydrase is higher inside than outside and leaves going <b>down</b>; Cl⁻ is higher outside and enters going <b>down</b>. Neither goes up, nobody pays: a <b>passive</b> antiport. This is the <b>chloride shift</b>.", "In the lungs the gradients reverse and the same <b>AE1</b> (anion exchanger 1, band 3) works the other way: HCO₃⁻ enters and Cl⁻ leaves. Antiport only says “opposite directions”: the direction, and whether anyone has to pay, is set by the sum of the gradients."]}, {"lab": "ATP (Na⁺/K⁺ pump)", "cls": "Primary active: ATP pays", "bc": "b-pri", "prot": "pump (ATPase): 3 Na⁺ out, 2 K⁺ in", "t": ["The pump is a carrier too: it opens to one side and then the other, and it saturates. But it pays for itself by hydrolysing ATP: Na⁺/K⁺-ATPase pushes out 3 Na⁺ and brings in 2 K⁺ per ATP, both uphill. It is <b>primary</b> active.", "It is the one that keeps Na⁺ low inside the cell, that is, that “pays beforehand” f     o+='<defs><marker id="gna" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="'+NA+'"/></marker><marker id="gk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="'+KK+'"/></marker></defs>';
    o+='<rect x="292" y="'+G+'" width="56" height="62" rx="10" fill="#FFF4EA" fill-opacity=".85" stroke="'+OR+'" stroke-width="2" stroke-dasharray="5 4"/>';
    o+=tx(320,G+28,'Na⁺/K⁺','middle',{s:9.5,w:700,c:OR})+tx(320,G+40,U.atpase,'middle',{s:9.5,w:700,c:OR});
    o+='<line x1="376" y1="'+(G+12)+'" x2="278" y2="'+(G+12)+'" stroke="'+NA+'" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#gna)"/>';
    o+='<line x1="278" y1="'+(G+52)+'" x2="376" y2="'+(G+52)+'" stroke="'+KK+'" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#gk)"/>';
    o+=tx(382,G+16,'3 Na⁺','start',{s:11,w:700,c:NA})+tx(382,G+56,'2 K⁺','start',{s:11,w:700,c:KK})+tx(452,G+36,'ATP → ADP','middle',{s:10.5,w:700,c:OR});
    U.gh.forEach(function(l,i){o+=tx(252,G+4+i*14,l,'end',{s:i?10.5:11,w:i?400:700,c:i?'#16222E':OR});});
    o+='<line x1="140" y1="'+(G-10)+'" x2="500" y2="'+(G-10)+'" stroke="#DDE4EA" stroke-dasharray="3 3"/>';}
  $('#kf').textContent=KF;
  return '<svg viewBox="130 0 380 '+H+'" role="img" aria-label="'+lab+'">'+o+'</svg>';}
function render(){var m=M[CUR],sb=m.subs?m.subs[SUB]:null,vs=sb&&sb.vars?sb.vars:null,v=vs?vs[VAR]:(sb||m);
  $('#tabs').innerHTML=M.map(function(x,i){var V=VIA[x.via];return '<button type="button" data-i="'+i+'"'+(i===CUR?' class="act" style="border:1.5px solid '+V.c+';background:'+V.bg+';color:#16222E"':' style="border-color:'+V.c+'66"')+'><span class="dt" style="background:'+V.c+'"></span>'+x.n+'</button>';}).join('')+'<span class="sp"></span><button type="button" id="pz"'+(PZ?' class="on"':'')+'>'+(PZ?U.play:U.pause)+'</button>';
  var sk=m.k==='diff'?'diff':m.k==='chan'?'ch_'+sb.g:(sb.g==='anti'&&VAR===2?'pump':sb.g);
  function row(q,arr,cur,att){return '<div class="vt"><span class="vl">'+q+'</span>'+arr.map(function(x,i){return '<button type="button" '+att+'="'+i+'"'+(i===cur?' class="on"':'')+'>'+x.lab+'</button>';}).join('')+'</div>';}
  var lab=m.n+(sb?' · '+sb.lab:'')+(vs?' · '+v.lab:'');
  $('#sc').innerHTML=(m.subs?row(m.subq,m.subs,SUB,'data-s'):'')+(vs?row(sb.vq||U.vq,vs,VAR,'data-v'):'')+scene(sk,lab);
  var cls=v.cls||(sb&&sb.cls)||m.cls,bc=v.bc||(sb&&sb.bc)||m.bc,prot=v.prot||(sb&&sb.prot)||m.prot;
  var paras=(m.t||[]).concat(sb?(vs?(sb.t||[]).concat(v.t):sb.t):[]);
  $('#tx').innerHTML='<h3>'+lab+'</h3><p><span class="badge '+bc+'">'+cls+'</span><span class="badge" style="background:'+VIA[m.via].c+'">'+U.via[m.via]+' · '+prot+'</span></p>'+paras.map(function(p){return '<p>'+p+'</p>';}).join('');}
$('#sc').addEventListener('click',function(e){var b=e.target.closest('button[data-v],button[data-s]');if(!b)return;
  if(b.hasAttribute('data-s')){SUB=+b.getAttribute('data-s');VAR=0;}else VAR=+b.getAttribute('data-v');render();});
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.id==='pz'){PZ=!PZ;document.body.classList.toggle('paused',PZ);b.textContent=PZ?U.play:U.pause;b.classList.toggle('on',PZ);return;}
  CUR=+b.getAttribute('data-i');SUB=0;VAR=0;render();});
$('#rl').innerHTML=U.rule;
$('#leg').innerHTML='<b>'+U.legT+'</b>'+['mem','chan','carr'].map(function(k){return '<span><i style="background:'+VIA[k].c+'"></i>'+U.viaL[k]+'</span>';}).join('');
render();
