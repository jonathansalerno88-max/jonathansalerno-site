<script>
var D={"ui": {"gh": ["WHO PAID BEFORE", "the Na⁺/K⁺ pump:", "it spent ATP to", "keep Na⁺ low", "in here"], "atpase": "ATPase", "out": "OUTSIDE the cell", "inn": "INSIDE the cell", "conc": "concentration", "pause": "❚❚ Pause", "play": "▶ Resume", "rule": "<b>The rule</b><ul>\n<li><span class=\"badge b-pas\">Passive</span> the substance goes <b>down</b> its electrochemical gradient: no energy. On its own through the lipids (simple diffusion) or through a protein, channel or carrier (facilitated diffusion).</li>\n<li><span class=\"badge b-pri\">Primary active</span> the substance goes <b>up</b> and the protein pays itself, by hydrolysing ATP: it is a <b>pump</b> (ATPase).</li>\n<li><span class=\"badge b-sec\">Secondary active</span> the substance goes <b>up</b>, but the protein does not touch ATP: it is dragged by another ion going <b>down</b>, usually Na⁺, in the <b>same carrier</b> (symport or antiport). That Na⁺ gradient was built beforehand by the Na⁺/K⁺ pump: hence “secondary”.</li><li><b>Careful:</b> symport and antiport only say <b>which way</b> the two substances go (same or opposite directions), not <b>who pays</b>. They are secondary active only if one of the two goes <b>up</b>; if both go down they are <b>passive</b>. The converse always holds: every secondary active transport is a symport or an antiport.</li></ul>", "vq": "What do the gradients do?", "np": ["NOBODY PAYS", "both go down:", "no pump to thank,", "the carrier just couples them"], "via": {"mem": "through the lipids", "chan": "channel", "carr": "carrier", "pump": "pump"}, "viaL": {"mem": "through the lipids (no protein)", "chan": "channel", "carr": "carrier", "pump": "pump: a carrier that pays with ATP"}, "legT": "Routes:"}, "modes": [{"k": "diff", "via": "mem", "n": "Simple diffusion", "cls": "Passive", "bc": "b-pas", "prot": "no protein", "t": ["Small, uncharged molecules such as O₂, CO₂ and steroid hormones cross the lipid bilayer on their own, from the side where they are more concentrated to the side where they are less.", "The flux is proportional to the concentration difference (Fick’s law) and never saturates: more gradient, more flux. Ions and large polar molecules cannot cross: they need a protein."]}, {"k": "chan", "via": "chan", "n": "Channel", "cls": "Passive", "bc": "b-pas", "prot": "a pore", "t": ["A channel is a water-filled pore across the membrane: when it is open, ions flow through it down their electrochemical gradient, up to millions per second. It is <b>facilitated</b> diffusion: the protein opens the way but does not push.", "Many channels open and close (voltage, ligand, hormones). Kidney examples: <b>ENaC</b> (Na⁺), <b>ROMK</b> (K⁺), <b>aquaporins</b> (water). A channel can never move a substance against its gradient."]}, {"k": "uni", "via": "carr", "n": "Uniport", "cls": "Passive", "bc": "b-pas", "prot": "1 substance", "t": ["A carrier binds the molecule on one side, changes shape and releases it on the other: it is never open on both sides at once. That is why it is much slower than a channel and <b>saturates</b>: when all carriers are busy the flux stops rising (V<sub>max</sub>).", "If it moves a single substance down its gradient it is a <b>uniporter</b> and is passive (facilitated diffusion). Example: <b>GLUT2</b>, which lets glucose leave the proximal tubule cell towards the blood."]}, {"k": "sym", "via": "carr", "n": "Symport", "cls": "Secondary active", "bc": "b-sec", "prot": "2 substances, same direction", "t": ["Na⁺ is high outside and low inside: as it enters it goes <b>down</b> and releases energy. The carrier uses it to bring in, in the same cycle, glucose, which goes <b>up</b> (there is already more inside).", "Same direction = <b>symport</b> (cotransport). It is <b>secondary</b> active because nobody here spends ATP: the Na⁺ gradient was built beforehand by the Na⁺/K⁺ pump, dashed at the bottom: it is the one that paid in ATP (in tubule cells it sits on the opposite membrane, the one facing the blood). Examples: <b>SGLT2</b> (Na⁺ + glucose), <b>NKCC2</b> (Na⁺, K⁺, 2 Cl⁻)."], "vars": [{"lab": "glucose goes up (SGLT2)", "cls": "Secondary active: glucose goes up", "bc": "b-sec", "t": ["Na⁺ is high outside and low inside: as it enters it goes <b>down</b> and releases energy. The carrier uses it to bring in, in the same cycle, glucose, which goes <b>up</b> (there is already more inside).", "Same direction = <b>symport</b>. Here it is <b>secondary</b> active because glucose goes <b>up</b> and nobody in the protein spends ATP: the Na⁺ gradient was built beforehand by the Na⁺/K⁺ pump, dashed at the bottom, and that is who paid (in tubule cells it sits on the opposite membrane, the one facing the blood). Examples: <b>SGLT2</b> (Na⁺ + glucose), <b>NKCC2</b> (Na⁺, K⁺, 2 Cl⁻).", "But “symport” alone does not mean “secondary active”: try the other case above."]}, {"lab": "both go down", "cls": "Passive: nothing goes up", "bc": "b-pas", "t": ["Same carrier, but now glucose is higher outside than inside (a teaching case: in the tubule cell glucose is higher inside). Both go down, neither goes up: there is nothing to pay for. Transport is <b>passive</b>, facilitated diffusion in pairs.", "So “symport” only says the two substances go the same way: whether transport is secondary active or passive is decided by the gradients of the moment, not by the name. And it is not always glucose that goes up: in the <b>NBCe1</b> (Na⁺–HCO₃⁻ cotransporter) of the proximal tubule, 1 Na⁺ leaves towards the blood with 3 HCO₃⁻, and it is Na⁺ itself that goes up, pushed by HCO₃⁻ and by the voltage."]}]}, {"k": "anti", "via": "carr", "n": "Antiport", "cls": "Secondary active", "bc": "b-sec", "prot": "2 substances, opposite directions", "t": ["Na⁺ enters going down; in exchange, in the same carrier, an H⁺ leaves going <b>up</b>, towards the side where H⁺ is already higher.", "Opposite directions = <b>antiport</b> (exchanger). Here too the energy comes from the Na⁺ gradient, paid for beforehand by the Na⁺/K⁺ pump dashed at the bottom: so it is secondary active. Example: <b>NHE3</b> of the proximal tubule, which pushes H⁺ into the lumen. Note: AE1 and pendrin are Cl⁻/HCO₃⁻ antiporters that do not use Na⁺."], "vars": [{"lab": "H⁺ goes up (NHE3)", "cls": "Secondary active: H⁺ goes up", "bc": "b-sec", "t": ["Na⁺ enters going down; in exchange, in the same carrier, an H⁺ leaves going <b>up</b>, towards the side where H⁺ is already higher.", "Opposite directions = <b>antiport</b> (exchanger). Here it is secondary active because H⁺ goes <b>up</b>, and the energy comes from the Na⁺ gradient, paid for beforehand by the Na⁺/K⁺ pump dashed at the bottom. Example: <b>NHE3</b> of the proximal tubule, which pushes H⁺ into the lumen. <b>NCX</b> (Na⁺/Ca²⁺ exchanger) works the same way: Ca²⁺ leaves uphill.", "But “antiport” alone does not mean “secondary active”: try the other case above."]}, {"lab": "both go down (red cell AE1)", "cls": "Passive: nothing goes up", "bc": "b-pas", "t": ["In the red cell, in the tissues, the HCO₃⁻ just made by carbonic anhydrase is higher inside than outside and leaves going <b>down</b>; Cl⁻ is higher outside and enters going <b>down</b>. Neither goes up, nobody pays: a <b>passive</b> antiport. This is the <b>chloride shift</b>.", "In the lungs the gradients reverse and the same <b>AE1</b> (anion exchanger 1, band 3) works the other way: HCO₃⁻ enters and Cl⁻ leaves. Antiport only says “opposite directions”: the direction, and whether anyone has to pay, is set by the sum of the gradients."]}]}, {"k": "pump", "via": "pump", "n": "Pump", "cls": "Primary active", "bc": "b-pri", "prot": "ATPase", "t": ["The pump hydrolyses ATP and uses that energy to move substances <b>against</b> their gradient: Na⁺/K⁺-ATPase pushes out 3 Na⁺ and brings in 2 K⁺ per ATP, both uphill.", "This is the pump that keeps Na⁺ low inside the cell: without it, SGLT2, NHE3 and the other secondary active transporters would stop. Other examples: the H⁺-ATPase and H⁺/K⁺-ATPase of α-intercalated cells, Ca²⁺-ATPase."]}]},U=D.ui,M=D.modes,CUR=0,PZ=false,VAR=0;

  $('#tabs').innerHTML=M.map(function(x,i){var V=VIA[x.via];return '<button type="button" data-i="'+i+'"'+(i===CUR?' class="act" style="border:1.5px solid '+V.c+';background:'+V.bg+';color:#16222E"':' style="border-color:'+V.c+'66"')+'><span class="dt" style="background:'+V.c+'"></span>'+x.n+'</button>';}).join('')+'<span class="sp"></span><button type="button" id="pz"'+(PZ?' class="on"':'')+'>'+(PZ?U.play:U.pause)+'</button>';
  var v=m.vars?m.vars[VAR]:m;
  $('#sc').innerHTML=(m.vars?'<div class="vt"><span class="vl">'+U.vq+'</span>'+m.vars.map(function(x,i){return '<button type="button" data-v="'+i+'"'+(i===VAR?' class="on"':'')+'>'+x.lab+'</button>';}).join('')+'</div>':'')+scene(m);
  $('#tx').innerHTML='<h3>'+m.n+(m.vars?' · '+v.lab:'')+'</h3><p><span class="badge '+v.bc+'">'+v.cls+'</span><span class="badge" style="background:'+VIA[m.via].c+'">'+U.via[m.via]+' · '+m.prot+'</span></p>'+v.t.map(function(p){return '<p>'+p+'</p>';}).join('');}
$('#sc').addEventListener('click',function(e){var b=e.target.closest('button[data-v]');if(!b)return;VAR=+b.getAttribute('data-v');render();});
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.id==='pz'){PZ=!PZ;document.body.classList.toggle('paused',PZ);b.textContent=PZ?U.play:U.pause;b.classList.toggle('on',PZ);return;}
  CUR=+b.getAttribute('data-i');VAR=0;render();});
$('#rl').innerHTML=U.rule;
$('#leg').innerHTML='<b>'+U.legT+'</b>'+['mem','chan','carr','pump'].map(function(k){return '<span><i style="background:'+VIA[k].c+'"></i>'+U.viaL[k]+'</span>';}).join('');
render();
</script>
</body>
</html>
