<!doctype html>
<html lang="en">

<title>Bacterial secretion systems</title>
<link rel="stylesheet" href="widget.css">
<style>
svg[viewBox]{max-width:620px;width:100%;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
.top button{font:inherit;font-size:13px;padding:5px 10px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);cursor:pointer}
.top button.act{font-weight:700;border:1.5px solid #16222E;background:#FFFFFF}
.top .sp{flex:1 1 auto}
.top #pz.on{border-color:#B5520C;background:#FCEEDD;color:#7A3E0B}
.pnl{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;padding:6px;margin:0 0 8px;overflow-x:auto}
@media (max-width:600px){.pnl::before{content:attr(data-hint);display:block;font-size:11.5px;color:#55697A;margin:0 2px 4px}}
.txt{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;padding:9px 12px;font-size:14px;line-height:1.55}
.gp{background:#F7FAFC;border-left:3px solid #2E7D5B;padding:4px 8px;border-radius:0 6px 6px 0;font-size:13.5px}
.txt h3{font-size:16px;margin:0 0 4px}
.txt p{margin:0 0 6px}.txt p:last-child{margin:0}
.badge.gb{background:#16222E;color:#FFFFFF;border-color:#16222E}
.badge{display:inline-block;font-weight:600;font-size:12.5px;padding:3px 10px;border-radius:999px;margin:0 6px 6px 0;background:#EEF2F5;color:#16222E;border:1px solid #DDE4EA}
body.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<body>
<h2 class="sr-only">Bacterial secretion systems, from Sec and Tat to T7SS: how many membranes the protein crosses, in how many steps, with which energy and where it ends up</h2>
<div class="top" id="tabs"></div>
<div class="pnl" id="sc" data-hint="Scroll the drawing sideways to see all of it."></div>
<div class="txt" id="tx"></div>
<script>
var D={"ui": {"cyt": "CYTOPLASM", "peri": "PERIPLASM", "pg": "peptidoglycan", "ext": "OUTSIDE", "envGn": "envelope of a Gram−", "envMb": "envelope of a mycobacterium", "im": "inner membrane", "om": "outer membrane", "mbperi": "arabinogalactan + peptidoglycan", "mbom": "mycomembrane (mycolic acids)", "hostm": "host cell membrane", "hostc": "HOST CELL CYTOPLASM", "rival": "rival bacterium membrane", "rivalc": "RIVAL BACTERIUM", "pmf": "energy: proton gradient", "hly": "haemolysin", "secretin": "secretin", "barrel": "β-barrel (BAM)", "ctx": "cholera toxin", "iga": "IgA protease", "step1": "step 1", "step2": "step 2", "transl": "translocon", "needle": "needle", "pilus": "pilus", "eff": "effector", "dna": "DNA or protein", "tox6": "toxin", "sheath": "contracting sheath", "unk": "passage through the mycomembrane: still unclear", "pause": "❚❚ Pause", "play": "▶ Resume"}, "modes": [{"k": "sec", "g": "Gram− and Gram+", "gp": "<b>In Gram+</b> it works the same way, but it is also the last step: beyond the cytoplasmic membrane there is only the thick peptidoglycan, which the protein crosses without a dedicated machine. Many proteins are then anchored to the peptidoglycan by <b>sortase</b> (e.g. protein A of <i>S. aureus</i>).", "n": "Sec", "full": "Sec (general secretory pathway)", "b": ["1 membrane: the inner one", "unfolded protein", "energy: ATP (SecA) + proton gradient"], "t": ["The pathway all bacteria use most. The protein is made with a <b>signal sequence</b> at its start; SecA pushes it, still <b>unfolded</b>, through the SecYEG channel of the cytoplasmic membrane. In the periplasm (or outside, in Gram+) it folds.", "On its own it only takes proteins across the inner membrane. In Gram− bacteria it is the <b>first step</b> for T2SS and T5SS. The same channel also inserts membrane proteins: that is called insertion, not secretion."]}, {"k": "tat", "g": "Gram− and Gram+", "gp": "<b>In Gram+</b> it is present too and, like Sec, takes the protein straight out of the cell, because there is no second membrane.", "n": "Tat", "full": "Tat (Twin-arginine translocation)", "b": ["1 membrane: the inner one", "already folded protein", "energy: proton gradient"], "t": ["Like Sec it crosses only the inner membrane, but it carries proteins that are <b>already folded</b>, often with their cofactor bound. It recognises them by a signal with <b>two arginines</b> in a row, hence the name. It uses no ATP: the drive comes from the proton gradient."]}, {"k": "t1", "g": "Gram− only", "gp": "<b>Not in Gram+</b>: it serves to cross the outer membrane, which Gram+ bacteria lack.", "n": "T1SS", "full": "T1SS (Type 1 Secretion System)", "b": ["the whole envelope in 1 step", "energy: ATP", "example: E. coli haemolysin"], "t": ["A single tube from the inner membrane to the outside: an <b>ABC transporter</b> (ATP-Binding Cassette) in the inner membrane, a protein that spans the periplasm (<b>MFP</b>, Membrane Fusion Protein) and the <b>TolC</b> channel in the outer membrane. The protein leaves in one step, without stopping in the periplasm.", "This is where secretion meets transport: the machine is an ABC protein, but the cargo is a protein, so it is called secretion. The same TolC is also the exit for antibiotic efflux pumps."]}, {"k": "t2", "g": "Gram− only", "gp": "<b>Not in Gram+</b>: it is the step that takes the protein across the outer membrane. In Gram+ Sec is enough.", "n": "T2SS", "full": "T2SS (Type 2 Secretion System)", "b": ["2 steps: Sec, then the outer membrane", "energy: ATP", "example: cholera toxin"], "t": ["Two steps. First the protein crosses the inner membrane with Sec (or Tat) and folds in the periplasm. Then the T2SS pushes it out through a large outer-membrane channel, the <b>secretin</b>, with an internal piston driven by ATP.", "It exports enzymes and toxins into the environment: <b>cholera toxin</b> of <i>Vibrio cholerae</i>, exotoxin A of <i>Pseudomonas aeruginosa</i>."]}, {"k": "t3", "g": "Gram− only", "gp": "<b>Not in Gram+</b>: it is typical of Gram− pathogens (enterobacteria, <i>Pseudomonas</i>, <i>Chlamydia</i>).", "n": "T3SS", "full": "T3SS (Type 3 Secretion System): the syringe", "b": ["3 membranes: the host's too", "energy: ATP", "examples: Salmonella, Shigella, Yersinia"], "t": ["A <b>molecular syringe</b>: a ringed basal body spans both bacterial membranes, a hollow <b>needle</b> sticks out and, when it touches the host cell, its tip forms a pore in the host membrane (the <b>translocon</b>). Bacterial proteins, the <b>effectors</b>, pass from the bacterial cytoplasm into the host cytoplasm without ever being free outside.", "The effectors tamper with the cell: they rearrange its cytoskeleton so that it engulfs the bacterium (<i>Salmonella</i>, <i>Shigella</i>) or they block phagocytosis (the Yop proteins of <i>Yersinia</i>). The T3SS is often encoded on <b>virulence plasmids</b> or <b>pathogenicity islands</b>, and is related to the flagellum."]}, {"k": "t4", "g": "mainly Gram−; Gram+ too", "gp": "<b>In Gram+</b> there are simpler type IV machines for <b>conjugation</b>: this is how resistance plasmids pass between enterococci and staphylococci. Injecting proteins into the host is a Gram− thing.", "n": "T4SS", "full": "T4SS (Type 4 Secretion System)", "b": ["carries proteins and DNA too", "energy: ATP", "examples: H. pylori, conjugation"], "t": ["It is related to the <b>conjugation</b> machinery: a complex spanning the envelope, with a pilus outside. It is the only one that can transfer <b>DNA</b> as well as proteins: this is how plasmids, resistance plasmids included, pass from one bacterium to another.", "In pathogens it injects proteins into the host cell: <i>Helicobacter pylori</i> injects <b>CagA</b> into stomach cells; <i>Legionella</i> uses a T4SS to survive inside macrophages; <i>Bordetella pertussis</i> exports pertussis toxin this way."]}, {"k": "t5", "g": "Gram− only", "gp": "<b>Not in Gram+</b>: the β-barrel forms in the outer membrane.", "n": "T5SS", "full": "T5SS (Type 5 Secretion System): autotransporters", "b": ["2 steps: Sec, then on its own", "no dedicated machine", "example: Neisseria IgA protease"], "t": ["The simplest system. The protein crosses the inner membrane with Sec, then part of it forms a <b>β-barrel</b> in the outer membrane (helped by the BAM complex) and the rest of the protein, the “passenger”, goes out through that barrel. The protein makes its own passage: hence the name autotransporter.", "The passenger stays on the surface (adhesins) or is cut off and released. Example: the <b>IgA protease</b> of <i>Neisseria</i> and <i>Haemophilus</i>, which cleaves mucosal IgA."]}, {"k": "t6", "g": "Gram− only", "gp": "<b>Not in Gram+</b>: it is found mainly in proteobacteria (<i>Vibrio</i>, <i>Pseudomonas</i>, <i>Burkholderia</i>).", "n": "T6SS", "full": "T6SS (Type 6 Secretion System): the harpoon", "b": ["hits other bacteria (and cells)", "energy: loaded sheath + ATP to reload", "examples: Vibrio, Pseudomonas"], "t": ["It looks like an upside-down bacteriophage tail. In the cytoplasm a <b>sheath</b>, loaded like a spring, surrounds a tube with a tip; when it contracts it fires the tube through the envelope and into the target cell, carrying toxins with it. Then the sheath is taken apart and reloaded with ATP.", "It serves mainly in <b>competition between bacteria</b>: it kills rival neighbours, for example in the gut. Some bacteria also use it against eukaryotic cells."]}, {"k": "t7", "g": "mycobacteria and other Gram+", "gp": "The drawing here is not a Gram−: it is the <b>mycobacterial envelope</b>. Type 7 systems also exist in some <b>Gram+</b> bacteria, for example the Ess system of <i>Staphylococcus aureus</i>.", "n": "T7SS", "full": "T7SS (Type 7 Secretion System, ESX) of mycobacteria", "b": ["mycobacterial envelope", "energy: ATP (EccC)", "example: ESAT-6 of M. tuberculosis"], "t": ["Mycobacteria have a different envelope, with the mycolic-acid mycomembrane, and a system of their own called <b>ESX</b>. The <b>ESX-1</b> system of <i>M. tuberculosis</i> exports <b>ESAT-6</b> and <b>CFP-10</b>, which help the bacillus break the macrophage phagosome and escape into the cytoplasm. How the protein crosses the mycomembrane is still unclear.", "The <b>BCG</b> vaccine strain (Bacillus Calmette-Guérin) has lost exactly the genetic region of ESX-1 (RD1): that is why it is attenuated. And that is why QuantiFERON, which uses ESAT-6 and CFP-10, is not positive in people vaccinated with BCG."]}]},U=D.ui,M=D.modes,CUR=4,PZ=false;
function $(q){return document.querySelector(q);}
function tx(x,y,t,a,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.s||12)+'" text-anchor="'+(a||'start')+'" fill="'+(o.c||'#16222E')+'"'+(o.w?' font-weight="'+o.w+'"':'')+(o.h?' stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke"':'')+'>'+t+'</text>';}
var KF='',PC='#B03A3A';
function kf(n,fr){KF+='@keyframes '+n+'{'+fr.map(function(f){return f[0]+'%{transform:translate('+f[1]+'px,'+f[2]+'px);opacity:'+(f[3]==null?1:f[3])+'}';}).join('')+'}';}
function an(n,d){return 'style="animation:'+n+' '+d+'s linear infinite;opacity:0"';}
function tok(n,d,lab,folded){var c=PC,inner=folded?'<circle r="11" fill="#FFFFFF" stroke="'+c+'" stroke-width="2.4"/><path d="M-6 -2 q3 -6 6 0 t6 0" fill="none" stroke="'+c+'" stroke-width="1.6"/>':'<path d="M-16 0 q4 -7 8 0 t8 0 t8 0 t8 0" fill="none" stroke="'+c+'" stroke-width="3" stroke-linecap="round"/>';
  return '<g '+an(n,d)+'>'+inner+(lab?tx(-20,4,lab,'end',{s:10,w:700,c:c,h:1}):'')+'</g>';}
function mem(y,h,lab,col,head){var o='<rect x="0" y="'+y+'" width="640" height="'+h+'" fill="'+col+'"/>';for(var x=6;x<640;x+=12){o+='<circle cx="'+x+'" cy="'+(y+3)+'" r="3.6" fill="'+head+'"/><circle cx="'+x+'" cy="'+(y+h-3)+'" r="3.6" fill="'+head+'"/>';}return o+tx(634,y+h/2+4,lab,'end',{s:10.5,w:700,c:'#55697A',h:1});}
function pill(x,y,lab,c){return '<rect x="'+(x-24)+'" y="'+(y-9)+'" width="48" height="18" rx="9" fill="'+c+'"/>'+tx(x,y+4,lab,'middle',{s:9.5,w:700,c:'#FFFFFF'});}
/* y layers */
var Y={host:[0,30],hm:[30,48],ext:[48,98],om:[98,124],peri:[124,186],im:[186,212],cyt:[212,320]};
function scene(k){KF='';var o='',d=6,mb=k==='t7',host=(k==='t3'||k==='t4'||k==='t6');
  o+='<rect x="0" y="0" width="640" height="320" fill="#FBFCFD"/>';
  o+='<rect x="0" y="'+Y.cyt[0]+'" width="640" height="108" fill="#F3ECFA"/>'+tx(12,312,U.cyt,'start',{s:11,w:700,c:'#55697A'})+tx(628,312,mb?U.envMb:U.envGn,'end',{s:11.5,w:700,c:mb?'#8A6A00':'#2E7D5B'});
  o+='<rect x="0" y="'+Y.peri[0]+'" width="640" height="62" fill="'+(mb?'#F6EED2':'#EAF4EE')+'"/>'+tx(12,Y.peri[0]+16,mb?U.mbperi:U.peri,'start',{s:10.5,w:700,c:'#55697A'});
  if(!mb)o+='<line x1="0" y1="160" x2="640" y2="160" stroke="#8E6CC0" stroke-width="2" stroke-dasharray="7 4"/>'+tx(12,154,U.pg,'start',{s:9.5,c:'#8E6CC0'});
  o+=tx(12,Y.ext[0]+16,U.ext,'start',{s:10.5,w:700,c:'#55697A'});
  o+=mem(Y.im[0],26,U.im,'#FBF3D6','#E8C76A');
  o+=mem(Y.om[0],26,mb?U.mbom:U.om,mb?'#EFE3B8':'#E2F0E7',mb?'#B8962E':'#2E7D5B');
  if(host){o+='<rect x="0" y="0" width="640" height="30" fill="'+(k==='t6'?'#E9EEF8':'#FDECEA')+'"/>'+mem(Y.hm[0],18,k==='t6'?U.rival:U.hostm,'#FFF7F5','#C9776B')+tx(12,18,k==='t6'?U.rivalc:U.hostc,'start',{s:10.5,w:700,c:'#A0473D'});}
  var C='#1F5FA8',F='#D6E6F7';
  function chan(x,y0,y1,w,col,fill){return '<rect x="'+(x-w/2)+'" y="'+y0+'" width="'+w+'" height="'+(y1-y0)+'" rx="6" fill="'+(fill||F)+'" stroke="'+(col||C)+'" stroke-width="2"/>';}
  var X=320;
  if(k==='sec'||k==='tat'){o+=chan(X,182,216,30)+tx(X+26,205,k==='sec'?'SecYEG':'TatABC','start',{s:10,w:700,c:C});
    if(k==='sec')o+=pill(X+52,236,'SecA · ATP','#C2571A');else o+=tx(X+26,236,U.pmf,'start',{s:9.5,w:700,c:'#0F6E56'});
    kf('p',[[0,X,290,0],[8,X,280,1],[45,X,228],[70,X,170],[90,X+90,150],[100,X+120,150,0]]);o+=tok('p',d,'',k==='tat');}
  if(k==='t1'){o+=chan(X,182,216,34,'#C2571A','#F6C7A8')+chan(X,124,186,22)+chan(X,92,128,34);
    o+=tx(X+26,205,'ABC','start',{s:10,w:700,c:'#C2571A'})+tx(X+18,160,'MFP','start',{s:10,w:700,c:C})+tx(X+22,112,'TolC','start',{s:10,w:700,c:C})+pill(X+64,236,'ATP','#C2571A');
    kf('p',[[0,X,290,0],[8,X,280,1],[30,X,214],[70,X,100],[85,X,70],[100,X,60,0]]);o+=tok('p',d,U.hly,false);}
  if(k==='t2'||k==='t5'){var a=250,b=400;o+=chan(a,182,216,28)+tx(a-20,205,'Sec','end',{s:10,w:700,c:C})+pill(a-46,236,'ATP','#C2571A');
    if(k==='t2'){o+=chan(b,92,128,40)+chan(b,128,182,18,'#1F5FA8','#EEF4FB')+pill(b+44,236,'ATP','#C2571A')+tx(b+26,112,U.secretin,'start',{s:10,w:700,c:C});}
    else{o+='<rect x="'+(b-22)+'" y="98" width="44" height="26" rx="12" fill="#CDE8D5" stroke="#2E7D4F" stroke-width="2"/>'+tx(b+28,114,U.barrel,'start',{s:10,w:700,c:'#2E7D4F'});}
    kf('p',[[0,a,290,0],[6,a,280,1],[28,a,214],[44,a,160],[62,b,160],[80,b,96],[92,b+40,70],[100,b+60,64,0]]);o+=tok('p',d,k==='t2'?U.ctx:U.iga,k==='t2');
    o+=tx(a,300,U.step1,'middle',{s:10,w:700,c:'#16222E'})+tx(b,300,U.step2,'middle',{s:10,w:700,c:'#16222E'});}
  if(k==='t3'||k==='t4'){var nc=k==='t3';o+=chan(X,182,216,44)+chan(X,124,186,22)+chan(X,96,128,44);
    o+='<rect x="'+(X-5)+'" y="'+(nc?46:40)+'" width="10" height="'+(nc?52:58)+'" fill="#5D6D7E"/>';
    if(nc)o+='<rect x="'+(X-14)+'" y="28" width="28" height="22" rx="5" fill="#F6C7A8" stroke="#C2571A" stroke-width="1.8"/>'+tx(X+20,22,U.transl,'start',{s:9.5,w:700,c:'#C2571A'});
    o+=tx(X+30,70,nc?U.needle:U.pilus,'start',{s:10,w:700,c:'#5D6D7E'})+pill(X+70,236,'ATP','#C2571A');
    kf('p',[[0,X,290,0],[8,X,280,1],[30,X,214],[55,X,110],[75,X,40],[88,X,14],[100,X-30,10,0]]);o+=tok('p',d,nc?U.eff:U.dna,!nc?false:true);}
  if(k==='t6'){o+='<rect x="'+(X-14)+'" y="214" width="28" height="80" rx="4" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="2" style="transform-box:fill-box;transform-origin:50% 100%;animation:sh 3s linear infinite"/>';
    KF+='@keyframes sh{0%{transform:scaleY(1)}40%{transform:scaleY(1)}48%{transform:scaleY(.45)}90%{transform:scaleY(.45)}100%{transform:scaleY(1)}}';
    o+=chan(X,182,216,34)+chan(X,96,128,34);
    kf('sp',[[0,X,214,0],[40,X,214,1],[48,X,40,1],[60,X,24,1],[70,X,24,0],[100,X,24,0]]);
    o+='<g '+an('sp',3)+'><polygon points="-6,0 6,0 0,-16" fill="#2E7D4F"/></g>';
    kf('p',[[0,X,250,0],[40,X,250,1],[48,X,30,1],[62,X-24,12,1],[72,X-40,10,0],[100,X-40,10,0]]);o+=tok('p',3,U.tox6,true);
    o+=tx(X+22,262,U.sheath,'start',{s:10,w:700,c:'#2E7D4F'});d=3;}
  if(k==='t7'){o+=chan(X,182,216,46)+tx(X+30,205,'ESX (EccC · ATP)','start',{s:10,w:700,c:C});
    o+='<rect x="'+(X-14)+'" y="98" width="28" height="26" rx="6" fill="none" stroke="'+C+'" stroke-width="2" stroke-dasharray="4 3"/>'+tx(X+20,92,U.unk,'start',{s:9.5,c:'#55697A'});
    kf('p',[[0,X,290,0],[8,X,280,1],[30,X,214],[60,X,150],[80,X,90],[92,X+30,66],[100,X+50,60,0]]);o+=tok('p',d,'ESAT-6',true);}
  $('#kf').textContent=KF;
  return '<svg viewBox="0 0 640 320" role="img" aria-label="'+M[CUR].n+'">'+o+'</svg>';}
function render(){var m=M[CUR];
  $('#tabs').innerHTML=M.map(function(x,i){return '<button type="button" data-i="'+i+'"'+(i===CUR?' class="act"':'')+'>'+x.n+'</button>';}).join('')+'<span class="sp"></span><button type="button" id="pz"'+(PZ?' class="on"':'')+'>'+(PZ?U.play:U.pause)+'</button>';
  $('#sc').innerHTML=scene(m.k);
  $('#tx').innerHTML='<h3>'+m.full+'</h3><p><span class="badge gb">'+m.g+'</span>'+m.b.map(function(b){return '<span class="badge">'+b+'</span>';}).join('')+'</p>'+m.t.map(function(p){return '<p>'+p+'</p>';}).join('')+'<p class="gp">'+m.gp+'</p>';}
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.id==='pz'){PZ=!PZ;document.body.classList.toggle('paused',PZ);b.textContent=PZ?U.play:U.pause;b.classList.toggle('on',PZ);return;}
  CUR=+b.getAttribute('data-i');render();});
render();
</script>
