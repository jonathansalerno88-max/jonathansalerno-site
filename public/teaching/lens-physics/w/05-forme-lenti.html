<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lens shapes</title>
<link rel="stylesheet" href="widget.css">
</head>
<body>
<svg width="100%" viewBox="0 0 680 400" role="img"><title>Lens shapes</title><desc>Converging lenses (biconvex, plano-convex, converging meniscus) and diverging lenses (biconcave, plano-concave, diverging meniscus) in cross-section.</desc>
<text class="th" x="40" y="30">Converging: thicker at the centre</text>
<path d="M150 50 Q180 100 150 150 Q120 100 150 50 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<path d="M330 50 Q370 100 330 150 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<path d="M530 50 Q496 100 530 150 Q514 100 530 50 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text class="th" x="150" y="174" text-anchor="middle">Biconvex</text>
<text class="ts" x="150" y="192" text-anchor="middle">two convex faces</text>
<text class="th" x="340" y="174" text-anchor="middle">Plano-convex</text>
<text class="ts" x="340" y="192" text-anchor="middle">one flat face</text>
<text class="th" x="530" y="174" text-anchor="middle">Converging meniscus</text>
<text class="ts" x="530" y="192" text-anchor="middle">glasses for hyperopia</text>
<line class="leader" x1="40" y1="208" x2="640" y2="208"/>
<text class="th" x="40" y="230">Diverging: thicker at the edges</text>
<path d="M136 250 L164 250 Q146 300 164 350 L136 350 Q154 300 136 250 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<path d="M326 250 L354 250 Q334 300 354 350 L326 350 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<path d="M520 250 Q508 300 520 350 L536 350 Q500 300 536 250 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text class="th" x="150" y="374" text-anchor="middle">Biconcave</text>
<text class="ts" x="150" y="392" text-anchor="middle">two concave faces</text>
<text class="th" x="340" y="374" text-anchor="middle">Plano-concave</text>
<text class="ts" x="340" y="392" text-anchor="middle">one flat face</text>
<text class="th" x="530" y="374" text-anchor="middle">Diverging meniscus</text>
<text class="ts" x="530" y="392" text-anchor="middle">glasses for myopia</text>
</svg>
</body>
</html>
