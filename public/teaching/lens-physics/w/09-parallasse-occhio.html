<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parallax in the eye</title>
<link rel="stylesheet" href="widget.css">
<style>
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px;font-size:14px;color:var(--text-secondary)}
.ctl button{font:inherit;font-size:13px;padding:6px 12px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);cursor:pointer}
.ctl button.act{border:1.5px solid var(--border-accent);color:var(--text-accent)}
.note{font-size:13px;color:var(--text-secondary);margin:8px 0 0;line-height:1.5}
/* phones (stack.js): panel titles moved into their panels; the strip is shown narrower, so its text is set larger */
@media (max-width:600px){#topT{transform:translateX(105px)} #stripT{font-size:18px;transform:translateX(82px)} #sepL{font-size:16px}}
</style>
</head>
<body>
<h2 class="sr-only">Top view of the eye with the entrance pupil, the posterior nodal point N′, the centre of rotation and the focal length to the retina; rotating the eye about one of the three points compares the parallax between a near and a far object.</h2>
<div class="ctl">
<span>Rotate about</span>
<button id="pR" onclick="piv='R';upd()">Centre of rotation (real)</button>
<button id="pN" onclick="piv='N';upd()">Posterior nodal point N′</button>
<button id="pE" onclick="piv='E';upd()">Entrance pupil</button>
<span style="flex:1"></span>
<button id="play" onclick="toggle()">Rotate</button>
</div>
<div class="ctl"><span>Rotation</span><input type="range" id="rot" min="-25" max="25" value="0" style="flex:1" oninput="stop();upd()"><span id="rotL" style="min-width:40px;text-align:right;color:var(--text-primary)">0°</span></div>
<svg width="100%" viewBox="0 0 680 400" data-stack="115,0,310,290; 425,85,255,125; 98,306,477,96" data-stack-main="0">
<text class="th" id="topT" x="20" y="24">Top view</text>
<g id="fov"></g><g id="sight"></g>
<circle id="blue" r="8" fill="#378ADD"/><circle id="red" r="8" fill="#E24B4A"/>
<text class="ts" id="blueL" text-anchor="middle">near</text><text class="ts" id="redL" text-anchor="middle">far</text>
<g id="eye"></g><g id="pivot"></g><g id="labels"></g>
<line class="leader" x1="20" y1="302" x2="660" y2="302"/>
<text class="th" id="stripT" x="20" y="324">What the eye sees</text>
<rect x="120" y="334" width="440" height="44" rx="6" fill="none" stroke="var(--b)" stroke-width="0.5"/>
<line x1="340" y1="334" x2="340" y2="378" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle id="dR" cx="340" cy="356" r="7" fill="#E24B4A"/><circle id="dB" cx="340" cy="356" r="7" fill="#378ADD"/>
<text class="ts" id="sepL" x="560" y="394" text-anchor="end"> </text>
</svg>
<p class="note" id="note"></p>
<script>
var piv='R',O={x:330,y:170},K=7,anim=null,t0=0;
var EX=-3.0*K,NX=-7.3*K,RX=-13.5*K,RET=-24*K;
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function L(x1,y1,x2,y2,c,w,d,o){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+(w||1)+'"'+(d?' stroke-dasharray="'+d+'"':'')+(o!=null?' opacity="'+o+'"':'')+'/>';}
function stop(){if(anim){cancelAnimationFrame(anim);anim=null;document.getElementById('play').textContent='Rotate';}}
function toggle(){if(anim){stop();return;}
if(reduce){var r=document.getElementById('rot');r.value=(parseFloat(r.value)>=0?-20:20);upd();return;}
document.getElementById('play').textContent='Stop';t0=performance.now();
var step=function(t){document.getElementById('rot').value=Math.round(22*Math.sin((t-t0)/900));upd();anim=requestAnimationFrame(step);};anim=requestAnimationFrame(step);}
function upd(){
['R','N','E'].forEach(function(k){document.getElementById('p'+k).classList.toggle('act',piv===k);});
var deg=parseFloat(document.getElementById('rot').value),phi=deg*Math.PI/180;document.getElementById('rotL').textContent=deg+'°';
var pl=piv==='R'?RX:piv==='N'?NX:EX,P={x:O.x+pl,y:O.y},c=Math.cos(phi),s=Math.sin(phi);
function W(lx,ly){var dx=lx-pl,dy=ly;return {x:P.x+c*dx-s*dy,y:P.y+s*dx+c*dy};}
var EP0={x:O.x+EX,y:O.y},psi=-8*Math.PI/180;
var B={x:EP0.x+140*Math.cos(psi),y:EP0.y+140*Math.sin(psi)},R={x:EP0.x+320*Math.cos(psi),y:EP0.y+320*Math.sin(psi)};
var EP=W(EX,0),NP=W(NX,0),CR=W(RX,0),FV=W(RET,0);
var g='<g transform="translate('+P.x+','+P.y+') rotate('+deg+') translate('+(-pl)+',0)">';
g+='<circle cx="'+(-12*K)+'" cy="0" r="'+(12*K)+'" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>';
var a=0.75,rx=12*K;g+='<path d="M'+(-12*K-rx*Math.cos(a))+' '+(-rx*Math.sin(a))+' A'+rx+' '+rx+' 0 0 0 '+(-12*K-rx*Math.cos(a))+' '+(rx*Math.sin(a))+'" fill="none" stroke="#D85A30" stroke-width="3"/>';
g+='<path d="M'+(-3*K)+' -40 Q'+(2*K)+' 0 '+(-3*K)+' 40" fill="#E6F1FB" stroke="#888780" stroke-width="1"/>';
g+='<ellipse cx="'+(-5.6*K)+'" cy="0" rx="'+(2*K)+'" ry="30" fill="#B5D4F4" opacity="0.6" stroke="#378ADD" stroke-width="0.5"/>';
g+='<rect x="'+(-3.6*K-2)+'" y="-36" width="4" height="26" fill="#854F0B"/><rect x="'+(-3.6*K-2)+'" y="10" width="4" height="26" fill="#854F0B"/>';
g+=L(RET,60,NX,60,'#D85A30',1.5)+L(RET,54,RET,66,'#D85A30',1.5)+L(NX,54,NX,66,'#D85A30',1.5);
g+='<circle cx="'+RET+'" cy="0" r="3" fill="#A32D2D"/>';
g+='<circle cx="'+RX+'" cy="0" r="4" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>';
g+='<circle cx="'+NX+'" cy="0" r="4.5" fill="#D85A30"/>';
g+='<circle cx="'+EX+'" cy="0" r="5" fill="none" stroke="#0F6E56" stroke-width="2"/>';
g+='</g>';
document.getElementById('eye').innerHTML=g;
var f='';[-26,26].forEach(function(a2){var r=(deg+a2)*Math.PI/180;f+=L(EP.x,EP.y,EP.x+600*Math.cos(r),EP.y+600*Math.sin(r),'#97C459',1.5);});
document.getElementById('fov').innerHTML=f;
document.getElementById('sight').innerHTML=L(EP.x,EP.y,R.x,R.y,'#888780',1,'3 3',0.7);
[['blue',B],['red',R]].forEach(function(p){var e=document.getElementById(p[0]);e.setAttribute('cx',p[1].x);e.setAttribute('cy',p[1].y);var l=document.getElementById(p[0]+'L');l.setAttribute('x',p[1].x);l.setAttribute('y',p[1].y-14);});
document.getElementById('pivot').innerHTML='<path d="M'+(P.x-9)+' '+P.y+' L'+(P.x+9)+' '+P.y+' M'+P.x+' '+(P.y-9)+' L'+P.x+' '+(P.y+9)+'" stroke="#A32D2D" stroke-width="2"/>';
var FM=W((RET+NX)/2,78);
var lab='<text class="ts" x="'+FM.x+'" y="'+(FM.y+8)+'" text-anchor="middle" fill="#D85A30">f = N′ → retina = 16.7 mm</text>';
var ph=matchMedia('(max-width:600px)').matches;
lab+='<text class="ts" x="'+EP.x+'" y="'+(EP.y-56)+'" text-anchor="start" fill="#0F6E56">'+(ph?'<tspan>entrance pupil</tspan><tspan x="'+EP.x+'" dy="14">(3 mm)</tspan>':'entrance pupil (3 mm)')+'</text>';
lab+='<text class="ts" x="'+NP.x+'" y="'+(NP.y-74)+'" text-anchor="middle" fill="#D85A30">N′ (7.3 mm)</text>';
lab+=L(NP.x,NP.y-66,NP.x,NP.y-8,'#D85A30',0.5);
lab+='<text class="ts" x="'+CR.x+'" y="'+(CR.y-96)+'" text-anchor="middle">centre of rotation (13.5 mm)</text>'+L(CR.x,CR.y-88,CR.x,CR.y-8,'var(--b)',0.5);
lab+='<text class="ts" x="'+(FV.x-8)+'" y="'+(FV.y+4)+'" text-anchor="end">fovea</text>';
lab+='<text class="ts" x="'+P.x+'" y="'+(P.y+108)+'" text-anchor="middle" fill="#A32D2D">rotation axis</text>';
document.getElementById('labels').innerHTML=lab;
function ang(o){return Math.atan2(o.y-EP.y,o.x-EP.x)*180/Math.PI-deg;}
var aB=ang(B),aR=ang(R);
/* phones: the strip is cropped to the frame, so dots outside it are drawn squeezed against its edge */
function sx(a){var x=340+a/26*220;return ph&&x<120?120-(120-x)*0.09:ph&&x>560?560+(x-560)*0.09:x;}
document.getElementById('dB').setAttribute('cx',sx(aB));document.getElementById('dR').setAttribute('cx',sx(aR));
var sep=Math.abs(aB-aR);
document.getElementById('sepL').textContent=sep<0.05?'near and far aligned: no parallax':'offset between near and far: '+sep.toFixed(1)+'°';
var n=piv==='R'?'How the eye really moves: it rotates about the centre of rotation, about 13.5 mm behind the cornea. The entrance pupil traces a wide arc, so there is parallax: this is ocular parallax, small but real.':piv==='N'?'Rotation about N′: the entrance pupil lies 4 mm further forward and moves, so the parallax remains, though smaller. As in the camera, the nodal point is not the right point.':'Rotation about the entrance pupil: the viewpoint stays still, near and far stay superimposed. No parallax, but the real eye does not rotate this way.';
document.getElementById('note').innerHTML=n+' Distances in mm from the cornea; the objects are much closer than in reality, to make the effect visible.';
}
upd();
var mq=matchMedia('(max-width:600px)');if(mq.addEventListener)mq.addEventListener('change',upd);else if(mq.addListener)mq.addListener(upd);
</script>
<script src="stack.js"></script>
</body>
</html>
