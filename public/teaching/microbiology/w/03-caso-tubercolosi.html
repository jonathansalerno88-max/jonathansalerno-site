<style>
svg[viewBox]{min-width:0!important;max-width:100%!important;width:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;margin:0 0 10px}

<body>
<h2 class="sr-only">Guided clinical case in five steps: a man with a two-month cough, night sweats and a cavity on the chest X-ray. Each step has a figure to explore (X-ray, granuloma, smear, treatment) and a question; the right answer opens the next step.</h2>

<script>
var D={"ui": {"lab": "Labels", "step": "Step", "all": "Show the whole case", "restart": "Start again", "next": "Next ↓", "end": "End of the case.", "ok": "Right.", "no": "Not quite."}, "figs": {"cxr": {"ls": 1.35, "labs": {"ranke": "Ranke (calcified)", "fib": "Fibrosis", "node": "Hilar node"}, "modes": ["Paolo: post-primary", "Primary", "Miliary"], "flags": ["Lobes", "Segments"], "fhint": ["<b>Lobes on the PA view.</b> Blue: upper lobes; green: middle lobe; orange: lower lobes. The lingula, below the dotted line, is part of the left upper lobe and is the counterpart of the middle lobe. The solid white line is the minor (horizontal) fissure, the only one visible on a PA film; the dashed lines are the oblique fissures, not visible on PA. The lobes overlap: the lower lobe lies behind and rises posteriorly to the level of the hilum.", "<b>Segments</b> (approximate position on PA; dashed border = posterior segments). Right: upper lobe 1 apical, 2 posterior, 3 anterior; middle lobe 4 lateral, 5 medial; lower lobe 6 superior, 7 medial basal, 8 anterior basal, 9 lateral basal, 10 posterior basal. Left: 1+2 apicoposterior, 3 anterior, 4 and 5 superior and inferior lingular, 6 superior, 7+8 anteromedial basal, 9 lateral basal, 10 posterior basal. Paolo's cavity is in segments 1 and 2 of the right upper lobe: post-primary tuberculosis favours the apical and posterior segments of the upper lobes and the superior segment (6) of the lower lobes."], "hint": "Hover over or tap the lesions. The patient's right is on the viewer's left (R).", "lab": {"rul": "Upper lobe", "rml": "Middle lobe", "rll": "Lower lobe", "lul": "Upper lobe", "ling": "Lingula", "lll": "Lower lobe", "side": "R", "cav": "Cavity", "fib": "Fibrosis, retracted hilum", "nod": "Bronchogenic spread nodules", "ranke": "Ranke complex (calcified)", "ghon": "Ghon focus", "node": "Enlarged hilar node", "mil": "Diffuse 1–3 mm micronodules", "aria": "Posteroanterior chest X-ray"}, "K": {"cav": ["Apical cavity", "Thick, irregular-walled cavity in the apical segment of the right upper lobe, with a second smaller one. Usually without an air-fluid level, which rather suggests an abscess. The wall is granulomatous and caseous tissue; inside there are up to 10⁷–10⁹ bacilli: it is the most infectious form."], "fib": ["Fibrosis and retracted hilum", "Fibrous strands between the apex and the hilum: chronic disease partly heals with scars, which pull the hilum upwards."], "nod": ["Bronchogenic spread nodules", "Small clustered nodules in other parts of the lung, including the other lung: caseous material from the cavity, emptied into the bronchi, seeds the bacilli further down."], "ranke": ["Ranke complex", "The Ghon focus and the hilar node of the primary infection, calcified: the \"small spot\" of ten years ago. Paolo had already met the bacillus; now the disease has reactivated."], "ghon": ["Ghon focus", "First focus of tuberculous pneumonia, under the pleura, where inhaled bacilli land most often: the lower part of the upper lobe or the upper part of the lower lobe, well-ventilated zones."], "node": ["Hilar node", "Macrophages carry the bacilli to the hilar lymph nodes. Ghon focus plus hilar node: the Ghon complex. In children, enlarged nodes may be the only sign."], "mil": ["Miliary tuberculosis", "Micronodules of 1–3 mm, all alike, scattered through both lungs like millet seeds (Latin milium): the bacilli have entered the blood. It mainly affects immunocompromised people and children and can reach the meninges, liver, spleen and bone marrow."]}}, "gran": {"ls": 1.35, "labs": {"ep": "Epithelioid", "lg": "Langhans", "fib": "Fibrosis", "bac": "red bacilli"}, "modes": ["Haematoxylin-eosin", "Ziehl–Neelsen"], "hint": "Hover over or tap the zones of the granuloma. With Ziehl–Neelsen the (red) bacilli are few: look for them at the edge of the necrosis.", "lab": {"cas": "Caseous necrosis", "ep": "Epithelioid cells", "lg": "Langhans giant cell", "ly": "Lymphocytes", "fib": "Fibrous capsule", "par": "Alveoli", "bac": "red bacilli, rare", "aria": "Tuberculous granuloma under the microscope"}, "K": {"cas": ["Caseous necrosis", "In the centre, pink granular material with no recognisable cells, with nuclear fragments. To the naked eye it is whitish-yellow and crumbly, like cheese (Latin caseus). It is typical of tuberculosis, though not exclusive to it."], "ep": ["Epithelioid cells", "Macrophages activated by <b>IFN-γ</b> (interferon gamma): large, with pale pink cytoplasm and an elongated \"shoe-sole\" nucleus, packed together like the cells of an epithelium. They are the heart of the granuloma."], "lg": ["Langhans giant cell", "Fused macrophages: a huge cell with dozens of nuclei arranged in a horseshoe at the periphery. Typical of tuberculous granulomas, but not exclusive to them."], "ly": ["Lymphocyte cuff", "Mostly Th1 CD4+ T cells, which produce IFN-γ and activate the macrophages; there are also CD8+ T cells and B cells."], "fib": ["Fibrous capsule", "Fibroblasts and collagen wall off the granuloma. Over time the lesion can fibrose and calcify: this is how the primary focus heals."], "par": ["Surrounding lung", "Normal alveoli, with thin septa and a few red cells in the capillaries."]}}, "cav": {"split": ["0 0 300 186", "300 0 300 186"], "nolab": true, "hint": "Tap the four stages, from granuloma to cavity.", "lab": {"c1": "Granuloma", "c2": "Caseous necrosis", "c3": "Liquefaction", "c4": "Cavity", "air": "air", "aria": "Four stages from granuloma to cavity"}, "K": {"c1": ["1 · Granuloma", "Epithelioid cells, giant cells and lymphocytes contain the bacillus. In most people the story ends here: latent infection."], "c2": ["2 · Caseous necrosis", "In the centre the cells die, leaving caseum, poor in oxygen and acidic: the bacilli survive but multiply little."], "c3": ["3 · Liquefaction", "The caseum softens and becomes fluid: the bacilli, now outside the cells, multiply enormously."], "c4": ["4 · Cavity", "The fluid material empties into a bronchus: what remains is an air-filled cavity, rich in oxygen, with billions of bacilli in its wall. The patient coughs them up: he becomes infectious and seeds new foci along the bronchi."]}}, "zn": {"ls": 1.35, "labs": {"bac": "AFB"}, "modes": ["Ziehl–Neelsen", "Auramine"], "hint": "Hover over or tap the bacilli and the cells. With auramine the bacilli glow yellow on a black background, under a fluorescence microscope.", "lab": {"bac": "Acid-fast bacilli", "ne": "Neutrophil", "ep": "Squamous cell", "zn": "Ziehl–Neelsen", "au": "Auramine, fluorescence", "aria": "Sputum smear under the microscope"}, "K": {"bac": ["Acid-fast bacilli", "Thin, slightly curved rods, sometimes beaded: <b>AFB</b> (acid-fast bacilli). Mycolic acids retain the carbol fuchsin even after acid-alcohol. Sometimes they line up in parallel rows, the cords. With auramine they are seen at lower magnification, so the smear is read faster."], "ne": ["Neutrophil", "It has taken up the methylene blue counterstain, like everything that is not acid-fast."], "ep": ["Squamous cells", "Cells from the mouth: if there are many, the sample is more saliva than sputum."]}}, "rx": {"ls": 1.3, "nolab": true, "hint": "Hover over or tap a drug or a phase.", "lab": {"H": "isoniazid", "R": "rifampicin", "Z": "pyrazinamide", "E": "ethambutol", "months": "months of treatment", "p1": "intensive phase", "p2": "continuation", "aria": "Antituberculosis treatment scheme 2HRZE/4HR"}, "K": {"H": ["H · isoniazid", "Blocks mycolic acid synthesis (the InhA enzyme). It is a prodrug, activated by the bacillus' catalase-peroxidase (KatG): mutations in katG or inhA give resistance. Adverse effects: hepatitis and peripheral neuropathy, prevented with pyridoxine (vitamin B6), to be given to Paolo because he is diabetic."], "R": ["R · rifampicin", "Blocks bacterial RNA polymerase (β subunit, rpoB gene). Turns urine, tears and sweat orange, and contact lenses too. A strong inducer of cytochrome CYP3A4: it reduces the effect of oral contraceptives, anticoagulants, antiretrovirals and some oral antidiabetic drugs. Hepatotoxic."], "Z": ["Z · pyrazinamide", "A prodrug active at acidic pH, the pH of phagolysosomes and caseum: it hits the bacilli living there. Adverse effects: hepatotoxicity, hyperuricaemia and gout. Using it in the first two months shortens treatment from 9 to 6 months."], "E": ["E · ethambutol", "Blocks the arabinosyltransferases that build arabinogalactan and <b>LAM</b> (lipoarabinomannan). It protects the other drugs from resistance until the susceptibility results arrive. Adverse effect: optic neuritis, with loss of red-green colour vision: vision is checked."], "p1": ["Intensive phase · 2 months HRZE", "Four drugs to cut the bacillary population quickly without letting resistant mutants emerge."], "p2": ["Continuation phase · 4 months HR", "Two drugs to eliminate the slow, persistent bacilli that survived the first phase. The <b>WHO</b> (World Health Organization) also allows 4-month regimens in selected cases."]}}}, "steps": [{"h": "A two-month cough", "figs": ["cxr"], "story": "<p>Paolo, 52, diabetic and a smoker. For two months: productive cough, low-grade fever in the evening, night sweats that soak the sheets; he has lost 7 kg. For a week his sputum has been streaked with blood. Ten years ago an X-ray showed \"a small calcified spot\", never followed up.</p><div class=\"vt\"><span>Temperature 37.8 °C</span><span class=\"al\">Weight −7 kg in 2 months</span><span class=\"al\">Haemoptysis</span><span>Blood glucose 240 mg/dL</span><span>Crackles at the right apex</span></div><p>Here is the chest X-ray. Compare it with the picture of primary tuberculosis and with miliary tuberculosis.</p>", "q": {"t": "Why does post-primary disease hit the apices?", "o": [["Because more inhaled air, and so more bacilli, reaches the apices", false, "It is the opposite: ventilation is greater in the middle and lower zones, and that is where the bacillus lands in primary infection (Ghon focus)."], ["Because the apices have the highest oxygen tension and slower lymphatic drainage", true, "At the apices the ventilation/perfusion ratio is highest, and with it the alveolar partial pressure of oxygen: the bacillus, an obligate aerobe, grows better there. Slow lymphatic drainage shields it from the defences."], ["Because the hilar lymph nodes are close to the apices", false, "Hilar nodes are involved in primary disease; post-primary disease is a disease of the apical parenchyma."], ["Because cavities only form under the clavicles", false, "The bones have nothing to do with it: oxygen and lymphatic drainage do."]]}, "after": "<h4>Three pictures to recognise</h4><p><b>Primary</b>: Ghon focus in the middle and lower zones, under the pleura, plus the hilar node; it almost always heals and calcifies (Ranke complex). <b>Post-primary</b>: reactivation, or new infection, at the apices, with infiltrates, cavities and bronchogenic spread. <b>Miliary</b>: spread through the blood, micronodules in both lungs.</p><p>Diabetes, smoking, <b>HIV</b> (human immunodeficiency virus), anti-<b>TNF</b> (tumour necrosis factor) drugs, malnutrition and alcohol raise the risk of reactivation.</p>"}, {"h": "Inside the lesion: the granuloma", "figs": ["gran", "cav"], "story": "<p>This is how the elementary lesion of tuberculosis, the granuloma, looks under the microscope (here in a biopsy from another patient). It is the response to a bacterium the macrophages cannot kill: they surround it and shut it in. Below, the stages leading from the granuloma to Paolo's cavity.</p>", "q": {"t": "What keeps the bacillus shut in the granuloma?", "o": [["Antibodies against the bacillus", false, "The bacillus lives inside macrophages, where antibodies do not reach: humoral immunity matters little."], ["Neutrophils", false, "They arrive early but neither kill the bacillus nor organise the granuloma."], ["Macrophages activated by IFN-γ from Th1 lymphocytes, with TNF-α holding the granuloma together", true, "Macrophages produce <b>IL-12</b> (interleukin 12), which steers CD4+ lymphocytes towards Th1; IFN-γ from Th1 cells activates the macrophages. <b>TNF-α</b> (tumour necrosis factor alpha) is needed to form and maintain the granuloma: that is why latent infection is looked for before an anti-TNF drug."], ["The fibrous capsule, on its own", false, "Fibrosis comes later and is not enough on its own: without T cells and TNF-α the granuloma falls apart."]]}, "after": "<h4>Remember</h4><p>With HIV and few CD4 cells, granulomas form poorly: atypical X-ray, few cavities, more extrapulmonary and miliary forms, and sputum more often negative.</p>"}, {"h": "The diagnosis", "figs": ["zn"], "story": "<p>Paolo is put in respiratory isolation, in a negative-pressure room, and anyone entering wears an <b>FFP2</b> or FFP3 (filtering face piece) respirator: the bacillus travels in droplet nuclei suspended in the air. Three sputum samples are collected, one first thing in the morning.</p>", "q": {"t": "The smear is positive. Which test tells you in under two hours whether it is M. tuberculosis and whether it is resistant to rifampicin?", "o": [["IGRA", false, "The interferon-gamma release assay (<b>IGRA</b>) only says that the immune system has met the bacillus: it is positive in latent infection too and can be negative in active disease. It does not diagnose active tuberculosis."], ["Culture on Löwenstein–Jensen medium", false, "It is the reference and gives full susceptibility testing, but the bacillus divides about every 20 hours: it takes 3–8 weeks on solid medium, 1–3 in liquid medium."], ["A rapid molecular test on sputum, such as Xpert MTB/RIF Ultra", true, "It amplifies DNA of the M. tuberculosis complex and looks for mutations in the rpoB gene, those giving rifampicin resistance. Rifampicin resistance raises suspicion of <b>MDR</b> (multidrug-resistant: resistant to at least isoniazid and rifampicin) disease."], ["Blood culture", false, "In pulmonary disease the bacillus is not sought in the blood; mycobacterial blood cultures have a role only in a few cases, such as severely immunocompromised patients."]]}, "after": "<h4>Remember</h4><p>A positive smear says \"AFB\", not \"tuberculosis\": non-tuberculous mycobacteria are acid-fast too. And it takes about 5,000–10,000 bacilli per millilitre for it to be positive. Culture is always done: it confirms the species and gives full susceptibility testing.</p>"}, {"h": "The treatment", "figs": ["rx"], "story": "<p>Molecular test: M. tuberculosis detected, rifampicin resistance not detected. Standard treatment starts and his diabetes is brought under control.</p>", "q": {"t": "Why four drugs together?", "o": [["To reduce side effects by splitting the dose", false, "Doses are not split: each drug is given at full dose, and side effects, if anything, add up."], ["Because a cavity already holds mutants resistant to each drug, but almost never to two at once", true, "A resistance mutation appears about once every 10⁶ bacilli for isoniazid and every 10⁸ for rifampicin. A cavity holds 10⁸–10⁹: a single drug would select the resistant ones. The probability of being resistant to two drugs is the product of the two: practically zero."], ["Because with four drugs two months are enough", false, "After the two intensive months another four are needed for the slow bacilli, which survive for a long time."], ["Because none of them, alone, kills the bacillus", false, "Isoniazid and rifampicin alone are bactericidal: the problem is resistance, not efficacy."]]}, "after": "<h4>Remember</h4><p>Standard regimen <b>2HRZE/4HR</b>: two months of isoniazid (H), rifampicin (R), pyrazinamide (Z) and ethambutol (E), then four months of isoniazid and rifampicin. If adherence is at risk, directly observed therapy is used. Tuberculosis must be notified. Isolation ends when the patient is no longer infectious: usually after at least two weeks of effective treatment, with clinical improvement and sputum turning negative, according to the local protocol.</p>"}, {"h": "Paolo's wife", "figs": [], "story": "<p>Paolo's wife, 49, is well: no cough, no fever, normal chest X-ray. Her IGRA, though, is positive.</p>", "q": {"t": "What does she have, and what do you do?", "o": [["Active tuberculosis: start the four drugs now", false, "With no symptoms and a normal X-ray there is no active disease: four drugs for six months would expose her to toxicity for nothing."], ["A false positive due to the BCG vaccine", false, "IGRA uses antigens (ESAT-6, CFP-10) that <b>BCG</b> (bacillus Calmette–Guérin) lacks, as do almost all non-tuberculous mycobacteria. BCG can make the Mantoux tuberculin skin test positive, not the IGRA."], ["Latent tuberculous infection: rule out active disease and offer preventive treatment", true, "She has met the bacillus and keeps it under control in granulomas; she is not infectious. About 5–10% of latent infections become disease over a lifetime, most often in the first two years. Preventive treatment lowers that risk: for example 4 months of rifampicin, 3 months of weekly isoniazid and rifapentine, or 6–9 months of isoniazid."], ["Respiratory isolation", false, "Latent infection is not infectious: in the granulomas the bacilli are few, shut in, and do not reach the bronchi."]]}, "after": "<h4>Remember</h4><p>Active disease is always ruled out before preventive treatment: a single drug given to someone with unrecognised active tuberculosis selects resistance. IGRA and Mantoux do not distinguish latent infection from disease: symptoms, X-ray and microbiology do.</p>"}]};
// ---------- helpers ----------
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function f1(v){return Math.round(v*10)/10;}
function cpath(p){var n=p.length,d='M'+f1(p[0][0])+' '+f1(p[0][1]);
  for(var i=0;i<n;i++){var p0=p[(i-1+n)%n],q1=p[i],q2=p[(i+1)%n],p3=p[(i+2)%n];
    d+=' C'+f1(q1[0]+(q2[0]-p0[0])/6)+' '+f1(q1[1]+(q2[1]-p0[1])/6)+' '+f1(q2[0]-(p3[0]-q1[0])/6)+' '+f1(q2[1]-(p3[1]-q1[1])/6)+' '+f1(q2[0])+' '+f1(q2[1]);}
  return d+'Z';}
function bpts(R,cx,cy,rx,ry,irr,n){var p=[],a0=R()*6.28,h1=R()*6.28,h2=R()*6.28;n=n||10;
  for(var i=0;i<n;i++){var a=a0+i/n*6.2832,k=1+irr*(.55*Math.sin(2*a+h1)+.45*Math.sin(3*a+h2))+irr*.6*(R()-.5);p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k]);}return p;}
function blob(R,cx,cy,rx,ry,irr,n){return cpath(bpts(R,cx,cy,rx,ry,irr,n));}
var LS=1;
function tx(x,y,t,a,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+f1((o.s||18)*LS)+'" text-anchor="'+(a||'start')+'" fill="'+(o.c||'#fff')+'"'+(o.h===''?'':' stroke="'+(o.h||'#000')+'" stroke-width="'+(o.hw||4)+'" paint-order="stroke" stroke-linejoin="round"')+' font-weight="'+(o.w||500)+'">'+t+'</text>';}
function ld(x1,y1,x2,y2,c){c=c||'#fff';return '<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'" stroke="'+c+'" stroke-width="1.5" fill="none"/><circle cx="'+x2+'" cy="'+y2+'" r="3" fill="'+c+'"/>';}
function hs(k,hit,ol){return '<g data-k="'+k+'" tabindex="0">'+hit+'<g class="ol">'+(ol||'')+'</g></g>';}
function hc(x,y,r){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="transparent"/>';}
function he(x,y,rx,ry){return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="transparent"/>';}
function hr(x,y,w,h){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="transparent"/>';}
function oc(x,y,r,c){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="none" stroke="'+(c||'#FFB547')+'" stroke-width="2.5" stroke-dasharray="6 4"/>';}
function oe(x,y,rx,ry,c){return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="none" stroke="'+(c||'#FFB547')+'" stroke-width="2.5" stroke-dasharray="6 4"/>';}
function orc(x,y,w,h,c){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" fill="none" stroke="'+(c||'#E0662B')+'" stroke-width="2.5" stroke-dasharray="6 4"/>';}
function blur(id,sd){return '<filter id="'+id+'" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="'+sd+'"/></filter>';}
function rod(x,y,a,l,c,w,bead){var dx=Math.cos(a)*l/2,dy=Math.sin(a)*l/2,bx=-Math.sin(a)*l*.07,by=Math.cos(a)*l*.07;
  return '<path d="M'+f1(x-dx)+' '+f1(y-dy)+' Q'+f1(x+bx)+' '+f1(y+by)+' '+f1(x+dx)+' '+f1(y+dy)+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" fill="none"'+(bead?' stroke-dasharray="'+(w*1.1)+' '+(w*.55)+'"':'')+'/>';}
var FIG={};

// ======================= TUBERCULOSIS =======================
// Chest X-ray, PA view: patient's right on the viewer's left

         :{bg:'#F7E6EE',alv:'#FFFDFE',sep:'#E2A9C2',sn:'#5D3A8E',cap:'#EDA9C4',col:'#DD8FB0',spn:'#6E3F94',ly:'#EBC8DB',lyn:'#3F2370',ep:'#F4D4E2',epn:'#AA8DCB',eps:'#7C5BA6',lg:'#EAB2CA',lgs:'#D592B2',lgn:'#6A479E',cas:'#E7A6C2',cas2:'#DC92B4',dust:'#5D3A8E',rbc:'#E0526A'};

  var sp='';for(i=0;i<90;i++){var a=R()*6.2832,p=E(.93+R()*.11,a),ang=Math.atan2(Math.cos(a)*RY,-Math.sin(a)*RX)*0+ (a*180/Math.PI+90);
    sp+='<ellipse cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" rx="'+f1(5+R()*2.5)+'" ry="1.3" transform="rotate('+f1(ang+(R()-.5)*20)+' '+f1(p[0])+' '+f1(p[1])+')"/>';}
  s+='<g fill="'+P.spn+'">'+sp+'</g>';

  for(i=0;i<70;i++){var a=R()*6.2832,p=E(.45+R()*.28,a);ly+='<circle cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" r="2.5"/>';}

  hot+=hs('ep','<path d="'+ring(.73)+' '+cas()+'" fill="transparent" fill-rule="evenodd"/>','<path d="'+ring(.73)+' '+cas()+'" fill="#E0662B" fill-opacity=".15" fill-rule="evenodd" stroke="#E0662B" stroke-width="2" stroke-dasharray="6 4"/>');

// From granuloma to cavity: four stages
FIG.cav=function(st,L,u){

    s+='<clipPath id="'+u+'p'+i+'"><rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" rx="10"/></clipPath>';
    var g='<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="#F7E6EE"/>';
    for(var k=0;k<34;k++){var ax=x0+R()*w,ay=y0+R()*h;if(Math.hypot(ax-cx,ay-cy)<48+i*4)continue;g+='<circle cx="'+f1(ax)+'" cy="'+f1(ay)+'" r="'+f1(7+R()*4)+'" fill="#FFFDFE" stroke="#E2A9C2" stroke-width="1.6"/>';}

    var bx=x0+w-30;g+='<path d="M'+(bx+14)+' '+(y0-4)+' C'+(bx+12)+' '+(y0+30)+' '+(bx-4)+' '+(y0+50)+' '+(cx+44)+' '+(cy-30)+'" stroke="#C98AA8" stroke-width="20" fill="none"/>';
    g+='<path d="M'+(bx+14)+' '+(y0-4)+' C'+(bx+12)+' '+(y0+30)+' '+(bx-4)+' '+(y0+50)+' '+(cx+44)+' '+(cy-30)+'" stroke="#FFFFFF" stroke-width="13" fill="none"/>';
    var r=34+i*4;

    var lyd='';for(k=0;k<160;k++){var a=R()*6.28,rr=r-2-R()*8;lyd+='<circle cx="'+f1(cx+Math.cos(a)*rr)+'" cy="'+f1(cy+Math.sin(a)*rr)+'" r="1.5"/>';}

    var en='';for(k=0;k<26;k++){var a=R()*6.28,rr=(i?r*.5:6)+R()*(r-12-(i?r*.5:6));en+='<ellipse cx="'+f1(cx+Math.cos(a)*rr)+'" cy="'+f1(cy+Math.sin(a)*rr)+'" rx="3.4" ry="1.5" fill="#AA8DCB" transform="rotate('+f1(a*57.3)+' '+f1(cx+Math.cos(a)*rr)+' '+f1(cy+Math.sin(a)*rr)+')"/>';}

    if(i===2){g+='<path d="'+blob(R,cx,cy,cr,cr,.12,8)+'" fill="#F6DDE8" stroke="#E7A6C2" stroke-width="3"/>';
      for(k=0;k<26;k++){var a=R()*6.28,rr=R()*(cr-4);g+=rod(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,R()*3.14,5,'#D7265B',1.5);}}
    if(i===3){g+='<path d="M'+(cx+14)+' '+(cy-16)+' L'+(cx+44)+' '+(cy-30)+'" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>';
      g+='<path d="'+blob(R,cx,cy,cr+2,cr,.1,9)+'" fill="#FFFFFF" stroke="#E7A6C2" stroke-width="4"/>';
      for(k=0;k<10;k++){var a=R()*6.28;g+=rod(cx+Math.cos(a)*(cr-1),cy+Math.sin(a)*(cr-1),a+1.57,5,'#D7265B',1.5);}
      for(k=0;k<6;k++){var t=k/5,px=(cx+40)+(bx+10-(cx+40))*t,py=(cy-30)+((y0+6)-(cy-30))*t;g+=rod(px+(R()-.5)*5,py,R()*3.14,5,'#D7265B',1.6);}
      g+='<path d="M'+(bx+20)+' '+(y0+40)+' l0 -18 m-5 6 l5 -6 l5 6" stroke="#B0183F" stroke-width="2" fill="none"/>';
      g+=tx(cx,cy+5,lb.air,'middle',{s:12,c:'#55697A',h:''});
      g+='<circle cx="'+(x0+22)+'" cy="'+(y0+136)+'" r="7" fill="#EDA9C4"/><circle cx="'+(x0+22)+'" cy="'+(y0+136)+'" r="4" fill="#E7A6C2"/>';}
    s+='<g clip-path="url(#'+u+'p'+i+')">'+g+'</g><rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" rx="10" fill="none" stroke="#C7B4C0"/>';
    s+='<circle cx="'+(x0+16)+'" cy="'+(y0+16)+'" r="11" fill="#16222E"/>'+tx(x0+16,y0+21,String(i+1),'middle',{s:13,w:700,h:''});
    s+=tx(x0+w/2,y0+h+22,lb['c'+(i+1)],'middle',{s:15,c:'#16222E',h:'',w:600});

  }
  return '<svg viewBox="0 0 600 186" class="fsv" role="img" aria-label="'+lb.aria+'">'+s+hot+'</svg>';
};

// Sputum smear: Ziehl–Neelsen or auramine
FIG.zn=function(st,L,u){
  var R=rng(31),au=st.m===1,lb=L.lab,s='',cx=300,cy=182,r=172;
  s+='<defs>'+blur(u+'g',1.6)+blur(u+'b3',3)+'<clipPath id="'+u+'f"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'"/></clipPath></defs>';
  s+='<rect width="600" height="364" fill="#0b0b0b"/>';
  var g='<rect width="600" height="364" fill="'+(au?'#060807':'#D2E2F2')+'"/>';
  var mu='';for(var i=0;i<7;i++){var y=40+i*46+R()*20;mu+='<path d="M100 '+f1(y)+' C200 '+f1(y-40+R()*80)+' 380 '+f1(y-40+R()*80)+' 520 '+f1(y+R()*30-15)+'" stroke-width="'+f1(12+R()*18)+'"/>';}
  g+='<g stroke="'+(au?'#121a12':'#A9C3E2')+'" fill="none" opacity=".55" filter="url(#'+u+'b3)">'+mu+'</g>';
  var ep='',ne='',ba='';
  [[200,120],[400,250],[420,92]].forEach(function(c){ep+='<path d="'+blob(R,c[0],c[1],40,30,.22,7)+'" fill="'+(au?'#0e120e':'#E3EDF8')+'" stroke="'+(au?'#172017':'#9AB5D6')+'" stroke-width="1.2"/><circle cx="'+(c[0]+4)+'" cy="'+(c[1]-2)+'" r="5" fill="'+(au?'#141a14':'#5B7FB7')+'"/>';});
  var NE=[];for(i=0;i<15;i++){var a=R()*6.28,rr=Math.sqrt(R())*150,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;NE.push([x,y]);
    ne+='<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="9" fill="'+(au?'#0d110d':'#C6D8EE')+'"/>';
    if(!au){for(var j=0;j<3;j++){var aa=R()*6.28;ne+='<circle cx="'+f1(x+Math.cos(aa)*3.6)+'" cy="'+f1(y+Math.sin(aa)*3.6)+'" r="2.9" fill="#3E62A3"/>';}}}
  var col=au?'#E4FF6A':'#D21F57';NE.sort(function(a,b){return Math.hypot(a[0]-500,a[1]-60)-Math.hypot(b[0]-500,b[1]-60);});
  for(i=0;i<46;i++){var a=R()*6.28,rr=Math.sqrt(R())*155;ba+=rod(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,R()*3.14,10+R()*6,col,2.1,R()<.4);}
  // a small cord of parallel bacilli
  for(i=0;i<9;i++)ba+=rod(250+i*2.2+R()*2,232+i*3.2,.5+R()*.12,16,col,2.2,R()<.3);
  g+=ep+ne+(au?'<g filter="url(#'+u+'g)" opacity=".9">'+ba+'</g>':'')+ba;
  s+='<g clip-path="url(#'+u+'f)">'+g+'</g><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#333" stroke-width="3"/>';
  s+=tx(586,354,au?lb.au:lb.zn,'end',{s:14,c:'#cfd6dd',h:''})+tx(14,354,'×1000','start',{s:14,c:'#cfd6dd',h:''});
  var lab='',hot='';
  lab+=tx(14,34,lb.bac,'start',{s:16})+ld(110,40,252,234);
  lab+=tx(586,34,lb.ne,'end',{s:16})+ld(530,40,f1(NE[0][0]),f1(NE[0][1]));
  lab+=tx(14,320,lb.ep,'start',{s:16})+ld(60,304,186,132);
  hot+=hs('bac',he(262,246,26,24),oe(262,246,26,24));
  hot+=hs('ne',hc(f1(NE[0][0]),f1(NE[0][1]),16),oc(f1(NE[0][0]),f1(NE[0][1]),15));
  hot+=hs('ep',he(200,120,46,36)+he(400,250,46,36)+he(420,92,46,36),oe(200,120,46,36)+oe(400,250,46,36)+oe(420,92,46,36));
  return '<svg viewBox="0 0 600 364" class="fsv" role="img" aria-label="'+lb.aria+'">'+s+(st.lab?'<g class="lb">'+lab+'</g>':'')+hot+'</svg>';
};

FIG.rash=function(st,L,u){
  var R=rng(41),vir=st.m===1,gl=st.f[0],lb=L.lab,s='',GX=392,GY=168,GR=100;
  s+='<defs>'+blur(u+'b3',3)+blur(u+'b1',.7)+blur(u+'b6',6)+
    '<linearGradient id="'+u+'sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7C1A6"/><stop offset=".5" stop-color="#EECDB5"/><stop offset="1" stop-color="#DDB096"/></linearGradient>'+
    '<clipPath id="'+u+'gc"><circle cx="'+GX+'" cy="'+GY+'" r="'+(GR-6)+'"/></clipPath></defs>';
  var skin='<rect width="600" height="336" fill="url(#'+u+'sk)"/>';
  for(var i=0;i<260;i++) skin+='<circle cx="'+f1(R()*600)+'" cy="'+f1(R()*336)+'" r="'+f1(.6+R()*.8)+'" fill="#C99B80" opacity=".35"/>';
  for(i=0;i<40;i++){var x=R()*600,y=R()*336,a=R()*.6+1.1;skin+='<path d="M'+f1(x)+' '+f1(y)+' q3 -5 '+f1(Math.cos(a)*14)+' '+f1(-Math.sin(a)*14)+'" stroke="#8E6A52" stroke-width=".7" fill="none" opacity=".45"/>';}
  var spots='',pet='',pur='';

    var CL=[[110,90],[200,220],[300,120],[420,80],[470,230],[380,200],[540,140],[90,250],[250,300]];
    CL.forEach(function(c){for(var j=0;j<18;j++){var x=c[0]+(R()-.5)*90,y=c[1]+(R()-.5)*70,r=.9+R()*1.6;pet+='<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(r+.7)+'" fill="#C6475E" opacity=".5"/><circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(r)+'" fill="#9E1B3A"/>';}});
    [[160,150,15],[350,110,11],[410,190,18],[520,260,13],[230,80,8],[90,180,9],[300,250,10]].forEach(function(p){
      pur+='<path d="'+blob(R,p[0],p[1],p[2]+4,p[2]*.85+3,.3,9)+'" fill="#8E2A55" opacity=".55" filter="url(#'+u+'b1)"/><path d="'+blob(R,p[0],p[1],p[2],p[2]*.85,.3,9)+'" fill="#6F2149"/>'+(p[2]>14?'<path d="'+blob(R,p[0]+2,p[1],p[2]*.35,p[2]*.3,.3,7)+'" fill="#33121F"/>':'');});
    spots=pet+pur;
  }else{
    for(i=0;i<44;i++){spots+='<path d="'+blob(R,R()*600,R()*336,10+R()*16,8+R()*14,.35,8)+'" fill="#E0605E" opacity=".38" filter="url(#'+u+'b3)"/>';}
    for(i=0;i<70;i++){spots+='<circle cx="'+f1(R()*600)+'" cy="'+f1(R()*336)+'" r="'+f1(1.6+R()*1.8)+'" fill="#D9534F" opacity=".35"/>';}
  }
  s+=skin+spots;
  if(gl){
    // pressure blanches the skin under the glass; extravasated blood stays visible
    s+='<g clip-path="url(#'+u+'gc)"><rect width="600" height="336" fill="#F5E2D6"/>'+(vir?'':pet+pur)+'</g>';
    s+='<circle cx="'+GX+'" cy="'+GY+'" r="'+GR+'" fill="#DDEEFF" fill-opacity=".12" stroke="#8FB0C8" stroke-width="10" stroke-opacity=".55"/>';
    s+='<circle cx="'+GX+'" cy="'+GY+'" r="'+(GR-9)+'" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity=".7"/>';
    s+='<path d="M'+(GX-70)+' '+(GY-55)+' A90 90 0 0 1 '+(GX+20)+' '+(GY-88)+'" stroke="#FFFFFF" stroke-width="7" stroke-opacity=".6" fill="none" stroke-linecap="round"/>';
  }
  var lab='',hot='',H={s:17,c:'#16222E',h:'#fff',hw:4.5,w:600};

FIG.gram=function(st,L,u){

  function bean(x,y,a,c){var d='',k;for(k=-1;k<=1;k+=2){var ox=Math.cos(a)*4.2*k,oy=Math.sin(a)*4.2*k;

  var NE=[[220,130],[360,220],[300,90],[180,250],[420,120],[260,300],[450,280],[150,160]],neu='',org='';
  NE.forEach(function(p){neu+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="18" fill="#F1C3D2" stroke="#E2A2B8"/>';
    var a0=R()*6.28,pts=[];for(var k=0;k<4;k++){var aa=a0+k*1.2;pts.push([p[0]+Math.cos(aa)*8,p[1]+Math.sin(aa)*8]);}

var FS={},done=[],shown=1,N=D.steps.length,MQ=matchMedia('(max-width:600px)');
function reAll(){for(var k in FS)render(k);}if(MQ.addEventListener)MQ.addEventListener('change',reAll);else if(MQ.addListener)MQ.addListener(reAll);
function $(s,e){return (e||document).querySelector(s);}
function kdText(id,k){var F=D.figs[id],K=F.K[k];if(!K)return '<span class="ht">'+F.hint+'</span>';var st=FS[id],t=(st.done&&K[2])?K[2]:K[0];return '<b>'+t+'</b> — '+K[1];}
function render(id){var st=FS[id],box=st.el,F=D.figs[id];
  var ph=MQ.matches,F2=F;LS=(ph&&F.ls)||1;
  if(ph&&F.labs){F2={};for(var q in F)F2[q]=F[q];F2.lab={};for(q in F.lab)F2.lab[q]=F.lab[q];for(q in F.labs)F2.lab[q]=F.labs[q];}
  var html=FIG[id](st,F2,id+'_');LS=1;if(F.split&&MQ.matches)html=F.split.map(function(vb){return html.replace(/viewBox="[^"]*"/,'viewBox="'+vb+'"');}).join('');
  $('.sv',box).innerHTML=html;
  var bs=box.querySelectorAll('.ctl button[data-m]');for(var i=0;i<bs.length;i++)bs[i].classList.toggle('act',+bs[i].getAttribute('data-m')===st.m);
  var fl=box.querySelectorAll('.ctl button[data-fl]');for(i=0;i<fl.length;i++)fl[i].classList.toggle('act',!!st.f[+fl[i].getAttribute('data-fl')]);
  var lb=$('.ctl .lbt',box);if(lb)lb.classList.toggle('act',st.lab);
  $('.fn',box).innerHTML=(F.fhint||[]).filter(function(t,i){return st.f[i];}).join(' ');
  if(st.k&&$('[data-k="'+st.k+'"]',box))show(id,st.k);else{st.k=null;$('.kd',box).innerHTML='<span class="ht">'+F.hint+'</span>';}}
function show(id,k){var st=FS[id],box=st.el;st.k=k;
  var all=box.querySelectorAll('[data-k]');for(var i=0;i<all.length;i++)all[i].classList.toggle('hi',all[i].getAttribute('data-k')===k);
  $('.kd',box).innerHTML=kdText(id,k);}
function initFig(id,box){var F=D.figs[id],st=FS[id]={m:0,f:(F.flags||[]).map(function(){return 0;}),lab:true,done:0,k:null,el:box};
  var c='';(F.modes||[]).forEach(function(m,i){if(F.modes.length>1)c+='<button type="button" data-m="'+i+'">'+m+'</button>';});
  (F.flags||[]).forEach(function(f,i){c+='<button type="button" data-fl="'+i+'">'+f+'</button>';});
  if(!F.nolab)c+='<span class="sep"></span><button type="button" class="lbt">'+D.ui.lab+'</button>';
  $('.ctl',box).innerHTML=c;if(!c)$('.ctl',box).style.display='none';
  $('.ctl',box).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-m'))st.m=+b.getAttribute('data-m');else if(b.hasAttribute('data-fl')){var j=+b.getAttribute('data-fl');st.f[j]=st.f[j]?0:1;}else st.lab=!st.lab;render(id);});
  var sv=$('.sv',box);
  function pick(e){var g=e.target.closest&&e.target.closest('[data-k]');if(g)show(id,g.getAttribute('data-k'));}
  sv.addEventListener('mouseover',pick);sv.addEventListener('click',pick);sv.addEventListener('focusin',pick);
  render(id);}
function prog(){var h='';for(var i=0;i<N;i++)h+='<i class="'+(done[i]?'ok':(i<shown?'on':''))+'"></i>';$('#pg').innerHTML=D.ui.step+' '+Math.min(shown,N)+'/'+N+' '+h;
  $('#all').textContent=shown>=N?D.ui.restart:D.ui.all;}
function reveal(n){shown=Math.max(shown,n);for(var i=0;i<N;i++)$('#s'+i).hidden=i>=shown;prog();}
var root=$('#case');
D.steps.forEach(function(s,i){var sec=document.createElement('section');sec.className='step';sec.id='s'+i;
  var h='<div class="shd"><span class="sn">'+(i+1)+'</span><h3>'+s.h+'</h3></div><div class="story">'+s.story+'</div>';
  (s.figs||[]).forEach(function(f){h+='<div class="fig" data-f="'+f+'"><div class="ctl"></div><div class="sv"></div><p class="fn"></p><p class="kd" aria-live="polite"></p></div>';});
  h+='<div class="q"><p class="qt">'+s.q.t+'</p><div class="opts">';
  s.q.o.forEach(function(o,j){h+='<button type="button" data-j="'+j+'">'+o[0]+'</button>';});
  h+='</div><div class="fb" aria-live="polite"></div></div><div class="after" hidden>'+s.after+(i<N-1?'<button type="button" class="nx">'+D.ui.next+'</button>':'<p class="end">'+D.ui.end+'</p>')+'</div>';
  sec.innerHTML=h;root.appendChild(sec);
  (s.figs||[]).forEach(function(f){initFig(f,$('.fig[data-f="'+f+'"]',sec));});
  $('.opts',sec).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var o=s.q.o[+b.getAttribute('data-j')];
    b.classList.add(o[1]?'ok':'no');var fb=$('.fb',sec);fb.className='fb '+(o[1]?'ok':'no');fb.innerHTML='<b>'+(o[1]?D.ui.ok:D.ui.no)+'</b> '+o[2];
    if(o[1]&&!done[i]){done[i]=1;sec.classList.add('solved');$('.after',sec).hidden=false;(s.figs||[]).forEach(function(f){FS[f].done=1;render(f);});prog();}});
  var nx=$('.nx',sec);if(nx)nx.addEventListener('click',function(){reveal(i+2);var nxt=$('#s'+(i+1));try{nxt.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){nxt.scrollIntoView();}});
});
$('#all').addEventListener('click',function(){if(shown>=N){location.reload();return;}reveal(N);});
reveal(1);
</script>
